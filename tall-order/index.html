<body>
<canvas id="gl"></canvas>

<div id="err" hidden>Tall Order needs WebGL 2, and this browser didn't offer it. A recent Chrome, Firefox or Safari will run it.</div>

    const R = stickR();
    hx.fillStyle = 'rgba(255,255,255,0.14)'; circle(stick.x0, stick.y0, R);
    hx.strokeStyle = 'rgba(255,255,255,0.5)'; hx.lineWidth = 2 * u; ring(stick.x0, stick.y0, R);
    hx.fillStyle = 'rgba(255,207,51,0.9)'; circle(stick.x, stick.y, R * 0.42);
  }
  const btn = (b, text, on, col) => {
    hx.fillStyle = on ? col : 'rgba(20,10,36,0.35)'; circle(b.x, b.y, b.r * (on ? 0.96 : 1));
    hx.strokeStyle = 'rgba(255,255,255,0.8)'; hx.lineWidth = 2.5 * u; ring(b.x, b.y, b.r * (on ? 0.96 : 1));
    label(text, b.x, b.y, b.r * 0.4, '#ffffff', 'center');
  };
  btn(B.fire, 'FIRE', fireHeld(), 'rgba(255,90,70,0.7)');
  btn(B.jump, 'JUMP', jumpHeld(), 'rgba(90,200,255,0.7)');
  drawItemButton();
  if (IN.keys) {
    label('SPACE', B.jump.x, B.jump.y + B.jump.r + 12 * u, 12 * u, '#ffffff', 'center', 0.8);
    label('J', B.fire.x, B.fire.y + B.fire.r + 12 * u, 12 * u, '#ffffff', 'center', 0.8);
    label('K', B.item.x, B.item.y + B.item.r + 12 * u, 12 * u, '#ffffff', 'center', 0.8);
  }
}

// ---------------------------------------------------------------- game flow
const panelEl = $('panel'), sheetEl = $('sheet'), pauseBtn = $('pauseBtn');
let panelKind = null;
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function button(cls, text, fn) { const b = el('button', cls, text); b.type = 'button'; b.addEventListener('click', fn); return b; }
function controlsList() {
  const dl = el('dl', 'controls');
  for (const [k, v] of [['Touch', 'left thumb: a stick that walks and turns; right thumb: FIRE (hold), JUMP, and the button for whatever you picked up'],
    ['Keys', 'W S walk, A D turn, Space jumps, J fires, K uses your pickup, Q swaps pickups'],
    ['Mouse', 'click to grab the mouse; move it to turn, click to fire, right-click for your pickup, A D sidestep'],
    ['Aim', 'turn to face it: the gun fires straight ahead and finds the height by itself']]) dl.append(el('dt', null, k), el('dd', null, v));
  return dl;
}
function showPanel(kind) {
  panelKind = kind;
  sheetEl.textContent = '';
  const title = (tag, text) => { const h = el(tag, null, text); h.id = 'sheetTitle'; return h; };
  const actions = (...b) => { const d = el('div', 'actions'); d.append(...b); return d; };
  let primary;
  if (kind === 'title') {
    primary = button('play', 'Climb', startGame);
    sheetEl.append(el('p', 'eyebrow', 'A toy-box shooter'), title('h1', 'Tall Order'),
      el('p', 'lede', 'Somebody built a tower out of big bricks in the middle of the rug, and it is crawling with toys. Fight your way to the flag on top.'),
      el('p', 'sideways', 'It plays best with your phone turned sideways.'),
      controlsList(), actions(primary, G.best ? el('span', 'muted', 'Best ' + fmtTime(G.best)) : el('span')));
  } else if (kind === 'pause') {
    primary = button('play', 'Resume', resume);
    const snd = button('ghost', muted ? 'Sound off' : 'Sound on', () => { setMuted(!muted); snd.textContent = muted ? 'Sound off' : 'Sound on'; });
    const mus = button('ghost', MUS.on ? 'Music on' : 'Music off', () => { MUS.on = !MUS.on; store.set('music', MUS.on ? 1 : 0); mus.textContent = MUS.on ? 'Music on' : 'Music off'; });
    sheetEl.append(el('p', 'eyebrow', 'Tall Order'), title('h2', 'Paused'), controlsList(), actions(primary, snd, mus, button('ghost', 'Start over', startGame)));
  } else if (kind === 'win') {
    primary = button('play', 'Climb again', startGame);
    const st = el('dl', 'stats');
    for (const [k, v] of [['Time', fmtTime(G.t)], ['Popped', String(G.kills)], ['Falls and knockouts', String(G.deaths)]]) { const d = el('div'); d.append(el('dt', null, k), el('dd', null, v)); st.append(d); }
    sheetEl.append(el('p', 'eyebrow', G.newBest ? 'New best time' : 'Best ' + fmtTime(G.best)), title('h2', 'Top of the tower!'), el('p', 'lede', rank()), st, actions(primary));
  }
  panelEl.hidden = false;
  sheetEl.classList.toggle('long', sheetEl.scrollHeight > sheetEl.clientHeight + 2);
  setTimeout(() => { try { primary.focus({ preventScroll: true }); } catch (e) {} }, 30);
}
// a title for how the climb went
function rank() {
  const t = G.t, d = G.deaths;
  if (t < 150 && d === 0) return 'Rank: Brick Legend. Not a scratch on you.';
  if (t < 210 && d <= 1) return 'Rank: Tower Toppler. The toys will talk about this.';
  if (t < 330) return 'Rank: Sturdy Climber. The flag is yours.';
  if (d >= 8) return 'Rank: Ketchup Connoisseur. You fell a lot, and you got there anyway.';
  return 'Rank: Slow and Steady. The wolf was getting bored.';
}
function hidePanel() { panelEl.hidden = true; panelKind = null; }
function startGame() {
  audio();
  resetGame();
  G.st = 'play'; G.paused = false;
  hidePanel(); pauseBtn.hidden = false;
  try { hud.focus({ preventScroll: true }); } catch (e) {}
  G.intro = REDUCE ? 0 : 3;
  if (REDUCE) { callout('CLIMB!', '#ffd23f', 64, 1); sfx.start(); }
}
function resetGame() {
  Object.assign(P, { x: 4, y: 0, z: 23.5, yaw: -Math.PI / 2, vx: 0, vy: 0, vz: 0, kx: 0, kz: 0, hp: 100, inv: 0, dead: 0, check: 0, onGround: true, ground: null, fallFrom: 0, full: 0, fireT: 0, kick: 0, itemT: 0, vm: null, swing: 0, hurtT: 0, hurtA: null });
  for (const c of CHECKS) c.reached = c.n === 0;
  for (const s of STEPS) { s.p = 0; s.sol.off = true; }
  stepsT = -1;
  Object.assign(G, { t: 0, kills: 0, deaths: 0, shake: 0, won: false, peak: 0, newBest: false, stepsIn: 0, combo: 0, comboT: 0, sayCd: 0, intro: 0 });
  G.callouts.length = 0; PARTS.length = 0; G.stats = { shots: 0, hits: 0 };
  stick = null; pointers.clear();
  populate();
}
function pause() {
  if (G.st !== 'play' || G.paused) return;
  G.paused = true; stick = null; pointers.clear(); IN.kf = IN.kb = IN.kl = IN.kr = IN.ksl = IN.ksr = 0; IN.kFire = IN.mFire = IN.kJump = false;
  if (document.pointerLockElement) document.exitPointerLock();
  showPanel('pause');
}
function resume() { G.paused = false; hidePanel(); last = performance.now(); try { hud.focus({ preventScroll: true }); } catch (e) {} }

// ---------------------------------------------------------------- input wiring
hud.addEventListener('pointerdown', e => {
  audio();
  if (G.st !== 'play' || G.paused) return;
  e.preventDefault();
  try { hud.setPointerCapture(e.pointerId); } catch (_) {}
  const mouse = e.pointerType === 'mouse';
  if (mouse && IN.locked) { if (e.button === 0) IN.mFire = true; else if (e.button === 2) useItem(); return; }
  if (mouse && e.button === 2) { useItem(); return; }
  if (mouse && e.button > 0) return;
  const x = e.clientX, y = e.clientY;
  if (x < W / 2) { if (!stick) stick = { id: e.pointerId, x0: x, y0: y, x, y }; return; }
  for (const c of chipSpots()) if (Math.hypot(x - c.x, y - c.y) < c.r * 1.25) { SEL = c.i; sfx.pickup(); return; }
  const b = buttonAt(x, y);
  if (b) press(e.pointerId, b);
});
hud.addEventListener('pointermove', e => {
  if (G.st !== 'play' || G.paused) return;
  if (IN.locked && e.pointerType === 'mouse') { IN.mouseTurn += e.movementX * 0.0032; return; }
  if (stick && stick.id === e.pointerId) {
    stick.x = e.clientX; stick.y = e.clientY;
    const R = stickR(), dx = stick.x - stick.x0, dy = stick.y - stick.y0, L = Math.hypot(dx, dy);
    if (L > R) { stick.x0 = stick.x - dx / L * R; stick.y0 = stick.y - dy / L * R; }
    return;
  }
  const p = pointers.get(e.pointerId);
  if (p) { const b = onButton(e.clientX, e.clientY); if (b && b !== p.b) press(e.pointerId, b); }
});
const pointerEnd = e => {
  if (IN.locked && e.pointerType === 'mouse') { if (e.button === 0) IN.mFire = false; return; }
  if (stick && stick.id === e.pointerId) stick = null;
  pointers.delete(e.pointerId);
};
hud.addEventListener('pointerup', pointerEnd);
hud.addEventListener('pointercancel', pointerEnd);
hud.addEventListener('contextmenu', e => e.preventDefault());
hud.addEventListener('click', e => {
  // with a mouse, a click grabs it, so it can turn you
  if (G.st !== 'play' || G.paused || IN.locked || e.pointerType === 'touch' || matchMedia('(pointer: coarse)').matches) return;
  try { const r = hud.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (_) {}
});
document.addEventListener('pointerlockchange', () => {
  IN.locked = document.pointerLockElement === hud;
  if (!IN.locked) { IN.mFire = false; IN.ksl = IN.ksr = 0; }
});
pauseBtn.addEventListener('click', pause);
window.addEventListener('keydown', e => {
  if (e.code === 'KeyM') { audio(); setMuted(!muted); return; }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (G.st === 'play' && !G.paused) pause(); else if (G.paused) resume(); return; }
  if (G.st !== 'play' || G.paused) return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  audio(); key(e.code, true);
});
window.addEventListener('keyup', e => { if (G.st === 'play' && !G.paused) key(e.code, false); });
function key(code, down) {
  const v = down ? 1 : 0;
  if (code === 'KeyW' || code === 'ArrowUp') IN.kf = v;
  else if (code === 'KeyS' || code === 'ArrowDown') IN.kb = v;
  else if (code === 'KeyA' || code === 'ArrowLeft') { if (IN.locked && code === 'KeyA') IN.ksl = v; else IN.kl = v; }
  else if (code === 'KeyD' || code === 'ArrowRight') { if (IN.locked && code === 'KeyD') IN.ksr = v; else IN.kr = v; }
  else if (code === 'Space') { IN.kJump = down; if (down) P.jumpBuf = 0.14; }
  else if (code === 'KeyJ' || code === 'KeyF' || code === 'Enter') IN.kFire = down;
  else if (code === 'KeyK' || code === 'KeyE') { if (down) useItem(); }
  else if (code === 'KeyQ') { if (down) cycleItem(); }
  else return;
  if (down) IN.keys = true;
}
window.addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------------------------------------------------------------- loop
let last = performance.now(), lastErr = '', slow = 0, fast = 0;
function frame(now) {
  const rdt = Math.max(0, (now - last) / 1000), dt = Math.min(0.05, rdt);
  last = now;
  G.time += dt;
  try {
    if (G.st === 'play' && !G.paused && !G.manual) {
      G.t += dt;
      stepLifts(dt); stepSteps(dt); stepPlayer(dt); stepWorld(dt);
    } else if (G.st === 'win') { G.winT += dt; if (G.winT > 2.2 && panelKind !== 'win') { finishRun(); showPanel('win'); } }
    if (G.st !== 'play' || !G.paused) stepParts(dt);
    const bossOn = G.boss && G.boss.alive && G.boss.awake && P.y > Y[4] - 0.5;
    music(G.st === 'play' && !G.paused ? (bossOn ? 'boss' : 'climb') : null, stepsT >= 0 ? 2 : 0);
    G.shake = Math.max(0, G.shake - dt * 30); G.flash = Math.max(0, G.flash - dt * 3);
    placeCamera(dt);
    drawLifts(); drawPads(); drawChecks(); drawSteps(); drawGoal(); drawParts();
    drawFoes(); drawShots(); drawGibs(); drawItems(); drawFX();
    render3d();
    drawHUD(dt);
  } catch (err) {
    if (String(err) !== lastErr) { lastErr = String(err); console.error(err); }
  }
  // if frames are slow, draw the 3D view at a lower resolution
  if (rdt > 0.028) slow += rdt; else slow = Math.max(0, slow - rdt * 0.5);
  if (slow > 1.5 && QUAL > 0.55) { QUAL -= 0.15; slow = 0; resize(); }
  requestAnimationFrame(frame);
}
function finishRun() {
  if (!G.best || G.t < G.best) { G.best = G.t; G.newBest = true; store.set('best', G.t.toFixed(2)); }
}
function placeCamera(dt) {
  if (G.st === 'title') {
    // a slow turn round the tower
    const a = G.time * 0.12, R = 26;
    CAM.x = Math.cos(a) * R; CAM.z = Math.sin(a) * R + 1; CAM.y = 9 + Math.sin(G.time * 0.2) * 3;
    CAM.yaw = Math.atan2(1 - CAM.z, -CAM.x); CAM.pitch = 0.18;
    return;
  }
  const down = P.dead > 0 ? clamp(1 - P.dead / 2.2, 0, 1) : 0;
  // at the start, a look up the tower to the flag, then down to business
  if (G.intro > 0 && G.st === 'play' && !G.paused) {
    const was = G.intro;
    G.intro -= dt; if (Math.hypot(P.vx, P.vz) > 1 || fireHeld()) G.intro = Math.min(G.intro, 0.5);
    if (was > 1.5 && G.intro <= 1.5) { callout('CLIMB!', '#ffd23f', 64, 1); sfx.start(); }
  }
  const up = G.intro > 0 ? easeInOut(clamp(G.intro / 1.7, 0, 1)) * 0.56 : 0;
  CAM.x = P.x; CAM.y = P.y + EYE * (1 - down * 0.7); CAM.z = P.z; CAM.yaw = P.yaw; CAM.pitch = up - down * 0.35;
}

// ---------------------------------------------------------------- boot
buildTower();
for (const L of LIFTS) { L.sol = solid(L.x0, L.lo - 0.4, L.z0, L.x1, L.lo, L.z1, { dyn: true }); SOL.pop(); DYN.push(L.sol); }
for (const s of STEPS) { s.sol = { x0: s.x0, y0: s.y0, z0: s.z0, x1: s.x1, y1: s.y1, z1: s.z1, off: true }; DYN.push(s.sol); }
for (const b of SOL) fileSolid(b);
buildMesh();
resize();
showPanel('title');
window.tallOrder = {
  FOES, SHOTS, ITEMS, INV, WAVES, giveItem, useItem, inLine, populate, los, floorBelow, stepsT: () => stepsT,
  sim(secs) { const dt = 1 / 60; for (let i = 0; i < Math.round(secs * 60); i++) { G.time += dt; G.t += dt; stepLifts(dt); stepSteps(dt); stepPlayer(dt); if (typeof stepWorld === 'function') stepWorld(dt); } },
  setStick(x, y) { if (x == null) { stick = null; return; } const R = stickR(); stick = { id: -1, x0: 0, y0: 0, x: x * R, y: y * R }; },
  G, P, IN, SOL, CHECKS, LIFTS, PADS, LADDERS, STEPS, GOAL: () => GOAL, start: startGame, world: () => WORLD, key, buttons, buildSteps,
  teleport(x, y, z, yaw) { Object.assign(P, { x, y, z, vx: 0, vy: 0, vz: 0, kx: 0, kz: 0 }); if (yaw != null) P.yaw = yaw; } };
requestAnimationFrame(frame);
})();
</script>
</body>
