<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div id="err" hidden>Tall Order needs WebGL 2, and this browser didn't offer it. A recent Chrome, Firefox or Safari will run it.</div>
<script>

  CAM.x = P.x; CAM.y = P.y + EYE * (1 - down * 0.7); CAM.z = P.z; CAM.yaw = P.yaw; CAM.pitch = up - down * 0.35 + tip + (P.hang ? 0.12 : 0) + (P.carried ? -0.55 + Math.sin(G.time * 2.3) * 0.04 : 0);
}

// ---------------------------------------------------------------- boot
buildTower();
for (const L of LIFTS) { L.sol = solid(L.x0, L.lo - 0.4, L.z0, L.x1, L.lo, L.z1, { dyn: true }); SOL.pop(); DYN.push(L.sol); }
for (const s of STEPS) { s.sol = { x0: s.x0, y0: s.y0, z0: s.z0, x1: s.x1, y1: s.y1, z1: s.z1, off: true }; DYN.push(s.sol); }
for (const b of SOL) fileSolid(b);
buildMesh();
resize();
showPanel('title');
window.tallOrder = {
  FOES, SHOTS, ITEMS, INV, WAVES, giveItem, useItem, inLine, populate, los, floorBelow, foe, stepsT: () => stepsT, aim: () => ({ out: OUTBAND, dir: OUTDIR, y: AIMY }), selIdx: () => SEL, dir: () => DIR,
  sim(secs) { const dt = 1 / 60; for (let i = 0; i < Math.round(secs * 60); i++) { G.time += dt; stepGame(dt); } },
  setStick(x, y) { if (x == null) { stick = null; return; } const R = stickR(), x0 = W * 0.2, y0 = H * 0.64; stick = { id: -1, x0, y0, x: x0 + x * R, y: y0 + y * R }; },
  dbgDecals() { DECAL.n = 0; drawFoes(); const out = []; for (let i = 0; i < DECAL.n; i++) out.push(Array.from(DECAL.inst.slice(i * 12, i * 12 + 12)).map(v => +v.toFixed(2))); DECAL.n = 0; SH.box.n = SH.cyl.n = SH.sph.n = 0; GLOW.box.n = GLOW.sph.n = 0; return out; },
  G, P, IN, SOL, CHECKS, LIFTS, PADS, LADDERS, STEPS, CAM, GOAL: () => GOAL, stick: () => stick && { ...stick }, pointers: () => [...pointers], start: startGame, world: () => WORLD, key, buttons, buildSteps,
  teleport(x, y, z, yaw) { Object.assign(P, { x, y, z, vx: 0, vy: 0, vz: 0, kx: 0, kz: 0 }); if (yaw != null) P.yaw = yaw; } };
requestAnimationFrame(frame);
})();
</script>
