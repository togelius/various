<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absorb This — kitchen checks</title>
<style>
body{background:#18382f;color:#fff0d1;font:16px/1.5 system-ui;max-width:820px;margin:40px auto;padding:0 20px}h1{font-size:32px}button{font:inherit;padding:10px 20px;cursor:pointer;border:0;border-radius:5px;background:#ffd17b;color:#302316}pre{white-space:pre-wrap;font-size:13px}.fail{color:#ff9d88}.pass{color:#9de8c1}iframe{position:fixed;left:-10000px;width:1280px;height:720px;border:0}
</style>
<h1>The long kitchen: integration checks</h1>
<p>Runs the actual game simulation and WebGL renderer in a muted, isolated frame. Scores and endings use an in-memory store. No playthrough records are changed.</p>
<button id="run">Run checks</button><p id="status" role="status">Ready.</p><pre id="results"></pre>
<script>
const run=document.querySelector('#run'),status=document.querySelector('#status'),results=document.querySelector('#results');let frame,timer;
run.onclick=async()=>{
 run.disabled=true;results.textContent='';status.textContent='Loading the kitchen…';frame?.remove();clearTimeout(timer);
 try{
  const [gameResponse,testResponse]=await Promise.all([fetch('../index.html'),fetch('journey.js')]);
  if(!gameResponse.ok||!testResponse.ok)throw Error('Serve this folder with a local HTTP server first.');
  let game=await gameResponse.text();const tests=await testResponse.text();
  const boot="showScreen('title');\nrequestAnimationFrame(frame);",pointerStart=game.indexOf('function grabPointer() {'),pointerEnd=game.indexOf("$('scr').addEventListener('click', e => {",pointerStart);
  if(!game.includes(boot)||pointerStart<0||pointerEnd<0||!game.includes('muted = false'))throw Error('Game test seams changed; update the harness.');
  game=game.slice(0,pointerStart)+'function grabPointer() { locked = true; }\n'+game.slice(pointerEnd);
  game=game.replace('muted = false','muted = true').replaceAll('localStorage','testStorage');
  game=game.replace("'use strict';","'use strict';\nconst testValues=new Map(),testStorage={getItem:k=>testValues.get(k)??null,setItem:(k,v)=>testValues.set(k,String(v))};");
  game=game.replace(boot,tests.replaceAll('localStorage','testStorage'));
  frame=document.createElement('iframe');frame.title='Muted game test frame';frame.srcdoc=game;document.body.append(frame);
  status.textContent='Running encounters and traversal…';timer=setTimeout(()=>{status.textContent='Checks timed out. Inspect the browser console for a startup error.';status.className='fail';run.disabled=false;},20000);
 }catch(e){status.textContent=e.message;status.className='fail';run.disabled=false;}
};
addEventListener('message',e=>{
 if(e.source!==frame?.contentWindow||e.data?.type!=='absorb-tests')return;
 clearTimeout(timer);const lines=e.data.results,failures=lines.filter(s=>s.startsWith('FAIL'));
 results.textContent=lines.join('\n');status.textContent=failures.length?`${failures.length} failed checks.`:`All ${lines.length} checks passed. Sound stayed off.`;status.className=failures.length?'fail':'pass';run.disabled=false;
});
</script>
