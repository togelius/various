  chal_real_intro: [
    "Challenge: Return to the Real! Knock an enemy off the counter within thirty-five seconds. Soap helps. Below the counter is the Real. Send somebody there.",
    "New challenge! Within thirty-five seconds, knock an enemy off the counter. Take some soap. Every enemy must one day meet the Real. Today you are the delivery service.",
    "Challenge! Knock something off the edge of the counter. Below is the floor, and the floor is where every illusion finally lands.",
    "Thirty-five seconds! Push one enemy over the edge of the counter, into the Real. Beneath the symbolic order there is only the floor, and the dog.",
    "Return to the Real! Knock one of them off the counter in thirty-five seconds. Show it the desert of the Real, which in this kitchen is mostly tiles.",
    "New challenge! Within thirty-five seconds, knock an enemy off the counter. Every enemy must one day meet the Real. Today you are the delivery service.",
    "The counter is the world of symbols and rules. Below it, crumbs, dust, a dog. The Real. Knock an enemy over the edge in thirty-five seconds. Make the introduction.",
    "Return to the Real! You have thirty-five seconds to knock an enemy off the counter. It has lived its whole life on a nice flat surface. Show it what is underneath.",
    "Return to the Real! Knock something off the edge of the counter. You have thirty-five seconds. The floor is waiting.",
    "Challenge! You have thirty-five seconds to knock one enemy off the counter. Trap it in a soap bubble if you like. Bubbles float, but they also drift.",
    "Thirty-five seconds! Push one enemy off the edge, down to the floor where the dog lives. A soap bubble makes it easier. The Real is only one nudge away.",
    "Return to the Real! Within thirty-five seconds, knock an enemy off the counter. Bubble it, blast it, dash into it. The dog has been patient all game.",
  ],
  chal_real_win: [
    "It fell! Into the Real! Welcome to the desert of the Real, my little friend. It is mostly crumbs, and a dog.",
    "Over the edge! You returned an enemy to the Real. It did not want to go. Nobody ever wants to go. That is how you know it was the Real.",
    "Over the edge! It met the Real. And the Real, it turns out, is linoleum. It is always linoleum. Nobody expects this.",
    "Down it goes! The dog is investigating. The dog is the only one in this house who is completely at home in the Real.",
    "Returned to the Real, with a little splat. That splat, you see, is the sound of the symbolic order losing a member.",
    "It fell into the Real. Down there, with the dog and the crumbs. This is where everything ends up eventually.",
    "Off the counter it goes! Now it lies among the crumbs and the lost peas, in the dark place where every kitchen hides its truth.",
    "Plop! It met the floor. The floor did not care. This is the lesson of the Real: it is completely indifferent to your drama.",
    "You delivered it to the Real. The dog sniffed it and walked away. Even the Real has standards.",
  ],
  chal_real_fail: [
    "The edge was right there, and nobody went over it. The Real was one push away. It is always one push away. Nobody ever pushes.",
    "Nobody fell. Everybody stayed on the counter, safe, in the Symbolic, where it is warm and there are rules. The Real can wait. The Real is very good at waiting.",
    "Time is over, and the floor is still empty. The dog is disappointed. The dog is the only one who actually wanted the Real.",
    "Nobody fell. Everyone stays safely inside the symbolic order. This is how it usually goes. The Real can wait. It is very patient. It is a floor.",
    "Thirty-five seconds, and nobody reached the Real. You are too comfortable up here. We all are.",
    "Failed. The enemies remain on the counter, protected by the fiction of the counter. The floor will have to wait, and the dog will have to wait for its snack.",
    "Nothing fell. Everything stays safely on the counter, in the Symbolic. How boring.",
    "Thirty-five seconds, and the edge stayed empty. You need a soap bubble next time. Even the Real needs a little help with transport.",
    "Nobody fell off the counter. Everybody just stood near the edge, looking down, like tourists at a viewpoint. Nobody jumps. Nobody ever jumps.",
    "Time is up, and nobody reached the floor. The dog has gone back to its basket. It is not angry. It is only disappointed, in the way of dogs.",
  ],
  chal_gaze_intro: [
    "Challenge: The Gaze! Shoot three googly eyes in fifteen seconds. They look at you, you look at them, but only one of you has a water pistol.",
    "Fifteen seconds, three googly eye hits. The gaze has been judging you all game. Now you judge it. Aim for the eyes.",
    "Three googly eyes, fifteen seconds. Look them in the eye and shoot. This is how you win an argument with a sponge. Also, sadly, with most people online.",
    "The Gaze! Three shots right in the googly eyes within fifteen seconds! It is not you who looks at the object. The object looks at you. Look back. Shoot back.",
    "New challenge: hit three googly eyes in fifteen seconds. Lacan says the picture is looking at you. These pictures have plastic eyes. Hit them.",
    "Three googly eyes, fifteen seconds! The gaze of the Other watches you from every sponge. Show it what happens when the watched one watches back.",
    "The Gaze! Three shots to the googly eyes in fifteen seconds. Aim carefully. The eye is the only part of the enemy that is really looking for trouble.",
    "The gaze! Three shots into the googly eyes in fifteen seconds. Make the object stop looking at you.",
    "Challenge! Three shots into googly eyes, within fifteen seconds. The pupils rattle around loose, so aim where they are going, not where they are.",
    "Fifteen seconds to hit three googly eyes! They were glued on at a factory to make sponges look alive. Make them look a little less alive.",
    "The Gaze! Three googly-eye hits in fifteen seconds. It is a staring contest, but you are allowed to cheat with seltzer.",
  ],
  chal_gaze_win: [
    "Three eyes! You shot the gaze itself! And yet I still feel watched. This is the gaze. You can shoot it, but you can never quite stop it.",
    "Precisely! Right in the googly, three times! The gaze of the Other is blinded. For a moment nobody is watching you. How does it feel? Lonely, yes?",
    "Three eyes, blinded! And now the sponges are only rectangles again. You removed the gaze and the whole world became furniture. Very peaceful. Very lonely.",
    "Three hits on the eyes. Now the sponges see the world as it truly is. Wet, and blurry. Welcome to the club.",
    "The Gaze is defeated! And look, the eyes still wobble. Even blinded, a googly eye keeps moving. It never needed to see. It only needed to look like it was looking.",
    "Three googly eyes, blinded. But the gaze is still there, you know. Now it is in you. *sniff*",
    "Three hits, right in the googlies! The eyes still spin, but now they spin with respect.",
    "You out-stared the objects! Three direct hits on the gaze. For a moment, the kitchen stopped looking at you, and you felt the terrible loneliness of freedom.",
    "Three eyes, three hits! Now the sponges know how it feels to be looked at by somebody who shoots.",
  ],
  chal_gaze_fail: [
    "Not three. The eyes remain. The terrible thing about the googly gaze is that it never blinks. It cannot. It is glued on.",
    "You missed the eyes. They are still looking at you. You know what is worse than being looked at? Being looked at by something that cannot see.",
    "The eyes won. They stared, you blinked. You should never have a staring contest with an object that has no eyelids.",
    "You missed the eyes. The gaze wins. The gaze always wins. It is looking at you right now, and it is disappointed. Googly, wobbly, disappointed.",
    "You failed The Gaze. The eyes still roll around, seeing nothing, judging everything. Like critics. Like a mirror at seven in the morning.",
    "You could not look the gaze in the eye. Nobody can. It is too googly. Do not feel bad. Philosophers have been failing this for centuries.",
    "Fifteen seconds, and not three eyes. The googly gaze remains intact. It will follow you now, rattling, all the way to the sink.",
    "You missed the eyes and hit the foam. You were looking at the sponge, but not at its gaze. This is the difference between an eye and a look.",
    "Failed! The eyes are too small and too wobbly. Like the truth. You aim for it, and it rolls to the side of its little plastic dome.",
  ],
  chal_horizontal_intro: [
    "The Ticklish Subject? No! The Horizontal Subject! Stay in puddle form for six seconds within the next twenty. Lie down. Spread out. Stop being so vertical.",
    "Become horizontal! Stay a puddle for six seconds. Right mouse, or C. Let go of your upright dignity.",
    "New challenge! Lie flat for six seconds. Be a puddle! Stop standing up for things! Just for once, spread out and let the world walk over you.",
    "Be a puddle! Six seconds in puddle form, sometime in the next twenty. You have been standing up all game. The subject is not a tower. The subject is a spill.",
    "Challenge: The Horizontal Subject. Hold puddle form for six seconds within twenty. No heroics. Just lie there, flat and shiny, like a philosopher after lunch.",
    "Twenty seconds to spend six of them as a puddle! Hegel's subject is a restless negativity. Yours will be a restful flatness. Try it. It is harder than it looks.",
    "New challenge! Six seconds as a puddle, within the next twenty. All of Western thought is about standing upright. Be the counter-argument. Lie flat on the counter.",
    "The Horizontal Subject! Puddle form, six seconds, within twenty! You want to rise, to act, to be seen. Instead, spread. Be a small wet opinion on the counter.",
    "Challenge! Within twenty seconds, spend six seconds as a puddle. Flatten yourself. Press C or right mouse. Lie there like a tea towel on a radiator.",
    "Horizontal Subject! Twenty seconds on the clock, and you must be a puddle for six of them. The crumbs are waiting to meet you at eye level.",
    "Be flat for six seconds, somewhere in the next twenty! Lying down is the oldest form of protest. Sit-ins are only lying down for cowards.",
  ],
  chal_horizontal_win: [
    "Six seconds of puddle! Flat, humble, horizontal. Diogenes lived in a barrel. You lived on a counter. Same thing, but wetter.",
    "Six seconds flat. The Ticklish Subject has become the Horizontal Subject. I should write a book. I probably already did. Several.",
    "A perfect puddle! Six seconds of horizontal existence. You gave up your verticality and nothing bad happened. Remember this on Monday morning.",
    "Perfect horizontality! You stopped being a drop and became a situation. This is maturity.",
    "You lay down, and the world did not end! You see? Most of the world does not need you standing up. It is a relief, no?",
    "Six seconds as a puddle. You have abandoned the vertical fantasy of the proud subject. Congratulations.",
    "Six seconds of perfect flatness! You were so horizontal that the spirit level in the lid drawer sent you a card.",
    "You lay down and let the kitchen happen above you. Six seconds. The Buddhists spend decades trying to do this. You did it on a counter.",
    "Success! Six seconds as a puddle. You did not rise, you did not strive, you simply spread. This is how the flood always wins in the end.",
  ],
  chal_horizontal_fail: [
    "Too humble for you, being a puddle? Everyone wants to be the drop. Nobody wants to be the spill. And yet the spill is the truth of the drop.",
    "You could not stay flat. You wanted to stand up, to be somebody, to be a drop. Ambition! The oldest way to evaporate.",
    "Not enough puddle. You kept popping back up, like a jack in the box, like a bad idea, like me on television.",
    "You could not stay flat! Always popping up, always vertical, always wanting to be seen. This is the narcissism of the drop.",
    "Not six seconds. You stood up too early, like a guest who leaves the party just before the good argument begins.",
    "Failed. You refused to lie down. I respect this. I also do not respect this. Both at once. This is dialectics.",
    "You stood up again. Always standing up, like a good little bourgeois individual.",
    "Not six seconds flat. You got up too soon, like a man who hears his phone in the other room. Something always calls you back to the vertical.",
    "Failed! You could not stay down. There is a lesson here about pride, but you were standing up before I could finish it.",
    "Twenty seconds, and not enough puddle. The crumbs are offended. They cleared a whole space for you.",
  ],
  greasy: [
    "Look at that sponge. It shines! It has been fried. This is the stove district: here even the enemies arrive pre-oiled, like a politician before a debate.",
    "A greasy sponge. Water slides off it, ice skids off it. It is like trying to criticise a billionaire: everything you throw just lubricates him. You need soap. You need a solvent.",
    "Grease! The great ideology of the frying pan. It coats everything, it repels water, and it convinces you that this is simply how things taste. Bubble it. Soap is the critique of grease.",
    "This sponge has been to the deep fryer. It is now waterproof, ice-proof and, I think, slightly delicious. Only detergent can bring it back to the realm of the arguable.",
  ],
  tip_greasy: [
    "It slid off! Of course. Oil and water do not mix. This is not chemistry, this is class consciousness. You need a mediator. Soap: half loves water, half loves grease. Soap is the vanishing mediator!",
    "Water off a greasy sponge. The sponge has achieved the dream of every corporation: it is perfectly non-stick. Nothing you do sticks to it. Bubble it, and it will be ordinary again.",
    "You cannot squirt your way through grease. Ask any dishwasher in history. You need the Suds-O-Matic. This is the one time in your life the answer really is: more soap.",
  ],
  degrease: [
    "Degreased! Soap molecules, half for water, half for oil. Soap is the Hegelian molecule: it does not choose a side, it holds both, and then the grease is gone.",
    "Squeaky clean! Now it is only a sponge again. Ordinary, vulnerable, absorbent. This is what they call the end of the illusion. Shoot it.",
    "Emulsified! You did not destroy the grease, you surrounded it with something that loves it and something that hates it. This is how every successful revolution actually works.",
    "Look, the shine is gone. The sponge has been demystified. Marx said all that is solid melts into air. He forgot: all that is greasy melts into foam.",
    "The vanishing mediator! The soap stands between water and grease, makes them meet, and then disappears down the drain. Nobody thanks the soap. Nobody ever thanks the mediator.",
  ],
  chal_dialectic_intro: [
    "Challenge! Three kills, three different ways, twenty-five seconds. Thesis, antithesis, synthesis. If you only squirt, you are not a dialectician, you are a garden hose.",
    "Dialectics! Kill three sponges, each one differently. Water, ice, fizz, soap, gravity, a puddle. Hegel did not spend his life writing so you could press one button.",
    "New challenge: three kills, three techniques. Variety! Not the variety of the supermarket, forty kinds of the same yoghurt. Real variety. Ice and then fire and then falling.",
    "Thesis, antithesis, synthesis! Three different ways to destroy kitchenware in twenty-five seconds. Fichte invented this formula, by the way. Hegel never used it. Nobody remembers Fichte. Make him proud.",
  ],
  chal_dialectic_win: [
    "Three different kills! Synthesis! Hegel would be very proud, and then he would write eight hundred pages explaining why it was inevitable all along.",
    "Thesis, antithesis, synthesis, and three dead sponges. This is the only dialectics that has ever produced a measurable result.",
    "Beautiful. Every kill negated the one before it. This is the cunning of reason, but with a shotgun.",
    "You did it! Three tools, three kills. You are no longer a specialist. Marx would say: hunt in the morning, freeze in the afternoon, soap after dinner. Communism!",
  ],
  chal_dialectic_fail: [
    "You did the same thing again. And again. The thesis never met its antithesis. It only met itself, many times, like a man at a mirror in a hotel bathroom.",
    "Failed! No synthesis. Only thesis, thesis, thesis. This is not Hegel. This is a pop song with one chord.",
    "Not three ways. You are like a philosopher who discovered one idea in 1968 and has been repeating it in every book since. I would never do this. I would never do this. I would never do this.",
  ],
  chal_coldwar_intro: [
    "The Cold War! Four ice kills in eighteen seconds. Here is some ammunition, a gift from the state. Freeze them, and remember: it is never really cold, it is only postponed hot.",
    "Challenge: four kills with ice. The Cold War was the only war where both sides agreed the fighting must happen somewhere else. Today, it happens on this counter.",
    "Four ice kills! Mutually assured shattering! I have filled your shotgun. Do not ask who paid for it. In a cold war, nobody asks who paid for it.",
  ],
  chal_coldwar_win: [
    "Four ice kills! The Cold War is over, and you won. Now, of course, comes the boring part: thirty years of people telling you it was the end of history.",
    "The wall has fallen! Several walls. Sponges, mostly. Fukuyama calls me: is history over? No, Francis. Look, there are more sponges.",
    "Frozen and shattered, four times. In the end the Cold War was won not by ideas but by refrigeration. Very historically accurate.",
  ],
  chal_coldwar_fail: [
    "The Cold War ended without a winner. Exactly like the real one. Everybody pretends they won, and the sponges keep the nuclear weapons.",
    "Not enough ice. The thaw came too early. This is détente: nobody wins, everybody is slightly wet.",
    "You failed the Cold War. Do not worry. Nobody really won the original one either. Some people only got very good at pretending.",
  ],
  frozen: [
    "Frozen! Look at it, perfectly still, like a liberal at a revolution. It wants to act, but first it must wait for the right conditions.",
    "It is frozen solid. This is the condition of every institution after its founder dies. It stands, it shines, it does nothing. Hit it now, it is brittle.",
    "On ice! Frozen in the middle of a gesture, like a statue of a man pointing at the future. Statues are wonderful. Statues also break.",
    "You froze it. Cold storage! This is how Europe treats its problems: put them in the freezer and hope the next generation has a microwave.",
    "Frozen, stiff, cannot move. Like me, at any party, after somebody says the word 'mindfulness'.",
  ],
  shatter: [
    "Shattered! A thousand little pieces. Each one, I am sure, now claims to be the authentic sponge. This is postmodernism in one second.",
    "It broke into fragments. Fragments! Every German philosopher dreams of writing only fragments. This sponge has achieved it without writing anything.",
    "Crushed ice! You froze it, then you hit it. Thesis: cold. Antithesis: violence. Synthesis: a cocktail.",
    "Look, it shatters like a grand narrative at a conference in 1979. Lyotard would be so proud. Lyotard was always proud when something broke.",
    "Ice to meet you, and goodbye. Sorry. Somebody has to make the bad jokes. In Slovenia this is the job of philosophers.",
  ],
  curling: [
    "Curling! The only sport where the players sweep the floor in front of the object, hoping it will go where they want. Exactly like a central bank.",
    "You used one frozen sponge to knock down another. This is the logic of capitalism: the system makes its own victims into its own weapons. Also, it is fun.",
    "Ice bowling! Strike! Somewhere in Scotland, an old man with a broom stands up and weeps with joy.",
    "A frozen sponge, sliding into its comrades. This is what happens to every vanguard. It moves very fast, and it hits its own side first.",
  ],
  bored: [
    "You stopped shooting, and look: the sponges are turning on each other. Of course! An ideology without an enemy is like a sponge without water. It will find something to absorb, even its own comrade.",
    "Carl Schmitt, very bad man, one good idea: the political is the distinction between friend and enemy. Take yourself away as the enemy, and the kitchen simply appoints a new one. Usually the sponge standing closest.",
    "Do not act. Just think! I have been saying this for decades and everybody laughs. Now look. You are doing nothing, and the kitchen is destroying itself. Who is laughing now? The sponges are not laughing. They are fighting.",
  ],
  bartlebyDistrict: [
    "You cleared the whole district without firing a single shot. I would prefer not to! Bartleby the scrivener, the patron saint of the refusal, smiles in his little office. The sponges did everything themselves. This is what we call the cunning of reason. Or laziness. In philosophy these are the same thing.",
    "Not one shot! The district is liberated, and you did nothing. This is the most radical act possible: you refused to participate, and the system collapsed under its own contradictions. Marx promised this. He did not promise it would happen in a kitchen.",
    "Look at the score: a bonus for doing nothing. Finally, a game that rewards the true intellectual. Sitting, watching, refusing, and still somehow taking credit for everything.",
  ],
  leap: [
    "Look at it. The last one. Nobody to fight, nobody fighting it. This is the situation Kierkegaard described: the anxiety of pure freedom. And now, the leap of faith. Off the counter. It is very brave. It is also very wet.",
    "The final sponge stands alone, and it asks the only serious philosophical question: if nobody attacks me, what am I for? It walks towards the edge. Camus would say imagine Sisyphus happy. Here, imagine the floor.",
    "You refused to give it an enemy, so it must give itself a meaning. And the only meaning available, in a kitchen, is gravity. Goodbye, my friend. You were the last of your ideology.",
  ],
  chal_negation_intro: [
    "Negation of the Negation! Soak up ten puddles of your own spilled water in twenty seconds. You spilled yourself. Now unspill yourself.",
    "Soak up ten of your own puddles within twenty seconds. The subject is the one who gets lost and then walks around picking itself up. Pick yourself up. Ten times.",
    "Challenge! Drink back ten of your own puddles in twenty seconds. What you lost, you take back. Hegel called this Aufhebung. My mother called it not wasting food.",
    "Challenge! Twenty seconds, ten of your own puddles. Absorb them back! You lost yourself, and now you negate the loss. This is the whole of Hegel, on a counter.",
    "Ten puddles, twenty seconds. Drink back your own spilled water. The negation of the negation is not a return to the start. It is a return with extra puddle.",
    "Negation of the Negation! Spilling negated you. Now soak up ten of your puddles in twenty seconds, and negate the negation. Go, go, dialectically!",
    "New challenge: reabsorb ten of your own puddles in twenty seconds. Be a sponge, but for yourself. Absorb yourself before the sponges do.",
    "Negation of the negation! You spilled yourself, now drink yourself back. Soak up ten puddles in twenty seconds.",
    "Challenge! Twenty seconds to soak up ten of your own puddles. Every squirt you fired is lying out there. Go and collect yourself. Literally.",
    "Negation of the Negation! Ten puddles back in twenty seconds. You scattered yourself across the counter like crumbs from a croissant. Now be the hand that sweeps them up.",
    "Soak up ten of your spilled puddles in twenty seconds! Each one is a little mirror of you, drying. Nothing is more urgent than rescuing your own reflection.",
  ],
  chal_negation_win: [
    "You picked yourself up ten times. This is exactly what Hegel meant. Probably. He was never very clear about puddles.",
    "Ten out of ten! You absorbed yourself back. A sponge of your own being! The sponges are jealous. Philosophy is jealous.",
    "Ten puddles recovered! Nothing is lost! The spirit returns to itself after its long journey across the counter. Beautiful. Also a little bit disgusting.",
    "Ten puddles reabsorbed! You negated your negation! You are the same drop as before, but now mediated. Much more sophisticated. Slightly dustier.",
    "The spilled returns to itself, enriched by its journey across the counter. Enriched mostly with crumbs. But this is how Spirit works. Crumbs, and then Spirit.",
    "You negated your own negation. Hegel would weep. Or he would ask for a towel.",
    "Ten puddles regained! You were lost, and now you are found, and you are slightly bigger. Dialectics is basically a diet in reverse.",
    "All ten, soaked up! The counter is dry, you are whole, and the sponges are furious. This is the synthesis nobody wanted except you.",
    "You gathered your scattered self from the counter, ten times. Many people need forty years and a therapist for this. You needed twenty seconds.",
  ],
  chal_negation_fail: [

    "Not ten. Some of you is lost forever. It evaporated. It is in the clouds now. Maybe it will rain on you in another game.",
    "You did not soak them up. Your puddles remain alienated from you, drying alone on the counter. This is alienation, very literally, with crumbs.",

    "Failed. Your spilled selves evaporate one by one. Do not worry. You were never whole in the first place. Nobody is. This is the good news.",
    "The puddles are still there. Your spilled self just lies on the counter, un-negated. Tragic.",
    "Not ten. Pieces of you remain on the counter, and the sponges are already circling your leftovers. The negation got negated by somebody else.",
    "Time is up. You left yourself everywhere, like a man who leaves his umbrellas in every café in the city. You are now partly in many cafés.",
    "Too slow! Some of you is evaporating toward the extractor fan. You will be recirculated into the kitchen air. Breathe carefully. You may be breathing yourself.",
  ],
  poster: [
    "You have mistaken a representation of authority for authority. Fortunately, it is charging you exactly the same fee.",

    "Please stop shooting me. I am hanging next to the calendar with the dentist appointment. I have suffered enough.",
    "You attack the image of the philosopher and not the philosophy. Very sensible. The philosophy is much harder to hit, it keeps moving.",
  ],
  edgeSave: [

    "Zeno has saved your life. Please do not ask him to explain; we will be here for half of eternity, then half of the remainder.",
    "You have encountered a limit to your freedom. For once, you are delighted.",
    "The dog had already begun its acceptance speech. You have ruined its evening.",
    "Held together by surface tension and denial. Finally, a protagonist I understand.",
    "Saved by surface tension! Your own inner cohesion held you back. For once, being uptight is a virtue.",
    "You almost fell, and the only thing that stopped you was the stickiness of your own being. Most of us are held together by exactly this.",

  kitchen_0: ["The sink is at the other end. Of course it is. If salvation were convenient, somebody would have bottled it.", "The Spill. Every journey begins with an accident. Afterwards, the accident is renamed a point of departure and printed on a mug.", "Look behind you: an empty glass. Look ahead: a sink. Between origin and destination, eleven metres of counter and a dog waiting underneath for your mistakes.", "You did not choose to leave the glass. Somebody knocked it over. This is how all great migrations begin, with an elbow.", "The Spill! Where the story begins, and where the sponges have already queued. They are always early. Lack is very punctual.", "Here is the paradox of the journey. You travel all the way to the sink in order to disappear down it. Odysseus at least got a wife at the end.", "Every crumb here is a monument to a breakfast that happened without you. Walk respectfully. Or, fine, slide.", "The sink is far away, so it must be important. Distance manufactures meaning. If it were next to the kettle, nobody would bother.", "Welcome to the first district. There is no map, only a countertop and a feeling that you are already late. This is called adulthood.", "Why go to the sink? Because it is there, and because the paper towel is behind you. Most destinations are really just escapes with better branding.", "The Spill is where you learned that you are not a drop in the glass, but a drop out of the glass. One preposition, and your whole ontology changes."],
  kitchen_1: ["The Breakfast Republic! Everyone is equal until the toaster decides who gets a second slice.", "The board admits flat things only. You can change your shape. This is already more social mobility than most institutions offer.", "Breakfast Republic. Liberty, equality, toast. Fraternity was also proposed, but it was eaten by the dog.", "Doubt Flakes, now with thirty percent less certainty! And still you eat them every morning with total conviction. Pure ideology, served with milk.", "The Toast Office. All requests will be returned brown. Notice: nobody asked for brown. But after ten years, brown becomes what you always wanted.", "I think, therefore I need coffee. Descartes forgot the second half. Without coffee, the cogito is only a rumour in a dressing gown.", "The toaster is the perfect sovereign. It holds your bread in its dark interior, says nothing, and then suddenly, violently, it decides.", "A republic of breakfast! Every citizen is born equal and then buttered according to merit. The marmalade people have their own lobby.", "Only flat things fit under the board. Please, become a puddle. Bureaucracy has always preferred the citizen who has no depth.", "Why do the cereal boxes have such happy faces? Because inside they are full of doubt. It is the same with people, especially at conferences.", "In the Breakfast Republic the revolution happens every morning at seven. By nine it has been cleared away and the plates are soaking.", "The toaster pops and everybody flinches. Twenty years of toast and still we are surprised. This is the Real, arriving on schedule."],
  kitchen_2: ["The stove. A place where every disagreement eventually becomes chemistry.", "Grandma has booked the hotplate. She says it is a dry heat. You are water. She knows.", "The Hot Take! When it glows, your argument is cooked. And when it stops glowing, it is still hot for a while. Like every opinion I have ever had.", "Watch the burners. Red means no. Black means perhaps. The stove is the only honest institution in this kitchen.", "You are water on a stove. There is a word for this: soup. Please do not become soup. Soup has no character arc.", "Jump, or wait. Kierkegaard said life is either or. He never met a hotplate. Wait too long, you are steam. Jump too early, you are also steam.", "The extractor fan above us hums like a man who has heard all your arguments before. It is sucking your ideas out through the ceiling.", "The Hot Take district. Here everybody glows for a moment and then goes cold, and nobody remembers what they were burning about.", "Steam! This is you, but more spiritual. Hegel would say Spirit rises. I say mind the hotplate, it is still on.", "Why must you cross the stove? Because the sink is on the other side, and the sink is always on the other side of something unbearable.", "The hob does not hate you. It is simply very hot, and you are very wet. Most conflicts in history were exactly this, only with flags.", "A burner glows. You hesitate. This hesitation, this is freedom! Freedom is the little delay before you jump over a hotplate."],
  kitchen_3: ["The plates have taken sides. Several sides. None of them stable.", "Dishcourse! Finally, a platform where being pushed off has consequences.", "Dishcourse! Every plate is a platform, and every platform wobbles. Welcome to public debate.", "The soap is morally superior. Of course it is. It has never had to be dirty. It only removes dirt from others and then goes down the drain feeling clean.", "Stand on a plate and it tilts. Stand on a bowl and you fall inside. The dish rack is a lesson in which positions can actually carry your weight.", "Look how the plates stand in their rack, upright, in perfect rows, dripping. This is the army of the clean. They are very proud and still wet.", "Dishcourse, where everybody has been washed but nobody has been dried. Discourse is always like this, a little damp and leaning on the next person.", "The plates have taken sides. The cups have taken handles. The saucepan has taken a lawyer. It is a dish rack, not a parliament.", "A clean plate is a promise of the next dirty one. Every act of washing contains its own failure. This is Sisyphus, but with a tea towel.", "Careful, the soap is slippery. Moral superiority always is. You try to stand on it and suddenly you are on your back.", "Here is the dialectic of the dish rack. The plates are clean because they were dirty. Without the lasagna they would have no identity at all.", "The dish rack has no opinion. It only holds up the opinions of others and lets them drip. Like a newspaper, but made of plastic."],
  kitchen_4: ["The sink of history. Everything flows into it, and somebody else is expected to do the washing-up.", "You came all this way for a hole. Desire has an extraordinary travel budget.", "The Sink of History! Pull the plug, become somebody else's problem. This is the oldest political strategy in the world.", "The tap refills you. Isn't it strange? At the end of the journey, the source. You walked all this way only to be poured again.", "Look at the limescale around the drain. Layer upon layer of the past, all the water that went before you, hardened into a crust. This is tradition.", "Everything ends up here: the crumbs of the Republic, the soap of Dishcourse, the steam of the stove, now condensed. History is the sediment of breakfast.", "The drain is a hole that swallows everything and gives nothing back. Lacan would call it the Thing. The plumber would call it a Tuesday.", "You fear the drain? Good. But you also want it. You came across the whole kitchen for it. This is the death drive with good water pressure.", "The Sink of History, where old events soak overnight in the hope that somebody else will scrub them in the morning. Nobody ever does.", "What is beyond the drain? The pipes. Beyond the pipes, the sewer. Beyond the sewer, the sea. Every ending is only the beginning of a larger plumbing.", "At the tap you are filled again, whole again, a drop again. Enjoy this moment. It will be taken from you immediately, which is why it is precious.", "Hegel said history ends. He did not say where. I have discovered the answer. It is next to the washing-up liquid."],

function findCurio() {
  if(state!=='play')return null;
  const eye=[P.x,P.y+P.eyeH,P.z],dir=[-Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),-Math.cos(P.yaw)*Math.cos(P.pitch)];
  let best=null,nearest=6;
  for(const r of CURIOS){
    if(r.lowOnly&&!P.pud)continue;
    const v=[r.x-eye[0],r.y+r.eyeY-eye[1],r.z-eye[2]],d=Math.hypot(...v);
    if(d>nearest||d<.1)continue;
    const dot=v.reduce((n,a,i)=>n+a*dir[i],0)/d;
    if(dot<Math.cos(.13+Math.min(.15,r.radius/d)))continue;
    if(rayStatic(...eye,...v.map(a=>a/d),d)<d-r.radius-.22)continue;
    best=r;nearest=d;
  }
  return best;
}

function cloneRetry(value, seen = new Map([[WET, WET]])) {
  if (value === null || typeof value !== 'object') return value;
  if (seen.has(value)) return seen.get(value);
  const copy = value instanceof Set ? new Set() : value instanceof Map ? new Map() : Array.isArray(value) ? [] : {};
  seen.set(value, copy);
  if (value instanceof Set) for (const item of value) copy.add(cloneRetry(item, seen));
  else if (value instanceof Map) for (const [key, item] of value) copy.set(cloneRetry(key, seen), cloneRetry(item, seen));
  else for (const key of Object.keys(value)) copy[key] = cloneRetry(value[key], seen);
  return copy;
}

function optsHTML() { return `<div class="opts"><button data-o="g">${GLASSN()}</button><button data-o="v">${voiceLabel().split(' (')[0].split(' ·')[0]}</button><button data-o="s">SPEECH: ${TALK_NAMES[talkSpeed]}</button><button data-o="z">ŽIŽEK: ${ZTALK[zTalk].n}</button><button data-o="m">${muted ? 'SOUND: OFF' : 'SOUND: ON'}</button><button data-o="l">LIGHTING: ${richLighting?'SUNLIT':'CLASSIC'}</button><button data-o="r">REPLAYS: ${autoReplays?'AUTO':'NOTEBOOK ONLY'}</button></div>`; }
$('scr').addEventListener('click', e => { const b = e.target.closest('button[data-o]'); if (!b) return;
  ({ g: toggleGlass, v: cycleVoice, s: cycleTalk, z: cycleZTalk, m: toggleMute, l: toggleLighting, r: toggleReplays })[b.dataset.o](); const o = b.closest('.opts'); if (o) o.outerHTML = optsHTML(); });
function start() {
  initAudio();
  if (state === 'title' || state === 'dead' || state === 'absorbed' || state === 'won') { reset(); districtSupplies(); continues = 0; state = 'play'; $('hud').classList.remove('off'); lastHud = ''; tickW = 0; say('get wet', true); setTimeout(() => { if(state==='play')zz(Math.random()<.4?'kitchen_0':'start', { force: true }); }, 1400); }
  else if (state === 'paused') {state = 'play';$('hud').classList.remove('off');}
  hideScreen(); grabPointer();
}
function grabPointer() {
  if (TOUCH) { locked = true; $('touchui').hidden = false; return; }
  try { const r = cv.requestPointerLock({ unadjustedMovement: true }); if (r && r.catch) r.catch(() => cv.requestPointerLock()); } catch (e) { cv.requestPointerLock(); }
}
$('scr').addEventListener('click', e => {
  const clipButton = e.target.closest('button[data-replay]');
  if (clipButton) { const clip = replayArchive[Number(clipButton.dataset.replay)]; if (clip) beginReplay(clip, true); return; }
  const action=e.target.closest('button[data-action]');
  const entry=e.target.closest('button[data-curio]');
  if(entry){const r=CURIOS.find(r=>r.id===entry.dataset.curio);if(r&&curioFound.has(r.id)){readingCurio=r;curioTurn=.12;showScreen('curio');}return;}
  if(action){
    const a=action.dataset.action;
    if(a==='journal')openNotebook();
    else if(a==='notebook-back')showScreen(notebookReturn);
    else if(a==='curio-left')curioTurn-=.45;
    else if(a==='curio-right')curioTurn+=.45;
    else if(a==='curio-close'){if(notebookReturn==='pause')start();else showScreen(notebookReturn);}
    else if(a==='continue')continueGame();else if(a==='endless')continueEndless();else start();return;
  }
  if(screenKind==='curio'||screenKind==='journal')return;
  if (e.target.closest('input, button, details, summary')) return;
  if (state === 'dead' && P.deadT < 1.2) return; start();
});
$('scr').addEventListener('input', e => { if (e.target.classList.contains('plz') && /please/i.test(e.target.value)) { e.target.blur(); continueGame(); } });
cv.addEventListener('mousedown', e => { if (replayPlayback) { if (e.button === 0) finishReplay(); return; } if (state === 'play' && !locked) start(); if (e.button === 0) mouseDown = true; if (e.button === 2) keys.Mouse2 = true; });
addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; if (e.button === 2) keys.Mouse2 = false; });
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === cv; lockAt = performance.now();
  if (!locked && replayPlayback) holdReplay(true);
  if (!locked && state === 'play') { state = 'paused'; mouseDown = false; showScreen('pause'); }
});
addEventListener('mousemove', e => {
  if (!locked || state !== 'play') return;
  // browsers sometimes report one huge jump right after the lock engages
  if (performance.now() - lockAt < 120 || Math.abs(e.movementX) > 400 || Math.abs(e.movementY) > 400) return;
  P.yaw -= e.movementX * sens; P.pitch = clamp(P.pitch - e.movementY * sens, -1.5, 1.5);
});
addEventListener('wheel', e => { if (state !== 'play') return; const d = e.deltaY > 0 ? 1 : -1; let i = P.wNext; for (let k = 0; k < 4; k++) { i = (i + d + 4) % 4; if (i === 0 || P.ammo[i] > 0) break; } selectWeapon(i); }, { passive: true });
addEventListener('keydown', e => {
  if (replayPlayback) {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); finishReplay(); }
    else if (e.code === 'Escape') holdReplay(true);
    else if (e.code === 'Enter') { e.preventDefault(); holdReplay(!replayPlayback.paused); }
    else if (e.code === 'KeyM') toggleMute();
    return;
  }
  if(e.code==='Escape'&&(screenKind==='curio'||screenKind==='journal')){e.preventDefault();if(notebookReturn==='pause')start();else showScreen(notebookReturn);return;}
  if(e.code==='KeyF'&&!e.repeat&&state==='play'){e.preventDefault();inspectCurio();return;}
  if(e.code==='KeyJ'&&!e.repeat&&(state==='play'||state==='paused')){e.preventDefault();openNotebook();return;}
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'Digit1') selectWeapon(0); if (e.code === 'Digit2') selectWeapon(1); if (e.code === 'Digit3') selectWeapon(2); if (e.code === 'Digit4') selectWeapon(3);
  if (e.code === 'KeyG') toggleGlass();
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyV') cycleVoice();
  if (state === 'dead' && P.deadT > 1.2 && e.key && e.key.length === 1) {
    pleaseBuf = (pleaseBuf + e.key.toLowerCase()).slice(-12);
    if (pleaseBuf.endsWith('please')) { pleaseBuf = ''; continueGame(); return; }
  }
  if ((e.code === 'Enter' || (e.code === 'KeyR' && !pleaseBuf.endsWith('p'))) && state === 'dead' && P.deadT > 1.2) start();
  if (e.code === 'Enter' && state === 'title' && screenKind==='title') start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const GLASSN = () => ['GLASS: NONE', 'GLASS: CLEAN', 'GLASS: MURKY'][glassLevel === 0 ? 0 : glassLevel < 1 ? 1 : 2];
function toggleGlass() {
  glassLevel = glassLevel === 1 ? 0.45 : glassLevel === 0.45 ? 0 : 1;
  if (state === 'play') pop(P.x - Math.sin(P.yaw) * 4, P.y + 1.5, P.z - Math.cos(P.yaw) * 4, GLASSN(), true);
  zz('glass', { force: true });
}
function toggleMute() {
  muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8;
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); ZZ.speaking = false; if (muted) zz('mute', { force: true });
}
function cycleVoice() {
  zVoiceMode = (zVoiceMode + 1) % 3; if ('speechSynthesis' in window) { speechSynthesis.cancel(); ZZ.speaking = false; } multiText(voiceLabel().split(' (')[0].split(' ·')[0]);
  if (state === 'play' && zVoiceMode < 2) { ZZ.cool = 0; zShow(zVoiceMode === 0 ? 'Now I speak like myself. More or less. *sniff*' : 'Now I speak like a BBC newsreader. This is how ideology sounds: neutral.', { cool: 3 }); }
}
function pauseGame() { if (state !== 'play') return; state = 'paused'; mouseDown = false; for (const k in keys) keys[k] = false; stickV.x = stickV.y = 0; showScreen('pause'); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (replayPlayback) holdReplay(true); else pauseGame(); } });

// ----- touch: floating stick on the left, drag to look on the right, buttons for the rest
const stickV = { x: 0, y: 0 };
if (TOUCH) {
  const ui = $('touchui'), st = $('stick'), knob = st.firstElementChild;
  let stickId = null, sx0 = 0, sy0 = 0; const looks = new Map();
  clearTouchControls = () => { stickId = null; looks.clear(); st.hidden = true; knob.style.transform = ''; stickV.x = stickV.y = 0; ui.querySelectorAll('.on').forEach(b => b.classList.remove('on')); };
  const TS = 0.0058;
  ui.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state !== 'play') return;
    if (e.target.closest('.tb')) return;
    const portrait = innerHeight > innerWidth;
    if (e.clientX < innerWidth * (portrait ? 0.5 : 0.42) && (!portrait || e.clientY > innerHeight * 0.45) && stickId === null) { stickId = e.pointerId; sx0 = e.clientX; sy0 = e.clientY; st.style.left = sx0 + 'px'; st.style.top = sy0 + 'px'; st.hidden = false; knob.style.transform = ''; }
    else looks.set(e.pointerId, [e.clientX, e.clientY]);
  });
  addEventListener('pointermove', e => {
    if (state !== 'play') return;
    if (e.pointerId === stickId) {
      let dx = e.clientX - sx0, dy = e.clientY - sy0; const d = Math.hypot(dx, dy), R = 60; if (d > R) { dx *= R / d; dy *= R / d; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`; stickV.x = dx / R; stickV.y = -dy / R;
    } else if (looks.has(e.pointerId) && state === 'play') {
      const l = looks.get(e.pointerId); P.yaw -= (e.clientX - l[0]) * TS; P.pitch = clamp(P.pitch - (e.clientY - l[1]) * TS, -1.5, 1.5); l[0] = e.clientX; l[1] = e.clientY;
    }
  }, { passive: true });
  const end = e => {
    if (e.pointerId === stickId) { stickId = null; st.hidden = true; stickV.x = stickV.y = 0; }
    looks.delete(e.pointerId);
  };
  addEventListener('pointerup', end); addEventListener('pointercancel', end);
  const hold = (id, on, off) => {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (state !== 'play') return; b.classList.add('on'); on(e); });
    const up = e => { b.classList.remove('on'); if (off) off(e); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  };
  // the fire button also steers: drag from it to aim while shooting
  hold('tbFire', e => { mouseDown = true; looks.set(e.pointerId, [e.clientX, e.clientY]); }, () => { mouseDown = false; });
  hold('tbJump', () => { keys.Space = true; }, () => { keys.Space = false; });
  hold('tbDash', () => { keys.ShiftLeft = true; }, () => { keys.ShiftLeft = false; });
  hold('tbPud', () => { keys.KeyC = true; }, () => { keys.KeyC = false; });
  hold('tbSurr', () => { keys.KeyE = true; }, () => { keys.KeyE = false; });
  hold('tbSwap', () => { let i = P.wNext; for (let k = 0; k < 4; k++) { i = (i + 1) % 4; if (i === 0 || P.ammo[i] > 0) break; } selectWeapon(i); });
  hold('tbInspect', () => inspectCurio());
  hold('tbPause', () => pauseGame());
  document.addEventListener('gesturestart', e => e.preventDefault());
}
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseDown = false; });

// =====================================================================  loop
let last = performance.now(), ftAvg = 16, scaleCool = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000;
  const dt = Math.min(0.05, raw); last = now;
  ftAvg = lerp(ftAvg, raw * 1000, 0.05); scaleCool -= dt;
  if (!qScale && scaleCool <= 0 && !document.hidden && raw < 0.5) {
    if (ftAvg > 24 && rScale > 0.5) { rScale = Math.max(0.5, rScale - 0.1); resize(); scaleCool = 1.5; }
    else if (ftAvg < 13 && rScale < 1) { rScale = Math.min(1, rScale + 0.1); resize(); scaleCool = 3; }
  }
  tick(dt); render(); hud(dt); zUpdate(dt);
}
// one step of game time (everything but drawing); the frame loop calls it once per frame
function tick(dt) {
  if (replayPlayback) { updateReplay(dt); return; }
  if(state==='paused'||screenKind==='curio'||screenKind==='journal')return;
  T += dt;
  if (state === 'play') {
    jokeUpdate(dt);
    const sdt = (jokeT > 0 ? dt * 0.05 : hitstop > 0 ? dt * 0.12 : dt) * (MOD === 'caffeine' ? 1.3 : 1); hitstop -= dt; update(sdt);
    if (jokeAt && T > jokeAt && state === 'play') { jokeAt = 0; if (jokeKind === 'sponge') { jokeKind = null; spongeConfessed = true; jokeMoment(pick(SPONGE_OPEN), ZL.selfSponge, ["CECI N'EST PAS UNE ÉPONGE", 'OR IS IT']); } else jokeMoment(); }
    if (state === 'play') recordReplay(dt);
  }
  else if (state === 'absorbing' || state === 'absorbed') {
    P.endT += dt; P.absorbT = 1; updateParticles(dt);
    const e = P.endE; if (e) { e.sq = 1 + Math.sin(T * 9) * 0.12; e.chomp = 1; e.wet = 1; if (Math.random() < dt * 5) bubbles(e.x, e.y + e.h, e.z, 2, e.r); }
    if (state === 'absorbing' && Math.random() < dt * 4) sfx('slurp');
    if (state === 'absorbing' && P.endT > 3.4) {
      state = 'absorbed'; recordEnding('absorbed'); zHide();
      if (score > hiScore) { hiScore = score; try { localStorage.setItem('absorbthis.hi', String(hiScore)); } catch (e) { } }
      document.exitPointerLock && document.exitPointerLock(); showScreen('absorbed');
    }
  }
  else if (state === 'dead') { P.deadT += dt; update(dt * 0.35); P.vy -= GRAV * dt * 0.35; P.y = Math.max(groundAt(P.x, P.z, P.y) , P.y + P.vy * dt * 0.35); }
  else if (state === 'won') { updateParticles(dt); }
  else if (state === 'title') { if (Math.random() < dt * 2) bubbles(HIVE.x + rand(-7, 7), HIVE.top, HIVE.z + rand(-4, 4), 2, 0.3); updateParticles(dt); }
  greyV = lerp(greyV, jokeT > 0 ? 1 : 0, Math.min(1, dt * 8));
}
showScreen('title');
requestAnimationFrame(frame);
})();
