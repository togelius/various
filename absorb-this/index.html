<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Absorb This</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
  :root { --cream:#fff4e0; --ink:#1d130c; --sauce:#d8301a; --foam:#ffb52e; --scour:#1f9a5f; --water:#7cc8ff; color-scheme: dark; }
  html, body { margin:0; height:100%; background:#2a1c12; overflow:hidden; color:var(--cream);
    font-family: Nunito, "Trebuchet MS", sans-serif; -webkit-user-select:none; user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .big { font-family: Bangers, Impact, "Arial Black", sans-serif; letter-spacing:.04em; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #hud.off { display:none; }
  #xh { position:absolute; left:50%; top:50%; width:0; height:0; }
  #xh i { position:absolute; background:#fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.55); border-radius:2px; }
  #xh i:nth-child(1){ left:-1.5px; top:-17px; width:3px; height:9px; }
  #xh i:nth-child(2){ left:-1.5px; top:8px;  width:3px; height:9px; }
  #xh i:nth-child(3){ top:-1.5px; left:-17px; height:3px; width:9px; }
  #xh i:nth-child(4){ top:-1.5px; left:8px;  height:3px; width:9px; }
  #xh b { position:absolute; left:-3px; top:-3px; width:6px; height:6px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--water); box-shadow:0 0 0 1.5px rgba(0,0,0,.6); }
  #hit { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg); opacity:0; }
  #hit::before, #hit::after { content:""; position:absolute; background:#fff; left:-14px; top:-1.5px; width:28px; height:3px;
    box-shadow:0 0 0 1px rgba(0,0,0,.6); }
  #hit::after { transform:rotate(90deg); }
  #hit.kill::before, #hit.kill::after { background:#ff3b1f; width:40px; left:-20px; }
  #tl { position:absolute; left:22px; top:16px; text-shadow:3px 3px 0 var(--ink); }
  #score { font-size:46px; line-height:1; }
  #combo { font-size:26px; color:var(--foam); min-height:30px; }
  #hi { font-size:15px; opacity:.8; font-weight:900; letter-spacing:.1em; }
  #wave { position:absolute; right:22px; top:16px; text-align:right; font-size:28px; text-shadow:3px 3px 0 var(--ink); }
  #wave small { display:block; font-family:Nunito,sans-serif; font-weight:900; font-size:13px; letter-spacing:.12em; opacity:.85; }
  #ann { position:absolute; left:0; right:0; top:22%; text-align:center; font-size:84px; color:#fff;
    text-shadow:5px 5px 0 var(--sauce), 9px 9px 0 var(--ink); opacity:0; }
  #ann small { display:block; font-size:34px; color:var(--foam); text-shadow:3px 3px 0 var(--ink); }
  #ann.go { animation: ann 2.2s ease-out forwards; }
  @keyframes ann { 0%{opacity:0; transform:scale(2.4) rotate(-6deg);} 8%{opacity:1; transform:scale(.92) rotate(2deg);}
    14%{transform:scale(1.05) rotate(-1deg);} 20%{transform:scale(1);} 80%{opacity:1;} 100%{opacity:0; transform:scale(1.1) translateY(-30px);} }
  #mk { position:absolute; left:0; right:0; top:36%; text-align:center; font-size:58px; color:var(--foam);
    text-shadow:4px 4px 0 var(--ink); opacity:0; }
  #mk.go { animation: mk 1.1s ease-out forwards; }
  @keyframes mk { 0%{opacity:1; transform:scale(1.8) rotate(4deg);} 15%{transform:scale(1) rotate(-3deg);} 70%{opacity:1;} 100%{opacity:0; transform:translateY(-40px);} }
  #feed { position:absolute; right:22px; top:92px; text-align:right; font-weight:900; font-size:15px; }
  #feed div { background:rgba(29,19,12,.72); padding:4px 10px; margin-bottom:4px; border-radius:4px; display:inline-block; clear:both; float:right;
    animation: feed 3.2s forwards; }
  #feed em { font-style:normal; color:var(--foam); }
  @keyframes feed { 0%{transform:translateX(40px); opacity:0;} 6%{transform:none; opacity:1;} 85%{opacity:1;} 100%{opacity:0;} }
  #bl { position:absolute; left:22px; bottom:44px; width:300px; text-shadow:2px 2px 0 var(--ink); }
  #bl .lbl { font-weight:900; font-size:14px; letter-spacing:.18em; }
  #hpbar { height:22px; background:rgba(29,19,12,.75); border:3px solid var(--ink); border-radius:12px; overflow:hidden; margin-top:4px; }
  #hpfill { height:100%; width:100%; background:linear-gradient(180deg,#bfe6ff,#3fa2ee); border-radius:8px; transition:width .12s; }
  #hpfill.low { background:linear-gradient(180deg,#ffd0a0,#e0501a); animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { filter:brightness(1.5);} }
  #hpnum { font-size:34px; margin-top:2px; white-space:nowrap; }
  #br { position:absolute; right:22px; bottom:44px; text-align:right; text-shadow:3px 3px 0 var(--ink); }
  #wname { font-size:34px; }
  #wsub { font-weight:900; font-size:13px; letter-spacing:.14em; opacity:.85; }
  #ammo { font-size:54px; line-height:1; }
  #wlist { font-weight:900; font-size:13px; letter-spacing:.08em; margin-top:4px; }
  #wlist span { display:inline-block; padding:2px 7px; margin-left:4px; border-radius:4px; background:rgba(29,19,12,.6); opacity:.55; }
  #wlist span.on { opacity:1; background:var(--sauce); }
  #pops { position:absolute; inset:0; }
  .pop { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-size:32px; color:#fff;
    text-shadow:3px 3px 0 var(--ink); animation: pop 1s ease-out forwards; }
  .pop.s { font-size:22px; color:var(--foam); }
  @keyframes pop { 0%{scale:1.8; opacity:1;} 18%{scale:1;} 75%{opacity:1;} 100%{opacity:0; margin-top:-40px;} }
  #scr { position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:center; text-align:center; overflow-y:auto;
    background:radial-gradient(ellipse at center, rgba(40,22,10,.55), rgba(20,10,4,.88)); cursor:pointer; }
  #scr.off { display:none; }
  #scr .box { max-width:760px; padding:24px; margin:auto; }
  #scr h1 { font-family:Bangers, Impact, sans-serif; font-weight:400; font-size:clamp(64px,13vw,150px); margin:0; line-height:.9; color:#fff;
    text-shadow:6px 6px 0 var(--scour), 12px 12px 0 var(--foam), 18px 18px 0 var(--ink); transform:rotate(-3deg); letter-spacing:.03em; }
  #scr h2 { font-family:Bangers, Impact, sans-serif; font-weight:400; font-size:clamp(26px,4vw,40px); margin:18px 0 6px; color:var(--foam);
    text-shadow:3px 3px 0 var(--ink); letter-spacing:.06em; }
  #scr p { font-size:17px; line-height:1.45; margin:10px auto; max-width:620px; }
  #scr .keys { display:grid; grid-template-columns:auto auto; gap:4px 18px; justify-content:center; text-align:left; font-size:15px; margin:18px auto; }
  #scr .keys b { color:var(--foam); font-weight:900; text-align:right; }
  #scr .cta { font-family:Bangers, Impact, sans-serif; font-size:40px; margin-top:18px; color:#fff; text-shadow:3px 3px 0 var(--sauce);
    animation: pulse .6s infinite alternate; }
  #scr .quip { font-size:22px; font-weight:900; color:#fff; }
  #scr .stat { font-family:Bangers, Impact, sans-serif; font-size:30px; color:var(--water); text-shadow:2px 2px 0 var(--ink); }
  #zz { position:absolute; left:22px; bottom:150px; display:flex; align-items:flex-end; gap:12px; opacity:0;
    transform:translateX(-130%) rotate(-4deg); transition:transform .35s cubic-bezier(.2,1.5,.4,1), opacity .2s; }
  #zz.on { opacity:1; transform:none; }
  #zz .face { width:150px; height:150px; flex:none; border-radius:50%; overflow:hidden; border:4px solid var(--ink); box-shadow:5px 5px 0 var(--ink); background:#f3d9a8; }
  #zz .face canvas { width:100%; height:100%; display:block; }
  #zz .bub { max-width:400px; background:#fff8ea; color:var(--ink); font-weight:900; font-size:17px; line-height:1.3; padding:10px 16px 12px;
    border:3px solid var(--ink); border-radius:18px 18px 18px 4px; box-shadow:4px 4px 0 var(--ink); margin-bottom:70px; min-height:1.3em; }
  #zz .who { display:block; font-family:Bangers, Impact, sans-serif; font-weight:400; font-size:15px; letter-spacing:.08em; color:var(--sauce); }
  #zz.big { left:50%; bottom:auto; top:48%; opacity:1; transform:translate(-50%,-50%); flex-direction:column; align-items:center; }
  #zz.big .face { width:250px; height:250px; }
  #zz.big .bub { margin:0; font-size:30px; max-width:640px; text-align:center; border-radius:18px; }
  #tick { position:absolute; left:0; right:0; bottom:0; height:28px; background:var(--sauce); color:#fff; overflow:hidden; border-top:3px solid var(--ink);
    font-weight:900; font-size:14px; line-height:26px; letter-spacing:.06em; white-space:nowrap; }
  #tick .lab { position:absolute; left:0; top:0; bottom:0; z-index:2; background:var(--ink); color:var(--foam); padding:0 12px;
    font-family:Bangers, Impact, sans-serif; font-weight:400; font-size:18px; letter-spacing:.08em; }
  #tickrun { position:absolute; left:0; top:0; will-change:transform; }
  #rank { font-size:22px; color:#fff; min-height:26px; }
  #rank b { font-size:44px; color:var(--water); -webkit-text-stroke:1px var(--ink); margin-right:6px; }
  #prompt { position:absolute; left:50%; top:62%; transform:translateX(-50%); text-align:center; font-size:30px; color:#fff;
    text-shadow:3px 3px 0 var(--ink); animation: pulse .4s infinite alternate; }
  #prompt .bar { width:320px; height:12px; margin:6px auto 0; border:3px solid var(--ink); border-radius:8px; background:rgba(29,19,12,.7); overflow:hidden; }
  #surr { height:100%; width:0; background:var(--foam); }
  #scr .zq { display:flex; gap:16px; align-items:center; justify-content:center; margin:16px auto; max-width:620px; text-align:left; }
  #scr .zq img { width:110px; height:110px; border-radius:50%; border:4px solid var(--ink); box-shadow:4px 4px 0 var(--ink); flex:none; }
  #scr .zq p { font-weight:900; font-style:italic; margin:0; }
  #scr .zq small { display:block; font-style:normal; color:var(--foam); font-family:Bangers, Impact, sans-serif; font-weight:400; letter-spacing:.08em; font-size:16px; }
  #scr .fine { font-size:13px; opacity:.75; }
  #scr .endings { font-weight:900; letter-spacing:.1em; font-size:14px; color:var(--foam); }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-size:20px; padding:30px; text-align:center; }
</style>
</head>
<body>
<canvas id="c" aria-label="Absorb This: a first-person shooter on a kitchen counter"></canvas>
<div id="hud" class="off">
  <div id="xh"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hit"></div>
  <div id="tl" class="big"><div id="score">0</div><div id="combo"></div><div id="rank"></div><div id="hi"></div></div>
  <div id="wave" class="big"></div>
  <div id="ann" class="big"></div>
  <div id="mk" class="big"></div>
  <div id="feed"></div>
  <div id="bl"><div class="lbl" id="lbl">DAMPNESS</div><div id="hpbar"><div id="hpfill"></div></div><div id="hpnum" class="big">100%</div></div>
  <div id="br"><div id="wname" class="big"></div><div id="wsub"></div><div id="ammo" class="big"></div><div id="wlist"></div></div>
  <div id="pops" class="big"></div>
  <div id="prompt" class="big" hidden>HOLD E TO SURRENDER TO THE SPONGE<div class="bar"><div id="surr"></div></div></div>
  <div id="zz"><div class="face" id="zzface"></div><div class="bub"><span class="who">SLAVOJ ŽIŽEK (PARODY)</span><span id="zztext"></span></div></div>
  <div id="tick"><span class="lab">COUNTER NEWS NETWORK</span><span id="tickrun"></span></div>
</div>
<div id="scr"></div>
<div id="err">This game needs WebGL2. Your browser said no. Try a recent Chrome, Firefox or Safari.</div>
<script>
(() => {
'use strict';

// =====================================================================  setup
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('err').style.display = 'flex'; return; }

const $ = id => document.getElementById(id);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const lerp = (a, b, t) => a + (b - a) * t;
function angLerp(a, b, t) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; }

// =====================================================================  matrices (column-major, post-multiply)
function ident(m) { m.fill(0); m[0] = m[5] = m[10] = m[15] = 1; return m; }
function tr(m, x, y, z) { for (let i = 0; i < 4; i++) m[12 + i] += m[i] * x + m[4 + i] * y + m[8 + i] * z; }
function sc(m, x, y, z) { for (let i = 0; i < 4; i++) { m[i] *= x; m[4 + i] *= y; m[8 + i] *= z; } }
function ry(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a0 = m[i], a2 = m[8 + i]; m[i] = a0 * c - a2 * s; m[8 + i] = a0 * s + a2 * c; } }
function rx(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a1 = m[4 + i], a2 = m[8 + i]; m[4 + i] = a1 * c + a2 * s; m[8 + i] = -a1 * s + a2 * c; } }
function rz(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a0 = m[i], a1 = m[4 + i]; m[i] = a0 * c + a1 * s; m[4 + i] = -a0 * s + a1 * c; } }
function mul(o, a, b) {
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
}
function persp(o, fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2); o.fill(0); o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); }

// =====================================================================  shaders
const NOISE = `
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float h31(vec3 p){ p=fract(p*0.3183099+vec3(.1,.2,.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
float vn3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x), mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x), f.y);
  float b=mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x), mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x), f.y);
  return mix(a,b,f.z); }
`;

const VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNor;
#ifdef INST
layout(location=2) in vec4 iPS;
layout(location=3) in vec4 iCol;
layout(location=4) in vec4 iRot;
#else
uniform mat4 uModel; uniform vec3 uScale; uniform vec3 uColor; uniform float uMat;
#endif
uniform mat4 uVP;
out vec3 vW; out vec3 vN; out vec3 vL; out vec3 vU; out vec3 vC; flat out float vMat;
vec3 rotA(vec3 v, vec3 k, float a){ float c=cos(a), s=sin(a); return v*c + cross(k,v)*s + k*dot(k,v)*(1.-c); }
void main(){
#ifdef INST
  vec3 s = iRot.yzw * iPS.w;
  vec3 k = normalize(vec3(0.6,1.0,0.35));
  vec3 p = rotA(aPos*s, k, iRot.x) + iPS.xyz;
  vN = rotA(aNor/s, k, iRot.x);
  vL = aPos*s; vU = aPos; vC = iCol.rgb; vMat = iCol.a; vW = p;
  gl_Position = uVP*vec4(p,1.);
#else
  vec4 w = uModel*vec4(aPos,1.);
  vW = w.xyz; vN = mat3(uModel)*(aNor/(uScale*uScale));
  vL = aPos*uScale; vU = aPos; vC = uColor; vMat = uMat;
  gl_Position = uVP*w;
#endif
}`;

const FS = `#version 300 es
precision highp float;
in vec3 vW; in vec3 vN; in vec3 vL; in vec3 vU; in vec3 vC; flat in float vMat;
uniform vec3 uEye; uniform float uFlash; uniform vec4 uSh[40]; uniform int uShN; uniform float uTime;
out vec4 o;
${NOISE}
const vec3 SUN = vec3(-0.34,0.88,0.33);
const vec3 SUNC = vec3(1.0,0.9,0.76);
const vec3 FOG = vec3(0.97,0.88,0.74);
vec3 envc(vec3 r){ return mix(vec3(0.32,0.22,0.15), vec3(1.05,0.97,0.86), smoothstep(-0.35,0.45,r.y)); }

vec3 wood(vec3 w, vec3 tint){
  float px = w.x/2.3; float id = floor(px); float fx = fract(px);
  float n = vn2(vec2(w.x*2.5, w.z*0.12 + id*13.1));
  float grain = sin(w.x*21. + n*7. + sin(w.z*0.21+id*3.)*2.5)*.5+.5;
  float fine = vn2(vec2(w.x*55., w.z*1.2+id*7.));
  vec3 base = mix(vec3(0.30,0.22,0.16), vec3(0.50,0.41,0.33), h21(vec2(id,3.)));
  vec3 c = base * (0.62+0.45*grain) * (0.82+0.3*fine);
  c *= mix(0.3,1., smoothstep(0.0,0.025,fx)*smoothstep(1.0,0.975,fx));
  float knot = smoothstep(0.35,0.,length(vec2(fract(w.x*0.23+id*.37)-.5, (fract(w.z*0.07+id*.61)-.5)*0.5)));
  c *= 1.-knot*0.35;
  c = mix(c, vec3(dot(c,vec3(.33))), 0.28);
  return c*tint;
}
vec3 spongeC(vec3 l, vec3 u, vec3 tint, inout float spec){
  float tri = abs(fract(l.x*2.1 + l.z*2.1)-.5);
  float edge = 0.12 + tri*0.16;
  if(u.y > edge){
    float fib = vn3(l*vec3(18.,26.,18.))*.6 + vn3(l*52.)*.4;
    spec = 0.04;
    return mix(vec3(0.02,0.26,0.15), vec3(0.10,0.58,0.37), fib)*tint;
  }
  float pores = vn3(l*6.)*.55 + vn3(l*15.)*.45;
  vec3 y = vec3(0.98,0.60,0.16)*(0.82 + 0.3*pores);
  y *= mix(0.5,1., smoothstep(0.26,0.44,pores));
  spec = 0.03;
  return y*tint;
}
vec3 bottleC(vec3 u, int m, vec3 tint, inout float spec, inout float refl){
  vec3 c = vec3(0.30,0.12,0.05)*tint*(0.75+0.45*u.y);
  spec = 1.0; refl = 0.38;
  if(m==3 && u.y>0.30 && u.y<0.62){
    c = vec3(0.95,0.76,0.83); spec=.12; refl=0.;
    float ang = atan(u.z,u.x);
    float rowi = floor(u.y*46.);
    float row = step(0.45, fract(u.y*46.)) * step(0.35, h21(vec2(floor(ang*18.), rowi)));
    if(u.y>0.36 && u.y<0.56 && abs(ang-1.4)<0.9) c = mix(c, vec3(0.32,0.16,0.22), row*0.7);
    if(u.y>0.58) c = mix(c, vec3(0.2,0.55,0.3), 0.8);
  }
  if(m==4){
    float ang = atan(u.z,u.x);
    float s1 = sin(ang*7. + u.y*19. + sin(u.y*31.+ang*3.)*1.6);
    float s2 = sin(ang*11. - u.y*27. + cos(ang*5.)*2.);
    float line = max(smoothstep(0.95,0.995,s1), smoothstep(0.965,0.998,s2)*step(0.25,u.y));
    float txt = step(0.5, h21(floor(vec2(ang*30., u.y*60.)))) * step(0.44,u.y)*step(u.y,0.52)*step(abs(ang-1.2),0.35);
    c = mix(c, vec3(0.93,0.9,0.86), max(line,txt)*0.92);
  }
  return c;
}
void main(){
  vec3 n = normalize(vN);
  vec3 V = normalize(uEye - vW);
  int m = int(vMat+0.5);
  vec3 alb = vC; float spec = 0.12, shin = 18., refl = 0.;
  float dist = length(uEye - vW);
  if(m==7){ vec3 c = alb; c = mix(c, FOG, (1.-exp(-dist*0.004))*0.5); o = vec4(c,1.); return; }
  if(m==16){ float fr = pow(1.-max(dot(n,V),0.),2.);
    vec3 ir = 0.5+0.5*cos(6.2832*(fr*1.4 + uTime*0.1 + vec3(0.,0.33,0.67)));

    ident(cur); tr(cur, k.x, k.y + Math.sin(k.t * 3) * 0.15, k.z); ry(cur, k.t * 2);
    if (k.type === 'ice') { part(CUBE, 0, 0, 0, 0.7, 0.7, 0.7, [0.75, 0.9, 1.05], 12, 0, 0.3); part(SPH, 0, 0, 0, 0.18, 0.18, 0.18, [0.6, 0.85, 1.3], 7); }
    else if (k.type === 'shells') { for (let i = 0; i < 3; i++) part(CUBE, Math.cos(i * 2.1) * 0.3, i * 0.12, Math.sin(i * 2.1) * 0.3, 0.35, 0.35, 0.35, [0.65, 0.85, 1.0], 12, i); }
    else { part(CYL, 0, -0.4, 0, 0.3, 0.8, 0.3, [0.85, 0.87, 0.9], 5); part(CYL, 0, -0.25, 0, 0.305, 0.45, 0.305, [0.45, 0.8, 0.25], 11); }
  }

  gl.useProgram(PR_INST.p);
  const cubes = [], sphs = [];
  for (const p of parts) (p.sph ? sphs : cubes).push(p);
  for (const s of stains) sphs.push({ x: s.x, y: s.y, z: s.z, size: 1, life: 1, max: 1, shrink: false, col: s.col, mat: s.water ? 12 : 11, ang: 0, sx: s.sx, sy: 0.012, sz: s.sz });
  let n = fillInst(cubes, instData.cube);
  if (n) { gl.bindBuffer(gl.ARRAY_BUFFER, instBuf.cube); gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData.cube, 0, n * 12); gl.bindVertexArray(ICUBE.vao); gl.drawElementsInstanced(gl.TRIANGLES, ICUBE.n, gl.UNSIGNED_SHORT, 0, n); }
  n = fillInst(sphs, instData.sph);
  if (n) { gl.bindBuffer(gl.ARRAY_BUFFER, instBuf.sph); gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData.sph, 0, n * 12); gl.bindVertexArray(ISPH.vao); gl.drawElementsInstanced(gl.TRIANGLES, ISPH.n, gl.UNSIGNED_SHORT, 0, n); }
  // viewmodel
  if (state !== 'title') {
    gl.clear(gl.DEPTH_BUFFER_BIT); gl.useProgram(PR_MAIN.p);
    persp(PROJ, 70 * Math.PI / 180, aspect, 0.02, 10); mul(VP, PROJ, VIEW); gl.uniformMatrix4fv(PR_MAIN.u.uVP, false, VP);
    drawViewmodel(eye);
    persp(PROJ, fov, aspect, 0.05, 500); mul(VP, PROJ, VIEW);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.disable(gl.DEPTH_TEST);

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex); gl.uniform1i(u.uT, 0);
  gl.uniform2f(u.uR, W, H); gl.uniform1f(u.uTime, T); gl.uniform1f(u.uGlass, state === 'title' ? 1.3 : glassLevel);
  gl.uniform1f(u.uHurt, state === 'title' ? 0 : P.hurtT); gl.uniform1f(u.uAbs, state === 'title' ? 0 : P.absorbT);
  gl.uniform1f(u.uDead, state === 'dead' ? Math.min(1, P.deadT) : 0); gl.uniform1f(u.uLow, state === 'play' && P.hp < 30 ? 1 : 0);
  gl.uniform1f(u.uGrey, greyV); gl.uniform1f(u.uPud, state === 'title' ? 0 : P.pudT);
  gl.uniform1f(u.uFill, state === 'absorbing' || state === 'absorbed' ? Math.min(1, P.endT / 2.8) : 0);
  const sp = new Float32Array(32); splats.forEach((s, i) => sp.set([s.x * aspect * 0.8, s.y, s.s, s.life], i * 4)); gl.uniform4fv(u.uSp, sp);
  gl.bindVertexArray(QUAD); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindVertexArray(null);
  // popups
  for (const p of pops) {
    const x = p.x, y = p.y, z = p.z;
    const cx = VP[0] * x + VP[4] * y + VP[8] * z + VP[12], cy = VP[1] * x + VP[5] * y + VP[9] * z + VP[13], cw = VP[3] * x + VP[7] * y + VP[11] * z + VP[15];
    if (cw <= 0.1) { p.el.style.display = 'none'; continue; }
    p.el.style.display = ''; p.el.style.left = ((cx / cw * 0.5 + 0.5) * innerWidth) + 'px'; p.el.style.top = ((0.5 - cy / cw * 0.5) * innerHeight) + 'px';
  }
}

// =====================================================================  HUD
let lastHud = '';
function hud(dt) {
  for (const p of pops) { p.t -= dt; if (p.t <= 0) p.el.remove(); }
  pops = pops.filter(p => p.t > 0);
  hitT -= dt; const h = $('hit'); h.style.opacity = hitT > 0 ? 1 : 0; h.className = hitKill ? 'kill' : '';
  if (state === 'title') return;
  // news ticker
  const run = $('tickrun'); tickX -= dt * 120;
  if (tickX < -tickW || !tickW) { run.textContent = headlines(); tickW = run.offsetWidth; tickX = innerWidth; }
  run.style.transform = `translateX(${tickX}px)`;
  // style rank
  let ri = 0; for (let i = 0; i < RANKS.length; i++) if (combo >= RANKS[i][0]) ri = i;
  if (ri !== lastRank) {
    if (ri > lastRank && ri > 0) { multiText(RANKS[ri][1] + ' · ' + RANKS[ri][2] + '!'); say(RANKS[ri][2].toLowerCase()); if (ri >= 6) zz('rank', { once: true, force: true }); }
    lastRank = ri; $('rank').innerHTML = ri ? `<b>${RANKS[ri][1]}</b>${RANKS[ri][2]}` : '';
  }
  const showP = state === 'play' && P.latchT > 0; $('prompt').hidden = !showP; if (showP) $('surr').style.width = (P.surr / 1.6 * 100) + '%';
  $('lbl').textContent = P.pud ? 'DAMPNESS · PUDDLE FORM' : 'DAMPNESS';
  const hp = Math.max(0, Math.ceil(P.hp));
  const mult = Math.min(10, 1 + Math.floor(combo / 4));
  const w = WEAPONS[P.w];
  const key = [score, hp, combo, P.w, P.ammo.join(), wave, enemies.length + spawnQ.length, P.wNext].join('|');
  if (key === lastHud) return; lastHud = key;
  $('score').textContent = score.toLocaleString();
  $('combo').textContent = combo >= 2 ? `${combo} COMBO · x${mult}` : '';
  $('hi').textContent = 'BEST ' + Math.max(hiScore, score).toLocaleString();
  $('hpfill').style.width = hp + '%'; $('hpfill').className = hp < 30 ? 'low' : '';
  $('hpnum').textContent = hp <= 0 ? 'BONE DRY' : hp < 30 ? `${hp}% · PARCHED!` : hp + '%';
  $('wname').textContent = w.name; $('wsub').textContent = w.sub;
  $('ammo').textContent = w.max === Infinity ? '∞' : P.ammo[P.w];
  $('wlist').innerHTML = ['1 SQUIRT', '2 ICE ' + P.ammo[1], '3 FIZZ ' + P.ammo[2]].map((t, i) => `<span class="${i === P.wNext ? 'on' : ''}">${t}</span>`).join('');
  $('wave').innerHTML = wave ? `WAVE ${wave}<small>${waveActive ? (enemies.length + spawnQ.length) + ' KITCHENWARE REMAIN' : 'CATCH YOUR BREATH'}</small>` : '';
}

// =====================================================================  screens & input
const CONTROLS = `<div class="keys">
  <b>MOUSE</b><span>look · click to shoot</span>
  <b>WASD</b><span>scurry</span>
  <b>SPACE</b><span>jump (land on sponges to boing)</span>
  <b>SHIFT</b><span>splash dash (you can't be hit mid-splash)</span>
  <b>RIGHT MOUSE / C</b><span>hold to become a puddle: flat, slippery, fast</span>
  <b>E</b><span>when a sponge has you, hold to surrender</span>
  <b>1 2 3 / WHEEL</b><span>squirter · ice shotgun · seltzer launcher</span>
  <b>G</b><span>glass: murky / clean / none</span>
  <b>M · V</b><span>mute everything · mute Žižek's voice</span>
  <b>ESC</b><span>pause</span></div>`;
function showScreen(kind) {
  const s = $('scr'); s.classList.remove('off');
  if (kind === 'title') {
    s.innerHTML = `<div class="box"><h1>ABSORB THIS</h1><h2>A COUNTER-TERRORISM SHOOTER</h2>
      <p>You are <b>DRIP</b>, the last drop of water in a glass on a kitchen counter. The sponges want to drink you. The hot sauce wants you diluted. The spoons just want to stir.</p>
      <p>Stay damp. Your squirter is made of you, so soak your spilled water back up. Knock things off the counter. Hit them in the googly eyes.</p>${CONTROLS}
      <div class="cta">CLICK TO GET WET</div>
      <p class="fine">Featuring a cartoon parody of the philosopher Slavoj Žižek. He never said any of this. Every line is made up.</p></div>`;
  } else if (kind === 'pause') {
    s.innerHTML = `<div class="box"><h1 style="font-size:90px">PAUSED</h1><h2>THE SPONGES ARE WAITING. PATIENTLY. MOISTLY.</h2>${zQuote(ZL.pause)}${CONTROLS}<div class="cta">CLICK TO RESUME</div></div>`;
  } else if (kind === 'dead') {
    const best = score >= hiScore && score > 0;
    s.innerHTML = `<div class="box"><h1 style="font-size:110px">EVAPORATED</h1>
      <p class="quip">${pick(DEATH[deathCause] || DEATH.sponge)}</p>
      <p class="stat">SCORE ${score.toLocaleString()} · WAVE ${wave} · ${killCount} KITCHENWARE DESTROYED</p>
      <p class="stat" style="color:var(--foam)">${best ? 'NEW BEST! THE FRIDGE IS PROUD OF YOU.' : 'BEST ' + hiScore.toLocaleString()}</p>
      ${zQuote(deathCause === 'fall' ? ZL.fallDeath : ZL.death)}
      <p class="endings">${endingsLine()}</p>${endings().absorbed ? '' : '<p class="fine">HINT: WHEN A SPONGE HAS YOU, HOLD E.</p>'}
      <div class="cta">CLICK TO RE-CONDENSE</div></div>`;
  } else if (kind === 'absorbed') {
    s.innerHTML = `<div class="box"><h1 style="font-size:110px">ABSORBED</h1><h2>THE SURRENDER ENDING</h2>
      <p class="quip">You stopped fighting. The sponge took you in. It is warm in here, and a little yellow. You are no longer the last drop. You are one of many.</p>
      ${zQuote(ZL.end)}
      <p class="stat">SCORE ${score.toLocaleString()} · WAVE ${wave} · SURRENDER BONUS: PRICELESS</p>
      <p class="endings">${endingsLine()}</p>
      <div class="cta">CLICK TO SQUEEZE YOURSELF OUT</div></div>`;
  }
}
function zQuote(bank) { return `<div class="zq"><img alt="" src="${zFace()}"><p><small>SLAVOJ ŽIŽEK (PARODY)</small>"${pick(bank)}"</p></div>`; }
function hideScreen() { $('scr').classList.add('off'); }
function start() {
  initAudio();
  if (state === 'title' || state === 'dead' || state === 'absorbed') { reset(); state = 'play'; $('hud').classList.remove('off'); lastHud = ''; tickW = 0; say('get wet', true); setTimeout(() => zz('start', { force: true }), 1400); }
  else if (state === 'paused') state = 'play';
  hideScreen();
  try { const r = cv.requestPointerLock({ unadjustedMovement: true }); if (r && r.catch) r.catch(() => cv.requestPointerLock()); } catch (e) { cv.requestPointerLock(); }
}
$('scr').addEventListener('click', () => { if (state === 'dead' && P.deadT < 1.2) return; start(); });
cv.addEventListener('mousedown', e => { if (state === 'play' && !locked) start(); if (e.button === 0) mouseDown = true; if (e.button === 2) keys.Mouse2 = true; });
addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; if (e.button === 2) keys.Mouse2 = false; });
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === cv; lockAt = performance.now();
  if (!locked && state === 'play') { state = 'paused'; mouseDown = false; showScreen('pause'); }
});
addEventListener('mousemove', e => {
  if (!locked || state !== 'play') return;
  // browsers sometimes report one huge jump right after the lock engages
  if (performance.now() - lockAt < 120 || Math.abs(e.movementX) > 400 || Math.abs(e.movementY) > 400) return;
  P.yaw -= e.movementX * sens; P.pitch = clamp(P.pitch - e.movementY * sens, -1.5, 1.5);
});
addEventListener('wheel', e => { if (state !== 'play') return; const d = e.deltaY > 0 ? 1 : -1; let i = P.wNext; for (let k = 0; k < 3; k++) { i = (i + d + 3) % 3; if (i === 0 || P.ammo[i] > 0) break; } selectWeapon(i); }, { passive: true });
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'Digit1') selectWeapon(0); if (e.code === 'Digit2') selectWeapon(1); if (e.code === 'Digit3') selectWeapon(2);
  if (e.code === 'KeyG') { glassLevel = glassLevel === 1 ? 0.45 : glassLevel === 0.45 ? 0 : 1; if (state === 'play') pop(P.x - Math.sin(P.yaw) * 4, P.y + 1.5, P.z - Math.cos(P.yaw) * 4, ['GLASS: NONE', 'GLASS: CLEAN', 'GLASS: MURKY'][glassLevel === 0 ? 0 : glassLevel < 1 ? 1 : 2], true); }
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); ZZ.speaking = false; if (muted) zz('mute', { force: true }); }
  if (e.code === 'KeyV') { zVoiceOn = !zVoiceOn; if (!zVoiceOn && 'speechSynthesis' in window) { speechSynthesis.cancel(); ZZ.speaking = false; } }
  if (e.code === 'KeyG') zz('glass', { force: true });
  if ((e.code === 'Enter' || e.code === 'KeyR') && state === 'dead' && P.deadT > 1.2) start();
  if (e.code === 'Enter' && state === 'title') start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseDown = false; });

// =====================================================================  loop
let last = performance.now(), ftAvg = 16, scaleCool = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000;
  const dt = Math.min(0.05, raw); last = now; T += dt;
  ftAvg = lerp(ftAvg, raw * 1000, 0.05); scaleCool -= dt;
  if (!qScale && scaleCool <= 0 && !document.hidden && raw < 0.5) {
    if (ftAvg > 24 && rScale > 0.5) { rScale = Math.max(0.5, rScale - 0.1); resize(); scaleCool = 1.5; }
    else if (ftAvg < 13 && rScale < 1) { rScale = Math.min(1, rScale + 0.1); resize(); scaleCool = 3; }
  }
  if (state === 'play') {
    jokeUpdate(dt);
    const sdt = jokeT > 0 ? dt * 0.05 : hitstop > 0 ? dt * 0.12 : dt; hitstop -= dt; update(sdt);
    if (jokeAt && T > jokeAt && state === 'play') { jokeAt = 0; jokeMoment(); }
  }
  else if (state === 'absorbing' || state === 'absorbed') {
    P.endT += dt; P.absorbT = 1; updateParticles(dt);
    const e = P.endE; if (e) { e.sq = 1 + Math.sin(T * 9) * 0.12; e.chomp = 1; e.wet = 1; if (Math.random() < dt * 5) bubbles(e.x, e.y + e.h, e.z, 2, e.r); }

    if (state === 'absorbing' && P.endT > 3.4) {

      if (score > hiScore) { hiScore = score; try { localStorage.setItem('absorbthis.hi', String(hiScore)); } catch (e) { } }
      document.exitPointerLock && document.exitPointerLock(); showScreen('absorbed');
    }
  }
  else if (state === 'dead') { update(dt * 0.35); P.vy -= GRAV * dt * 0.35; P.y = Math.max(groundAt(P.x, P.z, P.y) , P.y + P.vy * dt * 0.35); }
  else if (state === 'title') { if (Math.random() < dt * 2) bubbles(HIVE.x + rand(-7, 7), HIVE.top, HIVE.z + rand(-4, 4), 2, 0.3); updateParticles(dt); }
  greyV = lerp(greyV, jokeT > 0 ? 1 : 0, Math.min(1, dt * 8));
  render(); hud(dt); zUpdate(dt);
}
showScreen('title');
requestAnimationFrame(frame);
})();
</script>
