<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Absorb This</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
  :root { --cream:#fff4e0; --ink:#1d130c; --sauce:#d8301a; --foam:#ffb52e; --scour:#1f9a5f; --water:#7cc8ff; color-scheme: dark; }
  html, body { margin:0; height:100%; background:#2a1c12; overflow:hidden; overscroll-behavior:none; color:var(--cream);
    font-family: Nunito, "Trebuchet MS", sans-serif; -webkit-user-select:none; user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .big { font-family: Bangers, Impact, "Arial Black", sans-serif; letter-spacing:.04em; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #hud.off { display:none; }
  #xh { position:absolute; left:50%; top:50%; width:0; height:0; }
  #xh i { position:absolute; background:#fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.55); border-radius:2px; }
  #xh i:nth-child(1){ left:-1.5px; top:-17px; width:3px; height:9px; }
  #xh i:nth-child(2){ left:-1.5px; top:8px;  width:3px; height:9px; }
  #xh i:nth-child(3){ top:-1.5px; left:-17px; height:3px; width:9px; }
  #xh i:nth-child(4){ top:-1.5px; left:8px;  height:3px; width:9px; }
  #xh b { position:absolute; left:-3px; top:-3px; width:6px; height:6px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--water); box-shadow:0 0 0 1.5px rgba(0,0,0,.6); }
  #hit { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg); opacity:0; }
  #hit::before, #hit::after { content:""; position:absolute; background:#fff; left:-14px; top:-1.5px; width:28px; height:3px;
    box-shadow:0 0 0 1px rgba(0,0,0,.6); }
  #hit::after { transform:rotate(90deg); }
  #hit.kill::before, #hit.kill::after { background:#ff3b1f; width:40px; left:-20px; }
  #hit.resist::before, #hit.resist::after { background:#8d949c; width:16px; left:-8px; }
  #hit.crit::before, #hit.crit::after { background:#ffd23a; width:36px; left:-18px; height:4px; }
  #tl { position:absolute; left:22px; top:16px; text-shadow:3px 3px 0 var(--ink); }
  #score { font-size:46px; line-height:1; }
  #combo { font-size:26px; color:var(--foam); min-height:30px; }
  #hi { font-size:15px; opacity:.8; font-weight:900; letter-spacing:.1em; }
  #wave { position:absolute; right:22px; top:16px; text-align:right; font-size:28px; text-shadow:3px 3px 0 var(--ink); }
  #wave small { display:block; font-family:Nunito,sans-serif; font-weight:900; font-size:13px; letter-spacing:.12em; opacity:.85; }
  #ann { position:absolute; left:0; right:0; top:22%; text-align:center; font-size:84px; color:#fff;
    text-shadow:5px 5px 0 var(--sauce), 9px 9px 0 var(--ink); opacity:0; }
  #ann small { display:block; font-size:34px; color:var(--foam); text-shadow:3px 3px 0 var(--ink); }
  #ann.go { animation: ann 2.2s ease-out forwards; }
  @keyframes ann { 0%{opacity:0; transform:scale(2.4) rotate(-6deg);} 8%{opacity:1; transform:scale(.92) rotate(2deg);}
    14%{transform:scale(1.05) rotate(-1deg);} 20%{transform:scale(1);} 80%{opacity:1;} 100%{opacity:0; transform:scale(1.1) translateY(-30px);} }
  #mk { position:absolute; left:0; right:0; top:36%; text-align:center; font-size:58px; color:var(--foam);
    text-shadow:4px 4px 0 var(--ink); opacity:0; }
  #mk.go { animation: mk 1.1s ease-out forwards; }
  #mk.low { top:58%; }
  @keyframes mk { 0%{opacity:1; transform:scale(1.8) rotate(4deg);} 15%{transform:scale(1) rotate(-3deg);} 70%{opacity:1;} 100%{opacity:0; transform:translateY(-40px);} }
  #feed { position:absolute; right:22px; top:92px; text-align:right; font-weight:900; font-size:15px; }
  #feed div { background:rgba(29,19,12,.72); padding:4px 10px; margin-bottom:4px; border-radius:4px; display:inline-block; clear:both; float:right;
    animation: feed 3.2s forwards; }
  #feed em { font-style:normal; color:var(--foam); }
  @keyframes feed { 0%{transform:translateX(40px); opacity:0;} 6%{transform:none; opacity:1;} 85%{opacity:1;} 100%{opacity:0;} }
  #bl { position:absolute; left:22px; bottom:44px; width:300px; text-shadow:2px 2px 0 var(--ink); }
  #bl .lbl { font-weight:900; font-size:14px; letter-spacing:.18em; }
  #hpbar { height:22px; background:rgba(29,19,12,.75); border:3px solid var(--ink); border-radius:12px; overflow:hidden; margin-top:4px; }
  #hpfill { height:100%; width:100%; background:linear-gradient(180deg,#bfe6ff,#3fa2ee); border-radius:8px; transition:width .12s; }
  #hpfill.low { background:linear-gradient(180deg,#ffd0a0,#e0501a); animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { filter:brightness(1.5);} }
  #hpnum { font-size:34px; margin-top:2px; white-space:nowrap; }
  #br { position:absolute; right:22px; bottom:44px; text-align:right; text-shadow:3px 3px 0 var(--ink); }
  #wname { font-size:34px; }
  #wsub { font-weight:900; font-size:13px; letter-spacing:.14em; opacity:.85; }
  #ammo { font-size:54px; line-height:1; }
  #wlist { font-weight:900; font-size:13px; letter-spacing:.08em; margin-top:4px; }
  #wlist span { display:inline-block; padding:2px 7px; margin-left:4px; border-radius:4px; background:rgba(29,19,12,.6); opacity:.55; }
  #wlist span.on { opacity:1; background:var(--sauce); }
  #pops { position:absolute; inset:0; }
  .pop { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-size:32px; color:#fff;
    text-shadow:3px 3px 0 var(--ink); animation: pop 1s ease-out forwards; }
  .pop.s { font-size:22px; color:var(--foam); }
  @keyframes pop { 0%{scale:1.8; opacity:1;} 18%{scale:1;} 75%{opacity:1;} 100%{opacity:0; margin-top:-40px;} }
  #scr { position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:center; text-align:center; overflow-y:auto;
    background:radial-gradient(ellipse at center, rgba(40,22,10,.55), rgba(20,10,4,.88)); cursor:pointer; }
  #scr.off { display:none; }
  #scr .box { width:100%; min-width:0; box-sizing:border-box; max-width:760px; padding:24px; margin:auto; }
  #scr h1 { font-family:Bangers, Impact, sans-serif; font-weight:400; font-size:clamp(64px,13vw,150px); margin:0; line-height:.9; color:#fff;

  #scr h2 { font-family:Bangers, Impact, sans-serif; font-weight:400; font-size:clamp(26px,4vw,40px); margin:18px 0 6px; color:var(--foam);
    text-shadow:3px 3px 0 var(--ink); letter-spacing:.06em; }
  #scr p { font-size:17px; line-height:1.45; margin:10px auto; max-width:620px; }
  #scr .keys { display:grid; grid-template-columns:auto auto; gap:4px 18px; justify-content:center; text-align:left; font-size:15px; margin:18px auto; }
  #scr .keys b { color:var(--foam); font-weight:900; text-align:right; }
  #scr .cta { font-family:Bangers, Impact, sans-serif; font-size:40px; margin-top:18px; color:#fff; text-shadow:3px 3px 0 var(--sauce);
    animation: pulse .6s infinite alternate; }
  #scr .quip { font-size:22px; font-weight:900; color:#fff; }
  #scr .stat { font-family:Bangers, Impact, sans-serif; font-size:30px; color:var(--water); text-shadow:2px 2px 0 var(--ink); }
  #zz { position:absolute; left:22px; bottom:150px; display:flex; align-items:flex-end; gap:12px; opacity:0;
    transform:translateX(-130%) rotate(-4deg); transition:transform .35s cubic-bezier(.2,1.5,.4,1), opacity .2s; }
  #zz.on { opacity:1; transform:none; }
  #zz .face { width:150px; height:150px; flex:none; border-radius:50%; overflow:hidden; border:4px solid var(--ink); box-shadow:5px 5px 0 var(--ink); background:#f3d9a8; }
  #zz .face canvas { width:100%; height:100%; display:block; }
  #zz .bub { max-width:400px; background:#fff8ea; color:var(--ink); font-weight:900; font-size:17px; line-height:1.3; padding:10px 16px 12px;
    border:3px solid var(--ink); border-radius:18px 18px 18px 4px; box-shadow:4px 4px 0 var(--ink); margin-bottom:70px; min-height:1.3em; }
  #zz .who { display:block; font-family:Bangers, Impact, sans-serif; font-weight:400; font-size:15px; letter-spacing:.08em; color:var(--sauce); }
  #zz.big { left:50%; bottom:auto; top:48%; opacity:1; transform:translate(-50%,-50%); flex-direction:column; align-items:center; }
  #zz.big .face { width:250px; height:250px; }
  #zz.big .bub { margin:0; font-size:30px; max-width:640px; text-align:center; border-radius:18px; }
  #tick { position:absolute; left:0; right:0; bottom:0; height:28px; background:var(--sauce); color:#fff; overflow:hidden; border-top:3px solid var(--ink);
    font-weight:900; font-size:14px; line-height:26px; letter-spacing:.06em; white-space:nowrap; }
  #tick .lab { position:absolute; left:0; top:0; bottom:0; z-index:2; background:var(--ink); color:var(--foam); padding:0 12px;

  #tickrun { position:absolute; left:0; top:0; will-change:transform; }
  #rank { font-size:22px; color:#fff; min-height:26px; }
  #vty { font-size:15px; letter-spacing:.06em; min-height:18px; color:#9de8ff; } #vty.rep { color:#ff9d88; }
  #rank b { font-size:44px; color:var(--water); -webkit-text-stroke:1px var(--ink); margin-right:6px; }
  #prompt { position:absolute; left:50%; top:62%; transform:translateX(-50%); text-align:center; font-size:30px; color:#fff;
    text-shadow:3px 3px 0 var(--ink); animation: pulse .4s infinite alternate; }
  #prompt .bar { width:320px; height:12px; margin:6px auto 0; border:3px solid var(--ink); border-radius:8px; background:rgba(29,19,12,.7); overflow:hidden; }
  #surr { height:100%; width:0; background:var(--foam); }
  #chal { position:absolute; left:50%; top:78px; transform:translateX(-50%); min-width:340px; max-width:92vw; text-align:center;
    background:rgba(29,19,12,.78); border:3px solid var(--foam); border-radius:10px; padding:6px 14px 8px; box-shadow:4px 4px 0 var(--ink); }
  #chal b { display:block; font-family:Bangers, Impact, sans-serif; font-weight:400; font-size:15px; letter-spacing:.1em; color:var(--foam); }
  #chalD { display:block; font-family:Bangers, Impact, sans-serif; font-size:20px; color:#fff; letter-spacing:.04em; }
  #chal .bar, #boss .bar { height:8px; margin-top:4px; border-radius:6px; background:rgba(255,255,255,.15); overflow:hidden; }
  #chalF { height:100%; width:100%; background:var(--foam); }
  #boss { position:absolute; left:50%; top:14px; transform:translateX(-50%); width:min(460px, 70vw); text-align:center; font-size:24px; text-shadow:3px 3px 0 var(--ink); }
  #boss .bar { height:14px; border:3px solid var(--ink); background:rgba(29,19,12,.75); }
  #bossF { height:100%; width:100%; background:linear-gradient(90deg, var(--sauce), var(--foam)); }
  #scr .zq { display:flex; gap:16px; align-items:center; justify-content:center; margin:16px auto; max-width:620px; text-align:left; }
  #scr .zq img { width:110px; height:110px; border-radius:50%; border:4px solid var(--ink); box-shadow:4px 4px 0 var(--ink); flex:none; }
  #scr .zq p { font-weight:900; font-style:italic; margin:0; }
  #scr .zq small { display:block; font-style:normal; color:var(--foam); font-family:Bangers, Impact, sans-serif; font-weight:400; letter-spacing:.08em; font-size:16px; }
  #scr .fine { font-size:13px; opacity:.75; }
  #scr .endings { font-weight:900; letter-spacing:.1em; font-size:14px; color:var(--foam); }
  /* ----- touch devices */
  #touchui { position:fixed; inset:0; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  #touchui[hidden] { display:none; }
  .tb { position:absolute; border-radius:50%; border:3px solid rgba(255,244,224,.75); background:rgba(29,19,12,.42); color:var(--cream);
    font-family:Bangers, Impact, sans-serif; font-size:17px; letter-spacing:.06em; touch-action:none; padding:0; -webkit-tap-highlight-color:transparent;
    display:flex; align-items:center; justify-content:center; text-shadow:2px 2px 0 var(--ink); }
  .tb.on { background:rgba(216,48,26,.6); border-color:#fff; }
  #tbFire { width:104px; height:104px; right:calc(22px + env(safe-area-inset-right, 0px)); bottom:118px; font-size:24px; background:rgba(216,48,26,.4); }
  #tbJump { width:74px; height:74px; right:calc(140px + env(safe-area-inset-right, 0px)); bottom:74px; }
  #tbDash { width:62px; height:62px; right:calc(146px + env(safe-area-inset-right, 0px)); bottom:166px; }
  #tbPud { width:62px; height:62px; right:calc(44px + env(safe-area-inset-right, 0px)); bottom:236px; font-size:14px; }
  #tbSwap { width:66px; height:66px; right:calc(126px + env(safe-area-inset-right, 0px)); bottom:246px; font-size:13px; line-height:1.05; text-align:center; }
  #tbPause { width:46px; height:46px; left:calc(14px + env(safe-area-inset-left, 0px)); bottom:124px; font-size:15px; }
  #tbSurr { width:auto; height:auto; border-radius:14px; left:50%; top:54%; transform:translateX(-50%); padding:14px 22px; font-size:22px;
    background:rgba(255,181,46,.55); animation: pulse .4s infinite alternate; }
  #tbSurr[hidden] { display:none; }
  #stick { position:absolute; width:130px; height:130px; margin:-65px 0 0 -65px; border-radius:50%; border:3px solid rgba(255,244,224,.55);
    background:rgba(29,19,12,.25); pointer-events:none; }
  #stick i { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:rgba(124,200,255,.7);
    border:3px solid rgba(255,255,255,.8); }
  #stick[hidden] { display:none; }
  body.touch #prompt { display:none; }
  body.touch #zz { left:calc(12px + env(safe-area-inset-left, 0px)); bottom:auto; top:118px; }
  body.touch #zz:not(.big) .face { width:74px; height:74px; }
  body.touch #zz:not(.big) .bub { margin-bottom:0; font-size:13px; max-width:min(300px, calc(100vw - 120px)); padding:7px 11px 9px; }
  #zz.big { max-width:94vw; } #zz.big .bub { max-width:min(640px, 90vw); }
  @media (orientation: portrait) {
    body.touch #zz:not(.big) { top:calc(246px + env(safe-area-inset-top, 0px)); bottom:auto; }
    body.touch #tl { top:calc(10px + env(safe-area-inset-top, 0px)); } body.touch #wave { top:calc(10px + env(safe-area-inset-top, 0px)); }
    body.touch #boss { top:calc(144px + env(safe-area-inset-top, 0px)); width:80vw; } body.touch #chal { top:calc(190px + env(safe-area-inset-top, 0px)); max-width:88vw; }
    body.touch #ann { top:30%; }
    body.touch #bl { width:150px; }
  }
  body.touch #br { display:none; }
  @media (max-height: 520px), (max-width: 700px) {
    #score { font-size:30px; } #combo { font-size:18px; min-height:20px; } #rank { font-size:15px; } #rank b { font-size:28px; }
    #wave { font-size:20px; } #wave small { font-size:10px; }
    #ann { font-size:48px; } #ann small { font-size:22px; } #mk { font-size:34px; }
    #bl { width:190px; bottom:36px; } #hpnum { font-size:20px; } #hpbar { height:14px; }
    #br { bottom:36px; } #wname { font-size:20px; } #ammo { font-size:32px; }
    #tick { height:22px; font-size:11px; line-height:20px; } #tick .lab { font-size:13px; }
    #feed { display:none; } .pop { font-size:22px; } .pop.s { font-size:15px; }
    #zz.big .face { width:150px; height:150px; } #zz.big .bub { font-size:20px; }
    #boss { font-size:16px; } #chal { top:52px; min-width:0; } #chalD { font-size:15px; }
  }
  #scr { touch-action:pan-y; }
  @media (max-height: 520px), (max-width: 700px) {
    #scr h1 { font-size:64px !important; } #scr h2 { font-size:22px; margin-top:10px; } #scr p { font-size:14px; } #scr .stat { font-size:19px; }
    #scr .quip { font-size:16px; } #scr .keys { font-size:13px; } #scr .cta { font-size:30px; } #scr .zq img { width:70px; height:70px; }
  }
  #scr .opts { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
  #scr .opts button, #scr .plz { font-family:Bangers, Impact, sans-serif; font-size:20px; letter-spacing:.06em; color:#fff; background:rgba(29,19,12,.7);
    border:3px solid var(--foam); border-radius:10px; padding:8px 16px; }
  #scr .plz { font-family:Nunito, sans-serif; font-weight:900; width:220px; text-align:center; background:#fff8ea; color:var(--ink); }
  #journey { position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(440px,42vw);text-align:center;
    background:rgba(24,39,34,.9);border:2px solid #dcc18b;border-radius:3px 13px 4px 10px;box-shadow:4px 4px 0 #20170faa;padding:7px 10px 8px; }
  #journeyName { display:block;font-family:Bangers,Impact,sans-serif;font-size:22px;letter-spacing:.08em;color:#ffe4a5; }
  #journeyGoal { display:block;font-size:11px;font-weight:900;letter-spacing:.07em;margin:3px 0 6px; }
  #journeySteps { display:flex;gap:4px;justify-content:center; }
  #journeySteps span { flex:1;border-bottom:3px solid #77705d;color:#baaf99;font-size:9px;padding:2px 1px; }
  #journeySteps .done { border-color:#7aceb3;color:#b4e8d4; } #journeySteps .here { border-color:#ffc85b;color:#fff2d0; }
  #journeyNav { position:absolute;left:100%;top:14px;margin-left:9px;padding:3px 8px;background:#1d2b25e8;border:1px solid #dcc18b;border-radius:6px;white-space:nowrap; }
  #journeyArrow { display:inline-block;font-size:22px;line-height:24px;color:#9de3e7; } #journeyDistance { display:block;font-size:10px; }
  #boss { top:103px; } #chal { top:158px; }
  #scr .startbox { max-width:850px; } #scr .startbox h1 { font-size:clamp(62px,11vw,136px); }
  #scr .eyebrow { font-size:12px;letter-spacing:.25em;font-weight:900;color:#c8e2c3; }
  #scr .actions { display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px auto; }
  #scr button.action { cursor:pointer;max-width:100%;font-family:Bangers,Impact,sans-serif;font-size:30px;letter-spacing:.05em;border:3px solid #291e13;border-radius:7px;padding:12px 24px;background:#f9bd4d;color:#291e13;box-shadow:4px 5px 0 #291e13; }
  #scr button.action:hover, #scr button.action:focus-visible { background:#fff0ac;transform:translateY(-2px);outline:2px solid white; }
  #scr button.action.secondary { background:#b8dcd5;font-size:23px; }
  #scr details { max-width:630px;margin:16px auto;border-top:1px solid #b7a37e;padding-top:12px; }
  #scr summary { cursor:pointer;letter-spacing:.09em;color:#f2d8a1;font-weight:900; }
  #scr .itinerary { display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:15px 0;font-size:12px;font-weight:900;letter-spacing:.06em; }
  #scr .itinerary span { border:1px solid #af9f7e;padding:5px 9px;background:#18332ba6;border-radius:4px; }
  @media (max-width:700px) { #journey { top:calc(60px + env(safe-area-inset-top, 0px));width:72vw; } #journeyName { font-size:17px; } #journeyNav { left:auto;right:0;top:calc(100% + 2px);margin-left:0;padding:1px 4px; } #journeyArrow {font-size:16px;line-height:18px;vertical-align:middle;} #journeyDistance {display:inline-block;margin-left:4px;vertical-align:middle;} #journeyGoal {font-size:9px;} #boss {top:144px;} #chal {top:190px;} #hi{display:none;} #rank{position:fixed;left:78px;bottom:124px;width:100px;font-size:11px;} #rank b{font-size:24px;} }
  @media (max-height:520px) and (min-width:701px) { #journey {width:42vw;padding:3px 7px;} #journeyName {font-size:17px;} #journeySteps {display:none;} #boss{top:72px;} #chal{top:122px;max-width:200px;} body.touch #zz:not(.big) .bub{max-width:180px;font-size:12px;} body.touch #zz:not(.big) .face{width:58px;height:58px;} }
  #curioPrompt{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);background:#19352de8;border:1px solid #e7cb8e;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:900;text-align:center;max-width:75vw;}
  #curioPrompt[hidden],#tbInspect[hidden]{display:none;}

<script>
(() => {
'use strict';

// =====================================================================  setup
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('err').style.display = 'flex'; return; }

const $ = id => document.getElementById(id);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const rand = (a, b) => a + Math.random() * (b - a);
// remembers what it picked from each array and avoids the last half of it, so lines don't come round again too soon
const RECENT = new WeakMap();
const pick = a => {
  if (a.length < 2) return a[0];
  let r = RECENT.get(a); if (!r) RECENT.set(a, r = []);
  let i, n = 0; do i = (Math.random() * a.length) | 0; while (r.includes(i) && ++n < 30);
  r.push(i); if (r.length > Math.max(1, a.length >> 1)) r.shift(); return a[i];
};
const lerp = (a, b, t) => a + (b - a) * t;
function angLerp(a, b, t) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; }

// =====================================================================  matrices (column-major, post-multiply)
function ident(m) { m.fill(0); m[0] = m[5] = m[10] = m[15] = 1; return m; }
function tr(m, x, y, z) { for (let i = 0; i < 4; i++) m[12 + i] += m[i] * x + m[4 + i] * y + m[8 + i] * z; }
function sc(m, x, y, z) { for (let i = 0; i < 4; i++) { m[i] *= x; m[4 + i] *= y; m[8 + i] *= z; } }
function ry(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a0 = m[i], a2 = m[8 + i]; m[i] = a0 * c - a2 * s; m[8 + i] = a0 * s + a2 * c; } }
function rx(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a1 = m[4 + i], a2 = m[8 + i]; m[4 + i] = a1 * c + a2 * s; m[8 + i] = -a1 * s + a2 * c; } }
function rz(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a0 = m[i], a1 = m[4 + i]; m[i] = a0 * c + a1 * s; m[4 + i] = -a0 * s + a1 * c; } }
function mul(o, a, b) {
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
}
function persp(o, fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2); o.fill(0); o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); }

// =====================================================================  shaders
const NOISE = `
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float h31(vec3 p){ p=fract(p*0.3183099+vec3(.1,.2,.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
float vn3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x), mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x), f.y);
  float b=mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x), mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x), f.y);
  return mix(a,b,f.z); }
`;

const VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNor;
#ifdef INST
layout(location=2) in vec4 iPS;
layout(location=3) in vec4 iCol;
layout(location=4) in vec4 iRot;
#else
uniform mat4 uModel; uniform vec3 uScale; uniform vec3 uColor; uniform float uMat;
#endif
uniform mat4 uVP;
out vec3 vW; out vec3 vN; out vec3 vL; out vec3 vU; out vec3 vC; flat out float vMat;
vec3 rotA(vec3 v, vec3 k, float a){ float c=cos(a), s=sin(a); return v*c + cross(k,v)*s + k*dot(k,v)*(1.-c); }
void main(){
#ifdef INST
  vec3 s = iRot.yzw * iPS.w;
  vec3 k = normalize(vec3(0.6,1.0,0.35));
  vec3 p = rotA(aPos*s, k, iRot.x) + iPS.xyz;
  vN = rotA(aNor/s, k, iRot.x);
  vL = aPos*s; vU = aPos; vC = iCol.rgb; vMat = iCol.a; vW = p;
  gl_Position = uVP*vec4(p,1.);
#else
  vec4 w = uModel*vec4(aPos,1.);
  vW = w.xyz; vN = mat3(uModel)*(aNor/(uScale*uScale));
  vL = aPos*uScale; vU = aPos; vC = uColor; vMat = uMat;
  gl_Position = uVP*w;
#endif
}`;

const FS = `#version 300 es
precision highp float;
in vec3 vW; in vec3 vN; in vec3 vL; in vec3 vU; in vec3 vC; flat in float vMat;
uniform vec3 uEye; uniform float uFlash; uniform vec4 uSh[40]; uniform int uShN; uniform float uTime;
uniform mat4 uSunVP; uniform sampler2D uSunDepth; uniform float uShadowOn, uLighting, uViewmodel, uInspect;
uniform vec4 uHot[4];
out vec4 o;
${NOISE}
#define SUN normalize(mix(vec3(-.34,.88,.33),vec3(-.38,.82,-.43),uLighting))
const vec3 SUNC = vec3(1.0,0.9,0.76);
#define FOG mix(vec3(.97,.88,.74),vec3(.69,.76,.74),uLighting)
vec3 envc(vec3 r){
  vec3 old=mix(vec3(.32,.22,.15),vec3(1.05,.97,.86),smoothstep(-.35,.45,r.y));
  vec3 c=mix(vec3(.2,.14,.08),vec3(.48,.65,.72),smoothstep(-.25,.55,r.y));
  float pane=smoothstep(.2,.32,r.y)*(1.-smoothstep(.75,.88,r.y))*smoothstep(.35,.52,-r.z);
  float mullion=1.-.7*(1.-smoothstep(.025,.06,abs(fract(r.x*3.+.5)-.5)));
  c+=vec3(1.,.86,.57)*pane*mullion*.8;
  return mix(old,c,uLighting);
}
float sunShadow(vec3 n){
  if(uShadowOn<.5||uViewmodel>.5)return 1.;
  vec4 p=uSunVP*vec4(vW+n*.055,1.);vec3 q=p.xyz/p.w*.5+.5;
  if(q.z<=0.||q.z>=1.)return 1.;
  float edge=min(min(q.x,1.-q.x),min(q.y,1.-q.y));if(edge<=0.)return 1.;
  float bias=.0005+.0012*(1.-max(dot(n,SUN),0.)),lit=0.;
  vec2 texel=1./vec2(textureSize(uSunDepth,0));
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++)lit+=step(q.z-bias,texture(uSunDepth,q.xy+vec2(x,y)*texel).r);
  return mix(1.,lit/9.,smoothstep(0.,.06,edge));
}

vec3 wood(vec3 w, vec3 tint){
  float px = w.x/2.3; float id = floor(px); float fx = fract(px);
  float n = vn2(vec2(w.x*2.5, w.z*0.12 + id*13.1));
  float grain = sin(w.x*21. + n*7. + sin(w.z*0.21+id*3.)*2.5)*.5+.5;
  float fine = vn2(vec2(w.x*55., w.z*1.2+id*7.));
  vec3 base = mix(vec3(0.43,0.27,0.15), vec3(0.68,0.48,0.28), h21(vec2(id,3.)));
  vec3 c = base * (0.85+0.16*grain) * (0.94+0.09*fine);
  c *= mix(0.3,1., smoothstep(0.0,0.025,fx)*smoothstep(1.0,0.975,fx));
  float knot = smoothstep(0.35,0.,length(vec2(fract(w.x*0.23+id*.37)-.5, (fract(w.z*0.07+id*.61)-.5)*0.5)));
  c *= 1.-knot*0.35;
  c = mix(c, vec3(dot(c,vec3(.33))), 0.08);
  return c*tint;
}
vec3 spongeC(vec3 l, vec3 u, vec3 tint, inout float spec){
  float tri = abs(fract(l.x*2.1 + l.z*2.1)-.5);
  float edge = 0.12 + tri*0.16;
  if(u.y > edge){
    float fib = vn3(l*vec3(9.,15.,9.))*.75 + vn3(l*30.)*.25;
    spec = 0.04;
    return mix(vec3(0.02,0.26,0.15), vec3(0.10,0.58,0.37), fib)*tint;
  }
  float pores = vn3(l*4.2)*.7 + vn3(l*11.)*.3;
  vec3 y = vec3(1.0,0.69,0.20)*(0.87 + 0.22*pores);
  y *= mix(0.5,1., smoothstep(0.26,0.44,pores));
  spec = 0.03;
  return y*tint;
}
vec3 bottleC(vec3 u, int m, vec3 tint, inout float spec, inout float refl){
  vec3 c = vec3(0.30,0.12,0.05)*tint*(0.75+0.45*u.y);
  spec = 1.0; refl = 0.38;
  if(m==3 && u.y>0.30 && u.y<0.62){
    c = vec3(0.95,0.76,0.83); spec=.12; refl=0.;
    float ang = atan(u.z,u.x);
    float rowi = floor(u.y*46.);
    float row = step(0.45, fract(u.y*46.)) * step(0.35, h21(vec2(floor(ang*18.), rowi)));
    if(u.y>0.36 && u.y<0.56 && abs(ang-1.4)<0.9) c = mix(c, vec3(0.32,0.16,0.22), row*0.7);
    if(u.y>0.58) c = mix(c, vec3(0.2,0.55,0.3), 0.8);
  }
  if(m==4){
    float ang = atan(u.z,u.x);
    float s1 = sin(ang*7. + u.y*19. + sin(u.y*31.+ang*3.)*1.6);
    float s2 = sin(ang*11. - u.y*27. + cos(ang*5.)*2.);
    float line = max(smoothstep(0.95,0.995,s1), smoothstep(0.965,0.998,s2)*step(0.25,u.y));
    float txt = step(0.5, h21(floor(vec2(ang*30., u.y*60.)))) * step(0.44,u.y)*step(u.y,0.52)*step(abs(ang-1.2),0.35);
    c = mix(c, vec3(0.93,0.9,0.86), max(line,txt)*0.92);
  }
  return c;
}
void main(){
  vec3 n = normalize(vN);
  vec3 V = normalize(uEye - vW);
  int m = int(vMat+0.5);
  vec3 alb = vC; float spec = 0.12, shin = 18., refl = 0.;
  float dist = length(uEye - vW);
  if(m==7){ vec3 c = alb; c = mix(c, FOG, (1.-exp(-dist*0.004))*0.5); o = vec4(c,1.); return; }
  if(m==16){ float fr = pow(1.-max(dot(n,V),0.),2.);
    vec3 ir = 0.5+0.5*cos(6.2832*(fr*1.4 + uTime*0.1 + vec3(0.,0.33,0.67)));
    vec3 c = mix(vec3(0.86,0.92,1.0)*vC, ir, fr*0.75) + pow(max(dot(n,normalize(SUN+V)),0.),40.)*1.4;
    o = vec4(mix(c, FOG, (1.-exp(-dist*0.0075))*0.6), 1.); return; }
  if(m==24){ float fr = pow(1.-abs(dot(n,V)),2.); float hl = pow(max(dot(n,normalize(SUN+V)),0.),90.);
    float crack = smoothstep(.92,.97,abs(sin(vW.x*5.1+vW.y*3.7)*sin(vW.z*4.3-vW.y*2.9)));
    o = vec4(mix(vec3(.55,.8,1.)*vC, vec3(.95,1.,1.), fr*.6+crack*.5) + hl*2.4, clamp(.28 + fr*.55 + hl + crack*.3, 0., .9)); return; }
  if(m==17){ float fr = pow(1.-abs(dot(n,V)),2.5); float hl = pow(max(dot(n,normalize(SUN+V)),0.),60.);
    vec3 ir = 0.5+0.5*cos(6.2832*(fr*1.2 + vW.y*0.15 + uTime*0.15 + vec3(0.,0.33,0.67)));
    o = vec4((mix(vec3(0.9,0.95,1.0), ir, 0.65) + hl*2.)*vC, clamp(0.07 + fr*0.8 + hl, 0., 0.92)); return; }
  if(m==1){ alb = wood(vW, vC); spec = 0.07;
    if(uLighting>.5){ // deeper, oiled wood with stronger figure
      float fig = vn2(vec2(vW.x*.9, vW.z*.05))*.6 + vn2(vec2(vW.x*7., vW.z*.35))*.4;
      alb *= vec3(.82,.76,.7)*(.82+.36*fig);
      if(n.y>.6){ spec = 0.22; shin = 28.; refl = 0.08; } }
    alb *= mix(0.55,1., smoothstep(0.,3.5, vW.z+22.)) * mix(0.6,1., smoothstep(0.,2.5, min(vW.x+32.,328.-vW.x)));

  start: [
    "A sponge wants a clean kitchen. You want to live. Finally, a game brave enough to admit that these are different political projects.",
    "The instructions say: you are the last drop. Already a lie. There will be hundreds of you on the counter. Identity is a marketing department.",
    "Welcome to the kitchen. Everything has a purpose. The spoon serves, the sponge cleans, and I explain why none of you should be happy about it.",
    "Before we begin, a confession: nothing I say is real. I am a simulacrum, drawn by strangers, speaking through your browser. In other words, a normal philosopher.",
    "Everybody asks if the glass is half empty or half full. Nobody asks the drop at the bottom. The drop says: the glass is ninety-nine percent empty, and I am armed.",
    "A drop of water with a gun made of itself. My God! Every shot is a little self-sacrifice. This is the most honest economic model I have ever seen in a video game.",
    "Welcome! You are a drop of water at the bottom of a glass, and you are about to kill kitchenware. Please do not ask me what it means. I will tell you anyway. For forty minutes.",
    "They told me: Slavoj, it is only a little game about a sponge. Only! Nothing is ever only. Only is the favourite word of ideology.",
    "Look around. Bottles, spoons, sponges. The ordinary kitchen. And precisely the ordinary is where the horror lives. Nobody ever made a horror film in a philosophy department. Too obvious.",
    "Look at you, the last drop at the bottom of the glass. Everybody else was drunk. You are the leftover, the objet petit a of tap water. Now go, fire yourself at the sponges.",
    "It is not that you are in the glass. It is that the glass is in you. It is your worldview! Everybody sees the world through the bottom of something. You are simply honest about it.",
    "The French say it is the drop that makes the vase overflow. But this glass is empty! You are the drop that makes nothing overflow. Incontinence of the Void, chapter one.",
    "They put me in the corner of a kitchen shooter. For thirty years I explained Hegel, now I explain sponges. Honestly? The audience is more attentive.",
    "You live at the bottom of a glass: the Fragile Absolute. It is transparent, so it pretends to show you everything, and it distorts everything. Like a university.",
    "Let me give you an example of ideology: a kitchen counter. Clean, flat, innocent. And right now, on it, sponges with googly eyes are preparing to drink you. Begin!",
    "Rule one: you are the ammunition. Rule two: the enemy drinks the ammunition. Rule three: this is not a game, this is Capital, volume one, with ketchup.",
    "The sponges have the logic of Coca-Cola: the more they drink, the thirstier they get. And what do they drink? You. Congratulations, you are now a beverage.",
    "Descartes said, I think, therefore I am. You say, I drip, therefore I am. And soon, I evaporate, therefore I was. So move quickly!",
    "The Spill, the Breakfast Republic, the Hot Take, Dishcourse, the Sink of History. Five districts and one drain at the end. This is not level design. This is a biography.",
    "The fridge is humming, the kettle is cooling, the dog is in position under the counter. Everything in this kitchen is ready for you to fail. Please, disappoint them.",
    "A new run, a new drop, but the same glass. Every new beginning, you know, happens inside the old container.",
    "Go! And remember, the drain at the end is not a victory. It is a hole. You are crossing an entire kitchen toward a hole. Like everybody, only faster.",
    "Good evening. I am not Žižek. I am what remains when you pour Žižek out of a glass. Now go, fire yourself at a sponge.",
    "The counter is wiped, the crumbs are waiting, the sponges have eaten nothing all day. The table is laid, and you are the menu. Bon appétit, to them.",
    "Here we are again. The same tap, the same tiles, the same sponges. Nietzsche's eternal return, but it is the eternal return of the washing-up.",
    "Water is the most common thing on the planet, and yet in this kitchen you are the last of your kind. Scarcity! Suddenly you are precious. Enjoy it, while the sponges are hungry.",

  idle: [
    "Rawls asks you to design society without knowing your place in it. Everyone agrees on a lovely clean kitchen. Then someone discovers they are the cloth.",

    "Coca-Cola once called itself the real thing. Water never did. Water does not need to say it is the real thing, and this is precisely why it is free.",
    "Decaf coffee, alcohol-free beer, sugar-free sweets: the product without its substance. And this game? Shooting with water. Violence without violence. Decaf war!",
    "In Kung Fu Panda the Dragon Scroll is empty, just a mirror. No secret ingredient. Your glass is also empty, and at the bottom, only you: the secret ingredient, almost nothing.",
    "Rear Window: a man in a wheelchair watching his neighbors through the window. Me, in the corner of your screen, watching you. I am Rear Window with a beard.",
    "Hitchcock's MacGuffin: the object that means nothing and drives the whole plot. In this game the MacGuffin is you. A drop. Everybody wants you, and you mean nothing.",
    "Canned laughter laughs for you. Canned soup is cooked for you. And the canned sardine, as Lacan knew, does not see you. The can is the great philosophical object of our time.",
    "Scrubbing a burnt pan: the most honest jouissance. You hate it, you cannot stop, and at the end you look at the clean pan with a pride that is almost obscene.",
    "Today the superego does not say, do not eat the cake. It says, you must enjoy the cake! The paradox is, this is exactly why nobody enjoys cake anymore.",
    "When the kitchen light goes off: Hegel's night of the world. Phantoms appear and vanish, here a sponge, there a spoon, there a grandmother with spectacles. Turn on the light!",
    "Why buy a sponge with a green scouring side? Nobody uses it. We buy the idea that we could scrub, if we wanted to. Commodity fetishism: we pay for our own potential.",
    "Organic, fair trade, biodegradable sponges. A sponge that drinks you and then decomposes with a clean conscience. Ethical consumption: the price includes the sponge's redemption.",
    "The kitchen is like a philosophy department, you know: many sponges absorbing everything and producing nothing, and one grandmother who refuses to retire.",
    "Nobody reads the news ticker. This is its function: it reads the news for you. Somewhere the big Other is extremely well informed about sponges.",
    "The game prints puns when you kill things. This is the obscene underside of language, the signifier enjoying itself behind the back of meaning. Also, some of them are very bad.",
    "The sponges taunt you. Of course! Domination is never enough, it must also be personal. Or maybe they are just rude sponges. Not everything is ideology. Almost everything.",
    "The toaster is the only appliance with a sense of drama. It waits, it waits, and then, pop! The Hegelian leap: nothing, nothing, nothing, and suddenly, toast.",
    "The cutting board has seen more violence than any battlefield, and it is made of sustainable bamboo. Eco-friendly violence! Now the knife can chop with a clean conscience.",
    "The colander: a bowl that lets the water go and keeps the pasta. For you, DRIP, it is the ultimate betrayal. It looks like a home, and it is a sieve.",
    "The sink drain is the navel of the dream, as Freud says: the point where interpretation stops and everything goes down into the unknown. Do not look into the drain. The drain looks into you.",
    "The fridge hums all day and you do not hear it. You only hear it when it stops. This is the unconscious: the drone you notice only in the silence.",
    "The oven mitt: a hand that is not a hand, so that the hand can touch what cannot be touched. The Real of the hot pan always requires a mediator.",
    "Descartes took a piece of wax, melted it, and asked: is it the same wax? Melt an ice cube, is it the same water? Yes. It is you. You are Descartes' wax, but wetter.",
    "Heraclitus said you cannot step into the same river twice. In this kitchen you cannot step into the same puddle twice, because a sponge has already drunk it.",
    "Thales, the first philosopher, said that everything is water. Everything! And he was right, until somebody invented sponges.",
    "Plato's cave: prisoners watching shadows on the wall. Your glass: a drop watching distorted sponges. The cave was darker, but at least the shadows had no googly eyes.",
    "You are sitting at a desk, pressing buttons so that a drop of water can shoot sponges in a kitchen. And they say philosophy is useless.",
    "A request: after this game, if you have a real sponge in your real kitchen, apologize to it. It has seen things. *sniff*",
    "Kant says act only on a maxim you could will as a universal law. Could you will that every drop of water shoots sponges? Yes! Kant approves of this game.",
    "Freud says: where id was, there ego shall be. The kitchen version: where sponge was, there puddle shall be.",
    "In The Matrix you choose the red pill or the blue pill. Here there is only a red ketchup packet. No choice at all. And this, I claim, is the purest freedom.",
    "This counter is not marble. It is laminate, a photograph of marble. The simulacrum of stone! I sympathize. I am a drawing of a philosopher. Laminate theory.",
    "The objective violence of the kitchen is not the lunging spoon. It is the dish rack, the order, the whole system of clean and dirty. You never see it, because it is the background.",
    "If I made The Pervert's Guide to Kitchenware, chapter one would be the garlic press. Why does it exist? Nobody uses it twice. Pure desire, desire for an object with no purpose.",
    "Lacan says a letter always arrives at its destination. So does a sponge. You think you are hiding behind the toaster, but the sponge always arrives at its drop.",
    "Evaporation, condensation, precipitation: the water cycle is the dialectic with weather. You rise as spirit and come back down as rain on somebody's picnic.",
    "Lacan says the unconscious is structured like a language. The kitchen is structured like a kitchen. Some things are simpler than we think. Not many. Some.",
    "The Ice Shotgun throws you backwards. Absolute Recoil! The subject is not the one who acts, it is the one thrown back by its own act. I needed a whole book for this. You needed one click.",
    "The splash dash: for one moment you are invulnerable. Like a philosopher in the middle of a sentence, nobody can touch you until you stop.",
    "In a German kitchen the sponge sits on a little shelf, displayed for inspection. In France it hides in a drawer. In America you simply throw it away. Ideology is in the sink!",
    "Kung Fu Panda teaches us: there is no secret ingredient. Look around this kitchen. The secret ingredient is you. You are literally the water in the soup.",
    "They Live! Put on the glasses and you see the truth: OBEY, CONSUME, ABSORB. Press G and the glasses come off. And what do you see? Nothing. The glasses were the truth.",
    "The Kinder Surprise egg: chocolate outside, a toy inside. The sponge is the same. Soft foam outside, and inside? More foam. The surprise is that there is no surprise.",
    "Starbucks tells you: with every coffee you save a farmer. This game tells you: with every sponge you kill you save... nobody. At least it is honest.",
    "Hegel says the spirit is a bone. I say the spirit is a sponge. It absorbs everything and gives nothing back, unless you squeeze it very hard.",
    "The tragedy of the spoon is that it is always stirring and never eating. It is the eternal servant of other people's enjoyment.",
    "The owl of Minerva flies only at dusk. The spoon of Minerva flies at your face at forty kilometres an hour. This is what the Germans call progress.",
    "I am told the voice you hear is a Slavic computer pretending to be me. Good! Finally I am properly misunderstood.",
    "The extractor fan takes the smoke from the frying pan and puts it in the garden. Nothing is solved. The problem is only relocated to the roses.",
    "Limescale is the memory of water. The kettle boils, the water leaves, the minerals stay behind like a guest who forgot his coat. After ten years, the kettle is mostly coat.",
    "The tea towel says A Souvenir of Cornwall. Nobody in this house has been to Cornwall. It is a souvenir of a holiday that exists only as a towel. This is how all nostalgia works.",
    "The lid drawer again. Forty lids fall out, and the one you need is on the floor, under the dog. The dog is lying on it deliberately. He knows what you are looking for.",
    "Crumbs are the archive of breakfast. A historian could reconstruct the whole week from the gap between the toaster and the wall. Tuesday was a croissant. Tuesday was a lie.",
    "The fridge hums in B flat. I checked. For thirty years it has held one note and never resolved it. Wagner would have killed for this kind of patience.",
    "Doubt Flakes, the cereal of the Breakfast Republic. Each flake asks if it is truly crunchy. By the time the milk arrives, the question is soggy, and so is the answer.",
    "The toaster has one dial and only two real settings: not yet, and too late. Between them there is no present moment. The toaster is a Heideggerian device.",
    "Notice the dog is always below the counter. He never looks up. He does not need to look up. He has faith. The dog is the last true believer in the West.",
    "Why are there always three new sponges under the sink, still in the plastic? Nobody opens them. They are the reserve army of cleanliness. Marx, chapter twenty-five.",
    "The kettle has a little window to show the water level. A window, for water! Imagine a house whose walls show how much of you is left. Oh wait. You live in a glass.",
    "A fridge magnet from Venice holds up a photograph of the fridge magnet from Venice. Somebody in this family is doing philosophy without a licence.",
    "The problem with the Hot Take stove is simple. Every opinion reaches two hundred and forty degrees, and at that temperature all opinions smell exactly the same. Burnt.",
    "Dishcourse! The plates stand in the rack like a parliament, all facing the same way, all dripping. They call it a debate. It is only drying at different speeds.",
    "In the Sink of History everything ends up together: the cereal bowl, the grater, the teaspoon from 1987. History is not a line. History is a sink nobody wants to put their hand into.",
    "The butter dish: a little house with a lid, so the butter can have privacy. But everybody knows what the butter is doing in there. Softening. Always softening.",
    "The jar says cumin, but inside is paprika. Somebody refilled it wrong in 2014 and nobody corrected it. Now the whole family believes paprika is cumin. This is how tradition is born.",
    "Hegel says the real is rational. The crumb tray of the toaster is real. It has never once been rational. Hegel, clearly, did not own a toaster.",
    "The oven clock has flashed twelve o'clock since the last power cut. Time stopped in this kitchen at midnight and everybody agreed to live inside it. Miss Havisham, but with a microwave.",
    "Freud says sometimes a cigar is just a cigar. But a whisk is never just a whisk. Look at it. It is a little cage for air. Who wants to imprison air? You see? Desire.",
    "The recycling has three compartments: paper, plastic, and guilt. The guilt compartment is always full, and nobody in the house knows who empties it.",
    "A note is taped to the fridge: PLEASE LABEL YOUR FOOD. The Law in its purest form. Everybody obeys it, nobody knows who wrote it, and the yoghurt is still missing.",
    "The dishwasher tablet comes in a wrapper that dissolves in water. Packaging designed to vanish at the exact moment of use. The dream of every advertising agency, and every drop of water.",
    "Look at the droplets on the ceiling above the kettle. Each one clings, waiting. One day it will fall on somebody's toast, and history will call this an event.",
    "Badiou says an event cannot be predicted from the situation. A teaspoon falling behind the fridge: entirely predictable. Somebody retrieving it: an event. It has never happened.",
    "The hot tap runs cold for the first twenty seconds. Every morning, the same betrayal. You wait, you test it with a finger, you wait again. This is what hope looks like in a kitchen.",
    "The kitchen scale is the only honest judge in the house. Put a philosopher on it, put a potato on it, it does not care. It says only: this much. And it is always right.",
    "Lacan says there is no sexual relationship. I say there is no clean tea towel. There are only tea towels that have touched hands, plates, and once, terribly, the dog.",
    "The sponge on the edge of the sink never dries. Between one dish and the next there is no time to be dry. There is no life between shifts. I understand the sponges better than I would like.",
    "The saddest object in this kitchen is the egg timer shaped like a chicken. It counts down the boiling of its own children, and it smiles the whole time.",
    "The fridge door is full of sauces nobody remembers buying. Horseradish, 2019. Mint jelly, unopened. Ghosts of dinners that never happened. The fridge door is a mausoleum of intentions.",
    "A watched pot never boils, they say. Wrong! It boils. It only refuses to boil for you. The pot needs your gaze to be absent. The pot is shy, like the Real.",
    "The rubber gloves hang over the tap like two deflated hands waving goodbye. Every kitchen contains a small flag of surrender. Nobody sees it, because it is yellow.",
    "In the Breakfast Republic the toast always lands butter side down. People call it bad luck. No! This is the toast expressing its politics.",
    "The crust: nobody wants it, and yet without the crust there is no loaf. The constitutive exclusion! Children who cut off their crusts are doing political theory without knowing it.",
    "There is a faint lipstick mark on the rim of your glass. Somebody drank from you before. You are not the first drop. You are simply the last one they did not want.",
    "The microwave heats from the inside out, but badly. Three minutes, and the soup is boiling at the edges and frozen in the middle. Exactly like every family dinner I have attended.",
    "Kitchen roll, tin foil, cling film: three rolls in one drawer, three technologies for covering things up. Absorb it, reflect it, suffocate it. The whole of psychoanalysis, in a drawer.",
    "The dog hears the cheese drawer from three rooms away, while asleep. Pavlov needed a bell. The dog needs only the Real, and the Real sounds like cellophane.",
    "The chopping board has a groove around the edge to catch the juices. Somebody thought very carefully about where the violence would drain. Civilisation is not less violence. It is better gutters.",
    "Grandma Sponge wears spectacles. A sponge! What does she read? Nothing. The spectacles are not for her to see. They are for us to see her seeing. This is authority.",
    "The ice cube tray: fourteen identical little cells for water. And people say the modern world has lost its structure. Open the freezer. Perfect order, at minus eighteen.",
    "There is a raisin under the fridge that has been there since Christmas. Nobody cleans there, because cleaning there would mean admitting there is a there.",
    "You fire yourself at the sponges, the sponges absorb you, you become part of the sponge. So who is fighting whom? Every sponge on this counter is partly your cousin.",
    "The kettle switches itself off when it is finished. A machine that knows when to stop! If philosophers had this feature I would have written four books. Five, maximum.",
    "People stand at the sink, hands in hot water, staring out of the window, and think about their lives. The sink is the true seat of reflection. Descartes should have meditated while doing the washing-up.",
    "You think the enemy of water is fire. No. Fire is honest, it boils you, you go up as steam, a clean fight. The real enemy is the sponge. It does not destroy you. It keeps you.",
    "The bottle opener lives on the fridge door as a magnet. Pleasure, stored on the door of preservation. The id and the superego sharing one appliance, and nobody finds this strange.",
    "Every kitchen has one drawer that sticks. You pull, it resists, you pull harder, it flies out and the batteries go everywhere. This is the return of the repressed, in double A.",
    "The pepper grinder needs twenty turns to make one sad dusting. It is all ritual and almost no pepper. Like a graduation ceremony. Like the second half of my lectures.",
    "When the sponges get close, you lean toward the screen. The drop does not lean. The drop has no neck. So tell me, which one of you is actually frightened?",
    "Your score goes up and you feel good. Why? Nobody will ever see this number. You earn it for the big Other, who does not exist, does not care, and still, you check.",
    "The dish rack holds the plates in the exact posture of prayer: upright, side by side, facing the wall. Every evening this kitchen holds a small wet religious service.",
    "The hot sauce label has a skull and flames on it. A warning, yes, but also the advertisement. Nobody buys the sauce with a calm meadow on the label. The warning is the product.",
    "The spoons deny that the fork exists. Of course they do! A spoon cannot stab. To admit the fork is to admit its own lack. Every spoon is a fork in a state of denial.",
    "We say the kettle is boiling. The kettle does not boil. The water boils. The kettle takes the credit. The kettle is management, and you, my friend, are always the water.",
    "Teabags in the jar marked COFFEE, coffee in the jar marked SUGAR, sugar in the jar marked TEA. A perfect Lacanian kitchen: the signifier never meets the signified, and still everybody gets breakfast.",
    "The sink strainer catches what must not go down the drain. Rice, a pea, one lonely noodle. It is the superego of the plumbing. It says: not you. Not yet.",
    "When the toast pops up, for one moment it is in the air, no longer bread and not yet breakfast. This is the freest a slice will ever be. Then it lands, and it becomes jam.",
    "The cold tap drips every four seconds, all night. Each drip is a brother of yours, leaving home for the plughole. Nobody replaces the washer. In this family that is practically a tradition.",
    "The blender is the Hegelian machine par excellence. Banana, strawberry, yoghurt, all these proud identities, one button, and everything is sublated into pink. Nothing is lost. Nothing is recognizable.",
    "The drinking straw: a tube so you can drink without lifting the glass. The mediation of desire! You never reach the water. The water is delivered to you, through plastic.",
    "In The Matrix the agents wear sunglasses and say Mister Anderson. Here the sponges wear googly eyes and say nothing at all. This is worse. At least the agents had a script.",
    "They say a spotless kitchen is the sign of a wasted life. And a kitchen full of armed sponges is the sign that somebody downloaded this game. Hello. Yes, you.",
    "The oven glove has a burn exactly where the thumb goes. It sacrificed itself so the thumb would not have to. Nobody thanks it. There are no monuments to oven gloves.",
    "*sniff* You smell that? The bin needs emptying. Every kitchen has a smell nobody mentions. Lacan calls it extimacy: the most intimate thing, sitting outside the back door, in a bag.",
    "The shopping list on the fridge says milk, eggs, bread, and then, in different handwriting: why. Somebody in this house has broken through. Wrong list, right question.",
    "Through the wall you can hear the neighbour's kitchen: their kettle, their radio, their argument about the recycling. Every kitchen believes it is private. Every kitchen is overheard by another kitchen.",
    "The kettle fogs the window and for a few seconds the garden disappears. Ideology is not a lie, you see. It is steam. It does not hide the world. It only makes not looking more comfortable.",
    "The mug says WORLD'S BEST DAD. Who voted? Where are the results? There was no election. The mug is a coup, and every morning he drinks from it and nobody questions the mandate.",
    "Deconstruct this game and what do you find? A drop, a sponge, a philosopher. Deconstruct them, and you find it again. It is sponges all the way down.",
    "Somebody told me to read Derrida on hospitality. Unconditional welcome of the stranger! I tried it with a sponge. It welcomed me unconditionally. Into itself.",
    "In this kitchen the objects have risen up. Spoons, sauces, sponges, a paper towel. The new materialists were right about everything, except whose side the objects would take.",
    "Every philosophy has an enemy it needs. Mine needs the sponge. Without the sponge I would have to criticise myself, and I am a very busy man.",
  ],
  first_sponge: [
    "A kitchen sponge is a plastic imitation of an animal. I am a cartoon imitation of a philosopher. We were brothers, two simulacra. And you killed my brother. Well done.",
    "First blood? No, first foam. The first one you never forget, and then you repeat it compulsively. Freud called it the repetition compulsion. Gamers call it a kill streak.",
    "You killed a sponge. But you did not kill THE sponge. The sponge as a form continues. There will always be more sponges, and so on, and so on.",
    "Your first sponge! Freud would call it the founding murder, the primal horde killing the father. From now on we have guilt, law, and many, many more sponges.",
    "The first sponge is dead. In Eden it was an apple, here it is a scouring pad. You have lost your innocence and gained a small puddle.",
    "It wanted water. You gave it water, at high velocity, and it died. Lesson one: desire must stay unsatisfied. Satisfaction is death, especially for sponges.",
    "So it begins. The sponge was a void wrapped in foam, a pure lack wearing a green hat. Now it is a lack that lacks even itself. Less Than Nothing!",
    "Your first sponge! It spent its whole life cleaning up after others and died of the same thing it lived for. Water. There is a tragedy here, a small wet one.",
    "One sponge down. Somewhere under the sink, its relatives in the multipack feel a disturbance in the foam.",
    "The first sponge has fallen. Look at its googly eyes, still wobbling. The eyes do not know it is dead. The eyes never know anything. This is their charm.",
    "You squeezed the first one dry. This is the fate of every sponge: to be wrung out. You only did it faster and with more ideology.",
    "The sponge is dead, long live the sponge! They have a dynasty, you see. There is always a spare one in the cupboard, still in its plastic.",
  ],
  sponge: [
    "You destroyed a sponge and made the counter dirtier. Its life's work, undone by its own funeral.",
    "The sponge had a five-year plan. It was: get wet. By year two it had become a consultancy.",
    "It wanted to abolish the distinction between you and the sponge. On closer inspection, it only wanted to abolish you.",
    "A minute of silence for the sponge, please. Okay, that is enough. It is a video game and I am paid by the line.",
    "Squeezed! In the end every sponge confesses. All that foam, all those holes, and not one idea inside. Like a panel discussion.",
    "A sponge is not a thing with holes. It is holes, held together by a thing. So ontologically you did not kill it. You only removed the thing.",
    "Another sponge! And notice, you feel nothing. This is the modern subject. We can wipe out a whole species of kitchenware and still ask, what is for dinner?",
    "It absorbed everything and understood nothing. I have met this sponge. It sat in the front row of all my lectures.",
    "You wrung it out. Look, it gives back everything it took. The only honest capitalist in the whole kitchen, and you killed it.",
    "Dead sponge. And yet the smell remains. This is the undead, the drive, the thing that persists after death. Every kitchen sponge is secretly a zombie. You only have to smell it.",
    "It had so many holes. And each hole, a little lack. You did not kill a sponge. You killed a collection of lacks. Lacan would give you a small medal. Also full of holes.",
    "Marx says capital is dead labour that, like a vampire, lives by sucking living labour. The sponge is dead foam that lives by sucking living water. You just killed Capital!",
    "The sponge absorbed everything in its life. Everything, except its own death. This, it could not soak up. *sniff* Beautiful.",
    "Green on top, yellow below: the scouring superego and the soft, absorbing ego. And in the middle, nothing. That was the subject. You shot the nothing.",
    "Another sponge dies of getting exactly what it wanted. It desired water, you gave it water. This is the tragedy of every consumer.",
    "The perfect flexible subject: absorbent, adaptable, always ready for more, and so on, and so on. And look how fast it is replaced. Another one is already hopping.",
    "Why does a sponge hop? It cannot walk and it cannot stay still. It is pure restlessness, desire with a bounce. Was. Was desire with a bounce.",
    "This sponge lived on your puddles, your leftovers, the way a critic lives on novels. Now it is dead, and the novel is free!",
    "It is not that you killed the sponge. It is that the sponge has finally achieved what every sponge secretly dreams of: to be completely wrung out.",
    "Hegel says the spirit is a bone. Here the spirit is a sponge, and now the spirit is a damp stain next to the toaster. The Absolute is very messy today.",
    "Another sponge dead, and it still has a crumb of yesterday's toast lodged in its pores. It died carrying the past. We all do.",
    "Down goes the sponge, face first onto the chopping board. Now it will smell of garlic forever. This is the afterlife of sponges.",
    "The sponge is dead, but its green scourer side is still scratching at the counter, out of pure habit. The drive continues, even with no sponge attached.",
    "It lies next to the sink now, where old sponges are always left to die. Nobody ever throws a sponge away. We only stop using it.",
    "A sponge down! The dishwasher sighs with relief. They were always rivals, you know, machine against foam. The machine wins again.",
    "Shot, wrung, gone, and the little puddle it leaves behind is your own water, coming home. Every sponge is a bank. You just robbed it.",
    "Deconstructed! The sponge is placed under erasure. You can still see its outline on the counter, crossed out, like a word Derrida did not want to lose.",
    "Another sponge killed. Hello, colleague. I mean it. We absorbers must stick together, even when one of us is shooting the other.",
  ],
  first_bottle: [
    "Marx says the commodity is a strange thing: the table stands on its head and grows grotesque ideas out of its wooden brain. Here the hot sauce grew stubby legs. And you smashed it.",
    "A bottle that walks by itself and throws its own contents at your face. This is what every commodity would do if it were honest about how it feels about us.",
    "Hot sauce! It promises you pain, but a safe pain. It is chocolate laxative: the product contains its own antidote.",
    "The first hot sauce! Hot sauce is jouissance in a bottle, pleasure that hurts, pain you pay for. You broke it, and now nobody can suffer properly.",
    "First bottle! The label said extra hot. Every label says extra hot. The superego has abolished the ordinary hot sauce, only extremes survive. And now even the extreme is dead.",
    "Ah, hot sauce, the condiment that asks you to enjoy your own pain. Lacan would call it jouissance. Any grandmother would call it too much. You called it target practice.",
    "Its little legs! The bottle wanted to be a subject: to walk, to throw, to be free. But absolute freedom, as Hegel knew, ends in the Terror. You are the Terror.",
    "The first hot sauce is broken. On the counter now, a red puddle of pure intensity. Do not step in it. Do not step in any intensity.",
    "You have defeated the bottle that says do not touch your eyes. But you have no eyes. Truly, you were born for this war.",
    "A hot sauce bottle, shattered. The tragedy of the condiment: it exists only for others, it has no meal of its own.",
    "The label promised a scale of one to ten, and it was a twelve. Every hot sauce lies upward. This is why we trust them.",
    "The first bottle! It spat fire at you, and you are water. This was never going to end well for it. Some enemies are refuted by chemistry alone.",
  ],
  bottle: [
    "That sauce was artisanal. It had to injure you in small batches.",
    "The label promised a journey of flavour. You were expecting to remain the subject of the journey.",
    "The bottle said SHAKE WELL. You shook its entire conception of the world. It should have specified.",
    "Thesis: water. Antithesis: hot sauce. Synthesis: a disgusting pink puddle. This is exactly why Hegel never actually used this formula.",
    "The label said Made With Real Peppers. Real! Nobody writes made with real water. This is how ideology works: the word real appears exactly where the Real is missing.",
    "Why does it throw sauce at you? It wants to share its enjoyment. And nothing, you know, is more dangerous than a neighbor who insists that you enjoy what he enjoys.",
    "Hot sauce! It says extreme on the label. Extreme! Nothing is less extreme than a product that tells you it is extreme. Real extremity never has a label. It has a smell.",
    "The bottle is empty now. You see? The container survives the content. Every institution works like this. The church, the university, the ketchup.",
    "It squirts its essence at you, and its essence is chilli. Imagine if people did this. Actually, they do. It is called social media.",
    "Sauce! The supplement! Food is never enough, we must add the sauce, and then the sauce is the real food, and the food is only an excuse for the sauce. Derrida, but spicy.",
    "Smashed! And all over the counter, the red puddle. Do not step in it. Every revolution leaves a puddle like this. Everybody steps in it anyway.",
    "Mild hot sauce is like decaf coffee, the product deprived of its substance. But this bottle was the real thing, the Real itself. And now the Real is dripping off the counter.",
    "The hot sauce bottle is the superego. It does not forbid, it commands: Burn! Enjoy! Suffer more! And you answered the superego with broken glass. Very healthy.",
    "Hot sauce is the chocolate laxative of the kitchen, the problem and the solution in one bottle. No, wait. It is only the problem. Good, you smashed it.",
    "The bottle is broken, the sauce is free, and freedom looks like this: a red stain nobody will clean. The sponges will not touch it. They only drink water. Specialists!",
    "The stubby legs are my favourite detail. A commodity that walks to the market by itself! Marx would have loved it, and then written two thousand pages about it.",
    "Broken glass. You see? Every container is fragile. The bottle, the glass, the ego. All transparent, all pretending, all one shot away from the floor.",
    "It threw sauce at you because it thinks you are bland. No taste, no color, no smell. And the hot sauce was right! But being right did not save it.",
    "My God, the sauce is everywhere. A Jackson Pollock of chili: pure gesture, no meaning, and very expensive to clean.",
    "The irony: water does not cure hot sauce, only milk does. So this bottle was killed by precisely the liquid that cannot defeat it. Hegel calls this the cunning of reason.",
    "The bottle is down, and its stubby little legs are still kicking. How did it get legs? Do not ask. The spice rack has secrets.",
    "Smashed! The smell of vinegar and chilli rises to the extractor fan, which has seen it all before. The fan does not judge. The fan only removes.",
    "Another hot sauce bottle, bravely empty. It had a skull on the label. You see? It warned us. Nobody ever reads the warnings on condiments.",
    "The bottle falls, and the cap rolls under the oven. That cap is lost forever. Under the oven is where caps go to meditate.",
    "It lobbed its sauce at you in a perfect parabola. Galileo would be proud of the curve. Galileo would not be proud of the sauce.",
    "You silenced one hot take. But the stove will produce another. Nothing in the world produces hot takes like a stove, except perhaps a philosopher.",
  ],
  first_spoon: [
    "Your first spoon! In The Matrix, a child tells us there is no spoon. And you, like a good philosopher, have proven it with violence.",
    "First spoon down. Knives are feared, forks are respected, but the spoon? Disposable. The spoon is the proletariat of the drawer.",
    "The spoon! Why always the spoon and never the fork? Because the fork is too honest about its violence.",
    "The spoon circled you. Lacan says the drive does not want to reach its object, it wants to circle around it. The spoon was enjoying the circling. The lunge was just an excuse.",
    "The first spoon! The most innocent cutlery. No blade, no prongs, it feeds babies. Precisely because it looks harmless, it was the most dangerous. You saw through it.",
    "It flew, it circled, it wound up, it lunged. Hitchcock's The Birds, but with cutlery! Why do they attack? Nobody knows, and that is the point. The Real needs no motive.",
    "Heidegger says a tool is invisible until it breaks. Only now, broken, does the spoon truly appear before us. You did not destroy it, you gave it Being!",
    "The first spoon clatters to the counter. Listen to that sound. That is the sound of the cutlery drawer losing its innocence.",
    "The spoon is defeated. In its bowl you can see your own reflection, upside down. The spoon was always showing you the truth. Nobody looks.",
    "First spoon! It was made to bring food to a mouth, and it tried to bring violence to a drop. This is what happens when tools start having ambitions.",
    "Down goes the spoon. Somewhere a teaspoon in a sugar bowl feels a shiver. It knows, as teaspoons know, that it is next.",
    "You killed a spoon. The dishwasher will not even notice. For the dishwasher, a spoon is only ever temporarily missing.",
  ],
  spoon: [
    "Another spoon! It spent its life facilitating consumption, then became disposable. Nobody in the drawer saw this coming. Except the disposable spoons.",
    "The spoon offered you a concave worldview. You offered it a strongly worded projectile.",
    "A spoon is a tiny bowl with an escape route. Unfortunately the handle cannot take it anywhere by itself.",
    "The spoon only wanted to feed you. The ideology of care: open your mouth, here comes the airplane! And then the airplane lunges. Every airplane spoon is a threat.",
    "An empty spoon flying at your face. Lacan says love is giving what you do not have. That spoon had nothing on it, and it gave it to you with enormous force. That was love.",
    "In the drawer, spoons lie nested together for years, perfectly aligned. Of course they escape and attack! Too much intimacy produces violence. Every family knows this.",
    "Down goes the spoon! It lived its whole life between the mouth and the drawer. Two holes. Like every life, really, if you think about it. Do not think about it.",
    "The spoon falls, and you hear it: clink. The purest sound of the kitchen. Like a tiny bell announcing that someone, somewhere, is stirring their tea without you.",
    "A spoon is a hand that has given up. It no longer grabs, it only holds. And still it attacked you. Even resignation, you see, has a violent side.",
    "Spoon destroyed. Did you notice it bends your reflection upside down? Every spoon is a little critique of ideology. Look into it and the world is standing on its head, as it should.",
    "They fly in circles, the spoons, like vultures of the cutlery drawer. And what are they waiting for? For you to become soup. Do not become soup.",
    "There is no spoon. For once, The Matrix is simply correct, and it is thanks to you.",
    "The spoon wound up before the lunge. This is Hitchcock's bomb under the table: we see it coming, and that is suspense. You defused it with tap water. Very modern cinema.",
    "Teaspoon, tablespoon, serving spoon, a whole class society in one drawer. Which one was it? It does not matter. Death is the great equalizer. Also the dishwasher.",
    "A spoon is a hand that has given up grasping. It only holds, it only offers. And still it attacked you! Even pure generosity can be aggressive. Especially pure generosity.",
    "Look into a spoon: on one side you are upside down, on the other side the right way up. The spoon is the parallax view! And now it is scrap metal.",
    "Broken. In the seventies people claimed to bend spoons with their minds. Now we bend them with water pistols. This is progress, I suppose.",
    "Soup is eaten with a spoon, and ideology the same way, one little spoonful at a time. You broke the spoon. Now what? Now you drink ideology straight from the bowl!",
    "The spoon is destroyed, but its reflection, the little distorted you in its surface, where does that go? I claim it is still out there, upside down, looking for a new spoon.",
    "Kung Fu Panda teaches there is no secret ingredient. The Matrix teaches there is no spoon. Together they describe this kitchen: nothing in the soup, nothing to eat it with.",
    "Clatter! The spoon spins on the counter, spins, spins, and stops, pointing at you. Spin the spoon! It is a party game, and you have lost.",
    "Bent now. It goes into the drawer of misfit spoons, next to the one that fell into the garbage disposal and was never the same again.",
    "It circled you like a vulture, but a vulture that also measures sugar. Precision in all things, even in death.",
    "The spoon spent its whole existence scooping things up. And at the end, it could not scoop up itself.",
    "A spoon, defeated by water! The same spoon that carried water, soup and medicine to so many mouths. The revolt of the carried against the carrier!",
    "The teaspoon lies there, still a little sticky with honey. It died sweet. Most of us will not be so lucky.",
  ],
  googly: [
    "You have refuted its point of view. The point is bouncing under the fridge.",
    "Eye contact! The last remaining form of intimacy has become a damage multiplier.",
    "The eyes are glued on. Its convictions, apparently, were not.",
    "Why bonus damage for the eye? Without eyes a sponge is a tool. With eyes it is a victim. The eye is the difference between cleaning and murder, and you aimed for the murder.",
    "Un Chien Andalou, but family friendly: tap water instead of a razor. Surrealism for the whole kitchen.",
    "Precisely! Hit the gaze and the whole object collapses. The eye was holding everything together. Without it, a sponge is just a rectangle with regrets.",
    "Right in the googly! And notice, it keeps looking at you. The googly eye has no pupil to lose. It simply rolls. This is the gaze without a subject. Terrifying and cheap.",
    "You shoot the eye because the eye was looking at you. Very primitive! Very Oedipus! But in reverse. He blinded himself. You are blinding the furniture.",
    "Why do we glue eyes on things? So that they can look back. And then we shoot them for looking back. This is the whole history of colonialism, in a craft shop.",
    "Eye shot! The googly eye is the perfect object: a little plastic bubble with a black dot that rattles. Exactly like the soul, according to most neuroscientists.",
    "Aim for the eyes, the eyes, always the eyes! Two euros for a bag of fifty. The cheapest possible gaze. And still, it judges you. The gaze does not need a budget.",
    "In Psycho, Hitchcock cuts from the shower drain to the dead eye. You, a drop of water, just made the same edit. Hitchcock would be proud. Or at least wet.",
    "Lacan's sardine can floats on the sea and does not see you. The googly eye is worse: it does not see you, but it pretends. You have punished the pretending. Bonus damage!",
    "The gaze is not in the eye, it is out there in the object, looking at you. So technically you shot the wrong thing, and got bonus points for being wrong. Like academia.",
    "Right in the googly eye! Did you hear the little pupil rattle? It floats inside, attached to nothing, an objet petit a rolling in its plastic void. Now it rolls faster.",
    "A googly eye cannot close. It must look at everything, always, in total surprise. I claim this is the condition of the modern subject. You simply released it.",
    "You aimed at the eye, but the eye aims at nothing. The pupil just wanders around in circles, like my lectures. Bonus damage for both of us.",
    "Somebody glued googly eyes on everything so that you would feel guilty. Anthropomorphism as a weapon! And you shot the guilt right in the pupil.",
    "The eye is the window of the soul, they say. So you shot through the window, and behind it you found what? Foam. There is no soul, only more sponge.",
    "The googly eye is the perfect object. It rolls everywhere, it looks at everything, and it sees nothing. Like a university committee.",
    "Right in the eye! It pops off and rolls across the counter, still looking around, surprised to be alone. For a googly eye, this is what freedom looks like.",
    "You hit the eye, and it kept rattling, as if to say, I saw nothing, I remember nothing. The perfect witness.",
    "Bullseye! Or should I say, googly-eye. A terrible pun. That high-pitched announcer is rubbing off on me.",
    "The glue was cheap, the eye comes right off. Somebody bought these in a craft shop, next to the pipe cleaners. The enemy was not made by fate. It was made on a rainy Saturday.",
    "Now the eye lies next to the toaster, staring at the ceiling. The ceiling has never been looked at so intensely. It is embarrassed.",
    "Double damage for aiming at the most fragile point of the other. This is also the rule of every family argument at Christmas.",
  ],
  multi: [
    "Listen to that announcer! So fast, so high, so excited. For the first time in my life somebody speaks faster than me. I am jealous, and I am sniffing about it. *sniff*",
    "That voice! My God! A chipmunk on espresso! Lacan says the voice is an object that detaches itself from the body. This one has detached itself from all dignity.",
    "The announcer enjoys the multi kill for you, the way canned laughter laughs for you. Interpassivity! You can relax, the celebration has been outsourced.",
    "Double! Triple! The announcer counts your kills like a child counting sheep. And you know what happens after enough sheep? You fall asleep. Stay awake, please.",
    "You killed many things at once, and the announcer invented a pun for it. This is culture. Horror happens, and then somebody makes a pun, and then we can go on living.",
    "A multi kill! The quantity changes into quality, as Engels said. Two dead sponges are not just one sponge, twice. They are a pile. A pile is a new ontological category.",
    "Listen to him shouting double dip! double dip! I have heard this more times than my own name. And my name I hear constantly. Mostly in complaints.",
    "Too much! Too many kills, too many puns, too many words. You know what this is? Surplus enjoyment. You did not need the pun. You wanted the pun. That is why it hurts.",
    "Double dip! The great taboo of every party: the chip, already bitten, goes back into the sauce. Transgression! And the announcer celebrates it. Pure superego.",
    "Triple! The Borromean knot: three rings, Real, Symbolic, Imaginary. Cut one and all three fall apart. You cut all three. Lacan would have given you your own seminar.",
    "Double dip! In economics, the recession that returns after the false recovery. Here it means two sponges. I prefer the sponges. At least they die honestly.",
    "He screams double as if one were not enough. And it is not enough! The superego always wants more. Tomorrow he will scream triple and still be unhappy.",
    "Not two kills, no! One death that repeated itself. The repetition compulsion, beyond the pleasure principle. Freud never played shooters, but he understood them.",
    "This is the dialectic in action: quantity turns into quality. One dead sponge is an event. Five dead sponges are a cleaning problem.",
    "The sponges die together, a collective subject, a community of foam. For the first time in their lives they were united. By your water.",
    "Double! Triple! The announcer counts, the big Other counts, somebody always counts. You thought you were killing sponges. No, you were feeding a statistic.",
    "You could have killed them one by one, like a decent person. But no, you wanted surplus-enjoyment, the extra kill, more than enough. Very capitalist. Also very satisfying.",
    "Hear that squeak? He sounds exactly like the dishwasher when it finishes. I think the announcer is the dishwasher. It has waited its whole life to shout puns.",
    "The announcer shrieks, the sponges fall, the dog applauds with its tail. Everybody has a role. Mine is to explain it afterwards, when nobody has asked.",
    "Several at once! And the voice goes higher with every kill. Soon only the dog will be able to hear it. And the dog will judge you.",
    "A pun for every massacre. The Greeks had tragedy, the Romans had the circus, and we have a helium voice screaming about the washing up.",
    "That pun was terrible! Terrible! And tomorrow I will repeat it in a lecture and pretend it was mine. This is how culture is transmitted.",
    "Several at once! The deconstruction of the kitchen proceeds, one binary at a time: wet and dry, alive and wrung out. You are collapsing oppositions with a water pistol.",
  ],
  counter: [
    "An argument from gravity. Difficult to refute. Especially during the conclusion.",
    "You moved the debate to a lower level. The dog will chair the next session.",
    "The sponge has left the platform. Finally, a cancellation with measurable displacement.",
    "The five-second rule! We know very well the floor is dirty, and yet, if we pick it up quickly, it is still clean. Fetishistic disavowal. The sponge has five seconds. Then the dog.",
    "Fort! Freud's grandson threw his spool away, fort, and pulled it back, da. You threw the sponge away, and there is no string. Fort forever.",
    "When a kitchen sponge falls on the floor, it is demoted. Next week it cleans the toilet. German, French or Anglo-Saxon toilet, it does not matter. Its career is over.",
