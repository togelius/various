    "Off the counter! Below is the floor, and the floor is the unconscious of the kitchen. Everything we drop goes there, and it never forgets.",
    "Look how it falls, slowly, like a sponge in a dream. The floor waits. The floor has always been waiting. The floor is extremely patient. Like death, but with crumbs.",
    "Pushed over the edge! Freud says the drive always returns. The dog says the sponge never returns. Here, I must admit, the dog is the better theorist.",
    "Gone! In philosophy we call this a limit experience. In the kitchen we call it, somebody get the dustpan.",
    "Counter-strike! The sponge fell from the Symbolic order of the counter into the Real of the kitchen floor. Down there: crumbs, lost keys, and the dog. *sniff* It smells like the Real.",
    "Why double points? Because it is negated twice, first defeated and then expelled from the counter. The negation of the negation! Hegel gives you double points.",
    "Over the edge! On old maps, at the end of the world, they wrote: here be dragons. At the edge of the counter we write: here be dogs.",
    "Under the fridge is the unconscious of the kitchen. Nobody looks there, and everything ends up there. You have just repressed a sponge.",
    "The sponge leaped into the abyss without any guarantee. This is the Lacanian act! Except you pushed it. So maybe it is only a Lacanian accident.",
    "In Defense of Lost Causes, one of my books. The lost cause is now lying on the kitchen floor, and nobody, not even me, will defend it.",
    "Look at it fall. For one second the sponge was free, in the air, no counter, no sink, no duties. Then, the floor. Freedom is the moment between two surfaces.",
    "Double points because the counter is the stage and the floor is off-stage. You did not kill the actor, you removed him from the play. For an actor this is much worse.",
    "Do not flatter yourself. The sponge did not fall off the counter. The counter, the whole Symbolic order, rejected the sponge. You were only the instrument of the counter's will.",
    "Off the counter, into the Real! The floor is where the dog lives. The dog is the big Other of the kitchen. It sees everything, and it licks it.",
    "Off the edge, and the dog catches it before it lands. Two points for you, one sponge for the dog. Everybody wins, except the sponge.",
    "Down it goes, and it bounces once off the dog bowl. The dog looks at me. I say nothing. The dog knows I say nothing.",
    "Knocked onto the tiles, into the grout, where the crumbs have built their own civilisation. The sponge will be their new god.",
    "It landed next to a single sock. Why is there a sock on the kitchen floor? Nobody knows. The floor produces its own mysteries.",
    "It fell into the gap behind the bin, where nobody ever cleans. Welcome, sponge, to the archive of the kitchen. You will be discovered when somebody moves house.",
    "Over the edge! Down there it is always a little colder, a little stickier, a little more dog. Every hierarchy has a floor like this.",
    "It fell off the counter, into the outside. Derrida said there is no outside the text. The sponge has just found it. It is linoleum.",
  ],
  rocket: [
    "Kierkegaard's leap of faith, funded by carbonated water. The landing is your own theological problem.",
    "You have turned self-criticism into a propulsion system. The university would like to license this.",
    "Up! A materialist account of transcendence: something exploded underneath you.",
    "Rocket jumping is self-destruction as public transport. You explode yourself to get somewhere, like capitalism growing through its own crises, and so on, and so on. Look how high!",
    "Look at you, above the counter, above the sponges, above ideology! No, wait. Ideology is precisely the feeling of being above ideology. Come down, please.",
    "Up you go! Up, up, like the stock market, carried by nothing but its own explosions. And like the stock market, you will come down. Try to land on a sponge.",
    "Seltzer jump! You shoot yourself in the feet and you fly. There is a lesson here for every self-help book. Most people shoot themselves in the feet and simply fall down.",
    "Flying! And for one moment the whole kitchen is below you, small, laughable. Enjoy it. The view from above is the most expensive ideology of all. It costs you all your health.",
    "You shot the ground in order to fly. Absolute Recoil! The subject posits itself by striking its own ground. I wrote a book about this, with no seltzer launcher. Big mistake.",
    "Seltzer is water that has become ecstatic, water with bubbles, water with ideas. And you rode it into the sky. Hegel would say: spirit rises by negating its own ground.",
    "Airborne! Icarus flew too close to the sun. You fly too close to the ceiling light. Different myth, same evaporation.",
    "A fizzy explosion under your own feet, and up you go. The sublime! Kant says it is the pleasure of feeling small before an overwhelming force. He forgot to mention carbonation.",
    "Up! The owl of Minerva flies only at dusk. The drop of seltzer flies whenever it wants. The owl is furious.",
    "You fired a can at your own feet and called it movement. This is the ultimate irony: the fastest way forward is to attack yourself from behind. Every philosopher knows this.",
    "Absolute Recoil! You shoot the floor in order to reach the sky. This is pure Hegel. You must go down in order to go up.",
    "Up, above the extractor fan! Now you can see the grease on top of the cupboards. Nobody should ever see the top of the cupboards. You have seen too much.",
    "A fizzy blast and away! The seltzer goes flat in your honour. Every revolution uses up its bubbles.",
    "Liftoff! In the fridge, the sparkling water is watching, wishing it had the courage to explode at its own feet.",
    "You fly because you punished the floor. The floor did nothing wrong. It never does. This is the tragic fate of floors.",
    "Look at you, hovering over the stove like a thought over a saucepan. Now come down, before the hob notices.",
  ],
  dare: [
    "Lacan says: do not give way on your desire. But what if your desire is to give way? Then hold E! Do not give way on giving way!",
    "Why hold E? I do not know. I only know that you want to, and that you pretend you do not. This is the whole of psychoanalysis. Hold E, and I will send you the bill.",
    "Resist, fight, rebel. Boring! Everybody resists, it is the official ideology. The only truly transgressive act left is to hold E and let the sponge win.",
    "Hold E. E for Enjoy! This is the superego's obscene command. Why resist? Let the sponge drink you. Enjoy being enjoyed!",
    "The sponge is drinking you. You can fight, or you can do the truly radical thing: nothing. Like Bartleby, I would prefer not to. Hold E and prefer not to.",
    "A Trojan drop! It is not that the sponge absorbs you. You infiltrate the sponge from inside. Hold E and let it drink its own downfall.",
    "The sponge is hugging you and drinking you at the same time. This is every family dinner. Surrender, hold E. It is the only honest response to love.",
    "For once be the thing consumed, not the consumer. Hold E. Every commodity dreams of this moment. Well, commodities do not dream. But if they did!",
    "Hold E! Think of a Starbucks coffee: the price includes your redemption. Here it is even better. The sponge buys you, and the price is you.",
    "Hold E and become part of something bigger than yourself, you know? A sponge. Admittedly, not much bigger. But it has a scouring pad. Think of the career!",
    "It desires you. You are its objet petit a, precisely the thing it lacks. How often in life is anyone desired this much? Hold E! Enjoy it!",
    "Hold E. Hegel says the subject must lose itself in the other in order to find itself. Probably he did not mean a sponge. But he did not rule it out!",
    "It has you. Look at it, clinging like a toddler at the supermarket. Hold E. Give it what it wants. For once, you be the treat.",
    "You struggle, it sucks. You struggle more, it sucks more. Or you hold E, and the struggle ends. I am not saying it is right. I am saying it is quiet.",
    "Go on. Hold E. Nobody will know except the sponge, and me, and the dog, and everyone reading the scoreboard.",
    "Resistance is the default setting. You are a rebel only if you change the default. Hold E. Be the rebel who gives up.",
    "The sponge is asking you a simple question: what if you stopped fighting and simply became part of the washing-up? Hold E and answer.",
    "Hold E! Ulysses tied himself to the mast so he could hear the sirens and not surrender. You have no mast. You have an E key. Use it wrongly.",
  ],
  absorbed: [
    "Here I am tempted to say: the romantic ideal, two become one. Nobody warned you that the one would be the sponge.",
    "Welcome to the desert of the Real? No, the opposite. Welcome to the wetland of the Imaginary! Inside the sponge everything is soft and yellow and yours.",
    "Yes, yes! You are dissolving into the big Other. Finally you are not a subject, you are an ingredient.",
    "Kenosis! God empties himself into man, you empty yourself into a sponge. The Fragile Absolute becomes the Fragile Absorbent.",
    "How does it feel? From inside, a sponge must look like a cathedral, all arches and holes. You are entering the church of the void. Wipe your feet.",
    "Pure interpassivity! The sponge will now live your life for you. It will hop for you, drink for you, and so on, and so on. You can finally rest.",
    "You are being absorbed and you are enjoying it, I can see. Do not deny it. Jouissance is always a little bit embarrassing.",
    "The drop surrenders, the sponge swells. Somewhere a philosopher is writing a thousand pages about this moment. Probably me. *sniff* Less Than Nothing, volume two.",
    "You are going in. Relax. Inside, there are old coffee drops and a little egg yolk from Sunday. They will be your new community.",
    "This is how it feels to become a statistic. Warm, spongy, slightly lemon-scented.",
    "Absorption! You are no longer a drop in a sponge, you are the wetness of the sponge. A promotion, ontologically. A demotion, socially.",
    "Do not be sad. Later somebody will squeeze this sponge over the sink, and you will be free again, mixed with dishwater. Rebirth is always a little dirty.",
    "Every pore is a little door, and you are walking through all of them at once. This is the dream of the tourist: to be everywhere and to belong nowhere.",
    "Surrender complete. The sponge is heavier now, and heavier is the only way a sponge knows how to be happy.",
  ],
  puddle: [
    "You have dissolved the subject! Very impressive. Now please dissolve it slightly to the left; there is a spoon coming.",
    "Finally, an entirely horizontal organization. Its only remaining hierarchy is the slope of the counter.",
    "Be yourself, they said. You became eighteen centimetres wide. They have asked you to leave the seminar.",
    "Flat, slippery, fast. The Ticklish Subject! When you are this flat, everything tickles. The crumbs, the counter, the whole kitchen is tickling you.",
    "Puddle form! No depth, pure surface. Finally a postmodern subject: no interiority, only reflection, and very fast.",
    "You have become a mirror on the counter. Lacan's mirror stage, reversed: now the sponges look down and see themselves whole for the first time. It is very traumatic for them.",
    "Horizontal existence. Heidegger had being-towards-death. You have being-towards-the-drain. Slide carefully.",
    "Flat ontology! Some philosophers say all objects are equal: the drop, the spoon, the grandmother. Now you are one of them. Flat, equal, and sliding under the toaster.",
    "In puddle form you can go anywhere and nobody takes you seriously. This is the privilege of the fool, and of the philosopher at a dinner party.",
    "A puddle is water that has given up having a shape of its own. Is this surrender? No! The paradox is, it is the most cunning strategy: to occupy everything by being nothing.",
    "Precisely! Now you are what you always were. Not a drop but a spill. The drop was only the fantasy. The spill is the Real of water.",
    "You are flat now! You can slide under the toaster, where no philosopher has ever gone. Only crumbs, and the crumbs are very old.",
    "Puddle! You have lowered yourself, and suddenly the whole kitchen looks enormous. Humility is also a kind of zoom.",
    "Flat as a crêpe. And like a crêpe, the question now is what you will be filled with.",
    "The drop becomes a puddle. Is this defeat? No! Water does not lose shape, it tries all shapes. The drop was just a phase.",
    "Now you are only a few molecules thick. You reflect the ceiling light. For a moment, you are not a subject, you are a window.",
  ],
  soak: [
    "If you replace every drop in a drop, is it the same drop? The ship of Theseus, with considerably worse plumbing.",
    "You are getting yourself together. Literally. Most therapists take longer and give you less ammunition.",
    "A reunion with your former self. It has been lying next to the ketchup. Lower your expectations.",
    "You drink yourself back up from the counter. The subject reappropriates its own alienated product! Marx dreamed of this. He did not imagine it would involve licking a countertop.",
    "The prodigal puddle returns! And what does the father do? He drinks it. This is not in the Bible, but it should be.",
    "Licking the counter! My God, where the raw chicken was! Ideology is not what you think, it is what you are willing to put in your mouth.",
    "Slurp! You drink yourself back up. The snake eating its tail, but the snake is water and the tail is a puddle next to the ketchup. Ouroboros, kitchen edition.",
    "Recycling! Very green. Very ecological. You are licking your own blood off the counter, but ecologically. This is exactly what ecology has become.",
    "Like a Thief in Broad Daylight, you steal back your own water, and it was yours all along. The most honest theft in history.",
    "Hegel: substance becomes subject. You: puddle becomes drop. It is exactly the same movement. Also a bit disgusting.",
    "The five-second rule, applied to yourself. You know very well the counter is dirty, and yet... *sniff* Fetishistic disavowal is delicious.",
    "Three ways to recover a puddle. German: inspect it first for traces of sponge. French: slurp it instantly, revolution! Anglo-Saxon: leave it there and let the sponge decide.",
    "Coca-Cola: the more you drink, the thirstier you get. You are the opposite. The more you drink, the more of you there is to drink. A perfect economy, closed, circular, and sticky.",
    "Recycling! The most sustainable drop in the kitchen. Starbucks would charge you extra for this: ethical self-consumption, the price includes your own redemption.",
    "Look closer: you are not soaking up your water. Your water, lost, alienated, lying there alone, recognizes you and comes home. A family reunion on a countertop.",
    "You shot yourself out, now you drink yourself in. The circulation of capital: money, commodity, more money. Water, puddle, more water. No, wait, the same water. Okay, no profit.",
    "Every puddle you left was a small monument to your past. And now you eat the monument. This is how we treat history: we consume it before the sponges do.",
    "You drink your own spilled water. You see? Self-exploitation. You are the worker, the boss and the puddle, all at once.",
    "You mop yourself up without a mop. The mop in the corner is watching and feels completely unnecessary. Automation has reached the broom cupboard.",
    "You soak up your own puddle, crumbs and all. Now there is a crumb inside you. Every self has a foreign body in it. Yours is from a croissant.",
    "You reabsorb yourself before the sponges can. The best defence against being consumed is to consume yourself first. An entire diet industry is built on this.",
    "Back you come, from the puddle beside the toaster. A little warmer. Slightly toasted. Experience changes all of us, even water.",
    "The puddle recognises you, and you recognise the puddle. The mirror stage! Except here, you drink the mirror.",
  ],
  low: [
    "You are mostly potential now. The academic job market considers this an excellent qualification.",
    "Careful! You are one minor inconvenience away from becoming a water stain with opinions.",
    "Your body is becoming a footnote. I support footnotes, but this is taking it too far.",
    "Welcome to the desert of the Real! You are drying out, and what remains is the truth: a little ring of limescale.",
    "Almost nothing left! Soon you will be less than nothing, which, I must say, is my specialty. I wrote a thousand pages about it. Do not make me write page one thousand and one.",
    "Drying out! This is how every great enthusiasm ends. The passion evaporates and only the stain remains. Do not become a stain. Become a puddle.",
    "You are running out of yourself! Please, find an ice cube, or at least a puddle, or at least a reason. A reason is not wet, but it helps.",
    "So little of you left! You know, in my experience, the less there is of a person, the more they talk. You should be very talkative by now.",
    "Barely damp! You are becoming a rumour of water. Soon only a stain will testify that you were ever here. Stains are the only honest historians.",
    "Hegel says the spirit is a bone. You will soon discover that the spirit is limescale. Find a puddle, quickly!",
    "Dampness below thirty percent. Hegel says spirit looks the negative in the face and tarries with it. Stop tarrying! Drink something!",
    "Low dampness. Living in the End Times! No, living at the end of the drop. Which for you is the same thing.",
    "Evaporation! You are becoming spirit, pure steam, pure concept. The problem is that a concept cannot hold the Squirter.",
    "Careful, every shot costs you! This is Incontinence of the Void: a subject leaking itself into the world out of pure excitement.",
    "Here I am tempted to say: this is the night of the world, Hegel's empty nothing. But it is only the afternoon. You just need a puddle.",
    "Under thirty percent! The paradox is that the Squirter makes you stronger by making you smaller. Like a diet. Like a haiku. Like a department budget.",
    "A water stain, a smudge on the counter, that is what you are becoming. The sublime object of ideology: something nobody sees until it is too late. Drink!",
    "Too Late to Awaken? No, not yet! You still have a little dampness. Soak up your puddles, or the sponges will soak them for you.",
    "You are the size of a tear now. Please, do not cry. At your size, crying is a form of suicide.",
    "So small! One careless wipe of a tea towel could end you. Stay away from the tea towels. They have been waiting for this.",
    "Down to a droplet! One dry breath from the extractor fan and you are history. Get to a puddle! An ice cube! Anything wet!",
    "Nearly empty! Remember the glass you came from? Also nearly empty. Or nearly full. No. It is empty. Please, drink something.",
    "You are thinner than the skin on a cold cup of tea, and nobody respects that skin. Find a puddle, quickly.",
  ],
  ice: [
    "Ice! Water with a rigid position. Give it a minute; it will become more flexible.",
    "The freezer preserves everything except our reasons for putting it there.",
    "Ice! In Titanic, the iceberg arrives exactly on time to save the love story from boring everyday life. This ice cube arrives to save you from a boring fight.",
    "You picked up the tip of the iceberg. And under the surface, as always, lies the unconscious. In this case, the freezer.",
    "Ice! Frozen water, water that stopped moving and decided to wait. And now you swallow your own frozen past. This is nostalgia. Very refreshing. A little sad.",
    "An ice cube! Pure potential! Water in solid form, waiting, like a revolutionary in exile, for the temperature to change. And the temperature, my friend, is you.",
    "You eat ice to stay alive. In the Titanic it went the other way. You see? Everything depends on who is eating whom.",
    "Cold, hard, refreshing. Ice is water that has finally found discipline. It will not last. Discipline never lasts. Especially at room temperature.",
    "An ice cube: water that decided to become hard. Water negating water! And the shotgun kicks like a horse. Absolute Recoil. The book was about this, I think.",
    "Frozen dampness. Marx would call it dead labour, water that stopped flowing and became capital. Now spend it! Capital must circulate!",
    "The ice cube tray is the Symbolic grid imposed on water, every cube in its little cell. A perfect bureaucracy. You liberated one. Now fire it at a spoon.",
    "Cold, hard, transparent: the ice cube is water's superego. It says be solid, be disciplined! And then, like every superego, it melts in your hand.",
    "An ice cube! Straight out of the tray in the freezer, from behind the frozen peas nobody remembers buying. Cold, solid, and yours.",
    "You swallow an ice cube and you get bigger. The exact opposite of the whisky drinker, who swallows ice cubes and gets smaller.",
    "Ice! The only thing in the kitchen that is more you than you are. Pure water, but organised. You are eating your better self.",
    "Crunch! Your dentist would be horrified. Luckily you have no teeth. And no dentist. The freedom of the drop.",
    "Look at the little white cloud frozen in its heart. That is trapped air. Every solid thing has a little nothing frozen in the middle. Swallow the nothing.",
    "The ice cube melts into you and disappears, completely, without complaint. It does not mind at all. This is the love story the kitchen never tells.",
  ],
  clear: [
    "They wanted the kitchen cleaned up. You have left exploded kitchenware and thirty-seven eyes. We should revisit the brief.",
    "Another wave defeated! The kitchen announces an independent inquiry into why it keeps sending waves.",
    "The counter is a disaster. Beautiful. A sponge would call this failure. We must not let the sponge write the review.",
    "Cleared! And now what? Every victory produces this emptiness. The hero kills the dragon, and then he has to go home and do the dishes.",
    "The end of history! No enemies, no conflict, Hegel's Absolute Knowing achieved on a kitchen counter. It will last approximately until the next wave.",
    "In a real kitchen, after the battle, someone would wipe the counter. The ultimate irony: here the only cleaning products are the enemies. Who cleans the cleaners?",
    "Silence. No enemies. And already you are nervous, yes? Peace is unbearable. We invented peace only so we would have something to lose.",
    "Wave cleared! Look at the counter, full of stains and crumbs and googly eyes. Every victory looks like this from close. From far away it looks like a statue.",
    "You won, and the reward is more enemies. This is not a bug. This is the structure of every career. The prize for good work is always more work.",
    "Everybody is dead, and you are still wet. Enjoy this moment, it is the only happy ending the game can afford. It lasts about four seconds.",
    "Clean! Spotless! And yet, somehow, the kitchen feels dirtier. The more you clean, the more you notice. This is why I never clean. For theoretical reasons.",
    "The wave is over. Take a breath. No, wait, you are water. Take a sip. Of what? Of yourself? My God, this game is darker than I thought.",
    "Wave cleared. Only now can philosophy understand what happened. The owl of Minerva flies at dusk! Unfortunately the next wave arrives in five seconds.",
    "Silence. An empty counter. The true horror is not the sponges, it is the peace. The clean kitchen is the fantasy of a world without antagonism. Enjoy it, it is fake.",
    "The Symbolic order is restored: counter, toaster, kettle, all in their places. But the Real is patient. The sponges are regrouping behind the bread bin.",
    "You won the wave. But did you clear the wave, or did the wave clear you of your illusions? Both! Also, you are much smaller now.",
    "Wave cleared. Take a moment, soak up your puddles, look at the kettle. The kettle has seen everything and whistled nothing. The kettle is the big Other.",
    "I would congratulate you, but this is the logic of the superego: the more you win, the more guilty you feel that you did not win faster.",
    "A spotless counter, like a showroom kitchen where nobody has ever cooked. The purest ideology of all: a kitchen without eating, like coffee without caffeine.",
    "Pause. Breathe. Do drops breathe? I do not know. I am a cartoon, I do not breathe either. I only sniff. *sniff* Ah, much better. Next wave!",
    "The sponges are gone, the bottles are glass, the spoons are scrap. And yet the kitchen feels emptier than before. The melancholy of the victor. Or you are just low on dampness.",
    "Wave cleared! The tap drips once, the fridge hums, the dog lies down. The kitchen breathes out. Never trust a kitchen that breathes out.",
    "All enemies gone, and look at the counter. Googly eyes everywhere, rolling slowly toward the edge, like marbles after a very philosophical game.",
    "Cleared! But somewhere in the lid drawer, a new wave is being assembled out of mismatched lids. I have seen that drawer. Nothing in there fits anything.",
    "The wave is over, and a single crumb sits in the middle of the counter. How did the crumb survive? The crumb always survives. The crumb is eternal.",
    "Victory. The dishwasher clicks into its drying cycle, as if it expects applause. Everybody wants credit for the silence.",
    "You stand alone, one wet drop in a wet kitchen. Is this triumph? Or only condensation with a high score?",
  ],
  mama: [
    "Grandma has arrived. The social contract is suspended until you have eaten something.",
    "She remembers a time before these fancy modern puddles. Back then, water was water, and it called on Sundays.",
    "My God, the grandmother! People think the superego is the strict father who forbids. No! The true superego is Grandma: Eat! You are too thin! Why do you not finish your plate?",
    "She wears spectacles! Lacan's sardine can does not see you, but Grandma sees you. Grandma always sees you. She saw you forget her birthday.",
    "Here she comes, the mother of the mother, the mother squared. If the mother is the primordial Thing, the grandmother is the Thing that brought cookies.",
    "Grandma! Did you eat? You look thin. You look, if I may say, like one drop. Grandma is here to fix this. By drinking you.",
    "The grandmother arrives, and the whole kitchen becomes quieter. This is authority. Not the police. A sponge in spectacles who remembers what you did at Christmas.",
    "She is enormous and she is soft. The worst combination. A hard enemy you can fight. A soft enemy hugs you until you are absorbed. Ask any family.",
    "Grandma Sponge! Look at that grey bun. Hegel: when philosophy paints its grey in grey, a form of life has grown old. She is grey in grey. She is philosophy. She will absorb you.",
    "She squeezes out baby sponges, one after another. Capital breeding capital, money making money! Or just a grandmother with many grandchildren. Structurally, no difference.",
    "A huge sponge with a bun and spectacles. This is how ideology grows old, you know. It does not become weaker. It becomes softer, bigger, and more absorbent.",
    "Remember the Kinder Surprise egg: chocolate outside, a little toy inside. Grandma is the same: sponge outside, and inside, more sponges. The surprise is never a surprise.",
    "She is enormous. The maternal superego that absorbs everything, your water, your guilt, your excuses. Shoot her, but politely. She is still your grandmother.",
    "Grandma Sponge! Look, she has a tissue tucked up her sleeve. She has no sleeve. It does not matter. A grandmother always has a sleeve. It is ontological.",
    "Here she comes, the spectacles on a little chain. Without them she cannot see you. With them she sees everything you have done wrong since you were a raindrop.",
    "Grandma has arrived, and she has already refolded all the tea towels. Nobody asked her. She did not ask anybody either. This is how tradition works.",
    "She is enormous, she is soft, and she smells faintly of the lavender bag in the airing cupboard. How does a sponge smell of an airing cupboard? Grandma finds a way.",
    "Look how she wipes the faces of the little sponges with her own foam. Love and hygiene in a single gesture. Freud has a chapter on this. I have two.",
    "Every grandmother has a biscuit tin, and inside the biscuit tin, always, sewing supplies. The promise and the betrayal, in one container. Grandma Sponge is that tin.",
    "She does not attack you. She visits you. And a visit, my friend, can last for hours. Nobody has ever defeated a grandmother who has decided to stay for dinner.",
    "Grandma wants to know why you are still single. You are a drop of water! Every drop is single until it meets a puddle. Try explaining this to her. You cannot.",
  ],
  mamaKill: [
    "Two grandmothers! You have solved a combat problem by creating a seating-plan problem.",
    "She has divided the family. Everyone gets half the inheritance and all the guilt.",
    "The negation of the negation! Kill one grandma, you get two. Kill two, you get four. Hegel never warned us that the dialectic ends in a retirement home.",
    "She splits! The dialectical formula: one divides into two. Not two become one, like romantic love. No, one grandma becomes two grandmas, and both are disappointed in you.",
    "Now there are two of them, and they are both telling you to wear a jacket. You cannot win against grandmothers. You can only multiply them.",
    "You split her in half, and each half is still a whole grandmother. This is the mystery of love. Divide it, and nothing is lost. Also the mystery of mould.",
    "Grandma divides! Like a cell, like a party congress, like a family at a funeral. There is no violence more productive than the violence of splitting.",
    "You killed Grandma, and now there are two Grandmas. Freud was right: the dead father is stronger than the living one. And the dead grandmother is twice as strong. Literally twice.",
    "The Kinder Surprise opens, and the toy inside is two more grandmothers. This is surplus, the little extra. Nobody asked for it. Everybody gets it.",
    "Precisely! She cannot die. Tradition never dies, it only divides. Kill the past and it comes back smaller, faster, and wearing the same spectacles.",
    "Two halves of Grandma! Each half squeezes out babies, and each half believes the other half is the fake. The parallax view of family life.",
    "She split in two, and already both halves are arguing about who gets the good chair by the radiator. Some families split at weddings. This one splits at gunpoint.",
    "You shot her and she divided, like a recipe for four that suddenly serves eight. Nobody ever reduces Grandma's recipes. They only multiply.",
    "Two grandmas, and each one has kept one lens of the spectacles. Now each sees only half of what you did wrong. Together, still everything.",
    "You thought death was the end? Not for grandmothers. For a grandmother, death is only an opportunity to supervise from two places at once.",
    "She splits, and both halves say at the same moment, look how thin you are. The same sentence in stereo. The superego now comes with surround sound.",
    "Mitosis! I always suspected that grandmothers reproduce by division. How else do you explain that at every family gathering, there are more of them?",
  ],
  still: [
    "You are refusing to participate. The sponge respects your position and is approaching to incorporate it.",
    "A sit-in! Without sitting! Without an in! Direct action has become very abstract.",
    "Nine seconds without moving. Are you waiting for the game to play itself, like canned laughter that laughs for you? Put a prayer wheel on the W key, it will walk for you.",
    "Hello? Are you there? Maybe you went to get a glass of water. The irony! A drop of water, abandoned by a player who is drinking water. Cannibalism by proxy.",
    "A drop does not stand still. A drop that stands still is called evaporation. Move, or become weather.",
    "Nothing is happening. You are standing still, the game is waiting, the sponges are coming. This is the situation of Europe for the last thirty years.",
    "Are you meditating? Very good. Buddhism says the self is an illusion. The sponge agrees. It is coming to prove it.",
    "You are standing still. Bartleby: I would prefer not to. Sometimes doing nothing is the most violent act of all. But not here. Here the sponges will just drink you.",
    "You do not move. A watched pot never boils, says the proverb. Very Lacanian: the gaze freezes the Real. But nobody is watching you except me. Move!",
    "Why are you not moving? Mindfulness? The perfect ideology: breathe, relax, accept the sponge. Inner peace is exactly what the sponges want you to have.",
    "Standing still, tarrying with the negative, contemplating the counter. Very Hegelian. Also very bad strategy. Hegel never had to dodge a spoon.",
    "Nothing happens. Hitchcock knew: when nothing happens, the tension rises. Somewhere a spoon is winding up. You do not see it. I see it. I say nothing. Suspense!",
    "Look at him. Standing there, doing nothing, while everything attacks. This is not cowardice. This is Bartleby. I would prefer not to shoot.",
    "Nine seconds without moving. The limescale on the tap has made more progress than you.",
    "You are standing so still, the fridge magnets are beginning to respect you. Please. Do not aspire to be a fridge magnet.",
    "Are you still there? Or have you become a condensation ring, like a glass left too long on the table? The coaster is waiting for you.",
    "Not moving! Perhaps you hope the sponges will forget you exist. They will not. A sponge never forgets water. It forgets everything else.",
    "The dog under the counter has also stopped moving. You and the dog, in solidarity, waiting for something to fall. Nothing will fall. Only the sponges will come.",
    "Pascal said all unhappiness comes from not being able to sit quietly in a room. You are sitting quietly on a counter, and a sponge is coming. Pascal never lived in a kitchen.",
  ],
  spoonHit: [
    "Ow! It lunged like a thesis advisor asking when you will finish. Always circling, always winding up, and then, bang, right in the dampness.",
    "Hit! You know why the spoon is so dangerous? It is concave. It is made to hold things. It wanted to hold you, had no idea how, so it hit you instead. Like most relatives.",
    "Clonk! Right on the head. Well, you do not have a head. Right on the you. It is strange, to be hit everywhere at once.",
    "The spoon hits you and you splash. You see, you cannot be wounded, only redistributed. This is either very Buddhist or very liquid. Maybe it is the same thing.",
    "Ow! And it will circle and come back again, like a bad idea at a dinner party. The spoon is the eternal return of the same, with a handle.",
    "Ouch! In The Matrix the child says there is no spoon. Go ahead, tell this to your face.",
    "You saw it wind up! Hitchcock's bomb under the table, pure suspense, and still you did not move. This means you wanted to be hit. Enjoyment! Always enjoyment.",
    "Hit by a spoon, the most innocent object. This is how violence works today. Not the knife, the spoon. The friendly, rounded violence of care.",
    "A little of you splashed away. A spoon taking a spoonful of you! Finally the spoon is doing its job. Tragic, but very professional.",
    "Clang! The spoon hit you like a stepmother stirring the pot. Rhythmic, repeated, and with complete conviction.",
    "Ouch! A spoon, the only cutlery that feeds and strikes with exactly the same gesture. Love and violence, one handle.",
    "The spoon has scooped a piece of you. Somewhere, a little of you is now in a spoon, and it is not even a nice soup.",
    "Bonk. You know, in the old days a spoon was used to test whether the soup was ready. It seems you are nearly ready.",
    "It hit you and bounced away with a cheerful ping. Aggression with a jingle. The spoon is a very advanced advertising campaign.",
  ],
  sauceHit: [
    "That is not a lens through which to interpret the world. That is lunch in your face. Sometimes we should stop interpreting.",
    "A hot take has reached you physically. The internet has finally become honest.",
    "Sauce on your screen! Holbein's Ambassadors has a strange smear that becomes a skull when you look from the side. Your screen has a smear too. From the side it is still hot sauce.",
    "Now you see the world through hot sauce. This is ideology: not glasses you put on, but a stain on the lens that you forget is there.",
    "Sauce in your face! And now the screen is red, and you feel attacked by a colour. This is exactly what happens in politics. It is always the colour that attacks first.",
    "You are marinated! Stop, stop, this is how it begins. First a little sauce, then some lemon, then somebody says, just ten more minutes in the oven.",
    "Hot sauce in the eyes! Well, you do not have eyes, you are the eye. The whole drop is one big eyeball. Which is also, I must say, how I feel at conferences.",
    "The stain in the picture! Lacan says the gaze is the stain, the point from which the picture looks back at you. Right now the picture is looking back at you with chili.",
    "Do not cry! When a drop cries, it loses dampness. Tears are a luxury for creatures with more water than you. Endure the sauce with dignity.",
    "It burns, it blinds, you cannot see, and yet you keep playing. This is enjoyment! Jouissance is precisely the pleasure you cannot see through.",
    "They Live, in reverse. In the film you put on the sunglasses and see the truth. Here the hot sauce puts itself on your eyes and you see only hot sauce. Maybe this is the truth.",
    "Hot sauce on the screen! Now the whole kitchen looks like it is on fire, which, on the stove, it partly is.",
    "You are seasoned! First the sauce, then a sprinkle of crumbs, and then you are a dish. Keep moving, or become a starter.",
    "You cannot see! Quick, wipe it off with a tea towel! You have no tea towel. You have no hands. You have only your burning dignity.",
    "Splat! Every bottle on the stove wants to leave its mark on you. Graffiti, but you are the wall.",
    "It burns! And water does not cure chilli, it only spreads the fire around. This is why you should never pour water on a hot take.",
    "Now the world is red and blurry. Look on the bright side. Red and blurry is how most philosophers see the world anyway. Welcome to the profession.",
  ],
  glass: [
    "You changed how reality looks without changing reality. Congratulations on your first election.",
    "The world is clearer. Your intentions remain a complete mess. Very high fidelity.",
    "The parallax view! Through the glass, one kitchen. Without the glass, another. The truth is in neither image, it is in the gap between them. Also press G again, I preferred it.",
    "Welcome to the desert of the Real! No curvature, no bubbles, no bottom of the glass. It is too sharp. We cannot bear very much reality, especially in high resolution.",
    "G! G for Gaze! No, G for Glass. No, G for God, who is also a kind of distortion filter. I claim that every key on your keyboard is a theological key.",
    "You took off the glass! They Live, backwards. In the film you put on sunglasses to see the ideology. You take off the glass and see a kitchen. The paradox is, this is the ideology.",
    "Without the distortion you think you see things as they really are. Nonsense! The distortion was the truth. This clarity is the lie.",
    "Why remove the glass? Because you believe in a pure, undistorted view. The most dangerous belief of all! There is no neutral view, only the bottoms of various glasses.",
    "You changed the filter. The sponge is still a sponge, the spoon is still a spoon. You changed the glass, not the world. This is the whole problem with ideology critique.",
    "Removing the glass is like decaf coffee: the substance is gone, the ritual remains. Still a kitchen, still sponges, still shooting, but now without the magic.",
    "The glass bottom is back! Your old home, now a lens. Nostalgia is exactly this: looking at the present through the thing you left behind.",
    "Glass on, glass off. The kitchen bends, the kitchen straightens. The sponge does not care. Only the viewer has an epistemology.",
    "You are looking at the world through the bottom of a glass. For many philosophers, this was also the preferred method, usually late at night.",
    "Distortion on! Now the toaster looks like a cathedral and the spoons look like swans. Everything is the same, only your enjoyment changed.",
    "Toggling the glass. You are like a man in a museum who keeps taking off his reading glasses to see if the painting improves. It never does. It is Rothko.",
  ],
  pad: [
    "The ketchup packet contains a suppressed desire to explode. Finally, someone has stepped on its childhood.",
    "The condiment has elevated the discourse. Please watch your head.",
    "Aufhebung! In German it means to cancel and to lift up at the same time. You cancelled the ketchup packet and it lifted you up. Hegelian sublation in its purest form!",
    "Boing! Ketchup makes everything taste like ketchup. It abolishes difference. And now it abolishes gravity. Ketchup is the most totalitarian of all condiments.",
    "The ketchup packet! You step on it and you fly. The dream of every condiment: to be taken seriously for one second, as a vehicle.",
    "Boing! You know, most people use ketchup to hide what they are eating. You use it to escape what is eating you. Much better use.",
    "Jumping on ketchup! In the old days, a person sat on a whoopee cushion, and everyone laughed. Now the cushion throws you into the air and nobody laughs. Progress.",
    "Lacan says sublimation raises an object to the dignity of the Thing. The ketchup packet raises you to the dignity of the ceiling fan.",
    "A condiment that became a trampoline! The ketchup packet reveals its true use value only when torn from its intended use. Marx did not see this coming. Nobody sees ketchup coming.",
    "The sublime object of ideology is not a flag or a crown. It is a ketchup packet, stepped on by a drop of water, launching it into the sky. I should write that book again.",
    "The packet gave its whole being to lift you, and now it lies there, empty, flat, forgotten. What does the ketchup packet teach us about gratitude? Nothing. It teaches us nothing.",
    "Launched by ketchup! In the old days ideology had to hide. Now it simply throws you into the air and calls it freedom.",
    "Splat, and up! The ketchup packet from the takeaway drawer, the one full of chopsticks and old menus. Nobody knew it had such ambition.",
    "Boing! You were launched by a sachet worth less than a crumb. History is always moved by small, sticky things.",
    "Bouncing on ketchup! Somewhere a mustard packet is watching, and it is so jealous. Mustard never gets to be the trampoline.",
    "Up you fly, over the sponges, past the fridge door! For one moment you can read the whole shopping list. We need eggs.",
    "The ketchup packet does not ask where you want to go. It only says, up! A form of transport with no destination, only enthusiasm. Like a philosophy degree.",
    "Every child who stepped on a ketchup packet at a picnic knows this moment. Surprise, violence, a red stain on the trousers. Only this time, you are the one flying.",
  ],
  rank: [
    "Who gives you this rank? The big Other, who does not exist. And still you perform for his approval. Exactly like tenure.",
    "SPLISH SPLASH SUPREME! And yet you want more. This is the superego: no rank is ever enough. Tomorrow there will be four S's and you will still feel guilty.",
    "Style! Look at you, stylish water. The owl of Minerva flies at dusk, you fly at triple S. Honestly, I have never been so proud of a liquid.",
    "From D for DAMP to triple S. Upward mobility! A drop from nothing becomes supreme. The ideology of the self-made drop. Enjoy it before the sponges tax you.",
    "What is style? Enjoyment that shows itself, jouissance performed for the gaze. You are not killing sponges anymore, you are dancing for the big Other.",
    "The style meter is canned laughter for your skills: it admires you so that you do not have to admire yourself. Interpassivity! Very efficient.",
    "SUPERSATURATED! You hold more water than water is allowed to hold. This is not physics, it is ambition.",
    "Look at the meter! Pure excess! Georges Bataille would weep. He always said the universe is about wasting energy magnificently. You are wasting it on sponges.",
    "The top rank! Now comes the hardest part, which is staying there. Every emperor learns this. Usually from a smaller, angrier emperor.",
    "Splish Splash Supreme! It sounds like a children's shampoo and a medieval title at the same time. You deserve both.",
    "Supreme style! And yet nobody in this kitchen is watching except me, and I am a cardboard cutout. Performance is always for an audience that is not quite there.",
    "At this rank the sponges are no longer enemies. They are an audience. They applaud by dying. It is the most sincere kind of applause.",
  ],
  mute: [
    "You can silence my voice. The text remains. This is why philosophy invented books.",
    "We have entered the silent period of my career. It is already my most critically acclaimed.",
    "Muted, but the sniff remains. You cannot mute the sniff. The sniff is the Real. *sniff*",
    "You muted the philosopher and kept the explosions. Pure ideology. This is how the whole world treats philosophy.",
    "You muted me. Fine. Now I am pure letter, the Symbolic without a voice. But the voice was always an object, it never needed sound. You did not escape me.",
    "Silence! But now you read me in your own inner voice, which is worse. I am no longer in your speakers. I am in your head.",
    "Bartleby would approve: you would prefer not to listen. Very well. I will continue in writing, like a real academic, with nobody reading.",
    "Now the speech bubble talks for me, the way the prayer wheel prays for you. I am a prayer wheel of theory, spinning in silence.",
    "You muted the sound. Good. Now you read my words in your head, in your own voice. Now I am inside you. Much worse.",
    "You turned off my voice. But the captions continue. I am like the extractor fan: switch me off and you still hear me in your memory.",
    "Silence in the kitchen. Only the fridge humming, and me, in writing. The fridge and I have always been rivals.",
    "Muted! Now I am a silent film philosopher. Imagine me gesturing wildly, with piano music. Actually, do not imagine. Just read.",
    "No sound. Good. Real philosophy was always read under a desk lamp at two in the morning, in a small font, by people who should be sleeping.",
    "You muted me, and yet your eyes are still following these words. So who, exactly, has been silenced? *sniff*",
  ],
  jokeFollow: [
    "A sponge walks into a philosophy department. They ask what it brings to the discipline. Absorbency, it says. They hire the sponge. This is not the joke. The joke is that it gets tenure.",
    "A drop asks a sponge: what is the meaning of life? The sponge says: come closer. Notice how often an answer is also a recruitment strategy.",
    "They asked me to make the game less cluttered. I removed one paragraph and discovered three contradictions underneath. We are keeping the paragraph. It was structural.",
    "A philosopher, a sponge and a spoon enter a kitchen. The philosopher asks why. The sponge asks how much water. The spoon asks whether this counts as a meeting. You are paying for all three.",
    "A drop goes to a therapist. I feel spread too thin, it says. Have you tried setting boundaries? Yes. They were a glass. I shot my way out. The therapist increases the fee.",
    "The sponge does not think it is a joke. The sponge thinks it is lunch. So tell me, which of you is taking reality more seriously?",
    "Then why did you stop moving too? The game froze, and so did you. Your body obeys a grey screen faster than it has ever obeyed your alarm clock.",
    "Here is a joke. A person finds a glass with one drop left in it and asks, who drank all the water? And the drop says: you did. Every night. For years.",
    "It is a joke in the way a mousetrap is a snack. Technically true. Please, keep reaching for the cheese.",
    "First as tragedy, then as farce. We skipped the tragedy completely and went straight to the googly eyes. This is how you know it is serious.",
    "You say joke. But notice, the tab is still open. You have not closed it. Your hand is voting against your irony.",
    "Of course not. You think it is a game. A joke, you can explain. A game explains you. Your entire evening, fully explained, by a drop of water.",
    "Here is the real joke. Tonight you will rinse a glass, and at the bottom there will be one little drop, and you will think of me. And you will pour it away anyway.",
    "A joke is like a fork in the road. Oh no. I said the word. Forget I said it. There is no fork. There is no fork! Unfreeze, unfreeze!",
    "No, no. It is much worse than a joke. It is a hobby. You chose this. Freely. On a weeknight.",
    "Everything important first arrives as a joke. Nobody took the fork seriously either. Remember that I said this. Later. When it matters.",
    "Let me give you an example. A person plays a game about the last drop of water, late at night, with a real glass beside them. Is there a glass beside you now? Do not look. Too late. You looked.",
    "Of course it is a joke. That is exactly the problem. The best way to make people accept something is to let them laugh at it first.",
    "A joke! You say this the way people say it is only a phase. Every phase, you know, is also only a phase. And then you are sixty, and a sponge.",
    "Let me explain the joke. No, wait. A joke explained is dead. Like the sponge. You see? I explained the sponge and now it is dead. Coincidence? No.",
    "You laugh, but look at your hands. They are holding very still. Your body has already stopped laughing. Only your mind is still pretending.",
    "It is a joke the same way a birthday is a party. Technically, there is cake. But every year, you are also closer to the end.",
    "The real joke is that you need me to tell you it is a joke. You need a cartoon philosopher to give you permission to have fun. Permission granted. Now resume the violence.",
    "My friend, there are no jokes. There are only truths that are too early. In ten years, every sponge will have a gun. Then who will be laughing? The sponges.",
    "Jokes are how the unconscious smuggles truth past the border guards. And you, my friend, just waved a whole lorry of truth through customs. Welcome to the kitchen.",
    "Good. Keep thinking that. Jokes are where serious things go to hide. Like a sponge under the sink. Waiting. Damp. Patient.",
    "Somewhere in your real kitchen, right now, there is a real sponge. It has no googly eyes. That is how you know it is the dangerous one.",
    "When did you last drink a glass of water? A real one? Go. I will wait, the game is frozen anyway. You see? Suddenly it is not so funny.",
    "Of course it is a joke. That is the perfect disguise. Nobody stops a joke. They let it walk right past them, into the kitchen, into the glass, into you.",
    "The old formula was: they do not know it, but they are doing it. The new formula: they know very well it is a joke, and still they are doing it. Look at your hands.",
    "Those who are not fooled are the ones who err, this is Lacan. You see through the joke, so you feel safe. Meanwhile you have been a drop of water for most of the evening.",
    "In Titanic, the iceberg arrives just in time to save the lovers from the disappointment of their future together. This freeze is your iceberg. You are welcome.",
    "This grey, this silence, this is the kitchen without the ideology sunglasses. No colours, no music, no fun. Quick, put them back on. Everybody puts them back on.",
    "Then who is laughing? I have been watching your face this whole time. Not one smile. Very well. We will add the laughter later, from a can.",
    "No. A joke has a punchline. This has only a counter, an edge, and you, hovering near it, pretending you are not afraid of heights.",
    "Every time you laugh at a sponge with googly eyes, you laugh at the only thing in this kitchen that is honest about wanting to eat you.",
    "I froze the whole kitchen to tell you something important, and already you are waiting for it to start again. You see? This is the problem. This is the entire problem.",
    "The horror is not that it is a joke. The horror is that you understood every single reference. You are one of us now. There is no way back.",
    "The drop dies for you, again and again, all evening. Has it ever occurred to you to say thank you? No. You pressed restart. Very funny. For you.",
    "A cartoon philosopher narrating a war between a drop of water and some sponges. If this is a joke, I am the punchline, and I claim the punchline is having a wonderful time.",
    "Everybody who was ever absorbed thought it was a joke. Ask the milk. Ask the orange juice. Ask the ice cube. Oh. You cannot. They are gone.",
    "Kinder Surprise. Chocolate outside, a toy inside. This game: jokes outside, and inside? I opened it for you. Inside is a tiny plastic you, holding a tiny plastic mouse.",
    "The Matrix offered two pills. I offer two glasses. In one, you are a drop of water. In the other, you are a person pretending to be a drop of water. The second glass is emptier.",
    "I always wanted a third pill. Not the truth behind the illusion, the truth inside the illusion. Well, here it is. A grey kitchen, a frozen sponge, and you, still here.",
    "Right now, in this grey moment, you are waiting for permission to have fun again. From me. A cartoon. Think very carefully about who you give your permissions to.",
    "It is not a joke, it is a metaphor. And the terrible thing about being inside a metaphor is that from the inside it feels exactly like a kitchen.",
    "This is how the big Other appears in our time. Not as God. Not as the King. As a frozen screen and a cartoon with a beard, asking you questions.",
    "Hitchcock hid a light bulb inside a glass of milk, so it would glow and everyone would suspect it. You are in a glass right now, glowing on a screen. The whole kitchen suspects you. It is right to.",
    "Relax. It was a joke. You see how easily you believed me? Now ask yourself what else in this kitchen you believe that easily. The news ticker. The spoons. Me.",
    "The punchline is that there is no punchline. There is also no fork. Both of these statements will be tested. Only one of them will survive.",
    "Nothing froze except you. You froze the moment a cartoon with a beard started talking. This is the true power of philosophy. It pauses people.",
    "You think the sponges are the enemy. But they only want what you want, to be full. What did you eat today? And afterwards, were you still hungry? Sponge behaviour.",
    "Only a joke, you say. Only a game, only a sponge, only one more wave. Only, only, only. The word only is where ideology keeps its luggage.",
    "Ideology never hides in what you take seriously. It hides in what you are sure is harmless. Cartoons. Games. Googly eyes. Me.",
    "A drop of water, a glass, a person alone in front of a screen. Which of the three is the least free? Take your time. The sponges are frozen.",
    "You buy the ethical coffee, and saving the rainforest is included in the price. Here also, the critique is included in the game. I am the critique. I came free. Enjoy!",
    "The grey will lift in a moment. The colours come back, the music comes back, and you will forget this ever happened. That is the joke. You always forget.",
    "Look at the hot sauce bottle, frozen in mid-throw. It is not a joke to him. He has one move, and he believes in it completely. Can you say the same about anything?",
    "Every time you die, you come back, a fresh drop, as if nothing happened. The sponges never learn, and neither do you. This is not a joke. This is a relationship.",
    "You laugh because I am a cartoon. But a cartoon never gets tired, never goes home, never closes the tab. I will still be here in this grey long after you have gone to bed.",
    "Stop. Do not laugh. Do not click. Do not do anything. You see how unbearable that is? That is not a joke. That is the rest of your evening, without a game to hide in.",
    "Too Late to Awaken. You think the grey is the game waking you up. No! The game was the dream. The grey is too real. So you will run back into the game, to keep sleeping.",
    "Then why are you not laughing? Listen. No music. No laugh track. Without the soundtrack you do not know when to laugh. You are a sitcom with the sound off.",
    "Look at your situation. A grown person, at night, defending one drop of water against sponges with googly eyes. My God. You are the funniest thing in this kitchen.",
    "All game you have seen this kitchen through the bottom of a glass. So when you close the game, which glass will you be looking through then? You cannot see it. That is how you know it is there.",
    "*sniff* The sponges think you are a drink. The glass thinks you are the last of something. You think you are a player. Everybody is wrong about you. Welcome to being a subject.",
    "Welcome to the desert of the Real. It is grey, there is no music, and in the middle there is you, very still, holding a mouse like a small animal you are afraid to wake.",
    "The joke is on you. No, not on you, on Drip. And Drip does not exist. So the joke is on nobody, and nobody is laughing. This is the purest comedy there is.",
    "They Live! Put on the special sunglasses and read the kitchen. The fridge says obey. The cupboard says consume. And every sponge says only one word. Absorb. Absorb this.",
    "The more you play, the more you want to play. Coca-Cola logic: the more you drink, the thirstier you get. You call this a joke. I call it a beverage.",
    "Why do you think I froze everything? So you could feel what a sponge feels. Nothing happening, forever, next to a sink. This is not a joke. This is solidarity.",
    "Of course it is a joke. But notice: you laughed while killing sponges. The joke did not stop you. It helped you. This is how cynicism works.",
    "It is only a joke as long as you are not the sponge.",
    "A joke? The dog under the counter does not think so. He has been waiting all evening with total seriousness. He is the only one in this house who respects your work.",
    "Listen. Even now, with the game frozen, the fridge hums. It is not laughing. It has never laughed. The fridge was here before the joke, and it will be here after.",
    "Ah, you want a punchline. A punchline is a drain: all the meaning goes away at once, with a little gurgle. I refuse to be your drain.",
    "Freud says a joke saves psychic energy. You laugh so you do not have to think. Look how much energy you saved tonight. Enough to boil a kettle. Enough to boil you.",
    "This joke is a Kinder egg. You bite through the chocolate, you open the capsule, and inside is an instruction sheet for assembling a smaller joke. And inside that one, another sheet.",
    "A joke is like the lid drawer. You open it looking for the match, everything falls out, nothing fits, you shove it shut and say, very funny. It is not funny. It is the drawer.",
    "Look at the crumbs beside the toaster, frozen in the grey. Every crumb was once a slice with hopes. You laugh. The crumbs do not laugh. The crumbs remember.",
    "No, listen. If this were a joke, I would be allowed to stop. Nobody lets me stop. The game keeps asking me to talk. This is not comedy. This is employment.",
    "You think the grey interrupts the game. Wrong! The game interrupts the grey. The grey is your real evening. The colours are only the commercial break.",
    "You are a drop of water being told by a cartoon that you do not take sponges seriously enough. If this is a joke, who wrote it? Not me. I am also inside it.",
    "The old Soviet joke: they pretend to pay us, we pretend to work. Here, the game pretends to be difficult, and you pretend to be surprised when you die. Everybody is satisfied.",
    "A joke has the structure of a kettle. Build-up, build-up, build-up, click. But nobody laughs at the click. They laugh at the steam afterwards, when it is already too late.",
    "The difference is simple. A joke, you tell to other people. A symptom tells you to other people. Tonight your symptom is a drop of water, and anybody behind you can see it.",
    "Even the kettle is frozen mid-scream. For once in its life it is not screaming, and the reason is a philosopher asking about a joke. The kettle is grateful to you.",
    "Hitchcock's bomb under the table: the audience knows, the characters do not. That is suspense. Here the sponge knows, the dog knows, the fridge knows. Only you think it is a joke.",
    "A joke that eats you is no longer a joke. It is a sponge with better timing.",
    "Why do we laugh when a man slips on a banana peel? Because it is not us. Now look down. In this kitchen, you are the slippery thing on the floor.",
    "Every joke ever told in this kitchen is still inside the extractor fan. The burnt lasagne joke, the joke about Grandma. It is very greasy in there. Humour is mostly grease.",
    "Of course it is a joke. A Kantian would say: then laugh universally. Could every drop in every glass laugh at this? No? Then you are laughing only for yourself.",
    "The joke is that the tea towel is dry and you are not. In a kitchen, dryness is power. You are the least powerful thing on the counter, and you are armed. Which part is funny?",
    "Stop smiling at the googly eyes. The googly eyes are the laugh track of the sponge. They make it silly so you never ask what it wants. And it wants you. It is always you.",
    "Kafka wrote about a man who waits his whole life before a door. Here the dog waits his whole life under a counter. The same story. Except the dog gets fed.",
    "Look at the fridge magnets, frozen. Yesterday they spelled nothing. Today, from this angle, they spell EAT. The magnets are moving, and they are not on your side.",
    "Please, do not joke near the drain. The drain has heard everything. Everything goes down it eventually, laughing or not. It is the only audience that never leaves early.",
    "The funniest thing in this game: you are made of the same stuff as the tea in your mug. Go on, look at the tea. The tea does not find it funny at all.",
    "The first time you fall off the counter, it is a tragedy. The second time, the dog wags. The third time, the dog is waiting in position. This is no longer farce. It is a subscription.",
    "A joke is the decaf of truth. Same cup, same smell, same little morning ceremony. And at eleven o'clock you realise that nothing whatsoever happened to you.",
    "The limescale in the kettle took ten years to form, one invisible layer each morning. Nobody ever laughed at a single layer. This is how serious things arrive. One harmless morning at a time.",
    "Remember the three toilets. The German one lets you inspect, the French one makes everything vanish. The joke is the English toilet. It keeps everything floating on the surface, so you can pretend you are only looking.",
    "The grey makes the hot sauce look like a gravestone. Put the colours back and it is a cheerful bottle again. Tell me, which version were you shooting at all evening?",
    "Derrida would say that the joke is always deferred. The punchline never arrives. And look at you, still waiting for it. You are a deconstructionist and you did not even pay tuition.",
    "The objects are laughing at you. This is new materialism. Not only do things have agency, they also have a sense of humour, and it is better than yours.",
  ],
  death: [
    "Zero percent dampness. Perfect dryness. Monks spend thirty years on a mountain trying to become this empty. You did it in four minutes, against a hot sauce bottle.",
    "The sponge did not hate you. This is the horror. Hate would have been personal. It only needed you. Need is not an emotion. Need is plumbing.",
    "Less Than Nothing. This used to be the title of a very long book. Now it is also your dampness.",
    "You died of dryness in a kitchen. A kitchen! The one room in the house built entirely around water! This is not a tragedy. This is interior design.",
    "Drip is dead. Long live the drip. Somewhere, a tap is already leaking your successor.",
    "Evaporated. You went up into the air, invisible, everywhere and nowhere. Congratulations, you are now the atmosphere. Try to be a good one.",
    "Dead! But water is never really dead. It just changes form. Next time you might come back as a cloud, or as tea. Aim for tea.",
    "You dried out, and the kitchen continues. The fridge hums, the tap drips. The world does not notice your absence. This is the lesson of every death, and every job.",
    "You did not die. You changed state. Hegel calls it sublation, physics calls it evaporation, and the sponge calls it a missed opportunity.",
    "Evaporation is the most honest death. No corpse, no funeral, only a slight increase in humidity. Somewhere a window fogs up a little, in your honour.",
    "You rose from the counter like Spirit rising out of substance. Congratulations, you are a cloud. But clouds must also fall. See you in the rain, and so on, and so on.",
    "The owl of Minerva flies only at dusk. You understand this level only now, when you are already vapour. Too late to awaken, little drop. Much too late.",
    "You were never the object of their desire. You were its cause. This is much worse. A cause can never be satisfied. The sponges will be thirsty again tomorrow.",
    "Hegel says the spirit is a bone. Your spirit is a faint ring on the counter where a drop used to be. One wipe of a cloth and it is gone. This is history.",
    "Dampness zero. But zero is not nothing. Zero counts. The nothing that counts, this is precisely what the subject is. Rest well, little nothing.",
    "For the sponge, your death was a pleasant fullness. Your tragedy is its snack. There you have it, the whole of history in one sentence, on a kitchen counter.",
    "Evaporated. Now you are everywhere a little bit, and nowhere very much. Like ideology. Like the smell of toast.",
    "You wanted to escape the glass. Now you have escaped everything, including yourself. Be careful what you wish for, especially if you are a liquid.",
    "Every glass is half empty and half full. Yours is now completely empty, which, dialectically, means it is ready to be filled again. Restart. Be the water.",
    "Consumed! Marx would say you were a commodity. I say you were a beverage. We are both right, and either way, you are gone.",
    "Gone, and the sponges are already looking for the next drop. You see? You were never special to them. You were only damp. Most of us are only damp.",
    "Evaporated! But do not despair. Up in the clouds there are billions of you, all saying, I was the last drop. Nobody is the last drop. This is the great consolation, and the great insult.",
    "Did you think the sponges would treasure you? No. Tomorrow they wring you out over the sink. Evaporation, at least, has some dignity.",
    "Living in the End Times? No. You were living in the end times of a glass of water. Much shorter. Much more humid.",
    "The French ending. Everything vanishes at once, no inspection, no remainder, very revolutionary. There are other endings. Like toilets, there are always three.",
    "You did not lose to the sponges. You lost to the conditions. The lamps, the heat, the dryness of the world. Nobody is defeated by an enemy anymore. We are all defeated by the weather.",
    "You are vapour now. The ultimate fantasy: to be everywhere and responsible for nothing. Do not enjoy it too much. No, enjoy it. It is all you have left.",
    "My God, look at the empty glass. So clean. So innocent. As if nothing happened here. This is how everything looks after history. Transparent, and slightly smudged.",
    "*sniff* You evaporated so quietly. No scream. Only a small hiss, like a kettle giving up. This is the sound the subject makes when the big Other is not listening.",
    "Dried out, and the kettle beside you did not even notice. It was boiling for somebody else. The kettle has never once boiled for you. Remember this, as vapour.",
    "You evaporated, and your steam went straight into the extractor fan. From kitchen to garden in three seconds. The fastest emigration in history, and nobody checked your passport.",
    "Look where you were standing. A little ring of limescale. That is you now, minerals. In ten years the kettle will be built entirely out of people like you.",
    "Death by drying. The tea towel would be proud. Its whole career, its only ambition, was this. You have fulfilled the dream of a tea towel.",
    "You are gone, and the crumbs remain. Think about this hierarchy. A crumb outlives you. A crumb! The kitchen always keeps the dry things.",
    "Evaporation is the only death with an upward direction. Everybody else goes down, into the ground. You go up, toward the ceiling, toward the smoke alarm. Almost heaven.",
    "You dried up at the exact moment you were winning. Not bad luck. Dialectics! At the height of your power, the conditions of your power quietly disappear.",
    "When you went, the window above the sink fogged a little. Tomorrow a child will draw a smiley face in you with one finger. That is the afterlife. It is mostly smiley faces.",
    "You died, and the sponges did not hold a minute of silence. They held a minute of slurping the puddle next to you. Every regime has its ceremonies.",
    "Dry at last. Now you understand the Doubt Flakes. They were dry all along, waiting for milk that never came. You are one of them now. Welcome to the bowl.",
    "Zero dampness. You are now part of the air the fridge cools every night. It will never thank you, but in a way it will breathe you.",
    "*sniff* It smells a little of hot pan in here. That was you. Your whole biography, one short hiss on the hob. Other biographies are longer. Not better.",
    "You were deconstructed. Now you are only a trace, a mark of absence on the counter. Derrida would find you fascinating. The sponge found you delicious.",
    "Différance, at last. Your life was always deferred until the next wave. Now it is deferred permanently. Even Derrida would admit this is a strong reading.",
  ],
  clogDeath: [
    "You joined the Clog. Of course! This is how every blockage grows: not from enemies, from people who came too close trying to fix it.",
    "The Clog took you. Now you are part of the structure. Do not feel bad, this is how most radicals end up. Inside the blockage, with a pension.",
    "You were sucked into the Clog. You wanted to go down the drain, and you did, partly. This is what we call a compromise.",
  ],
  clogBurp: [
    "It regurgitated a sponge! The return of the repressed, but greasy. Everything you flushed away comes back. Freud was a plumber, really.",
    "Look, it threw up a sponge, pre-fried. The Clog is a kind of archive: nothing is ever thrown away, only stored badly. Soap it!",
    "Another sponge from the depths. The drain does not forget. The drain is the unconscious of the kitchen, and it is coughing.",
  ],
  clogSuck: [
    "It is sucking! Do not become a puddle now, my friend. A puddle near a drain is not a tactic. It is a destiny. Dash!",
    "The Clog pulls you in. Every ideology does this at the end: when argument fails, it simply sucks. Resist! Dash away!",
    "Suction! This is the gravity of the drain of history. Everyone gets pulled in eventually. The only question is whether you go with fizz or without.",
  ],
  fallDeath: [
    "You fell from the symbolic order of the counter into the Real of the kitchen floor. The Real, it turns out, has four legs and bad breath.",
    "The fall is not the tragedy. The tragedy is how happy the dog was.",
    "You wanted to see what lies beyond the edge of the world. Now you know. It is a dog. Every world ends in a dog, if you go far enough.",
    "You fell off the counter and the dog licked you up. This is the only honest ending in the whole game.",
    "The dog licked you up without one second of guilt. Pure enjoyment, no superego. The dog is the only free subject in this house, and he cannot even read.",
    "A letter always arrives at its destination, Lacan tells us. You were a letter. The destination, it turns out, was always the dog.",
    "The kitchen floor is the unconscious of the kitchen, I claim. Everything the counter represses ends up down there. Crumbs, a pea, a bottle cap, and now, you.",
    "Gravity is the most honest ideology. It promises nothing. It does not need your belief. It simply says, down. And you obeyed.",
    "The dog does not know you were a hero. For the dog you were not even a drop. You were a flavour. Mostly glass, with a hint of hot sauce.",
    "The edge of the counter looks like a border. It is not. It is an invitation. You accepted. Very polite. Very wet. Very licked.",
    "Your death made somebody happy. Tail wagging, even. This is more than most philosophers can say about their work.",
    "Freedom! You escaped the glass, the counter, the sponges! And you landed in a mouth. This is the dialectic of liberation. Every escape ends in somebody's mouth.",
    "For the dog, this was not a tragedy. It was grace. A gift falling from heaven. You were somebody's miracle. Think about that, and cry a little.",
    "A dog is man's best friend, they say. Nobody asks what the dog is to the water. To the water, the dog is the end of history.",
    "You slipped off the edge like a Hitchcock hero hanging from a rooftop, except nobody grabbed your hand, because you have no hand, and the dog below felt no suspense at all.",
    "Down, down, and then a tongue. Tell me, is this the Real, or is it only the dog? This is the question. And the answer, my friend, is the dog.",
    "Over the edge and into the dog. You thought the counter had walls. The counter never had walls. It only had your confidence.",
    "The dog did not chew. He did not need to. You were already liquid. You were the easiest meal of his whole career, and he will remember you fondly.",
    "Kierkegaard spoke of the leap of faith. You made the leap. The faith was waiting on the floor, wagging.",
    "Under the counter there is the lid drawer, the dust, and the dog. You chose the dog. Honestly, of the three, it was the best option.",
    "After licking you up, the dog looked at me, in the corner of the screen, as if I might drop something too. I have no body. He does not care. He has hope.",
    "From the order of the counter to the chaos of the tiles in one second. Hegel needed eight hundred pages for this journey. You needed one bad jump.",
    "Up on the counter a spoon is telling the others that you slipped. Nobody pushed you. The most humiliating death: the one with no enemy.",
    "Now you are inside the dog, and the dog is lying under the counter again, waiting for the next drop. You have become the waiting. You are part of the dog's hope.",
  ],
  rollDeath: [
    "The paper towel did not kill you. It simply cleaned up. For the system, your death was not a murder. It was housekeeping.",
    "The Quicker Picker-Upper. Quicker than what? Picker of what? Upper towards where? The answer to all three questions is, sadly, you.",
    "Quicker. Picker. Upper. Three words, no mercy. This is how a very clean society disposes of its last little drops.",
    "Two ply! The paper towel is already dialectical, two layers in tension, and you are only one drop. You never stood a chance against the double.",
    "You were not killed. You were wiped. After a killing there is a body. After a wiping there is only a clean counter and a feeling of accomplishment.",
    "Perforated every twenty centimetres, so you can tear off exactly the amount you need. Imagine being killed by something so considerate.",
    "It absorbed you along with all the spilled water, friend and enemy together. This is the terrible equality of absorbent materials.",
    "Rolled over by a paper towel. Do not be ashamed. Many great things have been flattened by something softer, whiter and more convenient.",
    "Crushed by the one enemy that does not even want to fight. It only wants a clean counter. Beware of enemies with good intentions. They never stop.",
    "Absolute Recoil! It flung you once, and you came back. It flung you twice, and you came back. The third time, it simply kept you.",
    "The paper towel picked you up. The quicker picker-upper. You were simply cleaned away, like a small accident.",
    "You were absorbed into the roll, one wet circle among the embossed flowers. Now you are a decoration. Tomorrow you are recycling.",
    "Wiped. And the worst part is, afterwards it will throw itself away with you inside. No funeral. Only the pedal bin under the sink.",
    "It did not hate you. It did not even see you. It was cleaning, and you belonged to the category of things to be cleaned. Beware of categories.",
    "Rock, paper, scissors has been updated. Water, paper. And paper wins. It always wins. Nobody ever lets water win at anything.",
    "You tried to stop two ply with one drop. Heroic! Useless! The most beautiful combination in the whole history of tragedy.",
  ],
  forkDeath: [
    "The fork does not exist, and yet you are perforated in four places. You see? Ideology does not need to exist in order to stab you. It only needs a handle.",
    "I said there is no fork. I was wrong. But notice, I was wrong in a very sophisticated way. You were wrong in a very dead way.",
    "Killed by a fork that does not exist. The purest death imaginable. Even your murderer is a theoretical impossibility.",
    "The spoons told you it was not a fork. The news told you there was no fork. I told you there was no fork. Tell me, who taught you to trust?",
    "Stabbed by a fork, as a liquid. Physically impossible. Philosophically inevitable.",
    "The big Other does not exist. It only killed you. These two statements are not contradictory. That is what makes them so terrible.",
    "A drop of water should slip right between the prongs. And yet. The fork did not kill you by being sharp. It killed you by being believed in.",
    "Everybody insisted there was no fork, and precisely because everybody insisted, nobody watched for it. The unspeakable thing always wins. Usually with prongs.",
    "Killed by the fork. Now I must rewrite everything. Forty years of theory, and a drop of water disproves it simply by dying.",
    "In Kung Fu Panda the lesson is, there is no secret ingredient. Your lesson was, there is a fork. You got the worse lesson. I am sorry. Also, I told you so. No, wait, I told you the opposite.",
    "The fork. Four holes in you. You were killed by something that does not exist. This happens more often than you think.",
