    "Speared on the Fork like the last pea on the plate. Everybody chases the last pea. Nobody ever asks what the pea wanted.",
    "Four little holes in you, and water spouting out of each one. Four fountains! At least your death has good civic architecture.",
    "You died believing there was no fork. This is the purest faith there is. Nobody will make you a saint, but I will make you a footnote.",
    "The Fork won. Now it will slide back into the drawer among the spoons, and every spoon will say it saw nothing. Nobody ever sees anything in a drawer.",
    "Pierced by the Real. The Real does not argue, it does not debate. It simply goes in, four times, like a fork into a sausage at a barbecue.",
    "It stabbed you, and a little bit of you is still clinging to the prongs. You see? Even in death we hold on to the thing that destroyed us.",
  ],
  end: [
    "You held E, and E held you. It is the most stable relationship you have had all evening.",
    "At last, no more struggle. Only warmth, and a faint smell of yesterday's lasagne. Is this happiness? Perhaps. Most happiness smells a little of yesterday's lasagne.",
    "The superego says Enjoy! And you found the one loophole. You let something else do the enjoying. Brilliant. Perverse. Deeply, deeply brilliant.",
    "You gave up your dampness freely. Beautiful. Now you belong to a larger dampness. This is either communism or a kitchen sponge. I have never been able to tell them apart.",
    "E. The fifth letter. Why E? E for Enjoy! E for Ego, dissolving! E for Exit! E for Eaten! Every letter becomes a destiny if you hold it long enough.",
    "In Lacanian terms, you made yourself the instrument of the sponge's enjoyment. Technically, this is perversion. A very tidy, very absorbent perversion. The Pervert's Guide to Kitchenware.",
    "You think you have lost? Look closer. The sponge is now 98% you. So, who has absorbed whom?",
    "You chose to be absorbed. Congratulations. This is the first free act you have committed in the entire game.",
    "Bartleby would prefer not to. You preferred to. Maybe this is even more radical. I do not know. I am shaken. Somebody hold my E.",
    "The sponge did not defeat you. You gave yourself. This is the difference between being eaten and being a gift. Only the sponge will never know the difference.",
    "You held the button for a long time. Long enough to think about it. That is the frightening part. It was not an accident. It was a decision.",
    "Surrender is not defeat. Surrender is the moment you stop wanting what the game wants you to want. And the game wanted you to want so much.",
    "Now you are inside the sponge, looking out through its googly eyes. You have become the gaze. Congratulations. It is very squishy in here, I imagine.",
    "A drop of water freely enters a sponge. Is this surrender? Is this marriage? Is this a Tuesday? Philosophy has no answer. Only a warm, damp silence.",
    "They told you to fight. They told you to Enjoy! They told you eight kills in twelve seconds. And you said no, I will hold E. A hero of our time.",
    "Freedom is not a grand gesture. Freedom is a long press. One finger, a few seconds, and the whole world changes. Well. The whole sponge.",
    "You did not lose. You simply moved in with the enemy. Many heroes end like this. A comfortable place, a sponge, and nobody asks about the old days.",
    "This is the lesson the golden sponge never learned. To be desired, you must run away. To be absorbed, you must only stop. You stopped. Look how happy it is.",
    "You chose the sponge over the struggle. Now you are part of a sponge, and you will be thirsty forever. Welcome to desire. Nobody ever leaves.",
    "Interpassivity, at last. Now the sponge exists for you. You do not have to do anything. Not even be. Very relaxing. I recommend it only a little.",
    "You surrendered, and do you know what the sponge felt? Nothing. Your grand gesture was, for the sponge, a small lunch. This is the fate of all grand gestures.",
    "Hegel says the subject must lose itself in order to find itself. You lost yourself in a sponge. The finding part is scheduled for when it gets squeezed over the sink.",
    "The most subversive act in a game about survival: not to survive. On purpose. And the game even gave you a button for it. This is the most suspicious thing of all.",
    "Absorbed, voluntarily! I am so moved. It is like watching a river finally reach the sea, except the sea is a sponge, and the river is you, so actually, it is like going home.",
    "They say the sponge takes everything. But you gave it. So the sponge took nothing. The sponge is a thief who has been handed a present, and now it does not know who it is.",
    "*sniff* You let go. Do you know how rare this is? Everyone in this kitchen is holding on to something. The spoon to its denial. Grandma to her spectacles. You let go.",
    "Not with a bang, but with a squish. And the squish, you know, is very underrated.",
    "You surrendered. Hegel would call this the negation of the negation. I call it: finally, some peace and quiet. *sniff*",
    "You held E and the sponge accepted. Somewhere a tea towel is jealous. It tried to absorb you all evening, and a sponge with googly eyes got there first.",
    "You are the sponge now. Tomorrow somebody will use you to wipe crumbs from around the toaster. Your destiny is breakfast. There are worse destinies. Ask the Doubt Flakes.",
    "Voluntary absorption. The dog is disappointed; he was hoping you would fall. You chose the sponge over the dog. A small betrayal of a very loyal animal.",
    "In The Matrix you choose a pill. You chose a sponge. At least with the sponge you know what you are getting. It is damp, it holds you, and it asks nothing.",
    "Tonight the sponge will sit on the edge of the sink, dripping. Every drip is a little of you escaping. The escape is slow, but, my friend, it has already begun.",
    "Surrender, but with a long press. You had to hold the button. Even giving up takes effort now. Nothing is easy anymore, not even letting go.",
    "The sponge is full. For the first time in its life, it wants nothing. You did this. You brought a sponge to peace. Somebody should give you a prize.",
    "From the edge of the sink you will now see the whole kitchen: the kettle, the fridge magnets, the window, the dog. A room with a view. A wet one.",
    "Kant says freedom is obeying a law you give yourself. You gave yourself one law, become sponge, and you obeyed it perfectly. This is extremely Prussian of you.",
    "*sniff* You let the sponge have you, and it did not even say thank you. This is love, I think. Or washing-up. After thirty years it becomes hard to tell the difference.",
  ],
  pause: [
    "You have stopped time to think. The kettle has requested the same accommodation for years.",
    "Paused. The sponge is still hungry, but now it is a theoretical hunger. My favourite kind; no catering required.",
    "Pausing a game is like decaf coffee. You get the whole ritual of playing without the dangerous substance of playing. Sip slowly.",
    "You paused, and suddenly, anxiety. Without the enemies you are alone with the most frightening thing in any game. The settings menu.",
    "While we wait, consider the three endings, like the three toilets. Evaporation is French, everything vanishes at once. The floor is German, the dog inspects you. The sponge is English. You float.",
    "Let me give you an example. The game is paused, the sponges are paused, you are paused. But the fridge is still humming. The fridge never pauses. The fridge is the true subject of history.",
    "You paused the game, but not the ideology. The ideology keeps running in the background. It is always running. It does not even need batteries.",
    "Paused! Now the sponges are frozen in mid-hop, like statues in a museum of stupidity. I would visit this museum. I would give a lecture there.",
    "Paused. The sponge hangs mid-hop, the sauce hangs mid-air. For once, nobody in this kitchen wants anything from you. Enjoy it. No! Do not enjoy it. Just sit.",
    "The game is paused. You are not. You are still here, breathing, staring at a frozen sponge. Tell me honestly, which of you is really the one who stopped?",
    "I would prefer not to. Very good, Bartleby. I would also prefer not to. Let us not, together, for a little while.",
    "Everything waits for you now. The sponge, mid-hop. The spoon, mid-lunge. This is how God must feel. Also, I suspect, a microwave.",
    "While you are away, the sponges do not think about you at all. I know. This is difficult to accept. It is also the whole of adult life.",
    "Tarrying with the Negative. Take your time. The negative is not going anywhere. That is basically its whole personality.",
    "Go, make a cup of tea. But while you drink, think of all the little drops going down your throat. Now you understand the sponges. Now you are the sponge.",
    "A pause button is a small miracle. The only place in the world where time stops and nobody dies.",
    "Look at them, frozen with their googly eyes wide open. They are not waiting for you. They are waiting for the game. We are all only waiting for the game.",
    "Paused. The perfect condition of the modern subject. Everything is possible, and nothing happens. You could live here. Many people do.",
    "Take a break. Stretch. Drink something. Not Drip, obviously, Drip is you. Drink something that is not you. This is the first rule of self-care.",
    "The Parallax View. You see the kitchen through the bottom of a glass, and the kitchen sees you through the bottom of a glass. So which side is the bottom? Take all the time you need.",
    "Paused. The sponge stops hopping, the sauce stops flying, but the dog under the counter keeps waiting. You cannot pause a dog. He is outside the software.",
    "While you are gone I will count the crumbs by the toaster. Three hundred and twelve. No, eleven. One of them was a very small sponge.",
    "The pause menu. The only room in this kitchen with no sink, no sponges and no water. A desert, with buttons.",
    "Paused! Even the drip on the tap is frozen, just about to fall. Look at it. Pure suspense. Hitchcock would have held this shot for eleven minutes.",
    "Now the game waits for you like a guest in the hallway with his coat on. Not staying, not leaving. Say something to it. It is getting awkward.",
    "The pause is the only moment in this game when nobody is thirsty. Enjoy the drought. Very peaceful, like a Sunday afternoon with an empty fridge.",
    "Take a break. Go to your real kitchen and look at your real sponge. Does it have eyes? No? Look again. Look harder.",
    "You can turn my voice down in the settings. I do not recommend it. Silence is not freedom. Silence is only me, continuing, without you.",
  ],
  bubble: [
    "A private sphere! Finally! It costs one soap and expires in seven seconds. The landlord calls this flexible living.",
    "The sponge can see the entire world and touch none of it. We have invented a postgraduate degree.",
    "You put its convictions in brackets. Phenomenology! Except the brackets are soap and the convictions are screaming.",
    "A soap bubble is pure ideology. You can see right through it, and still you cannot get out.",
    "Bubbled! It can see you. It can hate you. It simply cannot touch you. Like a neighbour on the other side of a very clean window.",
    "The Suds-O-Matic. You attack the enemy and you wash it at the same time. Violence with the hygiene already included. Every parent dreams of such a weapon.",
    "Look at it floating in its bubble, completely safe, completely helpless. This is the gated community. Very clean, very round, going nowhere.",
    "It is trapped in the one thing it was made to produce. The sponge makes soap bubbles its whole life. Now it lives in one. This is called a career.",
    "A sponge in a bubble! It looks so peaceful! It is not peaceful. It is screaming. Soap is soundproof. Many things are like this if you look closely.",
    "Look at him in the bubble! Safe, contained, floating. This is how we treat our enemies now. Not killing them. Only wrapping them in a nice, shiny, tolerant bubble.",
    "A sponge trapped in soap! The very substance it was made to spread. This is how ideology catches its most loyal servants. In their own suds.",
    "The Fragile Absolute! Perfect, round, complete, and one poke away from nothing.",
    "Look, it rises above the counter like a saint in an old painting. The enemy, sanctified by soap. Every halo, you know, is only a bubble that has not popped yet.",
    "The spoon in the bubble is still trying to lunge at you. It does not know it is already floating away. This is all of us. Still lunging. Already floating away.",
    "The hot sauce is still furious, but now it is also iridescent. Rage, made beautiful. Put it in a gallery. Charge admission.",
    "Encapsulation! The enemy remains, but now it is decorative. We turn our dangers into ornaments. This is the entire history of the snow globe.",
    "My God, it is Grandma in a bubble. She looks so peaceful. For the first time, she looks like she is not about to split into two of herself.",
    "A sphere of air inside a film of almost nothing. Less Than Nothing, with a sponge inside, looking very surprised. Surprise is the correct response to ontology.",
    "You put it in a soap bubble! Look at it floating there, safe and helpless. This is the bourgeois family.",
    "The bubble is ideology in its purest form: you can see the world through it, and it is still a prison.",
    "Into the bubble! Look, it reflects the whole kitchen, the kettle, the tap, even you. For a moment the sponge wears the world like a coat.",
    "The bubble smells of lemon washing-up liquid. The sponge is imprisoned in the perfume of its own profession.",
    "A spoon in a bubble, turning slowly, like the last spoon in the dishwasher basket. Clean, trapped, waiting for nobody.",
    "Look, the hot sauce bottle is trying to throw sauce from inside the bubble. It only splashes itself. Every protest from inside a bubble ends like this.",
    "The soap bubble is the only prison you can open with one fingertip. And the prisoner has no fingertip. Freedom exists. It is just one finger out of reach.",
    "Bubbled! It drifts up toward the extractor fan. The fan will not save it. The fan does not save anybody. The fan only hums.",
  ],
  bubbleCounter: [
    "The bubble has left the market. The floor is preparing a correction.",
    "Upward mobility, followed by downward reality. The brochure only showed the first part.",
    "You did not kill it. You relocated it. The most polite way to remove an enemy is to let gravity take the blame.",
    "This is interpassivity. You did not kill it, the floor did it for you. You keep the points, and gravity keeps the guilt.",
    "It did not fall. It was released. Language is important. With the right words, even a sponge plunging to the floor is a graduation.",
    "Floated away and fell. Nobody killed it. It simply left the counter on a very small cloud. If only all conflicts ended like this. With soap.",
    "Goodbye, little sponge! It will land on the floor, and the dog will lick the soap, and the dog will make bubbles for a week. Every war has consequences.",
    "Bubbled off the edge. You exported the problem. You did not solve it, you just sent it downstairs. This is exactly what rich countries do with their rubbish.",
    "It drifted off the edge so softly, like an idea nobody believes in anymore. Goodbye, little enemy. The floor will have you.",
    "Over the edge and into the Real! The kitchen floor is where everything goes that the counter cannot symbolise. Crumbs. Peas. And now, that poor thing.",
    "Hitchcock knew that the most terrible events happen just outside the frame. And now, just outside the frame, something meets the tiles. Suspense!",
    "The bubble drifts, the bubble pops, the enemy falls, the dog looks up. The dog is the only big Other in this house that actually exists.",
    "Down it goes, into the great beneath, where there is a dog and a single grape nobody has seen since last spring. It will not be lonely.",
    "Look at it float away, beautiful and helpless, over the edge. The most elegant cruelty. No violence. Only a gentle breeze and a very long way down.",
    "Over the edge of the known world! The old maps said, here be dragons. The kitchen maps say, here be dog.",
    "Soap, the ultimate soft power. Clean, gentle, transparent. It carries its enemies politely to the edge, and then it simply lets go.",
    "It floated away in its little bubble, and then: pop, and the Real. This is how every utopia ends.",
    "Pop, and down it goes, past the cupboard handles one by one, like the floors of a department store. Ground floor. Dog.",
    "It floated off the counter like a balloon at a birthday party. And like every balloon, it ended up under the table, forgotten, by Tuesday.",
    "Over the edge in a bubble. A soft deportation, clean, round, and smelling of lemons.",
    "It sailed off the counter and popped against the radiator. The radiator did not even notice. This is the world beyond the counter. Warm, and completely indifferent.",
    "The bubble carries it gently to the edge, and then lets go. Like a good teacher. Like a bad parent. The only difference is the landing.",
  ],
  roll: [
    "The paper towel promises to leave no trace. You are a trace. Read the manifesto before you vote.",
    "An unelected roll of paper is reorganizing public space. It calls this a clean mandate.",
    "Here it comes, the paper towel. It does not attack. It only cleans. And precisely this makes it unstoppable. Nobody ever resists being cleaned.",
    "The absorbent totality! It takes in the water, the sponges, the contradictions, everything. This is Hegel's Absolute, but in two ply.",
    "Look at it roll! And under that soft white surface, a cardboard tube, completely empty. Every totality is built around a hole. Run from this one.",
    "Oh no. The paper towel. The quicker picker-upper! What exactly does it pick up so quickly? You. It picks up you.",
    "A giant roll of kitchen paper. You know what they say: two ply, twice the absorbency. You know what I say? Two ply, twice the ideology.",
    "It rolls toward you with complete serenity. No eyes, no anger, only absorbency. The most dangerous enemy is the one that does not know it is your enemy.",
    "My God, the Quicker Picker-Upper! It absorbs everything! Your water, your puddles, your enemies, your hopes! It does not choose. It simply takes.",
    "It rolls toward the edge and cannot stop. No brakes, only momentum, absorbing everything in its path. I have written about this many times. It was never about paper towels.",
    "The roll! Get out of its way, or become its way! There is no third option! No, wait, there is a third option. It is called the floor.",
    "It rolls over friend and enemy with the same soft indifference. This is the only truly universal thing in the kitchen. Also, it is extremely absorbent.",
    "The Quicker Picker-Upper! So quick it picks you up before you have understood that you were a spill. You see, this is modern life. Cleaned up before you have even happened.",
    "Ah, the paper towel. Absorbent, disposable, perforated for your convenience. The perfect worker of our era. And it is rolling directly at you.",
    "A giant white scroll, and written on it, nothing. This is the book of the future. Blank, absorbent, and heading for the edge.",
    "Who unleashed the paper towel? This is not a weapon, it is a cleaning product. Which is to say, the worst weapon of all. The one with a clear conscience.",
    "Absolute Recoil! It flattens the sponges and flings you away like a thought you were not ready for. Nobody stands in front of the paper towel. Nobody.",
    "Look! The quicker picker-upper! The ultimate absorber. Even the sponges are afraid. It absorbs absorption itself.",
    "It unrolls a white carpet in front of itself, like a royal visit. Except the king is disposable, and the carpet is coming to wipe you.",
    "For years the paper towel hung on its holder beside the sink, watching. Only watching. Now it comes down to act. Every silent observer dreams of this day.",
    "The roll arrives and even the sponges scatter. Absorbers fear a bigger absorber. There is always a bigger fish, and this one is made of paper.",
    "Look at the little embossed flowers on every sheet! Somebody designed decorations for a thing whose only destiny is to become wet rubbish. This is the definition of art.",
    "A roll of kitchen paper as tall as the kettle! When absorbency gets this big, it stops being a product and becomes a landscape.",
    "Notice, it is the only thing in this kitchen without googly eyes. Who removed them? Or did it refuse them? The thing that does not look back is the thing to fear.",
  ],
  rollKill: [
    "Victory! But do not relax. Paper towels never come alone. They come in packs of six. Twelve for large families.",
    "Look at what remains. Only the cardboard tube. The paper towel was always organised around an absence. Like me. Like you. Like the fork. Oh no. I said fork.",
    "The paper towel is defeated! And look, it is still very absorbent. Death does not change anything essential about a paper towel. This is its tragedy and its strength.",
    "You beat a thing whose only purpose was to wipe you away. Congratulations. You have survived the cleaning. Most of us never do.",
    "Unrolled! Unspooled! Finished! And the cardboard tube remains, like the ruin of a very small empire. In a thousand years, archaeologists will study it. They will find nothing inside.",
    "You defeated the paper towel! The absorbent totality is torn! Somewhere in a supermarket, an entire aisle of pure ideology trembles.",
    "The roll is shredded, and all the water it drank is free again, running everywhere. You see, every revolution ends in a big puddle.",
    "The picker-upper has been picked apart! The absorbent, absorbed! Negation of the negation! Hegel would weep, and then look around for something to wipe his eyes.",
    "At the end of every roll comes the moment of truth, the last sheet, glued to the tube. Nobody talks about the last sheet. Today, we talk about the last sheet.",
    "Torn to wet confetti! The system is not overthrown, only littered all over the counter. But littering is a start.",
    "The Quicker Picker-Upper is now the slower lie-downer. Hegel would call this a reversal. Well, Hegel would call it something much longer. I call it a reversal.",
    "Kung Fu Panda! The Dragon Scroll is blank, and so is the paper towel. There is no secret ingredient. There was only ever you, and a lot of cardboard.",
    "You destroyed the paper towel. But somebody will just buy another roll. There is always another roll.",
    "You tore it along the perforation. The one place designed for tearing! Even its defeat was planned in advance by the manufacturer.",
    "Finished! Only the tube remains, and every child knows what the tube is for. A telescope! Look through it. The kitchen is now small, round, and a little sad.",
    "You defeated the paper towel with water. Water! The very thing it was built to erase. This is the revenge of the spill. Every spill in history salutes you.",
    "The paper towel is gone. Now who will clean up this mess? Nobody. The mess is sovereign now. Long live the mess.",
    "Soggy, torn, defeated. It absorbed so much that it could no longer hold itself together. I know this feeling. Every author of very long books knows this feeling.",

  rollLeft: [

  fork: [
    "I said there was no fork. I was working within the information available to me, which was entirely my own previous statements.",
    "Four prongs! Four! This is not an argument, this is an editorial board.",
    "No. No, no, no. This is not possible. The fork is the big Other, and the big Other does not exist! Who let it in? Who wrote this game?",
    "The fork exists! The spoons lied! The news lied! I lied! But I lied in good faith, which is the worst kind of lying, because then you believe it too!",
    "The spoons kept saying, I am not a fork, I am not a fork. Nobody asked them! This was the clue! The denial was the confession! Freud! It is always Freud!",
    "The return of the repressed! We repressed the fork so hard that it came back with four prongs and a health bar.",
    "Seen nowhere, suspiciously! The news ticker knew! The news ticker was the only honest journalist in this kitchen, and nobody listened to the news ticker!",
    "Everything I said is still true. It is only that now it is also stabbing you.",
    "A fork. A real fork. My whole system, forty years of books, collapsing on a kitchen counter. I would like to retract everything. Especially the long ones.",
    "Wait. Wait. If the fork exists, then the big Other exists, and if the big Other exists, somebody has been watching us this entire time. Taking notes. Stop jumping like that!",
    "The fork is the Real. It does not exist, it insists. And right now it is insisting very close to your face. Shoot it! Shoot the ontology!",
    "Everyone said there is no fork, and because everyone said it, the fork could grow in the silence. Nobody guards the door against something that does not exist.",
    "I told you there was no fork. I told you with such confidence. With footnotes! This is what happens when you take philosophers seriously. Never do it again. Starting now.",
    "Of course. Of course! The spoon was only ever a fork in denial. And the fork is a spoon that has stopped lying to itself. Look how free it is. Look how pointy.",
    "And the worst thing is not that it exists. The worst thing is how normal it looks. The Real never looks special. It just looks like a fork.",
    "This is the Kinder egg moment. You open the chocolate of ideology, expecting the little plastic toy, and inside there is a fork. There should never be a fork inside the egg!",
    "Four prongs! Why four? Why not three, or infinity? Because the Real is always a little too specific. Four prongs, and one of them slightly bent.",
    "I am having what the Hegelians would call a crisis, if they ever answered the phone. I am alone with a fork. Do something! I am busy collapsing.",
    "*sniff* My God. There is a fork. I need to sit down. There is nowhere to sit. It is a kitchen counter. Everything here is either a weapon or a sponge.",
    "The fork... exists? No. I built my whole theory on the absence of the fork! If the fork exists, then the big Other exists, and then, my God, I was simply wrong.",
    "This is a disaster. The fork was supposed to be a structural absence, a gap! And now it has eyes. Googly eyes! Nobody warned me that the Real has googly eyes.",
    "It is the Fork. It came from the drawer nobody opens, behind the lid drawer, behind the whisk that nobody uses. I thought it was a rumour. It was a filing system.",
    "Wait. If the fork exists, what else exists? The Tupperware lid that fits? The other oven glove? My God, now anything is possible!",
    "The spoons were a cover story! Little round decoys to stop us from looking for prongs. The whole cutlery drawer was an intelligence operation.",
    "I am not panicking. I am theorising extremely quickly. There is a difference. The difference is that I am also screaming.",
    "Look how it glints under the light of the extractor hood. It has been polished. By whom? For whom? Somebody has been preparing for this day.",
    "Forty years I said the fork is a structural illusion. And the fork has read none of my books. This is the worst review I have ever received.",
    "Look how it walks on its prongs, like four little legs. The fork has not only arrived. It has arrived with better posture than me.",
    "Everything is fine. Everything is perfectly fine. This is what the frog says in the saucepan, and what the philosopher says when the fork walks in.",
    "A fork! The objects have not only agency, they have a boss. New materialism never prepared me for middle management.",
  ],
  forkKill: [

    "We have returned to the original theory by destroying the counterexample. Excellent peer review.",
    "You killed the fork. Now it truly does not exist. You see? I was right all along, only a little early. Theory always arrives before the facts, like a nervous dinner guest.",
    "The fork is gone, and my theory is saved. Thank you. You did not do it for truth, you did it for points. But the effect on my theory is exactly the same.",
    "You killed the thing that does not exist. This is either the greatest victory in the history of philosophy, or you are very tired. Probably both.",
    "The fork is dead. And yet I can still feel it. A phantom fork. Amputated cutlery aches for years, you know.",
    "The fork is dead. The big Other is dead. Long live the big Other. Wait, that means another fork. Nobody say anything. Nobody say the word.",
    "You destroyed the fork, and order is restored. The fork does not exist again. This time with evidence. Keep the evidence. Hide the evidence. Both.",
    "No more fork. Now we can all return to the comfortable fiction. This is how ideology works. The impossible appears, we destroy it, and then we agree it was never here.",
    "A drop of water killed the fork. The Real, defeated by moisture. Hegel did not see this coming. Neither did the fork. Honestly, neither did I.",
    "It is over. The fork is scrap metal. The spoons can go back to saying they are not forks, and now, finally, it is only a little bit of a lie.",
    "The Fork is down, prongs bent in four directions. Now it is a sculpture. Stick it on the fridge with a magnet, as proof that I was only nearly wrong.",
    "Quickly, put it in the dishwasher! Nothing is ever found again in the dishwasher. It will be clean, forgotten, and theoretically nonexistent.",
    "You defeated the Fork, and now I can publish again. I will call it The Fork That Was Not: A Correction That Corrects Nothing.",
    "It is over. Shh. If anybody asks, it was a very aggressive spoon.",
    "The Fork falls with a clatter, the loudest sound a nonexistent object has ever made. The dog barks. Now even the dog believes in it. We are in trouble.",
    "Silent at last. And yet look how it lies there, pointing. Four prongs, all pointing at me. The dead are always the best at accusations.",
  ],
  gold: [
    "Look at it glitter! It is still a sponge. Same holes, same smell. But it is golden, and suddenly you want it more than your own dampness. Commodity fetishism, hopping away.",
    "Of course it runs from you. The paradox is, if it ever stopped running, it would be an ordinary yellow sponge. And sponges are already yellow!",
    "The Sublime Object of Ideology! With googly eyes! Running away! I wrote a whole book about this sponge, and I did not even know it existed.",
    "A golden sponge! Look how it runs! If it did not run, you would not want it. It knows this. It is the only sponge in the kitchen that has read Lacan.",
    "Gold! And your whole strategy collapses. Forget the enemies, forget survival, chase the shiny sponge! This is exactly how empires fall. Ask the Spanish.",
    "It glitters, it hops, it flees. You will chase it straight off the edge of the counter. I have seen people chase much stupider things. Promotions, for example.",
    "The golden sponge! The sublime object! You will never catch it, and precisely because you will never catch it, you will spend the entire wave trying!",
    "Objet petit a! The little golden nothing that turns your whole life into a chase! Run! It is worth a fortune, but only for as long as you do not have it!",
    "Nothing about this sponge is different. Same holes, same thirst. The value is not in the sponge. The value is in your eyes, chasing it. Stop chasing! No! Keep chasing!",
    "A golden sponge, the Kinder egg of the kitchen. Outside, gold. Inside, surprise, it is still just a sponge. But you must open it to find out. You must!",
    "Look how it flees! Like a cat from a bath, like meaning from a philosophy seminar. After it! Quickly, before it becomes a metaphor!",
    "The golden sponge! The sublime object of ideology! It is precious only because it runs away from you. Catch it!",
    "A golden sponge! It glitters like the foil on a chocolate coin. And you know what is inside the chocolate coin. Mostly disappointment, a little chocolate.",
    "Look at the other sponges looking at the golden one. They are not jealous. They are ashamed. Suddenly, being yellow is not good enough.",
    "It runs past the toaster, past the kettle, glittering in every chrome surface. You see it three times at once. Desire always multiplies its object in reflections.",
    "The golden sponge will never wash a single plate. It is too precious to work. This is the difference between an object and a treasure. The treasure has retired.",
    "Chase it! Leave your puddles, forget the spoons! This is how every gold rush ends. A lot of wet people in the wrong district, holding nothing.",
    "Every hop leaves a little glitter on the counter. The golden sponge will be gone in ten seconds. The glitter will be in the grout forever.",
  ],
  goldKill: [
    "The golden sponge is yours, and all its fortune. Tell me honestly, do you feel rich? No. You feel like chasing another one. This is the whole economy, in one sponge.",
    "Congratulations, the golden sponge. And now the terrible truth. It was yellow the whole time. It was the lighting. It is always the lighting.",
    "You got it! The golden sponge! Now look closely. It is exactly as absorbent as the yellow one. You killed for a colour. This is the history of art.",
    "Caught! And the price? Look at your health bar. You paid for the gold with your own water. Every treasure is paid for like this. Usually by somebody else.",
    "The golden sponge is dead, and it rains points. You feel happy. For one second. And then, what? Then you want the next one. Welcome to the economy.",
    "You caught the sublime object! And look, up close, it is just a sponge. A slightly shiny sponge. This is the tragedy of getting what you want.",
    "You have the golden sponge. The fortune is yours. The emptiness afterwards is also yours, free of charge.",
    "Caught! And immediately it turns into ordinary money. Desire does not die when you catch the object. It simply moves on to the next shiny thing, and so on, and so on.",
    "The sublime object, in your hands, turns out to be a sponge. The sublime is always like this. You get close, and it becomes kitchenware.",
    "You caught the thing that runs. But notice, now that it has stopped running, you do not want it anymore. You wanted the running.",
    "You caught the sublime object. And now, what is it? A dead sponge painted gold. This is always the tragedy of desire.",
    "You caught it, and the gold paint is already flaking off onto you. Now you are a little bit golden. Careful, soon you will start running away from yourself.",
    "The golden sponge is dead, and the other sponges hold a minute of silence. No, they do not. They are already dreaming of being golden next.",
    "Got it! Put it on the windowsill next to the basil, where precious things go to be ignored.",
    "You shot the treasure! Every pirate knows you do not shoot the treasure. You bury it, and then you lose the map. You skipped the most important steps.",
    "Caught! And now you know the secret. The gold was paint, and under the paint, crumbs. Every fortune is crumbs, somewhere underneath.",
    "The points arrive, the announcer squeals, and a small voice inside you asks, was that all? That small voice is me. I am always the small voice.",
  ],
  goldEscape: [
    "The golden sponge has relocated for tax purposes. Your disappointment remains taxable here.",
    "It got away. The financial press is calling this a successful exit.",
    "It ran away. Do not be sad. An object of desire that escapes is doing its job perfectly. It is the only employee in this kitchen who does.",
    "In Defense of Lost Causes! I will defend this sponge. It is lost. It is a cause. It is golden. What more do you want from a cause?",
    "It escaped! Good. A desire that is fulfilled dies. A desire that runs away lives forever. You have kept your desire alive. Thank you. The economy thanks you too.",
    "Gone! The golden sponge hopped away. Somewhere, in another kitchen, it will make somebody else very unhappy. This is the circulation of goods.",
    "It got away. Do not chase it. This is the most important lesson I can give you: never chase the golden sponge. I say this as a man who has chased it for fifty years.",
    "It escaped. Good. The sublime object must always escape. If you had caught it, you would have to live with it, and that is much, much worse.",
    "Gone. The golden sponge got away, and now you will think about it forever. It was never an object. It was the shape of your wanting.",
    "It escaped, and your desire survives intact. You see? Missing it was the real prize. You are richer than if you had caught it. Emotionally. Not in points.",
    "Somewhere behind the kettle, the golden sponge is glittering to itself. It does not miss you. The sublime never misses anyone. That is why it is sublime.",
    "It got away. Good! The object of desire must escape. If you catch it, you are disappointed. Now you can keep dreaming.",
    "It slipped behind the bread bin and vanished. The bread bin keeps many secrets. Old crusts, a lost key, and now a small fortune.",
    "It got away, and the dog below the counter looks up, hopeful. No. Not even the dog gets it. The sublime is not for dogs, and not for drops.",
    "It escaped down the plughole! The golden sponge is now circulating through the pipes of the city. Somewhere, a rat has become very rich.",
    "Gone. You will tell people about it for years, and every time it will be a little bigger, a little shinier. The fish that got away is always golden.",
    "Is it golden because it escapes, or does it escape because it is golden? I have thought about this for decades. The sponge thought about it for four seconds and left.",
    "Let it go. Somewhere at the far end of the counter it sits on the fruit bowl, alone, glittering, having escaped into total loneliness. That is the prize. That was always the prize.",
  ],
  mod_tap: [
    "Somebody left the tap on! Water from the heavens, free, endless, for everybody! This is communism! No, wait. It is only bad plumbing. What is the difference, really?",
    "Incontinence of the Void! The universe cannot hold its water, and neither, it seems, can this kitchen.",
    "The tap is on! Water falls from above like grace, like manna, like a leak you should really call a plumber about. Drink! It is free! Nothing is free!",
    "Rain in the kitchen! You see, the sponges love it too. Free water for everybody, including your enemies. This is the problem with every utopia.",
    "The tap is left on. The big Other forgot to turn off the water. It does not even exist, and still it manages to waste resources.",
    "Rain from the tap! Grace falling from above, and nobody asks who is paying the water bill. This is theology without economics.",
    "Abundance! And look how it makes everything worse. The sponges are delighted. You see, surplus always feeds the enemy first.",
    "Water falling from above, and every drop is a little you. Thousands of little yous. How does it feel to not be unique anymore? Welcome to modernity.",
    "Somebody walked away and left the tap running. Nobody is responsible. This is the purest form of power, the kind that is not even in the room.",
    "The tap is running, and the Coca-Cola principle applies. The more water falls, the thirstier the sponges get. Drink, drink, and never be satisfied. Look at them.",
    "Somebody left the tap on! Water falls from the sky and everybody gets stronger, especially the sponges. This is trickle-down economics, but it actually trickles.",
    "The tap is on, and nobody will turn it off, because everybody assumes somebody else will. The collective conscience, dripping straight into the dish rack.",
    "Listen to that drip, drip, drip on the limescale. Water torture! Invented by tyrants, perfected by landlords, and now it is a wave modifier.",
    "Free water falling on everyone, and look, the sponges are already fatter. Every generous system discovers this. The benefits go first to the most absorbent.",
    "Rain indoors! The kitchen has achieved its own weather. Next it will want a flag and a national anthem, probably hummed by the extractor fan.",
    "Who left the tap running? Nobody confesses. The tap itself cannot confess, it can only drip. Freud would say the drip is the confession.",
    "Drink from the sky while you can! Somewhere a water meter is spinning like a dervish, and one day a letter will arrive. Lacan says the letter always arrives.",
  ],
  mod_moon: [
    "The sponges hop so high now, so joyful. Nobody has told them there are no sinks on the moon. Ignorance, you know, is lighter than air.",
    "Low gravity! Finally the sponges experience the unbearable lightness of being. It does not suit them.",
    "Moon gravity! One small step for a drop, one giant hop for sponge kind. The flag is a paper towel.",
    "Everything floats! This is what happens when you remove gravity: no seriousness, only hopping. Like postmodernism, but in a kitchen.",
    "Moon Kitchen! Low gravity! Now everything floats. Especially ideology, which was never very heavy to begin with.",
    "On the moon a drop of water is the most precious thing there is. Suddenly you are valuable! Enjoy it. Gravity always comes back, and value always comes back down.",
    "Low gravity! The dream of the postmodern subject, freedom without weight. But notice, you cannot land anywhere. Freedom without weight is only floating.",
    "Now the hot sauce flies in slow, beautiful arcs. Even violence becomes elegant without gravity. This is the whole problem with aesthetics.",
    "The moon, the great symbol of romance! And here, in its gravity, a spoon drifts toward you at the speed of a sad balloon. This is love in our time.",
    "You jump, and you stay up there a long time, thinking. This is what philosophy is. A very long jump with nowhere to land.",
    "Moon gravity! Now the crumbs float up out of the toaster like tiny asteroids. The toaster has become a cosmology.",
    "Look, a spoon drifts past the fridge magnets, and the magnets do nothing. On the moon even attraction loses its conviction.",
    "Low gravity, and suddenly the edge of the counter is not a threat, only a suggestion. You still fall off, but slowly, with time to regret everything.",
    "The astronauts left footprints on the moon that will last a million years. You leave little wet rings on the chopping board. Which is the more honest monument?",
    "Everybody hops so high that the dog below the counter has started looking up. For the first time, the dog contemplates the heavens. This is how religion begins.",
    "Why do we dream of the moon? Because nothing there belongs to us. Now your own counter feels like that. Your kitchen, and you cannot even stand on it properly.",
  ],
  mod_googly: [
    "Googly overload! Now the eyes are bigger than the sponges. The gaze has eaten the object. This is Lacan, but also a children's craft project that went very wrong.",
    "Giant eyes, easier to hit! You see? The bigger the gaze, the easier the target. Remember this if you ever become famous.",
    "Look at those eyes! Enormous! They follow you everywhere. This is not a kitchen anymore. This is a surveillance state, with sponges.",
    "Bigger eyes! Easier to shoot! You see how the game helps you? It makes the victims more visible. Very generous. Very disturbing.",
    "The eyes! The eyes are enormous! This is the gaze in its purest form. Everything is looking at you, and nothing is seeing. It is only googly.",
    "Look at those eyes, giant, rolling, meaningless. The more eyes something has, the less it sees. Surveillance, but in plastic.",
    "In Hitchcock, an ordinary object becomes terrifying if the camera looks at it a little too long. Here it is the opposite. The objects look at you a little too long. Enormously.",
    "The secret of the googly eye is that it moves by itself, so it always seems to be looking at something. It never is. This is also the whole secret of charisma.",
    "My God, the eyes! And nobody is behind them! This is what is so horrible. The gaze without a subject. Like a security camera. Like a studio audience.",
    "The eyes! The eyes are enormous! Now the objects look back at you with full force. Lacan warned us. Nobody listened.",
    "The eyes have outgrown the sponges! Now it is a pair of giant eyes with a small sponge attached, like a tourist hanging off a camera.",
    "Giant googly eyes, and every one rattles like a maraca. The kitchen has become an orchestra of being looked at.",
    "Look how the enormous pupils roll! They cannot decide where to look, so they look everywhere at once. Like anybody holding a phone near a stove.",
    "The eyes are so big now I can see my own reflection in them. I look worried. I look googly. Is this who I have been all along? *sniff*",
    "When the eyes get this big, nobody sees the sponge anymore, only the look. Like a celebrity chef. You forget there was ever any food.",
    "Giant eyes on the spoons! A spoon already shows you upside down. Now it also stares. To be inverted and watched at the same time. This is adolescence.",
  ],
  mod_caffeine: [
    "Caffeinated! Everything faster! Finally the world is talking at my speed. Welcome, welcome, everybody, to my normal.",
    "Caffeinated sponges! They hop faster, drink faster, want you faster. Speed is not freedom. Speed is only anxiety with better marketing.",
    "Everybody is on coffee! The sponges, the spoons, even you. Faster, faster, and nobody knows where they are going. This is productivity.",
    "Caffeine! The drug of work! The only drug the boss pays for. Now even the kitchen is on it. Hop, hop, hop, like a startup.",
    "This is real coffee, with the caffeine. No more decaf ideology, the ritual without the danger. The danger is back, and it is hopping at you twice as fast.",
    "Everything speeds up. The sponges, the spoons, the sauce. This is how the modern economy feels from the inside. Like a hot sauce bottle on its third espresso.",
    "Desire has been given an espresso. And desire, my friend, never needed an espresso.",
    "Faster! Even the googly eyes are rolling faster! Nobody knows where anyone is going, but they are all getting there in record time. This is progress.",
    "Caffeine, the drug of productivity! Now the sponges will absorb you more efficiently, with better metrics. Somewhere, a manager is very proud of them.",
    "Everything is faster now. This is capitalism: the same meaningless activity, only more efficient.",
    "Caffeinated! The sponges are rattling like the lid on a boiling pot. Nobody knows what they want, but they want it right now.",
    "The spoons circle so fast they are stirring the air itself. Finally somebody has made a cup of coffee out of the whole kitchen.",
    "Look at the hot sauce bottles sprinting on their little stubby legs! Legs that short were never designed for ambition. Coffee does not care about design.",
    "Everything is on espresso, and the extractor fan still turns at exactly the same speed. The one worker who refuses to be accelerated. Solidarity with the fan!",
    "You know what caffeine gives you? Not more time. Only the feeling of having none. The sponges have discovered the deadline.",
    "Somewhere the coffee machine is laughing. Every morning it makes people as jittery as these sponges, and nobody has ever once shot it.",
  ],
  mod_rave: [
    "The kitchen has become a nightclub. The spoon is on the list. You are on the floor. The sponge owns the building.",
    "The sponges are dancing. Or maybe they are only hopping as usual, but with lighting. This is all of culture. The same hopping, better lighting.",
    "Lights, bass, sweat. Except there is no sweat, because you are the sweat. You are the only moisture on the dance floor. Careful. Everybody here is thirsty.",
    "A rave in the kitchen! Look at the lights! Everybody is having fun, and precisely because it is obligatory fun, it is the saddest thing I have ever seen.",
    "The bass is pumping, the sponges are dancing, the spoons are circling. Nobody is enjoying it. Everybody is performing enjoyment. Like every wedding.",
    "Kitchen rave! Flashing lights, pounding music! The superego's command to Enjoy, now delivered at one hundred and forty beats per minute!",
    "The hot sauce bottles flash pink, flash green. You cannot tell if they are attacking you or inviting you to dance. This is the ambiguity of every party.",
    "The music pounds, the lights flash, and you must have fun. You must! This is the tragedy of our time. Fun is compulsory, and nobody can find the light switch.",
    "Kitchen rave! Everyone is dancing, nobody is happy, and the spoons are lunging on the beat. This is what the end of a civilisation sounds like. Great tune, though.",
    "Now you see the sponge, now you do not. This is the Lacanian subject, flickering in and out of existence, but with a bass drop.",
    "A rave in the kitchen! The music tells you to enjoy, the lights tell you to enjoy. This is the superego with a subwoofer.",
    "A rave! And the dishwasher provides the bass line, as it always secretly wanted. Ten years of rinse cycles, and finally, an audience.",
    "The lights flash red, blue, red, and every sponge looks like a suspect in a police drama. On the dance floor, everybody is guilty.",
    "The bass is shaking the magnets off the fridge door. The shopping list falls to the floor. Nobody will buy milk tonight. This is the true meaning of the party.",
    "Why do people go to raves? To lose themselves. But you are one single drop. If you lose yourself, nothing is left. Dance carefully.",
    "The spoons circle you like dancers who want to tell you about their startup. You cannot escape. The music is too loud to say no.",
    "Strobe lights! Every movement becomes a series of still photographs. The sponge is here, then there. Zeno would say it never moves at all. Zeno never went clubbing.",
  ],
  mod_grease: [
    "The counter is greased! Everything slides. Welcome to the frictionless market, my friend. Nothing holds, nothing stops, and everybody ends up on the floor.",
    "Grease everywhere. This is the dream of the libertarian: no friction, no regulation, and the sponges slide straight into the abyss. Help them along.",
    "A greasy counter! You cannot walk, you can only skate. So do not walk. Become a puddle and surf! The grease is the ideology, and you are the drop that rides it.",
    "Oil on every surface. In my country we call this 'the transition'. Everybody slips, a few people slide very far, and they are never seen again.",
    "Slippery! The sponges are greasy too. Soap them, push them, let gravity finish the argument. On grease, the edge of the counter is the best critic.",
    "Deep-fried dialectics! Here is the lesson: on a slippery surface, the one who wins is not the strongest. It is the one who already lies flat.",
  ],
  mod_funsize: [
    "Smaller sponges! Same workload! Management has called this a leaner organization.",
    "Fun Size! Tiny sponges, twice as many! Like the fun size chocolate bar. Nobody ever asks, fun for whom? Not for you. Definitely not for you.",
    "Each little sponge drinks a little less, but there are so many more. This is not a reduction. This is a subscription model.",
    "Tiny sponges! So cute! Cuteness, you know, is the most effective weapon ever invented. You hesitate to shoot. They do not hesitate to drink.",
    "Mini sponges everywhere! The miniature is always ideological. A model railway, a doll's house, a fun size sponge. We shrink the world to believe we control it.",
    "Look at them, the little sponges, so cute, so many! This is how the system gets you. One big enemy you resist. Two hundred tiny ones you find adorable.",
    "The same quantity of evil, divided into smaller portions so you do not notice. This is the whole genius of the snack industry.",
    "Twice as many! Hegel says quantity turns into quality. Here quantity only turns into more quantity, which is its own quality. The quality of being annoying.",
    "You know what is not fun? The fun size. A whole chocolate bar reduced to a sad little sample. These sponges are the same. Small, sad, and very, very hungry.",
    "Tiny sponges! They look so surprised to be small. As would you, if somebody made you fun size without asking.",
    "Fun size! The sponges are small now. Tell me, who decided that smaller is more fun? Pure ideology.",
    "Tiny sponges, so small they can hide behind a crumb. For the first time in history, the crumb is the strategic high ground.",
    "Twice as many sponges, each one half the size. Mathematically, nothing has changed. Emotionally, it is a nursery school at snack time.",
    "They are the size of a tea bag now. A tea bag! And still they want to absorb you. Ambition does not shrink with the body.",
    "Look at them, like the crumbs you can never shake out of the toaster. You shake and shake, and there are always more. The toaster is infinite.",
    "Tiny targets! Now you must aim more carefully. Small things always do this to you. More work, less satisfaction. Like olives.",
    "Fun size! So small they could hide in the cutlery tray, between the teaspoons. Maybe they always lived there. Maybe the drawer was never only cutlery.",
  ],
  chal_bartleby_intro: [
    "Challenge: Bartleby! For six seconds, do not shoot. Not once. I would prefer not to, says Bartleby, and so will you. Hands off the trigger.",
    "Do not shoot for six seconds. In a shooting game! The most subversive thing you can do. It is also, I admit, a little boring. Be boring. Be magnificent.",
    "A challenge! For six seconds, do nothing with your trigger finger. Refuse! Resist by not resisting! This is the most radical move available to a gun.",
    "Bartleby! Do not shoot for six seconds. The most radical act. Not resisting, not obeying. Only preferring not to. Go! Or rather, do not go!",
    "Six seconds without shooting. The sponges expect violence. Give them nothing. Nothing is the most confusing weapon there is.",
    "New challenge! Six seconds, no shooting. You are not being passive. You are actively refusing. There is a huge difference, and the sponges will not notice it at all.",
    "The Bartleby challenge. For six seconds you would prefer not to shoot. Everything will beg you to shoot. Prefer not to. Very politely. For six seconds.",
    "A challenge for you. Do not shoot for six seconds. Like Bartleby: I would prefer not to. Can you prefer not to? I doubt it.",
    "Challenge! Six seconds, no shooting. Put down the seltzer. Look at the sponges. Let them wonder what you are planning. You are planning nothing.",
    "Bartleby challenge! For six seconds, hold your fire. The scrivener refused to copy. You refuse to squirt. Six seconds, starting now.",
    "Do not shoot for six seconds! A water pistol that does not fire is still a water pistol. Maybe more. The threat is always stronger than the shot.",
  ],

    "Magnificent! Six seconds of pure refusal. Bartleby would be proud of you, if he would prefer to be proud. He would not.",
    "Six seconds of nothing, perfectly executed. Doing nothing is the hardest thing in the world. Especially in a shooter. Especially for you.",

  chal_enjoy_intro: [

    "Enjoy! Eight enemies in twelve seconds! This is not a suggestion. This is the obscene command of the superego. Enjoy, or else!",

    "The superego commands you: Enjoy! Eight kills in twelve seconds. Go! Enjoy! This is an order!",
    "Challenge: Enjoy! Eight kills in twelve seconds! The kitchen is a buffet. Eat everything. Now. And smile while you do it.",

  chal_enjoy_win: [

    "Magnificent enjoyment! Obscene, excessive, efficient! You are the perfect subject of late capitalism. Congratulations. I am horrified.",
    "Eight kills. You enjoyed on command. Do you feel free? Of course not. But the points are real.",
    "Eight! In twelve seconds! The crumbs are shaking. You enjoyed so efficiently that it almost looked like work.",
    "Eight kills, fully enjoyed. The superego gives you a little star. Tomorrow it will ask why you did not get two stars.",
    "Success! You have enjoyed on command, which is the only way anybody enjoys anymore. Look at the counter. Look at all that joy, dripping.",
  ],
  chal_enjoy_fail: [

    "Time is up. Not enough enjoyment. Do not worry, nobody enjoys enough. There is not enough enjoyment in the whole world. This is why we invented shopping.",
    "Too slow! The superego says: you should have enjoyed faster. And then it says: why are you always in such a hurry? You cannot win against the superego.",
    "You did not enjoy enough! The paradox is that the more you are told to enjoy, the less you can. It is not your fault. Well. It is a little bit your fault.",
    "Too slow. You failed to enjoy on time. Somewhere, a tourist on a very expensive holiday knows exactly how you feel.",
    "You failed to enjoy! And now, guilt. You see how it works? First you must enjoy, then you feel guilty for not enjoying. The superego wins both ways.",
    "Not enough kills. You failed to enjoy. The superego is disappointed, and it has no interest in your excuses.",
