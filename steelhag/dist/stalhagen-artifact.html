  <script data-src="util.js">
'use strict';
// Small shared helpers: seeded randomness, 1-D noise, colour maths, canvases.

const TAU = Math.PI * 2;
const VIEW_W = 1280, VIEW_H = 720;

function rng32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeNoise(seed) {
  const r = rng32(seed), p = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) p[i] = r();
  return function (x) {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return p[i & 1023] * (1 - u) + p[(i + 1) & 1023] * u;
  };
}

function fbm(n, x, oct = 4) {
  let s = 0, a = 0.5, f = 1, t = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3); t += a; a *= 0.5; f *= 2.03; }
  return s / t;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const gauss = r => (r() + r() + r() - 1.5) / 1.5;

function hex(h) {
  if (Array.isArray(h)) return h;
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mix(a, b, t) { a = hex(a); b = hex(b); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function css(c, a = 1) { c = hex(c); return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function shade(c, k) { return k >= 0 ? mix(c, [255, 255, 255], k) : mix(c, [0, 0, 0], -k); }
function mono(c, r, amt) { c = hex(c); const d = (r() - 0.5) * amt; return [c[0] + d, c[1] + d, c[2] + d]; }
function jit(c, r, amt) { c = hex(c); return [c[0] + (r() - 0.5) * amt, c[1] + (r() - 0.5) * amt, c[2] + (r() - 0.5) * amt]; }

// In the painting worker there is no document, only OffscreenCanvas.
function makeCanvas(w, h) {
  w = Math.max(1, Math.ceil(w)); h = Math.max(1, Math.ceil(h));
  if (typeof document === 'undefined') return new OffscreenCanvas(w, h);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// Colour at height y from a list of [y, colour] stops.
function stopsAt(stops, y) {
  if (y <= stops[0][0]) return hex(stops[0][1]);
  for (let i = 1; i < stops.length; i++) {
    if (y <= stops[i][0]) {
      const t = (y - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
      return mix(stops[i - 1][1], stops[i][1], t);
    }
  }
  return hex(stops[stops.length - 1][1]);
}

  <script data-src="store.js">
'use strict';
// What the game remembers between visits: settings, how far you got, and the
// photographs. Storage can be missing or full; everything here fails quietly
// and the game plays the same without it.

const Store = (() => {
  const KEY = 'stalhagen.v1', ALBUM = 'stalhagen.album.v1';
  const touch = typeof window !== 'undefined' && ('ontouchstart' in window || navigator.maxTouchPoints > 0);
  const phone = touch && typeof screen !== 'undefined' && Math.min(screen.width, screen.height) < 600;
  const DEFAULT_KEYS = { left: 'KeyA', right: 'KeyD', jump: 'Space', photo: 'KeyE' };

  const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

  const saved = read(KEY) || {};
  const data = {
    // on phones the defaults favour legibility and calm
    settings: { large: phone, reduce: phone, muted: false, keys: { ...DEFAULT_KEYS }, ...(saved.settings || {}) },
    progress: { reached: 0, finished: false, ...(saved.progress || {}) },
  };
  data.settings.keys = { ...DEFAULT_KEYS, ...(data.settings.keys || {}) };

  // photographs: {key, chapter, x, caption, src}, and an Image for drawing
  const photos = (read(ALBUM) || []).filter(p => p && p.src).map(p => ({ ...p, img: toImage(p.src) }));

  function toImage(src) {
    if (typeof Image === 'undefined') return null;
    const img = new Image(); img.src = src; return img;
  }
  const save = () => write(KEY, { settings: data.settings, progress: data.progress });
  const saveAlbum = () => {
    const plain = photos.map(({ img, ...p }) => p);
    // if storage is full, keep what fits rather than nothing
    while (plain.length && !write(ALBUM, plain)) plain.shift();
  };
  const order = () => photos.sort((a, b) => a.chapter - b.chapter || a.x - b.x);
  order();

  return {
    DEFAULT_KEYS, phone,
    get settings() { return data.settings; },
    setting(name, value) { data.settings[name] = value; save(); },
    bind(action, code) { data.settings.keys[action] = code; save(); },
    resetKeys() { data.settings.keys = { ...DEFAULT_KEYS }; save(); },

    get reached() { return data.progress.reached; },
    get finished() { return data.progress.finished; },
    reach(i) { if (i > data.progress.reached) { data.progress.reached = i; save(); } },
    finish() { data.progress.finished = true; save(); },

    get photos() { return photos; },
    hasPhoto(key) { return photos.some(p => p.key === key); },
    // a canvas snapshot becomes a small JPEG; retaking a view replaces it
    keepPhoto(key, chapter, x, caption, canvas) {
      let src = null;
      try { src = canvas.toDataURL('image/jpeg', 0.8); } catch (e) { /* tainted or unsupported */ }
      const entry = { key, chapter, x, caption, src, img: src ? toImage(src) : canvas };
      const at = photos.findIndex(p => p.key === key);
      if (at >= 0) photos[at] = entry; else photos.push(entry);
      order();
      if (src) saveAlbum();
      return entry;
    },
  };
})();
</script>
  <script data-src="art.js">
'use strict';
// The paint box. Everything in the game is drawn from these procedures,
// once per chapter, into large offscreen canvases. Nothing is a bitmap.
// The look comes from three habits: many soft low-alpha dabs instead of flat
// fills, colours pulled toward the haze with distance, and one light source.

const Art = {};

Art.dab = (ctx, x, y, rx, ry, rot, c, a) => {
  ctx.fillStyle = css(c, a);
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.3, rx), Math.max(0.3, ry), rot, 0, TAU); ctx.fill();
};

Art.stroke = (ctx, x, y, len, w, ang, c, a) => {
  ctx.strokeStyle = css(c, a); ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); ctx.stroke();
};

Art.line = (ctx, x1, y1, x2, y2, w, c, a = 1) => {
  ctx.strokeStyle = css(c, a); ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
};

Art.blur = (canvas, px) => {
  const t = makeCanvas(canvas.width, canvas.height), tc = t.getContext('2d');
  if (!('filter' in tc)) return;
  tc.filter = `blur(${px}px)`; tc.drawImage(canvas, 0, 0);
  const c = canvas.getContext('2d');
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, canvas.width, canvas.height); c.drawImage(t, 0, 0); c.restore();
  t.width = 0;
};

// ------------------------------------------------------------------ sky
Art.sky = (ctx, W, top, pal, r) => {
  const g = ctx.createLinearGradient(0, -top, 0, VIEW_H);
  const span = VIEW_H + top;
  for (const [y, c] of pal.skyStops) g.addColorStop(clamp((y + top) / span, 0, 1), css(c));
  ctx.fillStyle = g; ctx.fillRect(0, -top, W, span);

  // long horizontal brush drags keep the gradient from looking digital
  for (let i = 0; i < W * 0.8; i++) {
    const y = -top + r() * span, x = r() * W;
    Art.stroke(ctx, x, y, 40 + r() * 160, 2 + r() * 7, (r() - 0.5) * 0.03, mono(stopsAt(pal.skyStops, y), r, 8), 0.12);
  }

  const sun = pal.sun;
  if (sun) {
    const sx = sun.x * W, sy = sun.y;
    let rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sun.glow);
    rg.addColorStop(0, css(sun.color, sun.glowA));
    rg.addColorStop(0.35, css(sun.color, sun.glowA * 0.35));
    rg.addColorStop(1, css(sun.color, 0));
    ctx.fillStyle = rg; ctx.fillRect(sx - sun.glow, sy - sun.glow, sun.glow * 2, sun.glow * 2);
    if (sun.disk) { Art.dab(ctx, sx, sy, sun.disk, sun.disk, 0, shade(sun.color, 0.6), sun.diskA ?? 0.95); }
  }

  for (const b of pal.clouds || []) {
    const light = hex(b.light), dark = hex(b.dark);
    // very faint dabs stall at different levels per 8-bit channel and tint the sky,
    // so trade count for opacity
    const ba = Math.max(b.a, 0.12), bn = b.n * b.a / ba;
    for (let i = 0; i < bn; i++) {
      const x = r() * W, y = b.y + gauss(r) * b.h;
      const t = clamp((y - (b.y - b.h)) / (2 * b.h), 0, 1);
      let c = mix(light, dark, Math.pow(t, b.curve || 1));
      if (sun) {
        const d = Math.hypot(x - sun.x * W, y - sun.y);
        c = mix(c, sun.rim || sun.color, clamp(1 - d / (b.sunReach || 420), 0, 1) * 0.7);
      }
      const rx = b.rx[0] + r() * (b.rx[1] - b.rx[0]);
      Art.dab(ctx, x, y, rx, rx * (b.flat || 0.16) * (0.6 + r() * 0.8), (r() - 0.5) * 0.05, mono(c, r, 8), ba);
    }
  }
};

// ------------------------------------------------------------------ land
// A silhouette from x0..x1 whose top is f(x); painted with texture strokes.
Art.ridge = (ctx, x0, x1, f, bottom, col, r, o = {}) => {
  col = hex(col);
  ctx.beginPath(); ctx.moveTo(x0, bottom);
  for (let x = x0; x <= x1 + 3; x += 3) ctx.lineTo(x, f(x));
  ctx.lineTo(x1, bottom); ctx.closePath();
  ctx.fillStyle = css(col); ctx.fill();
  if (o.tex) {
    ctx.save(); ctx.clip();
    const n = ((x1 - x0) * 40 / 1000 * o.tex) | 0;
    for (let i = 0; i < n * 25; i++) {
      const x = x0 + r() * (x1 - x0), top = f(x), y = top + Math.pow(r(), 1.5) * (bottom - top);
      const d = clamp((y - top) / 120, 0, 1);
      let c = o.topCol ? mix(o.topCol, col, d) : col;
      if (o.botCol) c = mix(c, o.botCol, clamp((y - top) / (o.botDepth || 300), 0, 1));
      Art.stroke(ctx, x, y, 6 + r() * 26, 1.5 + r() * 4, (r() - 0.5) * 0.3, jit(c, r, o.jit || 14), o.texA || 0.25);
    }
    ctx.restore();
  }
};

// Narrow Nordic spruce: a stack of drooping skirts.
Art.pine = (ctx, x, y, h, col, r, o = {}) => {
  const c = hex(col);
  ctx.fillStyle = css(c, o.a ?? 1);
  const tiers = Math.max(5, Math.min(26, (h / 5) | 0));
  const wide = (o.wide || 1) * (0.85 + r() * 0.3);
  ctx.beginPath();
  ctx.moveTo(x - 0.6, y - h * 1.03); ctx.lineTo(x + 0.6, y - h * 1.03); ctx.lineTo(x + 1.2, y - h * 0.8); ctx.lineTo(x - 1.2, y - h * 0.8); ctx.closePath();
  for (let j = 0; j < tiers; j++) {
    const t = j / tiers, yy = y - h + t * h * 0.9, dy = h / tiers * 1.9;
    const hw = (0.03 + Math.pow(t, 0.85) * 0.2) * h * wide * (0.75 + r() * 0.5);
    const sag = dy * (0.7 + r() * 0.5);
    ctx.moveTo(x, yy - 1);
    ctx.lineTo(x - hw, yy + sag); ctx.lineTo(x - hw * 0.4, yy + sag * 0.8);
    ctx.lineTo(x + hw * 0.4, yy + sag * 0.8); ctx.lineTo(x + hw * (0.8 + r() * 0.4), yy + sag * (0.9 + r() * 0.3));
    ctx.closePath();
  }
  ctx.fill();
  ctx.fillRect(x - Math.max(0.8, h * 0.012), y - h * 0.12, Math.max(1.6, h * 0.024), h * 0.12);
  if (o.light && h > 30) {
    // a lit edge on the sun side, and snow if it is winter
    const side = o.light;
    for (let j = 0; j < tiers; j++) {
      const t = j / tiers, yy = y - h + t * h * 0.9 + h / tiers * 1.2;
      const hw = (0.03 + Math.pow(t, 0.85) * 0.2) * h * wide * 0.8;
      Art.stroke(ctx, x, yy, hw * (0.6 + r() * 0.5), 1 + h * 0.008, side > 0 ? 0.35 : Math.PI - 0.35, o.lightCol, o.lightA ?? 0.35);
      if (o.snow && r() < 0.8) Art.stroke(ctx, x + (r() - 0.5) * hw, yy - 1, hw * 0.7, 1.4 + h * 0.01, side > 0 ? 0.25 : Math.PI - 0.25, o.snow, 0.8);
    }
  }
};

Art.branch = (ctx, x, y, len, ang, w, depth, col, r, a = 1) => {
  if (depth <= 0 || len < 1.5) return;
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  Art.line(ctx, x, y, x2, y2, Math.max(0.5, w), col, a);
  const n = 2 + (r() < 0.35 ? 1 : 0);
  for (let i = 0; i < n; i++) {
    Art.branch(ctx, x2, y2, len * (0.62 + r() * 0.22), ang + (r() - 0.5) * 1.15 - 0.05, w * 0.66, depth - 1, col, r, a);
  }
};

Art.bareTree = (ctx, x, y, h, col, r, a = 1) => {
  Art.line(ctx, x, y, x + (r() - 0.5) * h * 0.06, y - h * 0.35, h * 0.035, col, a);
  const bx = x, by = y - h * 0.3;
  for (let i = 0; i < 4; i++) Art.branch(ctx, bx, by, h * (0.28 + r() * 0.12), -Math.PI / 2 + (r() - 0.5) * 1.3, h * 0.022, 6, col, r, a);
};

// Birch: pale bark with black marks and a crown of small leaf dabs.
Art.birch = (ctx, x, y, h, pal, r, o = {}) => {
  const bark = hex(pal.bark), dark = hex(pal.barkDark), light = o.light || 1;
  const w = Math.max(1.2, h * (0.016 + r() * 0.008));
  const lean = (r() - 0.5) * 0.12, bend = (r() - 0.5) * h * 0.05;
  const px = t => x + lean * h * t + Math.sin(t * Math.PI) * bend;
  // trunk
  ctx.beginPath();
  for (let i = 0; i <= 12; i++) { const t = i / 12; ctx.lineTo(px(t) - w * (1 - t * 0.7), y - t * h); }
  for (let i = 12; i >= 0; i--) { const t = i / 12; ctx.lineTo(px(t) + w * (1 - t * 0.7), y - t * h); }
  ctx.closePath(); ctx.fillStyle = css(o.fade ? mix(bark, o.fade, o.fadeT) : bark); ctx.fill();
  if (h > 40) {
    // shadow side, marks, dark foot
    for (let i = 0; i < 12; i++) {
      const t = i / 12;
      Art.line(ctx, px(t) - light * w * 0.5 * (1 - t * 0.7), y - t * h, px(t + 1 / 12) - light * w * 0.5 * (1 - t * 0.7), y - (t + 1 / 12) * h, w * 0.7 * (1 - t * 0.6), pal.barkShade, 0.55);
    }
    const marks = (h / 6) | 0;
    for (let i = 0; i < marks; i++) {
      const t = r() * 0.85, ww = w * (1 - t * 0.7);
      Art.line(ctx, px(t) - ww * r(), y - t * h, px(t) + ww * (0.2 + r() * 0.6), y - t * h + (r() - 0.5), 0.8 + r() * h * 0.006, dark, 0.8);
    }
    ctx.fillStyle = css(dark, 0.85);
    ctx.beginPath(); ctx.moveTo(px(0) - w * 1.1, y);
    for (let i = 0; i < 6; i++) ctx.lineTo(px(i * 0.02) - w, y - i * h * 0.02 - r() * h * 0.03);
    for (let i = 5; i >= 0; i--) ctx.lineTo(px(i * 0.02) + w, y - i * h * 0.02 - r() * h * 0.02);
    ctx.lineTo(px(0) + w * 1.1, y); ctx.fill();
  }
  // branches & leaves
  const crown = o.bare ? 0 : 1;
  const leafN = crown * Math.min(1400, h * 4.6 * (o.leafy || 1));
  const tips = [];
  for (let i = 0; i < 7 + h / 20; i++) {
    const t = 0.35 + r() * 0.62, side = r() < 0.5 ? -1 : 1;
    const sx = px(t), sy = y - t * h, len = h * (0.1 + r() * 0.18) * (1.1 - t * 0.5);
    const ex = sx + side * len, ey = sy - len * (0.1 + r() * 0.5);
    ctx.strokeStyle = css(pal.barkShade, 0.5); ctx.lineWidth = Math.max(0.5, w * 0.2); ctx.beginPath();
    ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + side * len * 0.6, sy - len * 0.35, ex, ey + len * 0.1); ctx.stroke();
    tips.push([ex, ey, len]);
  }
  tips.push([px(0.98), y - h, h * 0.12]);
  if (!leafN) return;
  const L = hex(pal.leaf), LL = hex(pal.leafLight), LD = hex(pal.leafDark || shade(pal.leaf, -0.3));
  for (let i = 0; i < leafN; i++) {
    const tp = tips[(r() * tips.length) | 0];
    const lx = tp[0] + gauss(r) * tp[2] * 0.7, ly = tp[1] + gauss(r) * tp[2] * 0.55 + tp[2] * 0.2;
    const lit = clamp(0.5 + (lx - px(0.7)) / (h * 0.3) * light * 0.5 + (r() - 0.5) * 0.5 - (ly - (y - h)) / h * 0.3, 0, 1);
    const c = lit > 0.5 ? mix(L, LL, (lit - 0.5) * 2) : mix(LD, L, lit * 2);
    const s = Math.max(0.8, h * 0.014) * (0.6 + r() * 0.8);
    Art.dab(ctx, lx, ly, s, s * 0.8, 0, o.fade ? mix(c, o.fade, o.fadeT) : jit(c, r, 12), o.leafA ?? 0.8);
  }
};

// Lattice transmission tower. Returns the wire attachment points.
Art.pylon = (ctx, x, y, h, col, lw, a = 1) => {
  const c = hex(col), bw = h * 0.2, tw = h * 0.045, ty = y - h * 0.82;
  const L = t => [lerp(x - bw, x - tw, t), lerp(y, ty, t)], R = t => [lerp(x + bw, x + tw, t), lerp(y, ty, t)];
  ctx.strokeStyle = css(c, a); ctx.lineWidth = lw * 1.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(...L(0)); ctx.lineTo(...L(1)); ctx.lineTo(x, y - h); ctx.lineTo(...R(1)); ctx.lineTo(...R(0)); ctx.stroke();
  ctx.lineWidth = lw * 0.7; ctx.beginPath();
  const n = 7;
  for (let i = 0; i < n; i++) {
    const t0 = Math.pow(i / n, 0.8), t1 = Math.pow((i + 1) / n, 0.8);
    ctx.moveTo(...L(t0)); ctx.lineTo(...R(t1)); ctx.moveTo(...R(t0)); ctx.lineTo(...L(t1));
    ctx.moveTo(...L(t1)); ctx.lineTo(...R(t1));
  }
  ctx.stroke();
  const arms = [[y - h * 0.82, h * 0.34], [y - h * 0.93, h * 0.22]];
  const pts = [];
  ctx.lineWidth = lw * 1.2; ctx.beginPath();
  for (const [ay, aw] of arms) {
    ctx.moveTo(x - aw, ay); ctx.lineTo(x + aw, ay);
    ctx.moveTo(x - aw, ay); ctx.lineTo(x - tw, ay + h * 0.05); ctx.moveTo(x + aw, ay); ctx.lineTo(x + tw, ay + h * 0.05);
    pts.push([x - aw, ay + h * 0.03], [x + aw, ay + h * 0.03]);
  }
  ctx.stroke();
  ctx.lineWidth = lw * 0.8; ctx.beginPath();
  for (const p of pts) { ctx.moveTo(p[0], p[1] - h * 0.03); ctx.lineTo(p[0], p[1]); }
  ctx.stroke();
  return pts;
};

Art.wire = (ctx, x1, y1, x2, y2, sag, col, lw, a = 1) => {
  ctx.strokeStyle = css(col, a); ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + sag * 2, x2, y2); ctx.stroke();
};

// Wooden utility pole with a crossbar.
Art.pole = (ctx, x, y, h, col, lw) => {
  Art.line(ctx, x, y, x, y - h, lw, col);
  Art.line(ctx, x - h * 0.12, y - h * 0.92, x + h * 0.12, y - h * 0.92, lw * 0.7, col);
  return [[x - h * 0.1, y - h * 0.93], [x + h * 0.1, y - h * 0.93]];
};

// Hyperboloid cooling tower with its plume of steam.
Art.coolingTower = (ctx, x, y, h, pal, r, o = {}) => {
  const rb = h * 0.37, rw = h * 0.22, rt = h * 0.26, tw = 0.74;
  const k = tw / Math.sqrt((rb / rw) ** 2 - 1);
  const hw = t => rw * Math.sqrt(1 + ((t - tw) / k) ** 2);
  const base = hex(o.col), side = o.light || 1;
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) { const t = i / 40; ctx.lineTo(x - hw(t), y - t * h); }
  for (let i = 40; i >= 0; i--) { const t = i / 40; ctx.lineTo(x + hw(t), y - t * h); }
  ctx.closePath();
  const g = ctx.createLinearGradient(x - rb, 0, x + rb, 0);
  const lit = shade(base, o.lit ?? 0.18), drk = shade(base, -(o.dark ?? 0.25));
  g.addColorStop(0, css(side > 0 ? drk : lit)); g.addColorStop(0.5, css(base)); g.addColorStop(1, css(side > 0 ? lit : drk));
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  for (let i = 0; i < h * 1.2; i++) {
    const xx = x + (r() - 0.5) * rb * 2, yy = y - r() * h;
    Art.stroke(ctx, xx, yy, 5 + r() * h * 0.2, 1 + r() * 2, Math.PI / 2, jit(shade(base, -0.2), r, 10), 0.12);
  }
  for (let i = 1; i < 4; i++) Art.line(ctx, x - rb, y - h * i * 0.07, x + rb, y - h * i * 0.07, 0.8, shade(base, -0.3), 0.2);
  ctx.restore();
  ctx.fillStyle = css(shade(base, -0.45));
  ctx.beginPath(); ctx.ellipse(x, y - h, hw(1), Math.max(1, hw(1) * 0.08), 0, 0, TAU); ctx.fill();
  if (o.steam) Art.plume(ctx, x, y - h, hw(1), h, o.steam, r);
};

Art.plume = (ctx, x, y, w, h, s, r) => {
  const a0 = Math.max(s.a || 0.07, 0.12), n = (s.n || 260) * (s.a || 0.07) / a0;
  for (let i = 0; i < n; i++) {
    const t = Math.pow(r(), 0.8);
    const px = x + t * h * s.drift + gauss(r) * w * (0.5 + t * 1.4);
    const py = y - t * h * (s.rise || 0.9) + gauss(r) * w * 0.3 - w * 0.2;
    const rad = w * (0.45 + t * 1.3) * (0.6 + r() * 0.6);
    const shadeT = clamp(0.35 + gauss(r) * 0.3 + (s.lightDir || 1) * (px - x) / (w * 6) * 0.3, 0, 1);
    Art.dab(ctx, px, py, rad, rad * 0.7, 0, mix(s.dark, s.light, shadeT), a0 * (1 - t * 0.7));
  }
};

// A big smooth sphere with seams, lit from one side.
Art.sphere = (ctx, x, y, R, o) => {
  const lx = x + R * 0.45 * o.light, ly = y - R * 0.4;
  const g = ctx.createRadialGradient(lx, ly, R * 0.05, x, y, R);
  g.addColorStop(0, css(o.hi)); g.addColorStop(0.45, css(o.col)); g.addColorStop(0.92, css(o.dark)); g.addColorStop(1, css(o.rim || o.dark));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.clip();
  ctx.strokeStyle = css(o.seam, o.seamA ?? 0.3); ctx.lineWidth = Math.max(0.6, R * 0.006);
  for (let i = -3; i <= 3; i++) {
    const yy = y + i * R * 0.27;
    ctx.beginPath(); ctx.ellipse(x, yy, Math.sqrt(Math.max(0, R * R - (yy - y) ** 2)), R * 0.06, 0, 0, TAU); ctx.stroke();
  }
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(i) * R * 0.35, R, 0, 0, TAU); ctx.stroke(); }
  // reflection of the ground in the lower half
  const gr = ctx.createLinearGradient(0, y, 0, y + R);
  gr.addColorStop(0, css(o.ground || o.dark, 0)); gr.addColorStop(1, css(o.ground || o.dark, 0.45));
  ctx.fillStyle = gr; ctx.fillRect(x - R, y, R * 2, R);
  ctx.restore();
  if (o.rimLight) {
    ctx.strokeStyle = css(o.rimLight, 0.6); ctx.lineWidth = Math.max(1, R * 0.02);
    ctx.beginPath(); ctx.arc(x, y, R - R * 0.01, o.light > 0 ? -1.3 : Math.PI + 0.1, o.light > 0 ? 0.2 : Math.PI + 1.5); ctx.stroke();
  }
};

// A distant standing machine: a heavy hull carried on two jointed legs.
Art.walker = (ctx, x, y, h, col, r, o = {}) => {
  col = hex(col);
  const lw = h * 0.045, dark = shade(col, -0.18), side = o.light || 1;
  const hullW = h * 0.42, hullH = h * 0.2, hy = y - h * 0.8;
  const leg = (hx, dir, c) => {
    const kx = hx + dir * h * 0.11, ky = y - h * 0.42, fx = hx - dir * h * 0.02, fy = y;
    ctx.strokeStyle = css(c); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = lw * 1.3; ctx.beginPath(); ctx.moveTo(hx, hy + hullH * 0.7); ctx.lineTo(kx, ky); ctx.stroke();
    ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy - h * 0.04); ctx.stroke();
    // piston alongside the shin
    ctx.lineWidth = lw * 0.35; ctx.beginPath(); ctx.moveTo(kx - dir * lw, ky - h * 0.06); ctx.lineTo(fx + dir * lw * 1.2, fy - h * 0.12); ctx.stroke();
    Art.dab(ctx, kx, ky, lw * 0.95, lw * 0.95, 0, shade(c, -0.1), 1);
    Art.dab(ctx, hx, hy + hullH * 0.7, lw * 1.1, lw * 1.1, 0, c, 1);
    ctx.fillStyle = css(c);
    ctx.beginPath(); ctx.moveTo(fx - h * 0.06, fy); ctx.lineTo(fx - h * 0.04, fy - h * 0.045); ctx.lineTo(fx + h * 0.04, fy - h * 0.045); ctx.lineTo(fx + h * 0.065, fy); ctx.fill();
  };
  leg(x + hullW * 0.18, -1, dark);
  leg(x - hullW * 0.2, 1, col);
  // hull: a slab with a chamfered nose
  const L = x - hullW / 2, R = x + hullW / 2;
  ctx.fillStyle = css(col);
  ctx.beginPath();
  ctx.moveTo(L, hy + hullH * 0.15); ctx.lineTo(L + hullW * 0.08, hy); ctx.lineTo(R - hullW * 0.2, hy - hullH * 0.05);
  ctx.lineTo(R, hy + hullH * 0.35); ctx.lineTo(R - hullW * 0.06, hy + hullH * 0.8); ctx.lineTo(L + hullW * 0.1, hy + hullH);
  ctx.lineTo(L, hy + hullH * 0.8); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  const g = ctx.createLinearGradient(0, hy, 0, hy + hullH);
  g.addColorStop(0, css(shade(col, 0.1), 0.6)); g.addColorStop(0.5, css(col, 0)); g.addColorStop(1, css(shade(col, -0.25), 0.8));
  ctx.fillStyle = g; ctx.fillRect(L, hy - hullH, hullW, hullH * 2.2);
  ctx.strokeStyle = css(shade(col, -0.25), 0.7); ctx.lineWidth = Math.max(0.6, h * 0.003);
  ctx.beginPath();
  for (let i = 1; i < 6; i++) { const px = L + hullW * i / 6; ctx.moveTo(px, hy - 5); ctx.lineTo(px + hullW * 0.02, hy + hullH); }
  ctx.moveTo(L, hy + hullH * 0.55); ctx.lineTo(R, hy + hullH * 0.55);
  ctx.stroke();
  if (o.stripes) { ctx.fillStyle = css(o.stripes, 0.6); ctx.fillRect(L, hy + hullH * 0.6, hullW, hullH * 0.08); }
  ctx.restore();
  // a turret/cab, antennae, lights
  ctx.fillStyle = css(shade(col, 0.03));
  ctx.beginPath(); ctx.roundRect(x - hullW * 0.1, hy - hullH * 0.45, hullW * 0.32, hullH * 0.48, h * 0.01); ctx.fill();
  ctx.fillStyle = css(shade(col, -0.35)); ctx.fillRect(x + hullW * 0.02, hy - hullH * 0.33, hullW * 0.16, hullH * 0.12);
  Art.line(ctx, x - hullW * 0.05, hy - hullH * 0.45, x - hullW * 0.08, hy - h * 0.2, Math.max(0.6, h * 0.004), col);
  Art.line(ctx, x + hullW * 0.15, hy - hullH * 0.45, x + hullW * 0.17, hy - h * 0.13, Math.max(0.6, h * 0.003), col);
  if (o.lit) {
    ctx.strokeStyle = css(o.lit, 0.5); ctx.lineWidth = Math.max(1, h * 0.005);
    ctx.beginPath();
    if (side < 0) { ctx.moveTo(L + 1, hy + hullH * 0.8); ctx.lineTo(L + 1, hy + hullH * 0.15); ctx.lineTo(L + hullW * 0.08, hy + 1); ctx.lineTo(R - hullW * 0.2, hy - hullH * 0.05 + 1); }
    else { ctx.moveTo(L + hullW * 0.08, hy + 1); ctx.lineTo(R - hullW * 0.2, hy - hullH * 0.05 + 1); ctx.lineTo(R - 1, hy + hullH * 0.35); ctx.lineTo(R - hullW * 0.06, hy + hullH * 0.8); }
    ctx.stroke();
  }
  // cables hanging from the belly
  for (let i = 0; i < 4; i++) {
    const cx = L + hullW * (0.2 + r() * 0.6);
    Art.wire(ctx, cx, hy + hullH * 0.9, cx + hullW * 0.1, hy + hullH * 0.95, h * 0.03, shade(col, -0.2), Math.max(0.5, h * 0.003));
  }
  if (o.lamp) { Art.dab(ctx, R - hullW * 0.04, hy + hullH * 0.4, h * 0.01, h * 0.01, 0, o.lamp, 1); }
};

// ---------------------------------------------------------------- props
// Weathered steel plate: panels, rivets, rust running down from the seams.
Art.metal = (ctx, x, y, w, h, base, r, o = {}) => {
  base = hex(base);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, css(shade(base, o.topLit ?? 0.12))); g.addColorStop(1, css(shade(base, -0.28)));
  ctx.fillStyle = g;
  const rr = o.round || 0;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, rr) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.save(); ctx.clip();
  const rust = hex(o.rust || '#8a4a2a');
  for (let i = 0; i < w * h / 90; i++) {
    const xx = x + r() * w, yy = y + r() * h;
    Art.stroke(ctx, xx, yy, 3 + r() * 16, 1 + r() * 3, Math.PI / 2 + (r() - 0.5) * 0.1, jit(r() < 0.35 ? rust : shade(base, (r() - 0.5) * 0.3), r, 16), 0.16);
  }
  const pw = o.panel || 48;
  ctx.strokeStyle = css(shade(base, -0.45), 0.55); ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let px = x + pw; px < x + w - 6; px += pw) { ctx.moveTo(px, y); ctx.lineTo(px, y + h); }
  if (h > 50) for (let py = y + (o.panelH || 40); py < y + h - 6; py += (o.panelH || 40)) { ctx.moveTo(x, py); ctx.lineTo(x + w, py); }
  ctx.stroke();
  ctx.strokeStyle = css(shade(base, 0.25), 0.35); ctx.beginPath();
  for (let px = x + pw + 1.5; px < x + w - 6; px += pw) { ctx.moveTo(px, y); ctx.lineTo(px, y + h); }
  ctx.stroke();
  for (let px = x + pw; px < x + w - 6; px += pw) {
    for (let k = 0; k < 6; k++) {
      Art.stroke(ctx, px + (r() - 0.5) * 3, y + r() * h * 0.6, 8 + r() * 40, 1.5 + r() * 2.5, Math.PI / 2, rust, 0.22);
    }
  }
  if (o.stripes) {
    const sy = y + (o.stripeY ?? 6), sh = o.stripeH || 14;
    ctx.fillStyle = css(o.stripes[0]); ctx.fillRect(x, sy, w, sh);
    ctx.save(); ctx.beginPath(); ctx.rect(x, sy, w, sh); ctx.clip();
    ctx.fillStyle = css(o.stripes[1]);
    for (let sx = x - sh; sx < x + w + sh; sx += sh * 2) { ctx.beginPath(); ctx.moveTo(sx, sy + sh); ctx.lineTo(sx + sh, sy); ctx.lineTo(sx + sh * 2, sy); ctx.lineTo(sx + sh, sy + sh); ctx.fill(); }
    for (let i = 0; i < w / 3; i++) Art.stroke(ctx, x + r() * w, sy + r() * sh, 2 + r() * 6, 1 + r() * 2, 0, shade(base, -0.3), 0.25);
    ctx.restore();
  }
  if (o.label) {
    ctx.font = `bold ${o.labelSize || 16}px "Arial Narrow", Arial, sans-serif`;
    ctx.fillStyle = css(o.labelCol || '#e8e2d2', 0.7);
    ctx.fillText(o.label, x + (o.labelX ?? 10), y + (o.labelY ?? h * 0.6));
  }
  ctx.fillStyle = css(shade(base, -0.5), 0.5);
  if (o.rivets !== false) for (let px = x + 6; px < x + w - 3; px += 12) { ctx.fillRect(px, y + 4, 2, 2); ctx.fillRect(px, y + h - 6, 2, 2); }
  // grime at the foot
  const gg = ctx.createLinearGradient(0, y + h * 0.6, 0, y + h);
  gg.addColorStop(0, css(o.grime || '#2a2420', 0)); gg.addColorStop(1, css(o.grime || '#2a2420', 0.45));
  ctx.fillStyle = gg; ctx.fillRect(x, y + h * 0.6, w, h * 0.4);
  ctx.restore();
  // a thin highlight on the top edge
  Art.line(ctx, x + 2, y + 1, x + w - 2, y + 1, 1.5, shade(base, 0.4), 0.5);
  if (o.snow) Art.snowCap(ctx, x, y, w, o.snow, r);
  if (o.moss) Art.mossCap(ctx, x, y, w, o.moss, r);
};

Art.snowCap = (ctx, x, y, w, snow, r, depth = 7) => {
  const s = hex(snow.c || snow), sh = hex(snow.s || shade(s, -0.25));
  ctx.fillStyle = css(sh);
  ctx.beginPath(); ctx.moveTo(x - 2, y + 2);
  for (let xx = x - 2; xx <= x + w + 2; xx += 4) ctx.lineTo(xx, y - depth * (0.6 + 0.4 * Math.sin((xx - x) / w * Math.PI)) + (r() - 0.5) * 2);
  ctx.lineTo(x + w + 2, y + 2);
  for (let xx = x + w; xx >= x; xx -= 6) ctx.lineTo(xx, y + 2 + r() * 4 + (r() < 0.1 ? r() * 8 : 0));
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = css(s);
  ctx.beginPath(); ctx.moveTo(x - 1, y);
  for (let xx = x - 1; xx <= x + w + 1; xx += 4) ctx.lineTo(xx, y - depth * (0.7 + 0.3 * Math.sin((xx - x) / w * Math.PI)) + (r() - 0.5) * 1.5 - 1);
  ctx.lineTo(x + w + 1, y); ctx.closePath(); ctx.fill();
};

Art.mossCap = (ctx, x, y, w, moss, r) => {
  for (let i = 0; i < w * 1.2; i++) {
    const xx = x + r() * w, yy = y - 1 + Math.abs(gauss(r)) * 8;
    Art.dab(ctx, xx, yy, 1.5 + r() * 3, 1 + r() * 2, 0, jit(r() < 0.5 ? moss[0] : moss[1], r, 20), 0.7);
  }
};

// Silage bale wrapped in plastic — the white marshmallows of the Swedish field.
Art.bale = (ctx, x, y, w, h, o, r) => {
  const c = hex(o.c || '#dfe3df');
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, css(shade(c, 0.1))); g.addColorStop(0.55, css(c)); g.addColorStop(1, css(shade(c, -0.35)));
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(w, h) * 0.3); ctx.fill();
  for (let i = 0; i < 12; i++) Art.stroke(ctx, x + 6 + r() * (w - 12), y + 4, h * (0.4 + r() * 0.5), 1, Math.PI / 2, shade(c, -0.2), 0.25);
  Art.stroke(ctx, x + w * 0.2, y + h * 0.25, w * 0.5, 3, 0, '#ffffff', 0.5);
  if (o.snow) Art.snowCap(ctx, x + 4, y + 2, w - 8, o.snow, r, 5);
};

// Boxy 240-style estate car.
Art.car = (ctx, x, y, w, o, r) => {
  const s = w / 150, c = hex(o.c);
  const P = (px, py) => [x + px * s, y - py * s];
  ctx.fillStyle = css(shade(c, -0.1));
  ctx.beginPath();
  for (const p of [[0, 12], [2, 30], [30, 33], [44, 52], [128, 52], [150, 34], [150, 12]]) ctx.lineTo(...P(...p));
  ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(0, y - 52 * s, 0, y);
  g.addColorStop(0, css(shade(c, 0.15))); g.addColorStop(1, css(shade(c, -0.35)));
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = css(o.glass);
  ctx.beginPath(); for (const p of [[48, 49], [80, 49], [80, 35], [36, 35]]) ctx.lineTo(...P(...p)); ctx.fill();
  ctx.beginPath(); for (const p of [[84, 49], [125, 49], [140, 35], [84, 35]]) ctx.lineTo(...P(...p)); ctx.fill();
  Art.line(ctx, ...P(38, 36), ...P(62, 48), 2 * s, '#ffffff', 0.25);
  Art.line(ctx, ...P(2, 22), ...P(150, 22), 1.2, shade(c, -0.4), 0.7);
  ctx.fillStyle = css('#d8d0b8'); ctx.fillRect(...P(0, 26), 4 * s, 6 * s);
  ctx.fillStyle = css('#a33a2a'); ctx.fillRect(...P(146, 30), 4 * s, 10 * s);
  for (const wx of [28, 122]) {
    Art.dab(ctx, ...P(wx, 10), 12 * s, 12 * s, 0, '#1b1c1e', 1);
    Art.dab(ctx, ...P(wx, 10), 5 * s, 5 * s, 0, '#8d8f8c', 1);
  }
  if (o.snow) { Art.snowCap(ctx, ...P(44, 52), 84 * s, o.snow, r, 6); Art.snowCap(ctx, ...P(2, 33), 28 * s, o.snow, r, 4); }
};

// Falu-red wooden house with white trim and a warm window.
Art.house = (ctx, x, y, w, h, o, r) => {
  const wall = hex(o.wall), roofH = h * 0.55;
  ctx.fillStyle = css(wall); ctx.fillRect(x, y - h, w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y - h, w, h); ctx.clip();
  for (let bx = x; bx < x + w; bx += 5) Art.line(ctx, bx, y - h, bx, y, 1, shade(wall, -0.3), 0.35);
  for (let i = 0; i < w * h / 60; i++) Art.stroke(ctx, x + r() * w, y - r() * h, 4 + r() * 12, 2, Math.PI / 2, jit(wall, r, 30), 0.2);
  ctx.restore();
  ctx.fillStyle = css(o.roof);
  ctx.beginPath(); ctx.moveTo(x - w * 0.06, y - h); ctx.lineTo(x + w / 2, y - h - roofH); ctx.lineTo(x + w * 1.06, y - h); ctx.fill();
  if (o.snow) {
    ctx.fillStyle = css(o.snow);
    ctx.beginPath(); ctx.moveTo(x - w * 0.07, y - h + 1); ctx.lineTo(x + w / 2, y - h - roofH - 2); ctx.lineTo(x + w * 1.07, y - h + 1);
    ctx.lineTo(x + w * 1.0, y - h + 4); ctx.lineTo(x + w / 2, y - h - roofH + 5); ctx.lineTo(x - w * 0.0, y - h + 4); ctx.fill();
  }
  Art.line(ctx, x + 1, y - h, x + 1, y, 2.5, o.trim); Art.line(ctx, x + w - 1, y - h, x + w - 1, y, 2.5, o.trim);
  const wn = Math.max(1, Math.round(w / 45));
  for (let i = 0; i < wn; i++) {
    const wx = x + (i + 0.5) * w / wn - 7, wy = y - h * 0.65;
    ctx.fillStyle = css(o.trim); ctx.fillRect(wx - 2, wy - 2, 18, 22);
    ctx.fillStyle = css(o.window || '#3a4450'); ctx.fillRect(wx, wy, 14, 18);
    Art.line(ctx, wx + 7, wy, wx + 7, wy + 18, 1.5, o.trim); Art.line(ctx, wx, wy + 9, wx + 14, wy + 9, 1.5, o.trim);
  }
  // chimney
  ctx.fillStyle = css(shade(o.roof, 0.1)); ctx.fillRect(x + w * 0.7, y - h - roofH * 0.75, w * 0.07, roofH * 0.45);
};

Art.rock = (ctx, x, y, w, h, o, r) => {
  const c = hex(o.c), n = 11, pts = [];
  for (let i = 0; i <= n; i++) {
    const a = Math.PI + i / n * Math.PI;
    const rr = 0.85 + r() * 0.2;
    pts.push([x + w / 2 + Math.cos(a) * w / 2 * rr, y + h + Math.sin(a) * h * rr * (i === 0 || i === n ? 0 : 1)]);
  }
  ctx.beginPath(); pts.forEach(p => ctx.lineTo(...p)); ctx.closePath();
  const g = ctx.createLinearGradient(x + (o.light > 0 ? w : 0), y, x + (o.light > 0 ? 0 : w), y + h);
  g.addColorStop(0, css(shade(c, 0.25))); g.addColorStop(0.5, css(c)); g.addColorStop(1, css(shade(c, -0.4)));
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  for (let i = 0; i < w * h / 30; i++) Art.dab(ctx, x + r() * w, y + r() * h, 1 + r() * 4, 1 + r() * 2.5, r() * 3, jit(shade(c, (r() - 0.5) * 0.35), r, 12), 0.35);
  if (o.lichen) for (let i = 0; i < w * h / 200; i++) Art.dab(ctx, x + r() * w, y + r() * h * 0.6, 1 + r() * 3, 1 + r() * 2, 0, o.lichen, 0.35);
  for (let i = 0; i < 3; i++) Art.line(ctx, x + r() * w, y + r() * h * 0.3, x + r() * w, y + h * (0.5 + r() * 0.5), 0.8, shade(c, -0.5), 0.4);
  ctx.restore();
  if (o.snow) Art.snowCap(ctx, x + w * 0.15, y + h * 0.1, w * 0.7, o.snow, r, 6);
  if (o.moss) Art.mossCap(ctx, x + w * 0.2, y + h * 0.08, w * 0.6, o.moss, r);
};

Art.log = (ctx, x, y, w, h, o, r) => {
  const c = hex(o.c);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, css(shade(c, 0.2))); g.addColorStop(0.5, css(c)); g.addColorStop(1, css(shade(c, -0.45)));
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  for (let i = 0; i < w / 4; i++) Art.stroke(ctx, x + r() * w, y + 2 + r() * (h - 4), 4 + r() * 12, 1, 0, jit(o.mark || shade(c, -0.5), r, 10), 0.6);
  Art.dab(ctx, x + w - h * 0.2, y + h / 2, h * 0.22, h * 0.45, 0, o.end || '#c7b58f', 1);
  if (o.moss) Art.mossCap(ctx, x + 6, y + 2, w - 12, o.moss, r);
  if (o.snow) Art.snowCap(ctx, x + 4, y + 2, w - 8, o.snow, r, 5);
};

Art.plank = (ctx, x, y, w, h, o, r) => {
  const c = hex(o.c);
  for (let px = x; px < x + w; px += 22) {
    const pw = Math.min(21, x + w - px);
    ctx.fillStyle = css(mono(c, r, 18)); ctx.fillRect(px, y, pw, h);
    Art.line(ctx, px, y + h, px + pw, y + h, 1.5, shade(c, -0.5), 0.6);
    Art.line(ctx, px, y + 1, px + pw, y + 1, 1, shade(c, 0.3), 0.5);
  }
};

Art.concrete = (ctx, x, y, w, h, o, r) => {
  const c = hex(o.c);
  ctx.fillStyle = css(c); ctx.fillRect(x, y, w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  for (let i = 0; i < w * h / 70; i++) Art.stroke(ctx, x + r() * w, y + r() * h, 2 + r() * 14, 1 + r() * 3, Math.PI / 2 + (r() - 0.5) * 0.3, jit(shade(c, (r() - 0.6) * 0.3), r, 10), 0.18);
  for (let i = 0; i < w / 30; i++) Art.stroke(ctx, x + r() * w, y, 10 + r() * h * 0.7, 2 + r() * 5, Math.PI / 2, shade(c, -0.35), 0.15);
  ctx.strokeStyle = css(shade(c, -0.4), 0.4); ctx.lineWidth = 1;
  ctx.beginPath(); for (let px = x + 80; px < x + w; px += 80) { ctx.moveTo(px, y); ctx.lineTo(px, y + h); } ctx.stroke();
  const gg = ctx.createLinearGradient(0, y, 0, y + h);
  gg.addColorStop(0, css('#000', 0)); gg.addColorStop(1, css('#000', 0.35));
  ctx.fillStyle = gg; ctx.fillRect(x, y, w, h);
  ctx.restore();
  Art.line(ctx, x, y + 1, x + w, y + 1, 1.5, shade(c, 0.3), 0.6);
  if (o.snow) Art.snowCap(ctx, x, y, w, o.snow, r, 5);
};

Art.pipe = (ctx, x, y, w, h, o, r) => {
  const c = hex(o.c);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, css(shade(c, -0.2))); g.addColorStop(0.3, css(shade(c, 0.3))); g.addColorStop(0.6, css(c)); g.addColorStop(1, css(shade(c, -0.5)));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  for (let px = x + 30; px < x + w; px += 90) { ctx.fillStyle = css(shade(c, -0.3)); ctx.fillRect(px, y - 2, 8, h + 4); }
  for (let i = 0; i < w / 8; i++) Art.stroke(ctx, x + r() * w, y + h * 0.5, 3 + r() * 8, 1 + r() * 2, Math.PI / 2, o.rust || '#7a4428', 0.2);
  if (o.snow) Art.snowCap(ctx, x, y, w, o.snow, r, 4);
};

Art.reeds = (ctx, x, y, h, col, r, n = 18, a = 1) => {
  for (let i = 0; i < n; i++) {
    const bx = x + gauss(r) * h * 0.25, hh = h * (0.5 + r() * 0.6), lean = (r() - 0.4) * h * 0.25;
    ctx.strokeStyle = css(jit(col, r, 20), a); ctx.lineWidth = 0.8 + r() * 1.2;
    ctx.beginPath(); ctx.moveTo(bx, y); ctx.quadraticCurveTo(bx + lean * 0.2, y - hh * 0.6, bx + lean, y - hh); ctx.stroke();
    if (r() < 0.3) Art.dab(ctx, bx + lean, y - hh - 3, 1.6, 5, lean / hh, shade(col, -0.35), a);
  }
};

Art.grass = (ctx, x, y, h, col, r, n = 10, a = 0.8) => {
  for (let i = 0; i < n; i++) {
    const bx = x + (r() - 0.5) * h * 0.8, hh = h * (0.4 + r() * 0.7);
    Art.stroke(ctx, bx, y + 2, hh, 0.8 + r() * 1.3, -Math.PI / 2 + (r() - 0.5) * 0.7, jit(col, r, 26), a);
  }
};

Art.fence = (ctx, x0, x1, fy, col, r, o = {}) => {
  const gap = o.gap || 46;
  let prev = null;
  for (let x = x0; x < x1; x += gap * (0.85 + r() * 0.3)) {
    const y = fy(x), h = (o.h || 30) * (0.85 + r() * 0.3), lean = (r() - 0.5) * 3;
    Art.line(ctx, x, y + 2, x + lean, y - h, o.w || 3, col);
    if (o.snow) Art.dab(ctx, x + lean, y - h - 1, 2.5, 1.6, 0, o.snow, 1);
    if (prev) for (const k of [0.3, 0.65]) Art.wire(ctx, prev[0], prev[1] - prev[2] * k, x + lean * k, y - h * k, 2, o.wireCol || col, 0.8, 0.8);
    prev = [x, y, h];
  }
};

// Soft fog texture used live, scrolled between parallax layers.
Art.fogTexture = (w, h, seed) => {
  const c = makeCanvas(w, h), ctx = c.getContext('2d'), r = rng32(seed);
  for (let i = 0; i < 380; i++) {
    const x = r() * w, y = h * 0.5 + gauss(r) * h * 0.22, rx = 40 + r() * 180;
    for (const dx of [-w, 0, w]) Art.dab(ctx, x + dx, y, rx, rx * 0.22, 0, '#ffffff', 0.05);
  }
  return c;
};

  <script data-src="world.js">
'use strict';
// A chapter turned into something you can stand on and something you can look at.

const LAYER_DEFS = [
  { key: 'sky', f: 0.03, blur: 0 },
  { key: 'far', f: 0.13, blur: 2.1 },
  { key: 'mid', f: 0.32, blur: 1.05 },
  { key: 'near', f: 0.6, blur: 0.4 },
  { key: 'play', f: 1, blur: 0 },
];

class World {
  constructor(L) {
    this.L = L;
    this.W = L.width;
    this.top = L.top || 200;
    this.noise = makeNoise(L.seed * 7 + 3);
    this.solids = [];
    this.movers = [];
    this.lamps = (L.lamps || []).slice();
    this.buildObjects();
  }

  // --- ground ---------------------------------------------------------
  baseAt(x) {
    const g = this.L.ground;
    if (x <= g[0][0]) return g[0][1];
    for (let i = 1; i < g.length; i++) {
      if (x <= g[i][0]) {
        const t = (x - g[i - 1][0]) / (g[i][0] - g[i - 1][0]);
        const s = t * t * (3 - 2 * t);
        return lerp(g[i - 1][1], g[i][1], lerp(t, s, 0.7));
      }
    }
    return g[g.length - 1][1];
  }
  inGap(x) {
    for (const gp of this.L.gaps || []) if (x > gp.x0 && x < gp.x1) return gp;
    return null;
  }
  groundAt(x) {
    if (this.inGap(x)) return null;
    return this.baseAt(x) + (fbm(this.noise, x / 90, 3) - 0.5) * (this.L.bumps ?? 8);
  }
  // Surface drawn up to gap edges falls off steeply so banks read as banks.
  drawGroundAt(x) {
    const b = this.baseAt(x) + (fbm(this.noise, x / 90, 3) - 0.5) * (this.L.bumps ?? 8);
    return b;
  }
  // The highest thing to stand on at x (for the little machine and cameras).
  surfaceAt(x, below = -1e9) {
    let best = null;
    for (const s of this.solids) if (x >= s.x && x <= s.x + s.w && s.y >= below && (best === null || s.y < best)) best = s.y;
    const g = this.groundAt(x);
    if (g !== null && (best === null || g < best)) best = g;
    return best;
  }

  // --- objects -> solids ---------------------------------------------
  place(o, h) {
    if (o.y !== undefined) return o.y;
    const w = o.w || 0;
    const g = Math.max(this.groundAt(o.x + 4) ?? 0, this.groundAt(o.x + w / 2) ?? 0, this.groundAt(o.x + w - 4) ?? 0);
    return g - h + (o.sink ?? 5) - (o.lift || 0);
  }
  buildObjects() {
    for (const o of this.L.objects || []) {
      const add = (x, y, w, h, extra = {}) => { const s = { x, y, w, h, o, ...extra }; this.solids.push(s); return s; };
      switch (o.t) {
        case 'car': {
          const s = o.w / 150, y = this.place({ ...o, sink: 4 }, 0);
          o._y = y;
          add(o.x + 2, y - 33 * s, o.w - 4, 31 * s, { hidden: true });
          add(o.x + 42 * s, y - 52 * s, 88 * s, 20 * s, { hidden: true });
          break;
        }
        case 'plank': {
          const y = o.y ?? this.place(o, 0) - (o.lift || 0);
          add(o.x, y, o.w, o.h || 10, { oneway: true });
          break;
        }
        default: {
          const h = o.h, y = this.place(o, h);
          o._y = y;
          add(o.x, y, o.w, h, { oneway: !!o.oneway });
        }
      }
    }
    for (const m of this.L.movers || []) {
      this.movers.push({ ...m, bx: m.x, by: m.y, x: m.x, y: m.y, vx: 0, vy: 0, moving: true, oneway: m.oneway ?? false });
    }
  }

  updateMovers(t) {
    for (const m of this.movers) {
      const ph = (t / m.period + (m.phase || 0)) * TAU;
      let k;
      if (m.kind === 'bob') k = Math.sin(ph);
      else k = -Math.cos(ph) * 0.5 + 0.5;         // lifts: 0..1 with eased ends
      const nx = m.bx + (m.dx || 0) * k, ny = m.by + (m.dy || 0) * k;
      m.vx = nx - m.x; m.vy = ny - m.y; m.x = nx; m.y = ny;
    }
  }

  // --- painting --------------------------------------------------------
  buildLayers(Q) {
    const L = this.L, layers = [];
    for (const d of LAYER_DEFS) {
      const lw = VIEW_W + (this.W - VIEW_W) * d.f;
      const lh = VIEW_H + this.top;
      const c = makeCanvas(lw * Q, lh * Q), ctx = c.getContext('2d');
      ctx.scale(Q, Q); ctx.translate(0, this.top);
      const r = rng32(L.seed * 101 + d.key.length * 13 + d.f * 1000);
      if (d.key === 'sky') Art.sky(ctx, lw, this.top, L.pal, r);
      else if (d.key === 'play') this.paintPlay(ctx, r);
      if (L.paint[d.key]) L.paint[d.key](ctx, lw, r, this);
      if (d.key !== 'sky' && d.key !== 'play') this.hazeLayer(ctx, lw, d);
      if (d.blur) Art.blur(c, d.blur * Q);
      layers.push({ ...d, canvas: c, w: lw, h: lh });
    }
    return layers;
  }

  // A final wash of haze at the foot of distant layers: atmosphere pooling low.
  hazeLayer(ctx, lw, d) {
    const p = this.L.pal, a = (p.lowHaze ?? 0.25) * (1 - d.f);
    if (a <= 0) return;
    ctx.save(); ctx.globalCompositeOperation = 'source-atop';
    const g = ctx.createLinearGradient(0, p.horizon - 60, 0, VIEW_H);
    g.addColorStop(0, css(p.haze, 0)); g.addColorStop(0.35, css(p.haze, a)); g.addColorStop(1, css(p.haze, a * 0.6));
    ctx.fillStyle = g; ctx.fillRect(0, p.horizon - 60, lw, VIEW_H);
    ctx.restore();
  }

  paintPlay(ctx, r) {
    const L = this.L, p = L.pal, G = p.ground;
    if (L.paint.playBack) L.paint.playBack(ctx, this.W, r, this);
    // water first, so banks overlap it
    if (G.island) this.paintWater(ctx, 0, this.W, L.waterLevel, r);
    else for (const gp of L.gaps || []) {
      if (gp.water === undefined) continue;
      this.paintWater(ctx, gp.x0 - 30, gp.x1 + 30, gp.water, r);
    }
    // dry pits read as deep, shadowed cuts
    for (const gp of L.gaps || []) {
      if (gp.water !== undefined || gp.void) continue;
      const top = Math.min(this.drawGroundAt(gp.x0), this.drawGroundAt(gp.x1)) - 10;
      const g = ctx.createLinearGradient(0, top, 0, VIEW_H);
      g.addColorStop(0, css(G.lo)); g.addColorStop(0.5, css(shade(G.lo, -0.5))); g.addColorStop(1, css(shade(G.lo, -0.8)));
      ctx.fillStyle = g; ctx.fillRect(gp.x0 - 20, top, gp.x1 - gp.x0 + 40, VIEW_H - top + 20);
    }
    // ground segments between gaps
    const edges = [0];
    for (const gp of (L.gaps || []).slice().sort((a, b) => a.x0 - b.x0)) edges.push(gp.x0, gp.x1);
    edges.push(this.W);
    const bottom = VIEW_H + 20;
    for (let i = 0; i < edges.length; i += 2) {
      const a = edges[i], b = edges[i + 1];
      const drop = (x) => {
        // banks curl down in the last few pixels before a gap
        const da = x - a, db = b - x;
        let y = this.drawGroundAt(x);
        if (i > 0 && da < 16) y += (16 - da) * (16 - da) * 0.5;
        if (i + 1 < edges.length - 1 && db < 16) y += (16 - db) * (16 - db) * 0.5;
        return y;
      };
      // islands in a marsh are lumps with water in front; elsewhere the ground runs to the viewer
      const n2 = this.noise;
      const under = G.island
        ? x => drop(x) + G.island * (0.55 + fbm(n2, x / 70 + 50, 2) * 0.9) * smooth(a - 1, a + 60, x) * smooth(b + 1, b - 60, x) + 4
        : () => bottom;
      ctx.beginPath(); ctx.moveTo(a, under(a));
      for (let x = a; x <= b; x += 3) ctx.lineTo(x, drop(x));
      ctx.lineTo(b, drop(b));
      for (let x = b; x >= a; x -= 4) ctx.lineTo(x, under(x));
      ctx.closePath();
      if (G.island) {
        // dark reflection of the island below it
        ctx.save(); ctx.fillStyle = css(G.lo, 0.35);
        ctx.beginPath(); for (let x = a; x <= b; x += 4) ctx.lineTo(x, under(x) - 2);
        for (let x = b; x >= a; x -= 4) ctx.lineTo(x, under(x) + (under(x) - drop(x)) * 0.8);
        ctx.fill(); ctx.restore();
        ctx.beginPath(); ctx.moveTo(a, under(a));
        for (let x = a; x <= b; x += 3) ctx.lineTo(x, drop(x));
        ctx.lineTo(b, drop(b));
        for (let x = b; x >= a; x -= 4) ctx.lineTo(x, under(x));
        ctx.closePath();
      }
      const gg = ctx.createLinearGradient(0, 560, 0, VIEW_H);
      gg.addColorStop(0, css(G.fieldTop)); gg.addColorStop(1, css(G.fieldBottom));
      ctx.fillStyle = gg; ctx.fill();
      ctx.save(); ctx.clip();
      this.paintField(ctx, a, b, drop, bottom, r);
      // surface band
      const band = G.band || 14;
      for (let x = a; x <= b; x += 2) {
        const y = drop(x), slope = (drop(x + 4) - drop(x - 4)) / 8;
        const lit = clamp(0.55 - slope * (p.light || 1) * 2.5 + (r() - 0.5) * 0.3, 0, 1);
        const c = mix(G.surfShadow, G.surfLight, lit);
        Art.stroke(ctx, x, y + band * 0.5 * r(), 3 + r() * 8, band * (0.4 + r() * 0.6), (r() - 0.5) * 0.3, jit(c, r, 10), 0.55);
        if (r() < 0.5) Art.stroke(ctx, x, y + 1, 4 + r() * 6, 2 + r() * 3, (r() - 0.5) * 0.2, G.surfTop || G.surfLight, 0.5);
      }
      // underside of the surface band
      for (let x = a; x <= b; x += 3) {
        const y = drop(x) + band * (0.9 + r() * 0.5);
        Art.stroke(ctx, x, y, 4 + r() * 8, 3 + r() * 5, 0, G.bandLow || G.surfShadow, 0.35);
      }
      ctx.restore();
      // tufts sticking up
      if (G.tuft) {
        const n = (b - a) * (G.tuftDensity ?? 0.05);
        for (let k = 0; k < n; k++) {
          const x = a + 10 + r() * (b - a - 20);
          Art.grass(ctx, x, drop(x) + 2, (G.tuftH || 14) * (0.5 + r()), r() < 0.5 ? G.tuft : (G.tuft2 || G.tuft), r, 5 + (r() * 8 | 0), 0.8);
        }
      }
      if (G.sparkle) for (let k = 0; k < (b - a) * 0.15; k++) {
        const x = a + r() * (b - a);
        Art.dab(ctx, x, drop(x) + r() * 6, 0.8, 0.8, 0, '#ffffff', 0.9);
      }
    }
    if (L.paint.playFront) L.paint.playFront(ctx, this.W, r, this);
    if (L.paint.playMid) L.paint.playMid(ctx, this.W, r, this);
    for (const o of L.objects || []) this.paintObject(ctx, o, r);
  }

  // The ground in front of the path, seen receding: detail grows toward the viewer.
  paintField(ctx, a, b, drop, bottom, r) {
    const p = this.L.pal, G = p.ground, kind = G.kind, n = makeNoise(this.L.seed + 5);
    const depth = (x, y) => clamp((y - drop(x)) / (bottom - drop(x)), 0, 1);
    const area = (b - a) * 130;
    const count = area / 55;
    for (let k = 0; k < count; k++) {
      const x = a + r() * (b - a), top = drop(x), y = top + Math.pow(r(), 0.9) * (bottom - top), d = depth(x, y);
      const wave = fbm(n, x / 260 + y / 40, 3);
      if (kind === 'grass') {
        const c = wave > 0.5 ? mix(G.tuft2, G.surfLight, (wave - 0.5) * 1.6) : mix(G.fieldBottom, G.tuft2, wave * 1.6);
        Art.stroke(ctx, x, y, 3 + d * 22, 0.8 + d * 2.4, -Math.PI / 2 + (r() - 0.5) * 0.9, jit(c, r, 24), 0.35);
      } else {
        const c = wave > 0.52 ? mix(G.fieldTop, G.hi, (wave - 0.52) * 2.4) : mix(G.lo, G.fieldTop, clamp(wave * 2, 0, 1));
        Art.stroke(ctx, x, y, 6 + d * 70, 1 + d * 5, (r() - 0.5) * 0.08, jit(c, r, 8), 0.22);
      }
    }
    // drift rows: a highlight lip with a soft shadow under it
    if (kind === 'snow' || kind === 'asphalt') {
      for (let row = 1; row < 7; row++) {
        const t = Math.pow(row / 7, 1.4);
        const f = x => drop(x) + (bottom - drop(x)) * t + Math.sin(x / (120 + row * 40) + row * 2) * (3 + t * 12) + (fbm(n, x / 90 + row * 9) - 0.5) * 14 * t;
        for (let x = a; x < b; x += 3 + t * 5) {
          if (fbm(n, x / 400 + row * 3.1) < 0.42) continue;
          const y = f(x);
          Art.stroke(ctx, x, y + 2 + t * 5, 6 + t * 16, 3 + t * 12, 0, G.lo, 0.07 + t * 0.03);
          Art.stroke(ctx, x, y, 5 + t * 12, 1 + t * 2.5, 0, G.hi, 0.35);
        }
      }
    }
    if (kind === 'marsh') {
      for (let k = 0; k < (b - a) / 60; k++) {
        const x = a + r() * (b - a), top = drop(x), y = top + (0.15 + r() * 0.8) * (bottom - top), d = depth(x, y);
        const w = 20 + d * 120;
        Art.dab(ctx, x, y, w, 2 + d * 7, 0, G.puddle, 0.55);
        Art.stroke(ctx, x - w * 0.6, y - 1, w * 0.9, 1, 0, G.hi, 0.35);

  } else if (m.art === 'lift') {

    Art.metal(ctx, 0, 0, m.w, m.h, m.c || p.metal.c, r, { panel: 40, snow, rust: p.metal.rust });
    for (let i = 0; i < 3; i++) Art.line(ctx, r() * m.w, m.h, r() * m.w, m.h + 6 + r() * 16, 2, shade(p.metal.c, -0.3), 0.8);

    Art.plank(ctx, 0, 0, m.w, m.h, { c: p.plank || '#6b5a45' }, r);
  }
  return { canvas: c, pad };
}

'use strict';
// The kid in the orange parka, and the little machine.

const KID = {
  jacket: '#c9542a', jacketDark: '#8a3620', jacketLight: '#f08a52',
  jeans: '#34425c', jeansDark: '#232d42', boots: '#2b2521',
  skin: '#e6bca0', hat: '#e3be45', hatDark: '#a9862a', pack: '#3d5c70', packDark: '#2a3f4d', mitten: '#2c3a4a',
};

// x,y = feet. face = 1 right, -1 left. pose: {run 0..1, phase, air, vy, idle t}
function drawKid(ctx, x, y, face, pose, light, amb) {
  const k = amb ? (c, t = amb.t) => mix(c, amb.c, t) : c => hex(c);
  ctx.save();
  ctx.translate(x, y); ctx.scale(face * 1.08, 1.08);
  const run = pose.run, ph = pose.phase;
  const bob = pose.air ? 0 : Math.abs(Math.sin(ph)) * -2.2 * run + Math.sin(pose.t * 2) * 0.4 * (1 - run);
  const lean = run * 0.12 + (pose.air ? clamp(pose.vy / 3000, -0.08, 0.1) : 0);
  const hipY = -17 + bob;

  const leg = (sw, col, front) => {
    let th, sh;
    if (pose.air) { th = front ? -0.7 : 0.35; sh = front ? 1.1 : 0.5; if (pose.vy > 200) { th *= 0.4; sh *= 0.5; } }
    else { th = Math.sin(ph + sw) * 0.85 * run; sh = Math.max(0, -Math.cos(ph + sw)) * 1.1 * run + 0.05; }
    const kx = Math.sin(th) * 8.5, ky = hipY + Math.cos(th) * 8.5;
    const fx = kx + Math.sin(th - sh) * 8.5, fy = ky + Math.cos(th - sh) * 8.5;
    ctx.strokeStyle = css(col); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 5.2;
    ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    if (pose.wet > 0.05) {
      // marsh water soaked up to the shins
      ctx.strokeStyle = css(mix(col, '#0e1216', 0.5 * pose.wet)); ctx.lineWidth = 5.3;
      ctx.beginPath(); ctx.moveTo(lerp(kx, fx, 0.35), lerp(ky, fy, 0.35)); ctx.lineTo(fx, fy); ctx.stroke();
    }
    ctx.fillStyle = css(k(KID.boots)); ctx.beginPath(); ctx.ellipse(fx + 1.8, fy + 0.2, 4.2, 2.6, 0, 0, TAU); ctx.fill();
    if (pose.wet > 0.3) Art.line(ctx, fx, fy - 1.2, fx + 3.5, fy - 1.2, 0.8, '#9aa4ab', 0.6 * pose.wet);
  };
  const arm = (sw, col, front) => {
    let a = pose.air ? (front ? -2.2 : -1.2) : Math.sin(ph + sw) * 0.9 * run + 0.1;
    if (!pose.air && run < 0.1) a = 0.12 + Math.sin(pose.t * 2 + sw) * 0.03;
    if (front && pose.reach) a = lerp(a, 1.5, pose.reach);
    const sx = 1, sy = hipY - 12;
    const ex = sx + Math.sin(a) * 6, ey = sy + Math.cos(a) * 6;
    const hx = ex + Math.sin(a - 0.5) * 6, hy = ey + Math.cos(a - 0.5) * 6;
    ctx.strokeStyle = css(col); ctx.lineWidth = 4.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = css(k(KID.mitten)); ctx.beginPath(); ctx.arc(hx, hy, 2.4, 0, TAU); ctx.fill();
  };

  ctx.rotate(lean);
  arm(0, k(KID.jacketDark), false);
  leg(Math.PI, k(KID.jeansDark), false);
  // backpack
  ctx.fillStyle = css(k(KID.pack)); ctx.beginPath(); ctx.roundRect(-11, hipY - 15, 7, 12, 2.5); ctx.fill();
  ctx.fillStyle = css(k(KID.packDark)); ctx.fillRect(-11, hipY - 7, 7, 2);
  // parka
  ctx.fillStyle = css(k(KID.jacket));
  ctx.beginPath();
  ctx.moveTo(-6, hipY - 15); ctx.quadraticCurveTo(-8, hipY - 6, -7, hipY + 3);
  ctx.lineTo(7, hipY + 3); ctx.quadraticCurveTo(8, hipY - 6, 6, hipY - 15);
  ctx.quadraticCurveTo(0, hipY - 18, -6, hipY - 15); ctx.fill();
  ctx.fillStyle = css(k(KID.jacketDark)); ctx.fillRect(-7, hipY + 1, 14, 2.2);
  Art.line(ctx, 1.5, hipY - 14, 1.5, hipY + 2, 0.8, k(KID.jacketDark), 0.8);
  // rim light from the sun's side
  const lit = (light || 1) * face > 0;
  ctx.strokeStyle = css(KID.jacketLight, amb && amb.night ? 0.25 : 0.6); ctx.lineWidth = 1.3;
  ctx.beginPath();
  if (lit) { ctx.moveTo(6.2, hipY - 14); ctx.quadraticCurveTo(7.6, hipY - 6, 6.8, hipY + 2); }
  else { ctx.moveTo(-6.2, hipY - 14); ctx.quadraticCurveTo(-7.8, hipY - 6, -6.8, hipY + 2); }
  ctx.stroke();
  leg(0, k(KID.jeans), true);
  // head
  const hy = hipY - 22;
  ctx.fillStyle = css(k(KID.skin)); ctx.beginPath(); ctx.arc(1.5, hy, 5.2, 0, TAU); ctx.fill();
  ctx.fillStyle = css(k(KID.jacketDark)); ctx.beginPath(); ctx.ellipse(0.5, hy + 5, 6, 2.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = css(k(KID.hat)); ctx.beginPath(); ctx.arc(1, hy - 0.6, 5.7, Math.PI * 1.02, Math.PI * 2.08); ctx.closePath(); ctx.fill();
  ctx.fillStyle = css(k(KID.hatDark)); ctx.fillRect(-4.8, hy - 1.2, 11.5, 2);
  ctx.fillStyle = css(k(KID.hat)); ctx.beginPath(); ctx.arc(-3.2, hy - 6, 2.3, 0, TAU); ctx.fill();
  ctx.fillStyle = css('#2b2522'); ctx.fillRect(4.3, hy + 0.2, 1.1, 1.3);
  if (pose.snow > 0.05) {
    // snow settles on the hat, the pompom, the top of the pack and the shoulders
    const sn = pose.snow, white = amb && amb.night ? '#c9cfd9' : '#f6f7f4';
    ctx.fillStyle = css(white, 0.4 + sn * 0.55);
    ctx.beginPath(); ctx.ellipse(1, hy - 5.2, 4.2 * (0.5 + sn * 0.5), 1 + sn * 1.2, 0, Math.PI, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-3.2, hy - 7.2, 1.2 + sn, Math.PI, TAU); ctx.fill();
    ctx.fillRect(-11, hipY - 15.5 - sn, 7, 1 + sn * 1.4);
    ctx.beginPath(); ctx.ellipse(-2, hipY - 15.3, 3 * sn, 0.9 + sn * 0.6, 0, Math.PI, TAU); ctx.fill();
  }
  if (pose.torch) { ctx.fillStyle = '#fff3cf'; ctx.fillRect(4.6, hy - 3.2, 2, 1.8); }
  arm(Math.PI, k(KID.jacket), true);
  ctx.restore();
}

// The little machine: a beige 80s instrument case on four thin legs.
function drawBot(ctx, x, y, face, b, amb) {
  const k = amb ? c => mix(c, amb.c, amb.t) : c => hex(c);
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
  const hop = b.hopping, t = b.t;
  const lift = hop ? -3 : Math.sin(t * 3) * 0.5;
  // legs
  ctx.strokeStyle = css(k('#3a3b3c')); ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  for (const [lx, ph] of [[-8, 0], [-4, Math.PI], [5, Math.PI / 2], [9, Math.PI * 1.5]]) {
    const sw = b.walk ? Math.sin(t * 14 + ph) * 2.5 : 0;
    const kneeY = -9 + lift, footY = hop ? -4 : 0;
    ctx.beginPath(); ctx.moveTo(lx, -11 + lift); ctx.lineTo(lx + 2 + sw * 0.4, kneeY + 3); ctx.lineTo(lx + sw, footY); ctx.stroke();
  }
  // body
  const by = -24 + lift;
  ctx.fillStyle = css(k('#d9d2c0')); ctx.beginPath(); ctx.roundRect(-12, by, 24, 14, 3); ctx.fill();
  ctx.fillStyle = css(k('#a69f8e')); ctx.fillRect(-12, by + 10, 24, 4);
  ctx.fillStyle = css(k('#d7782f')); ctx.fillRect(-12, by + 5, 24, 2.5);
  ctx.fillStyle = css(k('#57544c')); ctx.font = 'bold 5px Arial'; ctx.fillText('04', -9, by + 4.8);
  // sensor head, turned toward whatever it is watching
  const look = b.look || 0;
  ctx.save(); ctx.translate(8, by - 1); ctx.rotate(look);
  ctx.fillStyle = css(k('#c8c1ae')); ctx.beginPath(); ctx.roundRect(-2, -6, 10, 9, 2); ctx.fill();
  ctx.fillStyle = css('#1d2226'); ctx.fillRect(2, -4, 5, 4);
  const on = b.blink > 0.5;
  ctx.fillStyle = on ? '#ff5a3c' : '#6e2a22'; ctx.fillRect(3.2, -3, 2.6, 2.2);
  ctx.restore();
  // antenna
  ctx.strokeStyle = css(k('#3a3b3c')); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-8, by); ctx.lineTo(-10, by - 12); ctx.stroke();
  ctx.fillStyle = on ? '#ff8a5c' : '#5b2a22'; ctx.beginPath(); ctx.arc(-10, by - 12.5, 1.4, 0, TAU); ctx.fill();
  ctx.restore();
  b.tip = [x + face * 15, y + by - 2];
  const ex = 8 + Math.cos(look) * 4.5 - Math.sin(look) * -2, ey = by - 1 + Math.sin(look) * 4.5 + Math.cos(look) * -2;
  return on ? [x + face * ex, y + ey] : null;
}

// The machine goes from waypoint to waypoint, hopping, when you come close.
// It watches you, and whatever else moves; it startles if you jump at it,
// and if you stand still long enough it comes back to see why.
class Robot {
  constructor(world) {
    this.w = world;
    this.pts = (world.L.robot || []).map(x => ({ x, y: world.surfaceAt(x) ?? 560 }));
    this.absent = !this.pts.length;
    if (this.absent) this.pts = [{ x: -999, y: 0 }];
    this.i = 0; this.x = this.pts[0].x; this.y = this.pts[0].y; this.face = 1;
    this.t = 0; this.blink = 0; this.hopping = false; this.walk = false; this.path = null; this.beepT = 3;
    this.look = 0; this.noticed = 0; this.visit = null; this.stillT = 0; this.visitCool = 0;
    this.onBeep = null;
  }
  get last() { return this.i >= this.pts.length - 1; }
  update(dt, player, interest) {
    if (this.absent) return;
    this.t += dt;
    this.blink = (Math.sin(this.t * (this.path ? 9 : 3)) > 0.2) ? 1 : 0;
    // where to look: something happening nearby, otherwise you
    const tgt = interest && Math.abs(interest.x - this.x) < 500 ? interest : { x: player.x, y: player.y - 30 };
    const dx = tgt.x - this.x, dy = tgt.y - (this.y - 25);
    const want = clamp(Math.atan2(dy, Math.max(24, Math.abs(dx))), -0.75, 0.45);
    this.look = lerp(this.look, this.path ? 0 : want, 1 - Math.pow(0.02, dt));
    if (this.path) { this.follow(dt); return; }
    this.face = dx > 0 ? 1 : -1;
    if (this.hold) return;
    this.visitCool = Math.max(0, this.visitCool - dt);

    const gap = Math.abs(player.x - this.x);
    const near = gap < 170 && Math.abs(player.y - this.y) < 200;
    // on a visit: go back to its post once you move on
    if (this.visit) {
      if (Math.abs(player.x - this.visit.px) > 70 || Math.abs(player.vx) > 60) { this.visit = null; this.goTo(this.pts[this.i], false, 0.9); }
      return;
    }
    if (near && !this.last && player.x > this.x - 80) {
      // jumped at: off it goes at once
      if (!player.onGround && gap < 110) { this.noticed = 0; this.go(this.i + 1, true); return; }
      // otherwise a moment to look at you first
      this.noticed += dt;
      if (this.noticed > 0.7) { this.noticed = 0; this.go(this.i + 1); }
      return;
    }
    this.noticed = 0;
    // you've stopped, some way back: it comes to check on you
    this.stillT = player.onGround && Math.abs(player.vx) < 5 ? this.stillT + dt : 0;
    if (this.stillT > 5 && !this.visitCool && gap > 200 && gap < 700 && this.clearTo(player.x)) {
      const side = player.x < this.x ? 1 : -1;
      const x = player.x + side * 70;
      this.visit = { px: player.x }; this.stillT = 0; this.visitCool = 20;
      this.goTo({ x, y: this.w.surfaceAt(x) ?? this.y }, false, 0.9);
      return;
    }
    this.beepT -= dt;
    if (this.beepT < 0 && gap > 420) { this.beepT = 4 + Math.random() * 3; this.onBeep && this.onBeep(0.5); }
  }
  // a walkable line of ground or low things between here and x
  clearTo(x) {
    const a = Math.min(x, this.x), b = Math.max(x, this.x);
    let prev = this.w.surfaceAt(a, this.y - 60);
    for (let xx = a; xx <= b; xx += 16) {
      const y = this.w.surfaceAt(xx, this.y - 60);
      if (y === null || prev === null || Math.abs(y - prev) > 70) return false;
      prev = y;
    }
    return true;
  }
  follow(dt) {
    const p = this.path; p.t += dt;
    const seg = p.segs[p.k], u = clamp(p.t / seg.d, 0, 1);
    this.x = lerp(seg.x0, seg.x1, u);
    this.y = lerp(seg.y0, seg.y1, u) - Math.sin(u * Math.PI) * seg.h;
    this.hopping = true; this.walk = false;
    if (u >= 1) {
      p.k++; p.t = 0;
      if (p.k >= p.segs.length) { this.path = null; this.hopping = false; this.x = seg.x1; this.y = seg.y1; }
    }
  }
  go(i, startled) {
    this.i = i;
    this.goTo(this.pts[i], startled);
    this.onBeep && this.onBeep(startled ? 1.4 : 1);
  }
  goTo(b, fast, speed = 1) {
    const a = { x: this.x, y: this.y };
    this.face = b.x > a.x ? 1 : -1;
    const dist = Math.abs(b.x - a.x), segs = [], k = (fast ? 0.6 : 1) / speed;

    } else {
      const n = Math.max(1, Math.ceil(dist / 110));
      let px = a.x, py = a.y;
      for (let j = 1; j <= n; j++) {
        const x = lerp(a.x, b.x, j / n);
        let y = j === n ? b.y : (this.w.surfaceAt(x, Math.min(py, b.y) - 130) ?? lerp(a.y, b.y, j / n));
        if (j < n && Math.abs(y - lerp(a.y, b.y, j / n)) > 140) y = lerp(a.y, b.y, j / n);
        segs.push({ x0: px, y0: py, x1: x, y1: y, h: (fast ? 26 : 16) + Math.max(0, py - y) * 1.1, d: (0.3 + Math.max(0, py - y) / 500) * k });
        px = x; py = y;
      }
    }
    this.path = { segs, k: 0, t: 0 };
  }
  draw(ctx, cx, cy, amb) {
    if (this.absent) return null;
    return drawBot(ctx, this.x - cx, this.y - cy, this.face, this, amb);
  }
}

const QUIET_PLACES = [
  [{ kind: 'radio', x: 1370, label: 'turn the dial' }],
  [{ kind: 'birds', x: 2310, label: 'whistle softly' }],
  [{ kind: 'water', x: 810, label: 'skip a stone', waterX: 960, waterY: 638 },
    { kind: 'bell', x: 3500, label: 'ring the little bell' }],
  [{ kind: 'signal', x: 1290, label: 'try the switch' }],
  [{ kind: 'stones', x: 2960, label: 'let a pebble go' }],
  // years later, something has moved into the place where the machine was

  constructor(world) {
