<script>
// ACCESSION — random streams. A stream is named by a path; its 32-bit state lives in
// state.rng[path], so a snapshot resumes every stream exactly (BUILD.md §3.2).
'use strict';
const Rng = (() => {
  // 32-bit string hash (the layout prototype's hashStr).
  function hash32(s) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < s.length; i++) {
      const ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h1 ^ h2) >>> 0;
  }

  // One mulberry32 step: returns [value, nextState], both uint32.
  function advance(a) {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return [(t ^ (t >>> 14)) >>> 0, a >>> 0];
  }

  // A stream bound to one state object. Creating it is cheap; the state is the record.
  function stream(state, path) {
    const table = state.rng;
    if (!(path in table)) table[path] = hash32(state.seed + '/' + path);
    const u32 = () => { const r = advance(table[path]); table[path] = r[1]; return r[0]; };
    const int = (lo, hi) => lo + (u32() % (hi - lo + 1));
    return {
      path, u32, int,
      chance: permille => u32() % 1000 < permille,
      d100: () => 1 + (u32() % 100),
      pick: arr => arr[u32() % arr.length],
      shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) { const j = u32() % (i + 1); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
        return arr;
      },
      // weights: non-negative integers; returns an index.
      weighted(weights) {
        let total = 0;
        for (const w of weights) total += w;
        let r = u32() % total;
        for (let i = 0; i < weights.length; i++) { if (r < weights[i]) return i; r -= weights[i]; }
        return weights.length - 1;
      },
    };
  }

  return { hash32, advance, stream };
})();

<script>
// ACCESSION — the state object: canonical serialisation, hashing, cloning and the
// plain-data check (BUILD.md §3.1, §3.5).
'use strict';
const State = (() => {
  const isPlainObject = v => Object.prototype.toString.call(v) === '[object Object]';

  // Returns the path of the first value that is not plain data, or null: null, booleans,
  // strings, safe integers, arrays without holes, and plain objects without undefined.
  function plainData(v, path) {
    path = path || 'state';
    if (v === null || typeof v === 'boolean' || typeof v === 'string') return null;
    if (typeof v === 'number') return Number.isSafeInteger(v) && !Object.is(v, -0) ? null : path;
    if (Array.isArray(v)) {
      for (let i = 0; i < v.length; i++) { if (!(i in v)) return path + '[' + i + ']'; const p = plainData(v[i], path + '[' + i + ']'); if (p) return p; }
      return null;
    }
    if (isPlainObject(v)) {
      for (const k of Object.keys(v)) { if (v[k] === undefined) return path + '.' + k; const p = plainData(v[k], path + '.' + k); if (p) return p; }
      return null;
    }
    return path;
  }

  // Canonical JSON: sorted keys, no whitespace. Anything that is not plain data throws.
  function canon(v) {
    if (v === null) return 'null';
    const t = typeof v;
    if (t === 'boolean' || t === 'string') return JSON.stringify(v);
    if (t === 'number') { if (!Number.isSafeInteger(v) || Object.is(v, -0)) throw new Error('State.canon: not a safe integer: ' + v); return String(v); }
    if (Array.isArray(v)) {
      let s = '[';
      for (let i = 0; i < v.length; i++) { if (!(i in v)) throw new Error('State.canon: array hole'); s += (i ? ',' : '') + canon(v[i]); }
      return s + ']';
    }
    if (isPlainObject(v)) {
      const keys = Object.keys(v).sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      let s = '{';
      for (let i = 0; i < keys.length; i++) {
        if (v[keys[i]] === undefined) throw new Error('State.canon: undefined at ' + keys[i]);
        s += (i ? ',' : '') + JSON.stringify(keys[i]) + ':' + canon(v[keys[i]]);
      }
      return s + '}';
    }
    throw new Error('State.canon: not plain data (' + Object.prototype.toString.call(v) + ')');
  }

  // 32-bit FNV-1a over UTF-16 code units.
  function fnv1a(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  const hash = state => fnv1a(canon(state));
  const clone = state => JSON.parse(canon(state));

  return { canon, fnv1a, hash, clone, plainData };
})();

// ACCESSION — integer helpers with stated rounding (BUILD.md §3.3).
'use strict';
const Int = (() => {
  const idiv = (a, b) => Math.floor(a / b);                 // floor division
  const ceilDiv = (a, b) => Math.ceil(a / b);
  const round10 = (num, den) => 10 * Math.floor((Math.floor(num / den) + 5) / 10);   // to the nearest 10, halves up
  const pct = (a, p) => Math.floor(a * p / 100);
  return { idiv, ceilDiv, round10, pct };
})();

</script>
<script>
// ACCESSION — the tile grid: what each tile character means, line of sight, walking
// distance and steps. A department's map is an array of row strings (BUILD.md §4.1).
'use strict';
const Grid = (() => {
  // Tile characters. Movement and sight follow the movement × sight matrix
  // (design/vocabulary.md §7.1); the registry describes each one to the player.
  const TILES = {
    '#': { name: 'wall' },
    '.': { name: 'floor', walk: 1, see: 1 },
    ',': { name: 'archway', walk: 1, see: 1 },
    '+': { name: 'closed door', walk: 1, door: 1 },
    "'": { name: 'open door', walk: 1, see: 1, door: 1 },
    'S': { name: 'staff door', walk: 1, door: 1, staff: 1 },
    'E': { name: 'entrance', walk: 1, see: 1 },
    'X': { name: 'exit door', walk: 1, see: 1 },
    'v': { name: 'vitrine', see: 1, glass: 1 },
    'k': { name: 'broken case', walk: 1, see: 1, loud: 1 },
    'x': { name: 'shards', walk: 1, see: 1, loud: 1 },
    'w': { name: 'pool', walk: 1, see: 1, loud: 1, slow: 1 },
    'p': { name: 'plinth', see: 1 },
    'f': { name: 'low furniture', see: 1 },
    'l': { name: 'lectern', see: 1 },
    'b': { name: 'bench', walk: 1, see: 1, bench: 1 },
    'o': { name: 'column' },
    'H': { name: 'shelving' },
    '|': { name: 'partition' },
    '~': { name: 'balustrade', see: 1 },
    '=': { name: 'rope line', walk: 1, see: 1 },
  };
  const WALK = new Uint8Array(128), SEE = new Uint8Array(128);
  for (const ch of Object.keys(TILES)) {
    const c = ch.charCodeAt(0);
    WALK[c] = TILES[ch].walk ? 1 : 0;
    SEE[c] = TILES[ch].see ? 1 : 0;
  }

  // Directions in a fixed order: N, NE, E, SE, S, SW, W, NW.
  const DX = [0, 1, 1, 1, 0, -1, -1, -1], DY = [-1, -1, 0, 1, 1, 1, 0, -1];

  const inside = (m, x, y) => x >= 0 && y >= 0 && x < m.w && y < m.h;
  const code = (m, x, y) => inside(m, x, y) ? m.tiles[y].charCodeAt(x) : 35; // '#'
  const ch = (m, x, y) => String.fromCharCode(code(m, x, y));
  const walkable = (m, x, y) => WALK[code(m, x, y)] === 1;
  const seeThrough = (m, x, y) => SEE[code(m, x, y)] === 1;
  function set(m, x, y, c) { const row = m.tiles[y]; m.tiles[y] = row.slice(0, x) + c + row.slice(x + 1); }

  // A step from (x, y) in direction d: the target must be walkable, and a diagonal step
  // may not cut past a tile you could not step onto.
  function canStep(m, x, y, d) {
    const nx = x + DX[d], ny = y + DY[d];
    if (!walkable(m, nx, ny)) return false;
    if (DX[d] !== 0 && DY[d] !== 0) return walkable(m, nx, y) && walkable(m, x, ny);
    return true;
  }

  // Line of sight between two tiles: a Bresenham line, always traced from the endpoint
  // that comes first in row-major order, so sight is symmetric. Endpoints never block.
  function los(m, x0, y0, x1, y1) {
    if (y1 < y0 || (y1 === y0 && x1 < x0)) { let t = x0; x0 = x1; x1 = t; t = y0; y0 = y1; y1 = t; }
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x1 > x0 ? 1 : -1, sy = y1 > y0 ? 1 : -1;
    let err = dx - dy, x = x0, y = y0;
    for (;;) {
      if (x === x1 && y === y1) return true;
      if (!(x === x0 && y === y0) && !seeThrough(m, x, y)) return false;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x += sx; }
      if (e2 < dx) { err += dx; y += sy; }
    }
  }

  const chebyshev = (x0, y0, x1, y1) => Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));

  // Walking distance from one or more start tiles, by the step rule, out to maxDist.
  // extra(x, y) may add a cost for entering a tile (closed doors for noise). Returns an
  // Int32Array of distances, -1 where unreached. Not part of the state.
  function distances(m, starts, maxDist, extra) {
    const n = m.w * m.h, dist = new Int32Array(n).fill(-1);
    // Bucketed Dijkstra: costs are small integers.
    const buckets = [[]];
    for (const [x, y] of starts) { dist[y * m.w + x] = 0; buckets[0].push(y * m.w + x); }
    for (let d = 0; d < buckets.length && d <= maxDist; d++) {
      const b = buckets[d];
      if (!b) continue;
      for (let i = 0; i < b.length; i++) {
        const p = b[i];
        if (dist[p] !== d) continue;
        const x = p % m.w, y = (p - x) / m.w;
        for (let k = 0; k < 8; k++) {
          if (!canStep(m, x, y, k)) continue;
          const nx = x + DX[k], ny = y + DY[k], q = ny * m.w + nx;
          const nd = d + 1 + (extra ? extra(nx, ny) : 0);
          if (nd > maxDist || (dist[q] !== -1 && dist[q] <= nd)) continue;
          dist[q] = nd;
          while (buckets.length <= nd) buckets.push([]);
          buckets[nd].push(q);
        }
      }
    }
    return dist;
  }

  return { TILES, DX, DY, inside, code, ch, walkable, seeThrough, set, canStep, los, chebyshev, distances };
})();

</script>
<script>
// ACCESSION — what you can see and what your ring covers (BUILD.md §8.2).
'use strict';
const Vision = (() => {
  const within = (dx, dy, r) => dx * dx + dy * dy <= r * r + r;

  // Visible tiles as a Uint8Array (1 = visible), from your tile. Not stored in the state.
  function visible(state) {
    const m = state.dept, you = state.actors[0], r = N.SIGHT_PLAYER, out = new Uint8Array(m.w * m.h);
    for (let y = Math.max(0, you.y - r); y <= Math.min(m.h - 1, you.y + r); y++)
      for (let x = Math.max(0, you.x - r); x <= Math.min(m.w - 1, you.x + r); x++)
        if (within(x - you.x, y - you.y, r) && Grid.los(m, you.x, you.y, x, y)) out[y * m.w + x] = 1;
    return out;
  }

  // Your ring's radius: by your last action that cost time, plus a loud floor.
  function ringRadius(state) {
    const you = state.actors[0];
    let r = you.still ? N.RING_STILL : N.RING_MOVING;
    const t = Grid.TILES[Grid.ch(state.dept, you.x, you.y)];
    if (t && t.loud) r += N.RING_LOUD_FLOOR;
    return Math.max(N.RING_MIN, r);
  }

  // The tiles your ring covers: exactly those where a sleeping exhibit would gain a pip
  // (BUILD.md §8.2): within its walking distance and in line of sight. A tile you cannot
  // step onto (a case, a plinth) is one step beyond its nearest neighbour you could.
  function ring(state) {
    const m = state.dept, you = state.actors[0], r = ringRadius(state);
    const d = Grid.distances(m, [[you.x, you.y]], r), out = new Uint8Array(m.w * m.h);
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      const i = y * m.w + x;
      let dist = d[i];
      if (dist < 0 && !Grid.walkable(m, x, y)) {
        for (let k = 0; k < 8; k++) {
          const nx = x + Grid.DX[k], ny = y + Grid.DY[k];
          if (!Grid.inside(m, nx, ny)) continue;
          const nd = d[ny * m.w + nx];
          if (nd >= 0 && Grid.walkable(m, nx, ny) && (dist < 0 || nd + 1 < dist)) dist = nd + 1;
        }
        if (dist > r) dist = -1;
      }
      if (dist >= 0 && Grid.los(m, you.x, you.y, x, y)) out[i] = 1;
    }
    return out;
  }

  // Marks what you can see now as seen, in state.dept.seen (one character a tile).
  function remember(state) {
    const m = state.dept, v = visible(state);
    let seen = m.seen && m.seen.length === m.w * m.h ? m.seen : '0'.repeat(m.w * m.h);
    let changed = false;
    const chars = seen.split('');
    for (let i = 0; i < v.length; i++) if (v[i] && chars[i] !== '1') { chars[i] = '1'; changed = true; }
    if (changed || seen !== m.seen) m.seen = chars.join('');
  }

  return { within, visible, ringRadius, ring, remember };
})();

</script>
<script>
// ACCESSION — the cause records kept in the state for death recaps (BUILD.md §3.4).
'use strict';
const Causes = (() => {
  // Records are copied in, so nothing outside the state can reach into it.
  function record(state, rec) {
    state.causes.push(JSON.parse(JSON.stringify(rec)));
    if (state.causes.length > N.CAUSE_RECORDS) state.causes.splice(0, state.causes.length - N.CAUSE_RECORDS);
  }
  return { record };
})();

</script>
<script>
// ACCESSION — status effects on actors, as { id, until } with until a turn number.
'use strict';
const Status = (() => {
  const has = (a, id) => !!(a.statuses && a.statuses.some(s => s.id === id));
  function add(a, id, turns, now) {
    if (!a.statuses) a.statuses = [];
    const s = a.statuses.find(s => s.id === id);
    if (s) s.until = Math.max(s.until, now + turns); else a.statuses.push({ id, until: now + turns });
  }
  // Called on each turn boundary: expire what has run out.
  function tick(state, ev) {
    for (const a of state.actors) {
      if (!a.statuses || !a.statuses.length) continue;
      const keep = [];
      for (const s of a.statuses) {
        if (s.until <= state.turn) ev.push({ k: 'status_ended', turn: state.turn, who: a.uid, status: s.id });
        else keep.push(s);
      }
      a.statuses = keep;
    }
  }
  return { has, add, tick };
})();

</script>
<script>
// ACCESSION — actors: lookup, occupancy, action costs and the scheduler.
'use strict';
const Actors = (() => {
  const at = (state, x, y) => { for (const a of state.actors) if (!a.gone && a.x === x && a.y === y) return a; return null; };
  const byUid = (state, uid) => { for (const a of state.actors) if (a.uid === uid) return a; return null; };
  // Speed scales every action's cost (BUILD.md §8.1).
  const cost = (a, base) => a.speed === 'fast' ? Int.pct(base, N.SPEED_FAST_PCT) : a.speed === 'slow' ? Int.pct(base, N.SPEED_SLOW_PCT) : base;
  // A blow with a Heavy weapon, or from a brute, costs more (§8.1, §8.10).
  const attackCost = a => cost(a, a.weaponForm === 'heavy' || a.role === 'brute' ? N.COST_ATTACK_HEAVY : N.COST_ATTACK);
  // Sleeping exhibits are not scheduled (§8.1).
  const scheduled = a => !a.gone && a.mode !== 'dormant';
  // The scheduler: the smallest next tick; ties to you, then to spawn order (array order).
  function next(state) {
    let best = null;
    for (const a of state.actors) if (scheduled(a) && (best === null || a.next < best.next)) best = a;
    return best;
  }
  return { at, byUid, cost, attackCost, scheduled, next };
})();

</script>
<script>
// ACCESSION — waking (BUILD.md §8.2). M0 holds only the transitions; the ring, noise,
// pips and special triggers arrive in M3.
'use strict';
const Wake = (() => {
  // Straight to hunting (damage, the ring, being seen). An exhibit that was asleep is
  // scheduled one action from now: waking costs a beat. Each actor keeps its own story.
  function toHunting(state, a, cause, ev) {
    const was = a.mode;
    a.mode = 'hunting';
    a.pips = 0;
    if (was === 'dormant') { a.next = state.tick + Actors.cost(a, N.COST_STEP); a.woke = { turn: state.turn, cause: copy(cause) }; }
    a.hunted = { turn: state.turn, cause: copy(cause) };
    ev.push({ k: 'hunting', turn: state.turn, who: a.uid, was, cause: copy(cause) });
    Causes.record(state, { turn: state.turn, k: 'hunting', who: a.uid, was, cause });
  }
  const copy = c => JSON.parse(JSON.stringify(c));
  return { toHunting };
})();

</script>
<script>
// ACCESSION — ordinary blows: hit chance, damage, Padding, surprise (BUILD.md §8.1).
// Every roll is drawn from the attacker's own stream, and every result carries its cause.
'use strict';
const Combat = (() => {
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

  function hitChance(att, def) {
    let mods = 0;
    if (Status.has(def, 'fixed')) mods += N.HIT_FIXED_TARGET;
    if (Status.has(att, 'dazed')) mods += N.HIT_DAZED_ATTACKER;
    return clamp(N.HIT_BASE + N.HIT_PER_POINT * (att.acc - def.eva) + mods, N.HIT_MIN, N.HIT_MAX);
  }

  // Is the defender unaware of the attacker? Only exhibits can be surprised.
  const surprised = (att, def) => def.uid !== 'you' && def.mode !== 'hunting';

  // Resolve one attack. Returns the events; the caller has already paid the cost.
  function attack(state, att, def, ev) {
    const rng = Rng.stream(state, 'combat/' + att.uid);
    const chance = hitChance(att, def);
    const cause = { k: 'attack', by: att.uid, at: def.uid, chance };
    if (surprised(att, def)) {
      let dmg = att.dmax;
      if (att.weaponForm === 'light') dmg = Int.pct(dmg, N.SURPRISE_LIGHT_PCT);
      cause.surprise = 1;
      return hurt(state, def, net(dmg, def.pad, cause), Object.assign(cause, { raw: dmg, pad: def.pad }), ev);
    }
    const roll = rng.d100();
    cause.roll = roll;
    if (roll > chance) { ev.push({ k: 'missed', turn: state.turn, by: att.uid, at: def.uid, cause: copy(cause) }); return; }
    const raw = rng.int(att.dmin, att.dmax);
    hurt(state, def, net(raw, def.pad, cause), Object.assign(cause, { raw, pad: def.pad }), ev);
  }

  // Damage after Padding, at least the minimum; the cause records when the floor applied.
  function net(raw, pad, cause) {
    if (raw - pad < N.DMG_MIN_ON_HIT) { cause.floor = N.DMG_MIN_ON_HIT; return N.DMG_MIN_ON_HIT; }
    return raw - pad;
  }

  function hurt(state, who, amount, cause, ev) {
    who.hp -= amount;
    if (who.hp < 0) who.hp = 0;
    ev.push({ k: 'damaged', turn: state.turn, who: who.uid, amount, hp: who.hp, cause: copy(cause) });
    Causes.record(state, { turn: state.turn, k: 'damaged', who: who.uid, amount, cause });
    if (who.uid !== 'you' && who.mode !== 'hunting') Wake.toHunting(state, who, { k: 'damage', by: cause.by }, ev);
    if (who.hp === 0) die(state, who, cause, ev);
  }

  function die(state, who, cause, ev) {
    who.gone = 1;
    ev.push({ k: 'died', turn: state.turn, who: who.uid, cause: copy(cause) });
    Causes.record(state, { turn: state.turn, k: 'died', who: who.uid, cause });
    if (who.uid === 'you') state.over = { k: 'died', turn: state.turn, by: cause.by || null };
  }

  const copy = c => JSON.parse(JSON.stringify(c));

  return { hitChance, surprised, attack, hurt };
})();

</script>
<script>
// ACCESSION — exhibit numbers from role and depth (BUILD.md §8.10): the role curves are
// anchored at depths 1, 4 and 8 and interpolated linearly, rounding down.
'use strict';
const Roles = (() => {
  const ANCHORS = [1, 4, 8];
  function at(values, depth) {
    if (depth <= ANCHORS[0]) return values[0];
    for (let i = 0; i + 1 < ANCHORS.length; i++) {
      const a = ANCHORS[i], b = ANCHORS[i + 1];
      if (depth <= b) return values[i] + Int.idiv((values[i + 1] - values[i]) * (depth - a), b - a);
    }
    return values[values.length - 1];
  }
  // Every role has all five rows; a missing one is an error, never a silent default.
  function row(role, what) {
    const key = 'ROLE_' + role.toUpperCase() + '_' + what;
    if (!(key in N)) throw new Error('Roles: missing number ' + key);
    return N[key];
  }
  function stats(role, depth) {
    const dmg = row(role, 'DMG');
    return {
      role, hp: at(row(role, 'HP'), depth), acc: at(row(role, 'ACC'), depth), eva: at(row(role, 'EVA'), depth),
      pad: at(row(role, 'PAD'), depth), dmin: at(dmg.map(d => d[0]), depth), dmax: at(dmg.map(d => d[1]), depth),
    };
  }
  const ROLES = ['fodder', 'skirmisher', 'artillery', 'brute', 'controller', 'warden', 'support', 'swarm', 'ambusher', 'centrepiece'];
  return { at, stats, ROLES };
})();

</script>
<script>
// ACCESSION — step(state, action) → events: the only function that changes the state
// (BUILD.md §3.1). It applies your action, then lets every other actor act until it is
// your turn again, resolving turn boundaries on the way (§8.1).
'use strict';
const Step = (() => {
  const refuse = (state, reason) => [{ k: 'refused', turn: state.turn, reason }];

  // Can a reach b with a blow? Adjacent, and not across a corner you could not step past.
  function adjacent(state, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== 1) return false;
    if (dx === 0 || dy === 0) return true;
    const m = state.dept;
    return Grid.walkable(m, b.x, a.y) && Grid.walkable(m, a.x, b.y);
  }

  const dirOf = (dx, dy) => { for (let d = 0; d < 8; d++) if (Grid.DX[d] === dx && Grid.DY[d] === dy) return d; return -1; };

  // Moving into a tile: attack what stands there, open a closed door, or walk. Returns the
  // cost in ticks, or a refusal string.
  function moveInto(state, a, d, ev) {
    const m = state.dept, nx = a.x + Grid.DX[d], ny = a.y + Grid.DY[d];
    const other = Actors.at(state, nx, ny);
    if (other) {
      if (!adjacent(state, a, other)) return 'You cannot reach it past the corner.';
      if (a.uid !== 'you' && other.uid !== 'you') return 'blocked';
      Combat.attack(state, a, other, ev);
      return Actors.attackCost(a);
    }
    if (Grid.ch(m, nx, ny) === '+' && Grid.canStep(m, a.x, a.y, d)) {
      Grid.set(m, nx, ny, "'");
      ev.push({ k: 'opened', turn: state.turn, who: a.uid, x: nx, y: ny });
      return Actors.cost(a, N.COST_DOOR);
    }
    if (!Grid.canStep(m, a.x, a.y, d)) return 'Something is in the way.';
    ev.push({ k: 'moved', turn: state.turn, who: a.uid, from: [a.x, a.y], to: [nx, ny] });
    a.x = nx; a.y = ny;
    return Actors.cost(a, N.COST_STEP);
  }

  // Your action. Returns the cost, or a refusal string.
  function yours(state, action, ev) {
    const you = state.actors[0];
    switch (action.a) {
      case 'move': {
        if (!(action.dir >= 0 && action.dir < 8)) return 'No such direction.';
        return moveInto(state, you, action.dir, ev);
      }
      case 'wait':
        ev.push({ k: 'waited', turn: state.turn, who: 'you' });
        return N.COST_WAIT;
      case 'attack': {
        const t = Actors.byUid(state, action.uid);
        if (!t || t.gone || t === you) return 'There is nothing there to attack.';
        if (!adjacent(state, you, t)) return 'It is out of reach.';
        return moveInto(state, you, dirOf(t.x - you.x, t.y - you.y), ev);
      }
      default:
        return 'Unknown action.';
    }
  }

  // One exhibit's turn. M0: a hunting exhibit closes in and strikes; others wait.
  function act(state, a, ev) {
    const you = state.actors[0];
    let cost = Actors.cost(a, N.COST_WAIT);
    if (a.mode === 'hunting') {
      if (adjacent(state, a, you)) {
        Combat.attack(state, a, you, ev);
        cost = Actors.attackCost(a);
      } else {
        const r = chase(state, a, you, ev);
        if (r !== null) cost = r;
      }
    }
    a.next += cost;
  }

  // Step along the walking-distance gradient toward the target; ties broken on the
  // exhibit's own ai stream. Returns the cost, or null if it cannot move.
  function chase(state, a, target, ev) {
    const m = state.dept, dist = Grid.distances(m, [[target.x, target.y]], 64);
    const here = dist[a.y * m.w + a.x];
    if (here <= 0) return null;
    const options = [];
    for (let d = 0; d < 8; d++) {
      if (!Grid.canStep(m, a.x, a.y, d)) continue;
      const nx = a.x + Grid.DX[d], ny = a.y + Grid.DY[d], v = dist[ny * m.w + nx];
      if (v < 0 || v >= here || Actors.at(state, nx, ny)) continue;
      options.push(d);
    }
    if (!options.length) return null;
    const d = options.length === 1 ? options[0] : Rng.stream(state, 'ai/' + a.uid).pick(options);
    const r = moveInto(state, a, d, ev);
    return typeof r === 'number' ? r : null;
  }

  // Turn-boundary effects, in the fixed order of §8.1.
  function boundary(state, ev) {
    Status.tick(state, ev);
    regenerate(state, ev);
  }

  function regenerate(state, ev) {
    const you = state.actors[0];
    if (you.gone || you.hp >= you.maxHp) return;
    const every = Math.max(N.REGEN_MIN, Int.idiv(N.REGEN_NUM, you.maxHp));
    if (state.turn % every === 0) { you.hp++; ev.push({ k: 'regenerated', turn: state.turn, who: 'you', hp: you.hp }); }
  }

  // Run the world until it is your turn again.
  function advance(state, ev) {
    for (;;) {
      if (state.over) return;
      const a = Actors.next(state);
      const boundaryTick = (state.turn + 1) * N.TICKS_PER_TURN;
      if (boundaryTick <= a.next) { state.turn++; state.tick = boundaryTick; boundary(state, ev); continue; }
      state.tick = a.next;
      if (a.uid === 'you') return;
      act(state, a, ev);
    }
  }

  function step(state, action) {
    if (state.over) return refuse(state, 'The visit is over.');
    const ev = [];
    const cost = yours(state, action, ev);
    if (typeof cost === 'string') return refuse(state, cost);
    const you = state.actors[0];
    you.next += cost;
    // Your ring is set by your last action that cost time (BUILD.md §8.2).
    if (cost > 0) you.still = STILL.includes(action.a);
    advance(state, ev);
    Vision.remember(state);
    return ev;
  }
  const STILL = ['wait', 'rest', 'view', 'sit'];

  // Every legal action for you now (BUILD.md §4.2). step() refuses exactly the others.
  function legal(state) {
    if (state.over) return [];
    const you = state.actors[0], out = [{ a: 'wait' }];
    for (let d = 0; d < 8; d++) {
      const nx = you.x + Grid.DX[d], ny = you.y + Grid.DY[d], other = Actors.at(state, nx, ny);
      if (other ? adjacent(state, you, other) : (Grid.canStep(state.dept, you.x, you.y, d))) out.push({ a: 'move', dir: d });
    }
    for (const a of state.actors) if (a !== you && !a.gone && adjacent(state, you, a)) out.push({ a: 'attack', uid: a.uid });
    return out;
  }

  return { step, adjacent, legal };
})();

</script>
<script>
// ACCESSION — a path for a tap (BUILD.md §4.2): the UI turns it into single moves, so a
// replay never holds a path. Shortest by the step rule, round other actors; ties broken in
// direction order, so the same tap always gives the same path.
'use strict';
const Path = (() => {
  function to(state, tx, ty) {
    const m = state.dept, you = state.actors[0];
    if (!Grid.inside(m, tx, ty) || (tx === you.x && ty === you.y)) return [];
    const target = Grid.walkable(m, tx, ty) ? [[tx, ty]] : [];
    if (!target.length) return [];
    const d = Grid.distances(m, target, m.w * m.h);
    const out = [];
    let x = you.x, y = you.y, here = d[y * m.w + x];
    if (here < 0) return [];
    while (here > 0) {
      let best = -1;
      for (let k = 0; k < 8; k++) {
        if (!Grid.canStep(m, x, y, k)) continue;
        const nx = x + Grid.DX[k], ny = y + Grid.DY[k], v = d[ny * m.w + nx];
        if (v < 0 || v >= here) continue;
        const busy = Actors.at(state, nx, ny);
        if (busy && !(nx === tx && ny === ty)) continue;
        best = k; break;
      }
      if (best < 0) break;
      x += Grid.DX[best]; y += Grid.DY[best]; here = d[y * m.w + x];
      out.push([x, y]);
    }
    return out;
  }
  const dirTo = (a, b) => { for (let k = 0; k < 8; k++) if (a[0] + Grid.DX[k] === b[0] && a[1] + Grid.DY[k] === b[1]) return k; return -1; };
  return { to, dirTo };
})();

</script>
<script>
// ACCESSION — the closing clock's budget (BUILD.md §8.4): the bell at B, the night watch at
// B + G, from the department's tour length.
'use strict';
const Clock = (() => {
  function budget(ltour) {
    const B = Int.round10(N.CLOCK_MULT_PCT * ltour + N.CLOCK_ADD * 100, 100);
    const G = Math.max(N.STAGE_GAP_MIN, Int.round10(N.STAGE_GAP_PCT * B, 100));
    return { B, G };
  }
  return { budget };
})();

</script>
<script>
// ACCESSION — layout construction kit, ported from prototypes/layout/proto.js: a working
// grid of character codes and room ids, rooms, openings, loops and the a-space pass
// (design/layout.md §§4–5). Generation is atomic, so its streams are local, not stored.
'use strict';
const LBuild = (() => {
  const CH = s => s.charCodeAt(0);
  const T = {
    WALL: CH('#'), FLOOR: CH('.'), ARCH: CH(','), DOOR: CH('+'), STAFF: CH('S'), VIT: CH('v'), LOWF: CH('f'),
    PLINTH: CH('p'), COL: CH('o'), SHELF: CH('H'), PART: CH('|'), CRATE: CH('c'), VOID: CH('~'), BENCH: CH('b'),
    CPL: CH('C'), ENT: CH('E'), EXIT: CH('X'), LECT: CH('l'), POOL: CH('w'),
  };
  // Public walking (staff doors closed) and sight, for generation and analysis.
  const WALK = new Uint8Array(128), SEE = new Uint8Array(128), BLOCK = new Uint8Array(128), GLASS = new Uint8Array(128);
  for (const c of '.,+EXbw') WALK[CH(c)] = 1;
  WALK[T.STAFF] = 2;
  for (const c of '.,bwEXvfp~l') SEE[CH(c)] = 1;
  for (const c of 'vfp~loH|cC') BLOCK[CH(c)] = 1;
  for (const c of 'vfp~l') GLASS[CH(c)] = 1;
  const PUBLIC = 1, ALL = 3;
  const walk = (c, mode) => (WALK[c] & mode) !== 0;

  function grid(W, H) {
    const t = new Uint8Array(W * H).fill(T.WALL), room = new Int16Array(W * H);
    return {
      W, H, t, room,
      in: (x, y) => x >= 0 && y >= 0 && x < W && y < H,
      get(x, y) { return x >= 0 && y >= 0 && x < W && y < H ? t[y * W + x] : T.WALL; },
      set(x, y, c) { t[y * W + x] = c; },
      rid(x, y) { return x >= 0 && y >= 0 && x < W && y < H ? room[y * W + x] : 0; },
      rows() { const out = []; for (let y = 0; y < H; y++) { let s = ''; for (let x = 0; x < W; x++) s += String.fromCharCode(t[y * W + x]); out.push(s); } return out; },
    };
  }

  // A local stream with the prototype's helper names, derived like every other stream.
  function stream(seed, path) {
    const holder = { seed, rng: {} }, s = Rng.stream(holder, path);
    return { u32: s.u32, int: s.int, pm: p => s.chance(p), pick: s.pick, shuffle: s.shuffle };
  }

<script>
// ACCESSION — the slice's layout programmes, ported from prototypes/layout/proto.js:

      const ring = new Set();
      for (const j of comp) { const x = j % W, y = (j - x) / W; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const q = (y + dy) * W + x + dx; if (open[q]) ring.add(q); } }

    const RG = roomGraph(L, reachRooms);
    const roomTiles = LCurate.roomTiles;
    // L_tour: nearest-neighbour tour over gallery centres, then the Centrepiece hall, then the nearest exit.
    const galleries = [...reachRooms].sort((a, b) => a - b).map(id => L.rooms[id]).filter(r => r.role !== 'coda' && r.role !== 'centre' && r.role !== 'staff');
    const pt = r => { const c = B.centreOf(r); let best = -1, bd = 1e9; for (const i of roomTiles(L, r)) { if (!open[i]) continue; const x = i % W, y = (i - x) / W, d = Math.abs(x - c.x) + Math.abs(y - c.y); if (d < bd) { bd = d; best = i; } } return best; };

      const D2 = B.bfs(G, [cur], B.PUBLIC);

    let vista = false;
    for (const i of roomTiles(L, intro)) { if (!open[i]) continue; const x = i % W; if (los(G, x, (i - x) / W, cx, cy)) { vista = true; break; } }

    const allRooms = L.rooms.filter(r => r && r.role !== 'staff');
    const allReached = allRooms.every(r => reachRooms.has(r.id));
    const exitsReached = L.meta.exits.length >= 2 && L.meta.exits.every(([x, y]) => D[y * W + x] >= 0);
    let dExit = 1e9;
    for (const [x, y] of L.meta.exits) if (D[y * W + x] >= 0) dExit = Math.min(dExit, D[y * W + x]);

        for (const j of comp) { const x = j % W, y = (j - x) / W; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const q = (y + dy) * W + x + dx; if (B.WALK[G.t[q]] === 1 || G.t[q] === T.CPL) ring.add(q); } }

      aShare: RG.n ? RG.types.a / RG.n : 0, introExits, introOnCycle, deadEnds, arenaMinRing, D, openMask: open, RG,

  return { analyse, los, roomGraph };
})();

<script>
// ACCESSION — layout generation, top level (design/layout.md §§2, 9, 10): embed the
// programme, add loops, make a-spaces, repair, curate, validate; up to 4 reseeds, then a
// certified fallback. Every step is logged in words, and every failed check names the
// tiles at fault, so a failing plan explains itself.
'use strict';
const Layout = (() => {
  const B = LBuild, T = B.T;
  const PIN = 2;                 // the layout version: bump on any change that alters layouts
  const RESEEDS = 4;
  // Certified fallbacks: one seed per programme, re-certified by test/m1.test.js.
  const FALLBACK = { enfilade: 1, case_labyrinth: 1, sculpture_court: 1 };

  const xy = (G, i) => { const x = i % G.W; return [x, (i - x) / G.W]; };
  const fail = (why, tiles) => ({ why, tiles: tiles || [] });

  // Identity checks per programme (design/layout.md §13.2), as integer comparisons.
  const IDENTITY = {
    enfilade: (L, A) => A.roomsToC < 3 ? `only ${A.roomsToC} rooms from the Intro to the Centrepiece hall (at least 3)`
      : (100 * A.glass < 40 * A.blockers || 100 * A.glass > 85 * A.blockers) ? `glass is ${A.glass} of ${A.blockers} blockers (40–85%)` : null,
    case_labyrinth: (L, A) => 4 * A.glass < 3 * A.blockers ? `glass is ${A.glass} of ${A.blockers} blockers (at least 75%)`
      : 100 * A.narrow < 15 * A.floor ? `only ${A.narrow} of ${A.floor} floor tiles are narrow (at least 15%)`
      : L.meta.crossing < L.meta.tortMin ? `the maze is crossed too directly (${L.meta.crossing} against ${L.meta.tortMin} per thousand)` : null,
    sculpture_court: (L, A) => A.pillar < 8 ? `only ${A.pillar} pillar loops (at least 8)` : null,
  };

  // The validators layout alone can decide (design/layout.md §9.1). Each returns null, or
  // a sentence and the tiles at fault.
  const CHECKS = [
    ['LV1', (L, A) => {
      if (A.allReached && A.exitsReached) return null;
      const G = L.G, tiles = [];
      for (const rm of L.rooms) if (rm && rm.role !== 'staff' && !LCurate.roomTiles(L, rm).some(i => A.openMask[i])) tiles.push(...LCurate.roomTiles(L, rm).slice(0, 4).map(i => xy(G, i)));
      for (const [x, y] of L.meta.exits) if (A.D[y * G.W + x] < 0) tiles.push([x, y]);
      return fail('not every room and exit can be reached from the entrance', tiles);
    }],
    ['LV3', (L, A) => A.optionalC ? null : fail('no exit can be reached without passing through the Centrepiece hall', L.meta.exits)],
    ['LV4', (L, A) => A.introExits >= 2 && A.introOnCycle ? null
      : fail(`the Intro has ${A.introExits} onward openings and ${A.introOnCycle ? 'is' : 'is not'} on a loop`, [L.meta.entrance])],
    ['LV5', (L, A) => A.allReached ? null : fail('a public room can only be reached through the staff layer')],
    ['LV8', (L, A) => {
      if (A.arenaMinRing < 16) return fail(`a free-standing block in the Centrepiece hall makes a loop of only ${A.arenaMinRing} tiles`, A.arenaBlock || []);
      if (!L.meta.viewTile) return fail('no lectern could be placed at the viewing distance from the Centrepiece', [L.meta.cpl]);
      const G = L.G, [vx, vy] = L.meta.viewTile, d = LCurate.toFootprint(L)(vy * G.W + vx);
      if (d !== N.VIEW_DISTANCE || !LAnalyse.los(G, vx, vy, L.meta.cpl[0], L.meta.cpl[1])) return fail(`the viewing tile is ${d} walking tiles from the Centrepiece, not ${N.VIEW_DISTANCE}, or out of its sight`, [L.meta.viewTile]);
      return null;
    }],
    ['LV9', (L, A) => !L.meta.vistaRequired || A.vista ? null : fail('the Centrepiece cannot be seen from the Intro', [L.meta.entrance, L.meta.cpl])],
    ['LV10', (L, A, pre) => {
      const G = L.G;
      for (const g of pre.gates) if (B.BLOCK[G.t[g]]) return fail('a fixture blocks a gate cell', [xy(G, g)]);
      for (let i = 0; i < G.W * G.H; i++) {
        if (G.t[i] !== T.VIT || !G.room[i]) continue;
        const [x, y] = xy(G, i);
        let ok = false;
        for (let dy = -1; dy <= 1 && !ok; dy++) for (let dx = -1; dx <= 1; dx++) if (A.openMask[(y + dy) * G.W + x + dx]) { ok = true; break; }
        if (!ok) return fail('a case cannot be reached', [[x, y]]);
      }
      return null;
    }],
    ['LV14', (L, A) => {
      const why = IDENTITY[L.meta.programme] && IDENTITY[L.meta.programme](L, A);
      if (why) return fail(why);
      if (L.meta.vistaRequired && !A.vista) return fail('no vista from the Intro');
      return null;
    }],
  ];

  // Opens a way into each unreachable room, then puts the Intro on a loop: first by opening
  // the Intro into a neighbour, then by linking the Intro's neighbour onward
  // (design/layout.md §10.1). Every repair is logged.
  function repair(L, A) {
    if (!A.allReached) {
      for (const r of L.rooms) {
        if (!r || r.role === 'staff' || LCurate.roomTiles(L, r).some(i => A.openMask[i])) continue;
        for (const q of L.rooms) if (q && q !== r && q.role !== 'staff' && LCurate.roomTiles(L, q).some(i => A.openMask[i]) && B.connect(L, r.id, q.id, { width: 1, why: 'repair' })) { L.log.push({ check: 'LV1', room: r.id, op: `opened a way into unreachable room ${r.id} (${r.role})` }); break; }
      }
      A = LAnalyse.analyse(L);
    }
    if (!A.introOnCycle || A.introExits < 2) {
      const intro = L.rooms.find(r => r && r.role === 'intro');
      const linked = new Set(L.edges.filter(e => e.a === intro.id || e.b === intro.id).map(e => e.a === intro.id ? e.b : e.a));
      for (const q of L.rooms) {
        if (!q || q === intro || q.role === 'staff' || q.role === 'coda' || q.tags.deadEnd || linked.has(q.id)) continue;
        if (B.connect(L, intro.id, q.id, { width: 3, why: 'repair:introCycle' })) { L.log.push({ check: 'LV4', room: q.id, op: `opened the Intro into room ${q.id}` }); break; }
      }
      A = LAnalyse.analyse(L);
      if (!A.introOnCycle) {
        let done = false;
        for (const id of linked) {
          const q = L.rooms[id];
          if (q.tags.deadEnd) continue;
          for (const r2 of L.rooms) {
            if (!r2 || r2 === q || r2 === intro || r2.role === 'staff' || r2.tags.deadEnd || r2.tags.noLoops) continue;
            if (L.edges.some(e => (e.a === q.id && e.b === r2.id) || (e.b === q.id && e.a === r2.id))) continue;
            if (B.connect(L, q.id, r2.id, { width: 3, why: 'repair:introCycle' })) { L.log.push({ check: 'LV4', room: q.id, op: `linked room ${q.id} onward to room ${r2.id} to put the Intro on a loop` }); done = true; break; }
          }
          if (done) break;
        }
        A = LAnalyse.analyse(L);
      }
    }
    return A;
  }

  // opts.plant(L) lets tests break a plan at a chosen stage ('afterAspace' or 'afterCurate').
  function attempt(programme, size, seed, base, opts) {
    opts = opts || {};
    const P = LProgrammes.PROGRAMMES[programme];
    const K = P.knobs(B.stream(seed, base + '/knobs'), size);
    const L = B.newLayout();
    L.meta.programme = programme;
    P.embed(L, K, B.stream(seed, base + '/embed'));
    B.addLoops(L, P.d, B.stream(seed, base + '/openings'), {
      allow: (a, b) => !a.tags.noLoops && !b.tags.noLoops && a.role !== 'staff' && b.role !== 'staff' && !((a.role === 'intro' && b.role === 'coda') || (a.role === 'coda' && b.role === 'intro')),
    });
    B.aSpacePass(L, K.studies || 0, B.stream(seed, base + '/aspace'));
    if (opts.plant && opts.plant.stage === 'afterAspace') opts.plant.fn(L);
    let A = repair(L, LAnalyse.analyse(L));
    roleKeys(L, A);
    LCurate.curate(L, seed, base, A.gates, opts.perturbRoom);
    const pre = { gates: A.gates };
    if (opts.plant && opts.plant.stage === 'afterCurate') opts.plant.fn(L, pre);
    A = LAnalyse.analyse(L);
    const failed = [];
    for (const [id, f] of CHECKS) { const r = f(L, A, pre); if (r) failed.push({ id, why: r.why, tiles: r.tiles }); }
    return { L, A, K, failed };
  }

  // Role keys name rooms without dots (BUILD.md §3.2): sections in tour order.
  function roleKeys(L, A) {
    let s = 0, st = 0;
    for (const id of A.order) { const r = L.rooms[id]; if (r.role === 'section') r.key = 's' + (++s); else if (r.role === 'study') r.key = 'study' + (++st); }
    for (const r of L.rooms) if (r && !r.key) r.key = r.role === 'section' ? 's' + (++s) : r.role === 'study' ? 'study' + (++st) : r.role;
  }

  // The certified fallback for a programme: always the same plan.
  function fallback(programme, size, opts) {
    return attempt(programme, size, FALLBACK[programme], `layout/fallback/${programme}@${PIN}/a0`, opts && { plant: opts.plantFallback });
  }

  // Generate one department's plan. opts: { acc, depth } name the streams.
  function generate(programme, size, seed, opts) {
    opts = opts || {};
    const key = `layout/${opts.acc || programme}@${PIN}/d${opts.depth || 1}`;
    const tries = [];
    for (let k = 0; k <= RESEEDS; k++) {
      const r = attempt(programme, size, seed, key + '/a' + k, opts);
      tries.push(r.failed);
      if (!r.failed.length) return finish(r, { attempt: k, fallback: false, tries, key });
    }
    const r = fallback(programme, size, opts);
    if (r.failed.length) throw new Error(`Layout: the certified fallback for ${programme} failed: ${r.failed.map(f => f.id + ' ' + f.why).join('; ')}`);
    return finish(r, { attempt: RESEEDS + 1, fallback: true, tries, key });
  }

  // The plan as plain data for the state (BUILD.md §4.1), plus the analysis for checks.
  function finish(r, info) {
    const { L, A } = r, G = L.G;
    const rooms = [];
    for (const rm of L.rooms) if (rm) rooms.push({ id: rm.id, key: rm.key, role: rm.role, x0: rm.x0, y0: rm.y0, x1: rm.x1, y1: rm.y1, tags: Object.keys(rm.tags).filter(k => rm.tags[k]).sort((a, b) => (a < b ? -1 : a > b ? 1 : 0)) });
    const roomOf = [];
    for (let y = 0; y < G.H; y++) { const row = []; for (let x = 0; x < G.W; x++) row.push(G.room[y * G.W + x]); roomOf.push(row); }
    return {
      plan: { programme: L.meta.programme, pin: PIN, w: G.W, h: G.H, tiles: G.rows(), rooms, roomOf, entrance: L.meta.entrance.slice(),
        exits: L.meta.exits.map(e => e.slice()), cpl: L.meta.cpl.slice(), lectern: L.meta.lectern ? L.meta.lectern.slice() : null,
        viewTile: L.meta.viewTile ? L.meta.viewTile.slice() : null, ltour: A.tour, tourOrder: A.order.slice() },
      analysis: A, failed: r.failed, log: L.log, attempt: info.attempt, fallback: info.fallback, tries: info.tries, knobs: r.K,
    };
  }

  // Room numbers D·100 + n in tour order: galleries in L_tour order, then the Centrepiece
  // hall, then the coda (design/layout.md §8.1). Staff rooms are not numbered.
  function number(plan, depth) {
    const out = {};
    let n = 1;
    for (const id of plan.tourOrder) out[id] = depth * 100 + n++;
    for (const rm of plan.rooms) if (rm.role === 'coda') out[rm.id] = depth * 100 + n++;
    return out;
  }

  // A plan as text, with the given tiles marked '!' (for failure reports).
  function text(plan, tiles) {
    const rows = plan.tiles.slice();
    for (const [x, y] of tiles || []) if (y >= 0 && y < rows.length) rows[y] = rows[y].slice(0, x) + '!' + rows[y].slice(x + 1);
    return rows.join('\n');
  }

  return { PIN, FALLBACK, generate, fallback, attempt, number, text, CHECKS };
})();

<script>
// ACCESSION — building a fresh state (BUILD.md §4.1).
'use strict';
const Setup = (() => {
  const SAVE_VERSION = 1;

  // The visitor at the start of a run: a T1 Balanced weapon and a T1 Standard garment
  // (BUILD.md §8.1), from the forms in the numbers table.
  function you(x, y) {
    const t = 1, F = N.FORM_BALANCED, G = N.GARMENT_STANDARD;
    return {
      uid: 'you', sp: 'visitor', size: 1, x, y, hp: N.PLAYER_HP, maxHp: N.PLAYER_HP, next: 0, still: false,
      acc: N.PLAYER_ACC + F[4], eva: N.PLAYER_EVA + G[1], pad: t + G[0], dmin: t + F[0], dmax: F[1] * t + F[2],
      weaponForm: 'balanced', statuses: [],
    };
  }

  // A state for one room: map rows, your position, and exhibit records from a pack.
  function room(seed, spec) {
    const state = {
      v: SAVE_VERSION, seed, rng: {}, tick: 0, turn: 0,
      dept: { acc: spec.acc, depth: spec.depth || 1, w: spec.map[0].length, h: spec.map.length, tiles: spec.map.slice() },
      actors: [you(spec.you[0], spec.you[1])],
      causes: [], over: null,
    };
    let n = 0;
    for (const e of spec.exhibits) {
      n++;
      state.actors.push(Object.assign({
        uid: spec.acc + '.' + state.dept.depth + '.' + (e.room || 'room') + '.' + n,
        size: 1, next: 0, pips: 0, statuses: [],
      }, e.stats, { sp: e.sp, x: e.at[0], y: e.at[1], mode: e.mode || 'dormant', maxHp: e.stats.hp }));
    }
    return state;
  }

  return { SAVE_VERSION, you, room };
})();

<script>
// ACCESSION — the grammar registry (BUILD.md §5.1): the nine universal systems and the
// slice's triggers, archetypes, modifiers and modules, each with the clause its Behaviour
// line is built from. A clause states exactly what the rule code does; the scenario tests
// named in `tests` prove it (they arrive with the rule, in M3 and M4).

    { id: 'grade', icon: 'certificate', name: 'Grade', sentence: 'Each department’s Certificate, earned by defeating or viewing its Centrepiece, raises your grade by one: more health, a perk chosen from three, heavier objects, higher-grade cases.' },
    { id: 'labels', icon: 'reads', name: 'Labels', sentence: 'Every exhibit and object has one: a plain Behaviour line that states exactly what it does, and a paragraph that is only for reading.' },
    { id: 'doors', icon: 'highlight', name: 'Doors', sentence: 'Each department ends in doors whose placards say what kind of trouble lies behind each.' },
  ];
  const MAX_SYSTEMS = 10;

  // Special triggers: at most one per species (BUILD.md §8.2).
  const TRIGGERS = {
    axis: { icon: 'axis', clause: 'also wakes when you stand in its row or column within 8 tiles, in sight' },
    period: { icon: 'period', clause: 'wakes on the bell to perform, then sleeps again' },

  // Archetypes in the slice (design/vocabulary.md §2.1, trimmed per BUILD.md §5.5).
  const ARCHETYPES = {
    plodder: { clause: 'Walks one tile at a time and strikes from beside you.' },
    darter: { clause: 'Moves two tiles a turn; strikes, then steps back one.', speed: 'fast' },

    axis_sniper: { clause: 'Aims along its row or column for a turn, with the line shown, then fires a beam up to 10 tiles that passes through glass.', ranged: true },
    splitter: { clause: 'A blow that does not destroy it splits it in two, each with half its health, at most twice.' },
    mote_swarm: { clause: 'Comes as several bodies that each fall to one blow; they move up to two tiles a turn and surround you.' },
    herald: { clause: 'On seeing you it calls for one turn, shown, then wakes every sleeping exhibit within 6 tiles.' },
    tethered_warden: { clause: 'Never goes more than 2 tiles from what it guards; strikes hard; heals and settles when you leave.' },
    reflector: { clause: 'Sends beams and shots back along their line and shields whatever stands behind it; weak in a fight.' },
    mimic_vitrine: { clause: 'Looks like a case. Touched, it grips you (you cannot move for 2 turns) and strikes, then fights slowly.' },
    night_watchman: { clause: 'Comes for you wherever you are; if defeated, it returns 20 turns later.' },
    unobserved_mover: { clause: 'Moves two tiles a turn, but only while you cannot see it; strikes hard from beside you.' },
    patrol_guard: { clause: 'Walks a fixed round. On seeing you it raises the alarm for one turn, then gives chase; after 20 turns without you it goes back to its round.' },
    demonstrator: { clause: 'Keeps to its track and never chases. On the bell it performs the demonstration on its label.' },
    conservator_healer: { clause: 'Stays behind its allies and spends a turn, shown, restoring one; backs away when you come close.' },
    completing_guardian: { clause: 'Grows one limb for every two galleries you have walked, up to four; each limb is a special. Leaving its room heals it and drops one limb.' },
    mp_ensemble: { clause: 'Several pieces share one health pool. When a piece falls, the others take on its special.' },
    mp_tableau: { clause: 'Stays in its frame and alternates shown lines and bursts; takes double damage while it summons.' },
  };

  // Modifiers, trimmed to what the slice implements (BUILD.md §5.5).
  const MODIFIERS = {
    glass: { clause: 'Its body does not block sight; it leaves shards when destroyed.' },
    clockwork: { clause: 'Shows its next move as an arrow and cannot be dazed; rain stops it for 2 turns.' },
    old_repair: { clause: 'One side is a later repair and takes double damage.' },
    marble: { clause: 'Moves at half speed.' },
    plaster: { clause: 'A cast: when destroyed it crumbles into dust that blocks sight for 3 turns.' },
  };

  const MODULES = {
    unobserved_motion: { sentence: 'The animals move only when you cannot see them.' },
    alarm_network: { sentence: 'The waders raise the alarm when they see you; then the whole court is awake.' },
    copies_weaken: { sentence: 'When an original is broken, its spares lose heart.' },
    hourly_demonstration: { sentence: 'On the bell, the stations exchange signals down the length of the gallery.' },
    weather_cases: { sentence: 'Some cases hold weather. Break one, and the weather gets out.' },
  };

  // The Behaviour line for a species: archetype, modifiers, waking (BUILD.md §5.3).
  function behaviour(sp) {
    const parts = [ARCHETYPES[sp.archetype] ? ARCHETYPES[sp.archetype].clause : ''];
    for (const m of sp.modifiers || []) if (MODIFIERS[m]) parts.push(MODIFIERS[m].clause);
    const t = sp.trigger && TRIGGERS[sp.trigger];
    if (t && sp.trigger === 'awake') parts.push('It never sleeps.');
    else parts.push('Wakes when you stay inside your ring or make noise near it' + (t ? '; ' + t.clause : '') + '.');

<script>
// ACCESSION — the department packs: content files register themselves here (BUILD.md §5.2).
'use strict';
const Packs = (() => {
  const all = [];
  function add(p) { all.push(p); }
  const get = acc => all.find(p => p.acc === acc) || null;
  const list = () => all.slice();
  function species(acc, id) { const p = get(acc); return p ? p.species.find(s => s.id === id) || null : null; }
  return { add, get, list, species };
})();

<script>
// ACCESSION — every sentence about the rules is made here, from events and data
// (BUILD.md §3.4). M0 covers moving, fighting and doors.
'use strict';
const Text = (() => {
  const name = uid => uid === 'you' ? 'You' : 'The training dummy';
  const lower = uid => uid === 'you' ? 'you' : 'the training dummy';
  function event(e) {
    switch (e.k) {
      case 'damaged': {
        const c = e.cause;
        const sum = `${c.raw} − ${c.pad} Padding${c.floor ? `, at least ${c.floor}` : ''}`;
        if (c.surprise) return `${name(c.by)} caught ${lower(e.who)} unawares: ${e.amount} damage (${sum}).`;
        return `${name(c.by)} hit ${lower(e.who)} for ${e.amount} (rolled ${c.roll} against ${c.chance}%; ${sum}).`;
      }
      case 'missed': return `${name(e.by)} missed ${lower(e.at)} (rolled ${e.cause.roll} against ${e.cause.chance}%).`;
      case 'died': return e.who === 'you' ? 'You fell.' : `${name(e.who)} broke apart.`;
      case 'hunting': return e.cause.k === 'damage' ? `${name(e.who)} woke: it was struck.` : `${name(e.who)} is hunting you.`;
      case 'opened': return e.who === 'you' ? 'You opened the door.' : null;
      case 'refused': return e.reason;
      default: return null;
    }
  }
  return { event };
})();

<script>
// ACCESSION — what a label says about a thing on the board (BUILD.md §8.8): the title,
// state, tombstone, pictograms, Behaviour line, odds readout and paragraph, built from the
// pack, the registry and the rules' own numbers.
'use strict';
const Labels = (() => {
  function speciesOf(state, a) {
    const pack = Packs.get(state.dept.acc);
    if (!pack) return null;
    if (pack.centrepiece && pack.centrepiece.id === a.sp) return pack.centrepiece;
    return pack.species.find(s => s.id === a.sp) || null;
  }

  function stateIcons(a) {
    if (a.uid === 'you') return [];
    if (a.mode === 'dormant') return a.pips ? Array.from({ length: 3 }, (_, i) => i < a.pips ? 'pip' : 'pip_empty') : ['asleep'];
    return [a.mode === 'hunting' ? 'hunting' : a.mode === 'returning' ? 'returning' : 'alert'];
  }

  // Brogue's sentence, computed from the live numbers (BUILD.md §8.1).
  function odds(state, a) {
    const you = state.actors[0];
    const toYou = Combat.hitChance(a, you), toIt = Combat.hitChance(you, a);
    const mean = Int.idiv(a.dmin + a.dmax, 2), worst = Math.max(1, a.dmax - you.pad);
    const typical = Math.max(1, mean - you.pad), yourMean = Math.max(1, Int.idiv(you.dmin + you.dmax, 2) - a.pad);
    const lines = [
      `It has a ${toYou}% chance to hit you, typically hits for ${Math.max(1, Int.idiv(100 * typical, Math.max(1, you.hp)))}% of your current health, and at worst could defeat you in ${Int.ceilDiv(you.hp, worst)} hits.`,
      `You have a ${toIt}% chance to hit it, and typically need ${Int.ceilDiv(a.hp, yourMean)} hits to destroy it.`,
    ];
    if (Combat.surprised(you, a)) lines.push(`A surprise attack now would deal ${Math.max(N.DMG_MIN_ON_HIT, you.dmax - a.pad)}.`);
    return lines;
  }

  function of(state, uid) {
    const a = Actors.byUid(state, uid);
    if (!a || a.gone || a.uid === 'you') return null;
    const sp = speciesOf(state, a), you = state.actors[0];
    const near = Grid.chebyshev(you.x, you.y, a.x, a.y) <= N.READ_RANGE;
    const pictos = [
      { icon: 'heart', text: `${a.hp}/${a.maxHp}` }, { icon: 'acc', text: String(a.acc) }, { icon: 'eva', text: String(a.eva) },
      { icon: 'padding', text: String(a.pad) }, { icon: 'damage', text: `${a.dmin}–${a.dmax}` },
    ];
    if (sp && sp.trigger && Registry.TRIGGERS[sp.trigger]) pictos.unshift({ icon: Registry.TRIGGERS[sp.trigger].icon, text: 'wakes' });
    pictos.unshift({ icon: 'ring', text: 'ring' });
    const adjacent = Step.adjacent(state, you, a);
    return {
      uid, title: sp ? sp.name : a.sp, stateIcons: stateIcons(a), tomb: sp ? sp.tomb : null, number: sp ? sp.id.replace(/^([A-Z]+)(\d+)/, '$1.$2') : '',
      pictos, behaviour: sp ? Registry.behaviour(sp) : '', odds: odds(state, a),
      paragraph: near && sp ? sp.paragraph : '', far: near ? '' : 'Come closer to read the label.',
      closeup: sp ? { sprite: sp.sprite, dept: state.dept.acc } : null,
      actions: adjacent ? [{ id: 'attack', text: `Attack: ${Combat.hitChance(you, a)}%, ${Math.max(1, you.dmin - a.pad)}–${Math.max(1, you.dmax - a.pad)} damage` }] : [],
    };
  }

  // The strip: the nearest readable exhibit within 2 tiles and in sight, hunting first.
  function strip(state) {
    const you = state.actors[0], m = state.dept;
    let best = null, bestKey = null;
    for (const a of state.actors) {
      if (a.gone || a.uid === 'you') continue;
      const d = Grid.chebyshev(you.x, you.y, a.x, a.y);
      if (d > N.READ_RANGE || !Grid.los(m, you.x, you.y, a.x, a.y)) continue;
      const key = (a.mode === 'hunting' ? 0 : a.mode === 'dormant' ? 2 : 1) * 100 + d;
      if (best === null || key < bestKey) { best = a; bestKey = key; }
    }
    if (!best) return null;
    const l = of(state, best.uid);
    return { uid: best.uid, title: l.title, stateIcons: l.stateIcons, pictos: l.pictos.slice(0, 2).map(p => p.icon), behaviour: l.behaviour };
  }

  return { of, strip, speciesOf, stateIcons };
})();

</script>
<script>
// ACCESSION — a department visit's starting state: the generated plan from a pack's
// programme, you at the entrance, the pack's exhibits placed asleep. M2's placement is a
// stand-in for M4's population pass: one of each species, in the sections, outside the
// safe zone, never on a gate cell.
'use strict';
const Dept = (() => {
  const SAFE = 8;

  function create(seed, acc, depth) {
    const pack = Packs.get(acc);
    const r = Layout.generate(pack.programme, 0, seed, { acc, depth });
    const plan = r.plan, nums = Layout.number(plan, depth);
    const tiles = plan.tiles.map(row => row.replace(/C/g, '.'));
    const state = {
      v: Setup.SAVE_VERSION, seed, rng: {}, tick: 0, turn: 0,
      dept: { acc, depth, pin: plan.pin, programme: plan.programme, w: plan.w, h: plan.h, tiles, ltour: plan.ltour,
        rooms: plan.rooms.map(rm => ({ id: rm.id, role: rm.role, number: nums[rm.id] || 0, x0: rm.x0, y0: rm.y0, x1: rm.x1, y1: rm.y1 })),
        roomOf: plan.roomOf, entrance: plan.entrance, exits: plan.exits, lectern: plan.lectern, seen: '' },
      actors: [Setup.you(plan.entrance[0] + 1, plan.entrance[1])],
      causes: [], over: null,
    };
    const m = state.dept, d = Grid.distances(m, [plan.entrance], 999);
    const free = [];
    for (let y = 1; y < m.h - 1; y++) for (let x = 1; x < m.w - 1; x++) {
      const i = y * m.w + x, rm = plan.rooms.find(q => q.id === plan.roomOf[y][x]);
      if (m.tiles[y][x] === '.' && d[i] > SAFE && rm && (rm.role === 'section' || rm.role === 'study')) free.push([x, y]);
    }
    const holder = { seed, rng: {} }, pick = Rng.stream(holder, `place/${acc}/d${depth}`);
    pick.shuffle(free);
    let n = 0;
    for (const sp of pack.species) {
      const at = free.find(([x, y]) => !state.actors.some(a => Math.abs(a.x - x) < 3 && Math.abs(a.y - y) < 3));
      if (!at) break;
      add(state, sp, at, ++n, Roles.stats(sp.role, depth));
    }
    // The Centrepiece stands where the plan put its plinth.
    const c = pack.centrepiece;
    add(state, c, plan.cpl, ++n, Roles.stats('centrepiece', depth));
    return state;
  }

  function add(state, sp, at, n, stats) {
    const m = state.dept, rid = m.roomOf[at[1]][at[0]], rm = m.rooms.find(q => q.id === rid);
    state.actors.push(Object.assign({
      uid: `${m.acc}.${m.depth}.${rm ? rm.role : 'room'}${rid}.${n}`, sp: sp.id, size: sp.size || 1,
      x: at[0], y: at[1], next: 0, mode: 'dormant', pips: 0, statuses: [],
    }, stats, { maxHp: stats.hp }));
  }

  return { create };
})();

</script>
<script>
// ACCESSION — the view model: a plain description of what to draw, derived from the state
// (BUILD.md §6.1). Both board views read this and nothing else, and bots see only this.
'use strict';
const ViewModel = (() => {
  function derive(state, ui) {
    ui = ui || {};
    const m = state.dept, you = state.actors[0], n = m.w * m.h;
    const now = Vision.visible(state), vis = new Uint8Array(n);
    for (let i = 0; i < n; i++) vis[i] = now[i] ? 2 : (m.seen && m.seen.charCodeAt(i) === 49 ? 1 : 0);
    const ring = Vision.ring(state);
    const actors = [];
    for (const a of state.actors) {
      if (a.gone) continue;
      const size = a.size || 1;
      let seen = false;
      for (let dy = 0; dy < size && !seen; dy++) for (let dx = 0; dx < size; dx++) if (now[(a.y + dy) * m.w + a.x + dx]) { seen = true; break; }
      if (!seen && a.uid !== 'you') continue;
      const sp = a.uid === 'you' ? null : Labels.speciesOf(state, a);
      actors.push({ uid: a.uid, sprite: a.uid === 'you' ? 'visitor' : (sp ? sp.sprite : 'seated_clerk'), x: a.x, y: a.y, size,
        mode: a.uid === 'you' ? 'you' : a.mode, pips: a.pips || 0, hostile: a.uid !== 'you', hp: a.hp, maxHp: a.maxHp });
    }
    const pack = typeof Packs !== 'undefined' ? Packs.get(m.acc) : null;
    const clock = m.ltour ? Object.assign({ turn: state.turn }, Clock.budget(m.ltour)) : null;
    return {
      dept: pack ? pack.palette : 'T0', w: m.w, h: m.h, tiles: m.tiles, vis, ring, actors, marks: [],
      you: { x: you.x, y: you.y, hp: you.hp, maxHp: you.maxHp, grade: you.grade || 1 }, turn: state.turn, over: state.over,
      camera: { x: you.x, y: you.y }, clock, path: ui.path || null, selection: ui.selection || null, selectedTile: ui.selectedTile || null,
    };
  }
  return { derive };
})();

<script>
// ACCESSION — the monkey: random legal actions (Step.legal) chosen on its own seeded
// stream, for soak and cross-engine hash runs (BUILD.md §3.5, §10.1). Loaded by tests and
// the hash page.
'use strict';
const Monkey = (() => {
  // Plays `count` actions. When a visit ends (you die, or the room is cleared), a new one
  // starts on the next seed. Returns a hash folded over every finished visit and every
  // checkpoint. opts.cloneEachStep replaces the state with State.clone after every step.
  function run(seed, count, opts) {
    opts = opts || {};
    const make = opts.make || (s => TestRoom.create(s));
    const pick = { seed: seed, rng: {} };
    const r = Rng.stream(pick, 'monkey');
    let state = make(seed), visit = 0, fold = 0x811c9dc5;
    const checkpoints = [];
    const mix = h => { fold = State.fnv1a(fold + ':' + h); };
    for (let i = 1; i <= count; i++) {
      const legal = Step.legal(state);
      // Mostly moves, as a player's are; waits and attacks often enough to matter.
      const roll = r.int(0, 99), moves = legal.filter(a => a.a === 'move'), attacks = legal.filter(a => a.a === 'attack');
      const action = roll < 15 || !moves.length ? { a: 'wait' } : roll < 25 && attacks.length ? r.pick(attacks) : r.pick(moves);
      Step.step(state, action);
      if (opts.cloneEachStep) state = State.clone(state);
      if (opts.check) opts.check(state, i);
      const cleared = state.actors.every(a => a.gone || a.uid === 'you');
      if (state.over || cleared) { mix(State.hash(state)); visit++; state = make(seed + visit); }
      if (i % 1000 === 0) { mix(State.hash(state)); checkpoints.push(fold); }
    }
    mix(State.hash(state));
    return { hash: fold, checkpoints, visits: visit };
  }
  return { run };
})();
