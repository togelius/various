<!doctype html><html><head><meta charset="utf-8"><title>Contact sheet</title>
<style>body{margin:0;background:#111;color:#ddd;font:600 13px system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:10px;padding:10px}
figure{margin:0;display:flex;flex-direction:column;gap:4px}img{display:block;height:var(--h,560px);width:auto;border:1px solid #333}figcaption{max-width:280px}</style></head>
<body><script>
const q = new URLSearchParams(location.search);
const items = JSON.parse(q.get('items'));
if (q.get('h')) document.body.style.setProperty('--h', q.get('h') + 'px');
for (const [src, cap] of items) { const f = document.createElement('figure'); f.innerHTML = `<img src="${src}"><figcaption>${cap}</figcaption>`; document.body.appendChild(f); }
window.addEventListener('load', () => { window.__ready = true; });
</script></body></html>
