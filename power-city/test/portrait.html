<!DOCTYPE html><html><head><meta charset="utf-8"><title>portraits</title>
<style>body{margin:0;background:#101018}canvas{image-rendering:pixelated;display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script src="../js/core.js"></script><script src="../js/art.js"></script>
<script src="../js/rig.js"></script><script src="../js/cast.js"></script>
<script>
// Large, one-at-a-time: the cast in a handful of poses, against the
// pavement grey they will actually stand on.
var Q = new URLSearchParams(location.search);
var who = (Q.get('c') || 'hero1,punk,brute,boss_power').split(',');
var poses = (Q.get('p') || 'idle,walk1,jab,kick,hurt').split(',');
var Z = parseInt(Q.get('z') || '5', 10);
var ctx = document.getElementById('c').getContext('2d'); ctx.imageSmoothingEnabled = false;
var off = document.createElement('canvas'); off.width = 1280 / Z; off.height = 720 / Z;
var o = off.getContext('2d'); o.imageSmoothingEnabled = false;
o.fillStyle = '#8f95a3'; o.fillRect(0, 0, off.width, off.height);
var cw = Math.floor(off.width / poses.length), ch = Math.floor(off.height / who.length);
who.forEach(function (c, r) {
  poses.forEach(function (pn, k) {
    o.fillStyle = (r + k) % 2 ? '#9aa0ac' : '#8f95a3';
    o.fillRect(k * cw, r * ch, cw, ch);
    PC.rig.draw(o, PC.rig.frame(c, pn), k * cw + cw / 2, r * ch + ch - 4, false);
  });
});
ctx.drawImage(off, 0, 0, off.width * Z, off.height * Z);
document.title = 'ready';
</script></body></html>
