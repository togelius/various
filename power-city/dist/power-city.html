<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>POWER CITY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23050a24'/><rect x='2' y='3' width='12' height='4' fill='%23e02030'/><rect x='2' y='9' width='12' height='4' fill='%232f6ef0'/></svg>">
<style>
:root {
  --ink: #05060e;
  --dim: #6a7290;
  --accent: #ffe070;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #05060c;
  /* a dark arcade, one machine lit */
  background-image:
    radial-gradient(ellipse 70% 55% at 50% 40%, #1a1430 0%, rgba(8, 8, 16, 0) 72%),
    linear-gradient(#07070f, #030308);
  color: #9fb0d0;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

#frame {
  position: relative;
  line-height: 0;
  border-radius: 5px;
  padding: 7px;
  background: linear-gradient(#20182c, #0c0a16);
  box-shadow:
    0 0 0 1px #3a2a44,
    0 20px 60px rgba(0, 0, 0, 0.8),
    0 0 100px rgba(224, 32, 48, 0.12);
}

canvas#screen {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
  border-radius: 2px;
}

#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-size: 13px;
  letter-spacing: 2px;
  text-align: center;
  padding: 12px;
}

#hint {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.2px;
  color: var(--dim);
  text-align: center;
  max-width: 92vw;
  line-height: 1.6;
}
#hint b { color: #b8c4e0; font-weight: 600; }

/* ---------------------------------------------------------- touch controls */
#touch { display: none; }

@media (hover: none) and (pointer: coarse) {
  #hint { display: none; }
  #touch {
    display: block;
    position: fixed;
    inset: auto 0 0 0;
    height: 46vh;
    pointer-events: none;
    z-index: 5;
  }
  #touch .pad { position: absolute; bottom: 4vh; pointer-events: auto; }
  #touch .pad.left { left: 3vw; width: 34vw; height: 34vw; }
  #touch .pad.right { right: 3vw; width: 40vw; height: 34vw; }
  #touch button {
    position: absolute;
    border: 1px solid rgba(180, 200, 255, 0.3);
    background: rgba(30, 36, 60, 0.5);
    color: #d8e0f4;
    font: 600 11px/1 ui-monospace, monospace;
    border-radius: 50%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #touch button:active { background: rgba(90, 120, 220, 0.6); }
  .pad.left .u { left: 34%; top: 0; width: 32%; height: 32%; }
  .pad.left .d { left: 34%; bottom: 0; width: 32%; height: 32%; }
  .pad.left .l { left: 0; top: 34%; width: 32%; height: 32%; }
  .pad.left .r { right: 0; top: 34%; width: 32%; height: 32%; }
  .pad.right .a { right: 0; bottom: 8%; width: 42%; height: 42%; background: rgba(200, 40, 60, 0.45); }
  .pad.right .b { right: 40%; bottom: 22%; width: 38%; height: 38%; background: rgba(40, 90, 200, 0.45); }
  .pad.right .c { right: 12%; top: 2%; width: 38%; height: 38%; background: rgba(200, 160, 40, 0.4); }
  .pad.right .small {
    left: 0; bottom: 0; width: 30%; height: 22%; border-radius: 6px; font-size: 10px;
  }
}

@media (max-height: 620px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="frame">
    <canvas id="screen" width="384" height="288"></canvas>
    <div id="loading">LOADING&hellip;</div>
  </div>

  <div id="touch" aria-hidden="true">
    <div class="pad left">
      <button data-act="up" class="u">&#9650;</button>
      <button data-act="left" class="l">&#9664;</button>
      <button data-act="right" class="r">&#9654;</button>
      <button data-act="down" class="d">&#9660;</button>
    </div>
    <div class="pad right">
      <button data-act="jump" class="c">JUMP</button>
      <button data-act="kick" class="b">KICK</button>
      <button data-act="punch" class="a">PUNCH</button>
      <button id="touch-start" class="small">START</button>
    </div>
  </div>

  <p id="hint">
    <b>Arrows/WASD</b> move &nbsp;&middot;&nbsp; <b>Z/J</b> punch &nbsp;&middot;&nbsp;
    <b>X/K</b> kick &nbsp;&middot;&nbsp; <b>C/L</b> jump &nbsp;&middot;&nbsp;
    <b>Punch+Kick</b> spin kick &nbsp;&middot;&nbsp; <b>5</b> insert coin &nbsp;&middot;&nbsp;
    <b>1</b>/<b>2</b> start &nbsp;&middot;&nbsp; <b>Esc</b> pause &nbsp;&middot;&nbsp;
    <b>M</b> mute &nbsp;&middot;&nbsp; <b>F</b> fullscreen &nbsp;&middot;&nbsp; gamepads supported
  </p>
<script>
/* POWER CITY - core: constants, math, RNG, input, pixel screen, loop, storage.
 *
 * Classic scripts (no modules) so the game runs straight off the filesystem
 * with a double-click, and so tools/build-single.py can concatenate it.
 */
(function (global) {
  'use strict';

  var PC = global.PC || (global.PC = {});

  // ------------------------------------------------------------- screen box
  PC.W = 384;
  PC.H = 288;
  PC.FPS = 60;
  PC.DT = 1 / 60;

  /* The cabinet layout. A beat 'em up is a shallow diorama: a backdrop, a
   * band of floor you can walk in, and arcade furniture stacked above and
   * below it. Everything else in the game measures itself against these. */
  PC.HUD_TOP = 64;          // black band at the top ends here
  PC.FIELD_Y = 64;          // backdrop starts
  PC.FIELD_BOT = 256;       // backdrop ends / bottom bar starts
  PC.FLOOR_TOP = 196;       // nearest-to-the-wall footline
  PC.FLOOR_BOT = 246;       // nearest-to-the-camera footline
  PC.FLOOR_H = PC.FLOOR_BOT - PC.FLOOR_TOP;

  // ------------------------------------------------------------------- math
  var M = PC.math = {
    clamp: function (v, a, b) { return v < a ? a : (v > b ? b : v); },
    lerp: function (a, b, t) { return a + (b - a) * t; },
    sign: function (v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); },
    approach: function (v, target, step) {
      if (v < target) return Math.min(v + step, target);
      if (v > target) return Math.max(v - step, target);
      return target;
    },
    dist: function (ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); },
    ease: function (t) { return t * t * (3 - 2 * t); }
  };

  // ---------------------------------------------------------- mulberry32 RNG
  PC.RNG = function (seed) {
    var s = (seed >>> 0) || 0x9e3779b9;
    var r = function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = function (a, b) { return a + r() * (b - a); };
    r.int = function (a, b) { return Math.floor(a + r() * (b - a + 1)); };
    r.pick = function (arr) { return arr[Math.floor(r() * arr.length) % arr.length]; };
    r.chance = function (p) { return r() < p; };
    r.sign = function () { return r() < 0.5 ? -1 : 1; };
    return r;
  };
  PC.rand = PC.RNG(0xC0FFEE01);

  // ------------------------------------------------------------------ input
  /* Two players share one keyboard. The arrow cluster belongs to player one
   * until player two actually joins, at which point it moves over to them -
   * so a solo player can use whichever hand they like, and a second player
   * never has to be told which keys became theirs. */
  var ACTIONS = ['left', 'right', 'up', 'down', 'punch', 'kick', 'jump', 'start'];

  var MAP_P1 = {
    KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down',
    KeyJ: 'punch', KeyZ: 'punch',
    KeyK: 'kick', KeyX: 'kick',
    KeyL: 'jump', KeyC: 'jump', Space: 'jump',
    Enter: 'start', Digit1: 'start'
  };
  var MAP_ARROWS = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down'
  };
  var MAP_P2 = {
    Comma: 'punch', Period: 'kick', Slash: 'jump',
    Numpad1: 'punch', Numpad2: 'kick', Numpad3: 'jump',
    Numpad0: 'start', Digit2: 'start', ShiftRight: 'jump'
  };
  // 0=A 1=B 2=X 3=Y ... standard mapping
  var MAP_PAD = {
    0: 'jump', 1: 'kick', 2: 'punch', 3: 'jump', 5: 'kick', 7: 'punch',
    9: 'start', 12: 'up', 13: 'down', 14: 'left', 15: 'right'
  };

  function blankState() {
    var s = { held: {}, pressed: {}, released: {}, tapDir: 0, _tapTimer: 0, _tapDir: 0 };
    for (var i = 0; i < ACTIONS.length; i++) {
      s.held[ACTIONS[i]] = false; s.pressed[ACTIONS[i]] = false; s.released[ACTIONS[i]] = false;
    }
    return s;
  }

  var Input = PC.input = {
    p: [blankState(), blankState()],
    coin: false, pause: false, mute: false, fullscreen: false, anyKey: false,
    p2Joined: false,
    touch: null,           // filled in by touch.js: { held: {...} }
    _down: {},             // raw code -> true
    _edge: {},             // raw code pressed this frame
    _latch: {},            // guarantees sub-frame taps are seen
    _globals: {},

    init: function () {
      var self = this;
      global.addEventListener('keydown', function (e) {
        if (e.repeat) { e.preventDefault(); return; }
        if (self._interesting(e.code)) e.preventDefault();
        self._down[e.code] = true; self._latch[e.code] = true;
        self._edge[e.code] = true;
      });
      global.addEventListener('keyup', function (e) {
        if (self._interesting(e.code)) e.preventDefault();
        self._down[e.code] = false;
      });
      global.addEventListener('blur', function () { self._down = {}; });
    },

    _interesting: function (code) {
      return !!(MAP_P1[code] || MAP_P2[code] || MAP_ARROWS[code] ||
        code === 'Digit5' || code === 'Escape' || code === 'KeyP' ||
        code === 'KeyM' || code === 'KeyF' || code === 'Tab');
    },

    // Collapse raw key state into per-player actions once per simulation step.
    poll: function () {
      var i, a, code, st, prev = {};
      var pads = (global.navigator && global.navigator.getGamepads) ? global.navigator.getGamepads() : [];

      for (i = 0; i < 2; i++) {
        st = this.p[i];
        prev[i] = {};
        for (a = 0; a < ACTIONS.length; a++) prev[i][ACTIONS[a]] = st.held[ACTIONS[a]];
        for (a = 0; a < ACTIONS.length; a++) st.held[ACTIONS[a]] = false;
      }

      function set(pl, act) { if (act) Input.p[pl].held[act] = true; }
      function down(c) { return Input._down[c] || Input._latch[c]; }

      for (code in MAP_P1) if (down(code)) set(0, MAP_P1[code]);
      for (code in MAP_P2) if (down(code)) set(1, MAP_P2[code]);
      var arrowsTo = this.p2Joined ? 1 : 0;
      for (code in MAP_ARROWS) if (down(code)) set(arrowsTo, MAP_ARROWS[code]);

      // Gamepads take players in the order the browser lists them.
      var padPlayer = 0;
      for (i = 0; i < pads.length && padPlayer < 2; i++) {
        var pad = pads[i];
        if (!pad || !pad.connected) continue;
        var b, ax;
        for (b in MAP_PAD) if (pad.buttons[b] && pad.buttons[b].pressed) set(padPlayer, MAP_PAD[b]);
        ax = pad.axes[0] || 0;
        if (ax < -0.35) set(padPlayer, 'left'); else if (ax > 0.35) set(padPlayer, 'right');
        ax = pad.axes[1] || 0;
        if (ax < -0.35) set(padPlayer, 'up'); else if (ax > 0.35) set(padPlayer, 'down');
        padPlayer++;
      }

      // Touch overlay always drives whichever player is on screen first.
      if (this.touch) {
        for (a in this.touch.held) if (this.touch.held[a]) set(0, a);
      }

      for (i = 0; i < 2; i++) {
        st = this.p[i];
        for (a = 0; a < ACTIONS.length; a++) {
          var act = ACTIONS[a];
          st.pressed[act] = st.held[act] && !prev[i][act];
          st.released[act] = !st.held[act] && prev[i][act];
        }
        // Double-tap left/right, for the run. Window is 16 frames.
        st.tapDir = 0;
        if (st._tapTimer > 0) st._tapTimer--;
        var dir = st.pressed.left ? -1 : (st.pressed.right ? 1 : 0);
        if (dir) {
          if (st._tapTimer > 0 && st._tapDir === dir) { st.tapDir = dir; st._tapTimer = 0; }
          else { st._tapDir = dir; st._tapTimer = 16; }
        }
      }

      this.coin = !!(this._edge.Digit5 || this._edge.Digit6 || this._edge.KeyR);
      this.pause = !!(this._edge.Escape || this._edge.KeyP);
      this.mute = !!this._edge.KeyM;
      this.fullscreen = !!this._edge.KeyF;
      this.anyKey = false;
      for (code in this._edge) if (this._edge[code]) { this.anyKey = true; break; }

      this._edge = {};
      this._latch = {};
    },

    axis: function (i) { var h = this.p[i].held; return (h.right ? 1 : 0) - (h.left ? 1 : 0); },
    axisY: function (i) { var h = this.p[i].held; return (h.down ? 1 : 0) - (h.up ? 1 : 0); }
  };

  // -------------------------------------------------------------- the screen
  PC.Screen = {
    canvas: null, ctx: null, view: null, vctx: null, scale: 1,

    init: function (viewCanvas) {
      this.view = viewCanvas;
      this.vctx = viewCanvas.getContext('2d', { alpha: false });
      this.canvas = document.createElement('canvas');
      this.canvas.width = PC.W; this.canvas.height = PC.H;
      this.ctx = this.canvas.getContext('2d', { alpha: false });
      this.ctx.imageSmoothingEnabled = false;
      this.vctx.imageSmoothingEnabled = false;
      var self = this;
      global.addEventListener('resize', function () { self.resize(); });
      var host = document.getElementById('stage');
      if (host && global.ResizeObserver) {
        new global.ResizeObserver(function () { self.resize(); }).observe(host);
      }
      this.resize();
    },

    resize: function () {
      var host = document.getElementById('stage');
      var maxW = global.innerWidth, maxH = global.innerHeight - 54;
      if (host) {
        var r = host.getBoundingClientRect();
        if (r.width > 40 && r.height > 40) { maxW = r.width; maxH = r.height; }
      }
      var s = Math.min(maxW / PC.W, maxH / PC.H);
      // Whole-pixel scales only (down to a half step) so the art stays crisp.
      if (s >= 1) s = Math.floor(s) + (s - Math.floor(s) >= 0.5 ? 0.5 : 0);
      else s = Math.max(s, 0.3);
      this.scale = s;
      var w = Math.round(PC.W * s), h = Math.round(PC.H * s);
      this.view.width = w; this.view.height = h;
      this.view.style.width = w + 'px';
      this.view.style.height = h + 'px';
      this.vctx.imageSmoothingEnabled = false;
    },

    present: function () {
      this.vctx.imageSmoothingEnabled = false;
      this.vctx.drawImage(this.canvas, 0, 0, this.view.width, this.view.height);
    }
  };

  // ---------------------------------------------------------------- colours
  PC.color = {
    hex: function (r, g, b) {
      return '#' + ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)).toString(16).slice(1);
    },
    parse: function (h) {
      h = String(h).replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var n = parseInt(h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    },
    mix: function (a, b, t) {
      var ca = this.parse(a), cb = this.parse(b);
      return this.hex(M.lerp(ca[0], cb[0], t), M.lerp(ca[1], cb[1], t), M.lerp(ca[2], cb[2], t));
    },
    shade: function (h, amt) {
      var c = this.parse(h);
      if (amt >= 0) return this.hex(M.lerp(c[0], 255, amt), M.lerp(c[1], 255, amt), M.lerp(c[2], 255, amt));
      return this.hex(c[0] * (1 + amt), c[1] * (1 + amt), c[2] * (1 + amt));
    }
  };

  // -------------------------------------------------------------- game loop
  PC.Loop = function (update, render) {
    var acc = 0, last = 0, running = false, raf = 0;
    var STEP = 1000 / PC.FPS;
    function frame(now) {
      if (!running) return;
      raf = requestAnimationFrame(frame);
      if (!last) last = now;
      var delta = now - last; last = now;
      if (delta > 250) delta = STEP;   // tab was hidden: drop the gap
      acc += delta;
      var steps = 0;
      while (acc >= STEP && steps < 5) { update(); acc -= STEP; steps++; }
      if (steps === 5) acc = 0;
      render();
    }
    return {
      start: function () { if (running) return; running = true; last = 0; raf = requestAnimationFrame(frame); },
      stop: function () { running = false; cancelAnimationFrame(raf); },
      step: function () { update(); render(); }
    };
  };

  // ----------------------------------------------------------------- saving
  PC.save = {
    key: 'power-city-v1',
    read: function () {
      try { return JSON.parse(global.localStorage.getItem(this.key)) || {}; } catch (e) { return {}; }
    },
    write: function (o) {
      try { global.localStorage.setItem(this.key, JSON.stringify(o)); } catch (e) { /* private mode */ }
    },
    merge: function (patch) {
      var d = this.read();
      for (var k in patch) d[k] = patch[k];
      this.write(d); return d;
    }
  };

  PC.pad = function (n, len) {
    var s = String(Math.max(0, Math.floor(n)));
    while (s.length < len) s = '0' + s;
    return s.length > len ? s.slice(-len) : s;
  };

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* POWER CITY - art primitives.
 *
 * Nothing is loaded from disk. Every pixel in the game is drawn here or by
 * something that calls in here: the arcade font, the chunky limb shapes the
 * fighters are built from, and the outline pass that gives every sprite the
 * hard black keyline that 8-bit brawlers all had.
 */
(function (global) {
  'use strict';
  var PC = global.PC || (global.PC = {});
  var Art = PC.art = {};

  function mk(w, h) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
    var x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    return c;
  }
  Art.mk = mk;

  // ------------------------------------------------------------------- font
  /* A 5x7 arcade face. Rows are bit strings, which is a format you can read
   * and fix by eye - the whole point when the letters are seven pixels tall. */
  var GLYPHS = {
    'A': '01110,10001,10001,11111,10001,10001,10001',
    'B': '11110,10001,10001,11110,10001,10001,11110',
    'C': '01110,10001,10000,10000,10000,10001,01110',
    'D': '11110,10001,10001,10001,10001,10001,11110',
    'E': '11111,10000,10000,11110,10000,10000,11111',
    'F': '11111,10000,10000,11110,10000,10000,10000',
    'G': '01110,10001,10000,10111,10001,10001,01111',
    'H': '10001,10001,10001,11111,10001,10001,10001',
    'I': '11111,00100,00100,00100,00100,00100,11111',
    'J': '00111,00010,00010,00010,00010,10010,01100',
    'K': '10001,10010,10100,11000,10100,10010,10001',
    'L': '10000,10000,10000,10000,10000,10000,11111',
    'M': '10001,11011,10101,10101,10001,10001,10001',
    'N': '10001,11001,10101,10011,10001,10001,10001',
    'O': '01110,10001,10001,10001,10001,10001,01110',
    'P': '11110,10001,10001,11110,10000,10000,10000',
    'Q': '01110,10001,10001,10001,10101,10010,01101',
    'R': '11110,10001,10001,11110,10100,10010,10001',
    'S': '01111,10000,10000,01110,00001,00001,11110',
    'T': '11111,00100,00100,00100,00100,00100,00100',
    'U': '10001,10001,10001,10001,10001,10001,01110',
    'V': '10001,10001,10001,10001,10001,01010,00100',
    'W': '10001,10001,10001,10101,10101,11011,01010',
    'X': '10001,10001,01010,00100,01010,10001,10001',
    'Y': '10001,10001,01010,00100,00100,00100,00100',
    'Z': '11111,00001,00010,00100,01000,10000,11111',
    '0': '01110,10001,10011,10101,11001,10001,01110',
    '1': '00100,01100,00100,00100,00100,00100,01110',
    '2': '01110,10001,00001,00010,00100,01000,11111',
    '3': '11111,00010,00100,00010,00001,10001,01110',
    '4': '00010,00110,01010,10010,11111,00010,00010',
    '5': '11111,10000,11110,00001,00001,10001,01110',
    '6': '00110,01000,10000,11110,10001,10001,01110',
    '7': '11111,00001,00010,00100,01000,01000,01000',
    '8': '01110,10001,10001,01110,10001,10001,01110',
    '9': '01110,10001,10001,01111,00001,00010,01100',
    '.': '00000,00000,00000,00000,00000,01100,01100',
    ',': '00000,00000,00000,00000,01100,01100,11000',
    '-': '00000,00000,00000,11111,00000,00000,00000',
    '_': '00000,00000,00000,00000,00000,00000,11111',
    '!': '00100,00100,00100,00100,00100,00000,00100',
    '?': '01110,10001,00001,00010,00100,00000,00100',
    ':': '00000,01100,01100,00000,01100,01100,00000',
    ';': '00000,01100,01100,00000,01100,01100,11000',
    "'": '00100,00100,01000,00000,00000,00000,00000',
    '"': '01010,01010,01010,00000,00000,00000,00000',
    '(': '00010,00100,01000,01000,01000,00100,00010',
    ')': '01000,00100,00010,00010,00010,00100,01000',

<script>
/* POWER CITY - the city itself.
 *
 * Backgrounds are composed, not drawn: a seeded walk along the stage lays
 * down facade modules - brick, shutters, neon, chain-link - each of which
 * knows how to paint itself. Panels that should show sky (an alley mouth, a
 * fence) simply leave their pixels transparent, and the parallax skyline
 * behind shows through. Same trick the arcade original used, minus the ROM.
 */
(function (global) {
  'use strict';
  var PC = global.PC || (global.PC = {});
  var Art = PC.art, C = PC.color;
  var City = PC.city = {};

  var FIELD_H = PC.FLOOR_TOP - PC.FIELD_Y;      // wall height, 132px
  var FLOOR_H = PC.FIELD_BOT - PC.FLOOR_TOP;    // street height, 60px

  // ------------------------------------------------------------- the skyline
  /* One wide, horizontally tiling canvas per theme: night sky, stars, and a
   * ragged block of towers with windows lit at random. */
  City.makeSky = function (theme, w, h) {
    var c = Art.mk(w, h), x = c.getContext('2d');
    var r = PC.RNG(theme.seed || 7);
    var top = theme.sky[0], bot = theme.sky[1];
    /* The horizon sits level with the top of the street-level fences, so a
     * gap anywhere in the facade shows towers and not just empty gradient. */
    var hor = Math.round(h * 0.47);
    var i, j;
    for (j = 0; j < hor; j++) Art.rect(x, 0, j, w, 1, C.mix(top, bot, j / hor));
    for (i = 0; i < w * hor / 700; i++) {
      Art.rect(x, r.int(0, w - 1), r.int(0, hor - 6), 1, 1, r.chance(0.25) ? '#ffffff' : '#b8c8f0');
    }
    if (theme.moon) {
      Art.ellipse(x, theme.moon[0], theme.moon[1], 11, 11, '#f0ecd0');
      Art.ellipse(x, theme.moon[0] + 4, theme.moon[1] - 2, 9, 9, C.mix(top, bot, 0.25));
    }
    // ---- towers, standing on the horizon
    var bx = 0;
    while (bx < w) {
      var bw = r.int(12, 26), bh = r.int(Math.floor(hor * 0.3), Math.floor(hor * 0.92));
      var col = C.mix(theme.tower, bot, r.range(0, 0.3));
      Art.rect(x, bx, hor - bh, bw, bh, col);
      if (r.chance(0.3)) Art.rect(x, bx + Math.floor(bw / 2) - 1, hor - bh - r.int(4, 10), 2, 10, col);
      if (r.chance(0.22)) Art.rect(x, bx + Math.floor(bw / 2) - 1, hor - bh - r.int(6, 12), 2, 2, '#ff4a4a');
      for (j = hor - bh + 3; j < hor - 2; j += 5) {

          if (r.chance(0.4)) Art.rect(x, i, j, 2, 3, r.chance(0.18) ? '#f8e070' : theme.lit);
        }
      }
      bx += bw + r.int(0, 3);
    }
    // ---- whatever lies below the horizon, for gaps that reach the ground
    if (theme.water) {
      for (j = hor; j < h; j++) {
        Art.rect(x, 0, j, w, 1, C.mix(theme.water, C.shade(theme.water, -0.5), (j - hor) / (h - hor)));
      }

      for (i = 0; i < w / 3; i++) {
        var rx = r.int(0, w - 1), ry = hor + r.int(1, h - hor - 2);
        Art.rect(x, rx, ry, r.int(2, 5), 1, r.chance(0.3) ? theme.lit : C.shade(theme.water, 0.22));
      }
      Art.rect(x, 0, hor, w, 1, C.shade(theme.water, 0.35));
    } else {
      Art.rect(x, 0, hor, w, h - hor, theme.behind || C.shade(theme.sky[1], -0.55));
      // a haze of low roofs so the ground gaps are not a flat block
      for (i = 0; i < w; i += r.int(9, 22)) {
        var rh = r.int(3, 12);
        Art.rect(x, i, hor, r.int(8, 20), rh, C.shade(theme.behind || theme.sky[1], -0.35));
      }
    }
    return c;
  };

  // -------------------------------------------------------- facade modules
  /* Every module paints into the wall strip (0..FIELD_H) starting at x, and
   * returns nothing; the composer knows each module's width up front. */
  var MOD = {};

  function brick(x, ctx, w, t, r) {

      }

    for (var k = 0; k < 18; k++) Art.dither(ctx, x, FIELD_H - 26 + k, w, 1, dark, k % 2);
  }

  MOD.wall = { w: 48, paint: function (ctx, x, t, r) { brick(x, ctx, 48, t, r); } };

    w: 48,
    paint: function (ctx, x, t, r) {

<script>
/* POWER CITY - the sound board.
 *
 * Two pulse voices, a triangle bass and a noise channel, which is exactly
 * what the machine this game is pretending to be had. No samples: the hits,
 * the coin, the sirens and the songs are all made out of oscillators at
 * runtime, so the whole game stays one folder of text.
 */
(function (global) {
  'use strict';
  var PC = global.PC || (global.PC = {});

  var NOTE = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };

  function freq(name) {
    var s = String(name).toLowerCase();
    var semi = NOTE[s[0]];
    if (semi === undefined) return 0;
    var i = 1;
    if (s[i] === '#') { semi++; i++; } else if (s[i] === 'b') { semi--; i++; }
    var oct = parseInt(s.slice(i), 10);
    if (isNaN(oct)) oct = 4;
    return 440 * Math.pow(2, ((oct + 1) * 12 + semi - 69) / 12);
  }
  PC.noteFreq = freq;

  var A = PC.audio = {
    ctx: null, ready: false, muted: false, enabled: true,
    musicVol: 0.42, sfxVol: 0.55,
    _song: null, _row: 0, _next: 0, _timer: null, _paused: false, _waves: {},

    init: function () {
      if (this.ctx) return;
      var AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      var c = this.ctx = new AC();

      this.master = c.createGain();
      this.master.gain.value = 0.85;

      this.comp = c.createDynamicsCompressor();
      this.comp.threshold.value = -12;
      this.comp.ratio.value = 8;
      this.comp.attack.value = 0.003;
      this.comp.release.value = 0.15;

      this.musicBus = c.createGain(); this.musicBus.gain.value = this.musicVol;
      this.sfxBus = c.createGain(); this.sfxBus.gain.value = this.sfxVol;

      // A short slap echo: cheap, and it glues the square leads together the
      // way a cabinet speaker in a room does.
      this.delay = c.createDelay(0.6);
      this.delay.delayTime.value = 0.14;
      this.fb = c.createGain(); this.fb.gain.value = 0.22;
      this.echoLP = c.createBiquadFilter();
      this.echoLP.type = 'lowpass'; this.echoLP.frequency.value = 2400;
      this.echoOut = c.createGain(); this.echoOut.gain.value = 0.3;
      this.delay.connect(this.echoLP);
      this.echoLP.connect(this.fb);
      this.fb.connect(this.delay);
      this.echoLP.connect(this.echoOut);
      this.echoOut.connect(this.comp);

      this.musicBus.connect(this.comp);
      this.musicBus.connect(this.delay);
      this.sfxBus.connect(this.comp);
      this.comp.connect(this.master);
      this.master.connect(c.destination);

      // noise, one second of it, looped
      var n = c.sampleRate;
      var buf = c.createBuffer(1, n, n), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this._noise = buf;

      this.ready = true;
      var self = this;
      this._timer = setInterval(function () { self.tick(); }, 24);
    },

    resume: function () {
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    toggleMute: function () {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.85;
    },

    setPaused: function (p) {
      this._paused = p;
      if (this.musicBus) this.musicBus.gain.value = p ? this.musicVol * 0.25 : this.musicVol;
    },

    // --------------------------------------------------------------- voices
    pulse: function (duty) {

      if (this._waves[key]) return this._waves[key];
      // Fourier series for a rectangle of the given duty cycle.
      var n = 24, real = new Float32Array(n), imag = new Float32Array(n);

<script>
/* POWER CITY - actors, the fight system, and the things lying in the street.

 * how far up the pavement you are standing (a smaller y is further away), and
 * `z` is height off the ground. Everything sorts by y, collides in x/y, and
 * only jumps in z.

 * punch: take it out and the game feels like it is made of paper.

<script>
/* POWER CITY - bats, knives, crates, oil drums and the odd roast chicken.
 *
 * One entity type covers all of it. A thing lies on the floor until someone
 * picks it up; then it either swings from a hand (a weapon) or rides overhead
 * (a crate). Thrown, it flies until it meets a body or the ground, and what
 * happens next is a property of the thing, not a special case in the player.
 */

  'use strict';

 *
 * Two buttons and a jump, and out of them: a three-hit combo that ends in a
 * knockdown, a kick, an uppercut, a back elbow for whoever crept up behind
 * you, a running knee, a jump kick, a spin kick that clears a crowd, and a
 * clinch you can knee or throw out of. Beat 'em ups live or die on how much

          if (anyStart || anyStart2) {
            if (this.credits <= 0) this.coin();
            this.startGame(anyStart ? 0 : 1);
          }
          break;

        case 'ready':
          if (this.stateT === 1 && PC.audio) PC.audio.play(PC.stage.def.music);
          if (this.stateT > 150) this.setState('play');
          this.tryJoin();
          break;

        case 'play':
          this.tryJoin();
          PC.stage.update();
          W.update();
          this.checkPlayers();
          if (PC.stage.atEnd() && PC.stage.finishT > 40) this.stageClear();
          break;

        case 'clear':
          W.update();
          if (this.stateT > 40 && this.stateT % 3 === 0 && PC.stage.timeLeft > 0) {
            PC.stage.timeLeft--;
            var pl = this.players[0] || this.players[1];
            if (pl) pl.addScore(100);
            if (PC.audio) PC.audio.sfx('tally');
          }
          if (this.stateT > 260) this.nextStage();
          break;

        case 'over':
          W.update();
          if (this.stateT > 90) { this.setState('continue'); this.continueT = 10 * 60; }
          break;

        case 'continue':
          W.update();
          this.continueT--;
          if ((anyStart || anyStart2) && this.credits > 0) {
            this.doContinue(anyStart ? 0 : 1);
          } else if (anyStart || anyStart2) {
            this.coin();
          }
          if (this.continueT <= 0) {
            this.saveHi();
            this.setState('title');
            PC.stage.load(0);
            if (PC.audio) PC.audio.play('title');
          }
          break;

        case 'ending':
          W.update();
          if (this.stateT > 900 || anyStart) { this.saveHi(); this.setState('title'); PC.stage.load(0); if (PC.audio) PC.audio.play('title'); }
          break;
      }

      if (this.state !== 'play' && this.state !== 'ready') W.time++;
    },

    tryJoin: function () {
      for (var i = 0; i < 2; i++) {
        if (!this.players[i] && PC.input.p[i].pressed.start) {
          if (this.credits <= 0) this.coin();
          this.joinPlayer(i);
        }
      }
    },

    /* Death, respawn, and the point at which the machine stops being polite.
     * A slot only empties when that player is out of lives, so "both slots
     * empty" is exactly the game-over condition and nothing else needs to
     * agree with it. */
    checkPlayers: function () {
      for (var i = 0; i < 2; i++) {
        var p = this.players[i];
        if (!p || !p.dead) continue;
        if (!p.removed) continue;                 // still falling over
        if (this.respawnT[i] <= 0) { this.respawnT[i] = 70; continue; }
        if (--this.respawnT[i] > 0) continue;
        this.lives[i]--;
        if (this.lives[i] > 0) {
          var x = M.clamp(W.camX + PC.W * 0.3, W.camX + 20, W.camX + PC.W - 20);
          p.reviveAt(x, PC.FLOOR_BOT - 16);
          W.add(p);
        } else {
          this.players[i] = null;
          if (i === 1) PC.input.p2Joined = false;
        }
      }
      if (!this.players[0] && !this.players[1] && this.state === 'play') {
        this.setState('over');
        if (PC.audio) PC.audio.play('gameover');
      }
    },

    doContinue: function (i) {
      this.credits--;
      this.lives[i] = 3;
      var p = this.players[i];
      if (!p) {
        p = new PC.Player(i, HERO[i]);
        this.players[i] = p;
        if (i === 1) PC.input.p2Joined = true;
      }
      // Put the street back the way it was and re-run the fight you lost.
      for (var k = W.actors.length - 1; k >= 0; k--) if (W.actors[k].team === 1) W.actors.splice(k, 1);
      W.tokenHolders.length = 0;
      p.reviveAt(W.camX + PC.W * 0.3, PC.FLOOR_BOT - 16);
      if (W.actors.indexOf(p) < 0) W.add(p);
      PC.stage.timeLeft = PC.stage.def.time;
      if (PC.stage.active) PC.stage.startEncounter(PC.stage.active);
      this.setState('play');
      if (PC.audio) PC.audio.play(PC.stage.def.music);
    },

    stageClear: function () {
      this.setState('clear');
      if (PC.audio) PC.audio.play('clear');
    },

    nextStage: function () {
      this.stageIndex++;
      if (this.stageIndex >= PC.STAGES.length) {
        this.ended = true;
        this.setState('ending');
        if (PC.audio) PC.audio.play('ending');
        return;
      }
      var keep = [];
      for (var i = 0; i < 2; i++) {
        var p = this.players[i];
        if (p) { p.hp = p.maxHp; keep.push(p); }
      }
      PC.stage.load(this.stageIndex);
      for (var k = 0; k < keep.length; k++) {
        keep[k].reviveAt(60 + k * 26, PC.FLOOR_BOT - 16 - k * 8);
        W.add(keep[k]);
      }
      this.setState('ready');
    },

    saveHi: function () {
      if (this.hiScore > (PC.save.read().hiScore || 0)) PC.save.merge({ hiScore: this.hiScore });
    },

    toggleFullscreen: function () {
      var el = document.documentElement;
      if (!document.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen(); }
      else if (document.exitFullscreen) document.exitFullscreen();
    },

    // --------------------------------------------------------------- drawing
    render: function () {
      var ctx = PC.Screen.ctx;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, PC.W, PC.H);

      if (this.state === 'title') this.renderTitle(ctx);
      else this.renderWorld(ctx);

      if (FX.flashT > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(0.8, FX.flashT / 6);
        ctx.fillStyle = FX.flashCol;
        ctx.fillRect(0, 0, PC.W, PC.H);
        ctx.restore();
      }
      PC.Screen.present();
    },

    renderWorld: function (ctx) {
      var sx = Math.round(FX.shakeX), sy = Math.round(FX.shakeY);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, PC.FIELD_Y, PC.W, PC.FIELD_BOT - PC.FIELD_Y);
      ctx.clip();
      ctx.translate(sx, sy);
      PC.stage.draw(ctx);

      // ---- everything in the street, sorted back to front
      var draws = [], i;
      for (i = 0; i < W.actors.length; i++) {
        var a = W.actors[i];
        if (!a.removed) draws.push({ y: a.y, a: a });
      }
      for (i = 0; i < W.items.length; i++) {
        var it = W.items[i];
        if (!it.held && !it.dead) draws.push({ y: it.flying ? it.y + 0.5 : it.y, it: it });
      }
      draws.sort(function (p, q) { return p.y - q.y; });
      for (i = 0; i < draws.length; i++) {
        if (draws[i].a) draws[i].a.draw(ctx, W.camX);
        else PC.items.draw(ctx, draws[i].it, W.camX);
      }

      FX.draw(ctx, W.camX);
      PC.stage.drawArrow(ctx);
      PC.stage.drawBanner(ctx);
      ctx.restore();

      Hud.drawTop(ctx, this);
      Hud.drawBottom(ctx, this);
      if (PC.stage.bossActive) Hud.drawBoss(ctx);

      this.renderOverlays(ctx);
    },

    renderOverlays: function (ctx) {
      var mid = PC.FIELD_Y + 74;
      var t = this.stateT;
      switch (this.state) {
        case 'ready':
          this.dim(ctx, 0.45);
          Hud.banner(ctx, [
            { t: 'STAGE ' + (PC.stage.index + 1), c: '#4ae06a', scale: 2 },
            { t: PC.stage.def.name, c: '#ffffff', scale: 3 }
          ], mid - 20);
          Art.text(ctx, PC.stage.def.intro, PC.W / 2, mid + 34, '#c8d0e8', { align: 'center' });
          if (t > 110 && (t >> 3) % 2) {
            Art.text(ctx, 'READY', PC.W / 2, mid + 52, '#ffe070', { align: 'center', scale: 2 });
          }
          break;
        case 'clear':
          this.dim(ctx, 0.4);
          Hud.banner(ctx, [{ t: 'STAGE CLEAR', c: '#ffe070', scale: 3 }], mid - 16);
          if (t > 40) {
            Art.text(ctx, 'TIME BONUS  ' + PC.pad(PC.stage.timeLeft * 100, 5), PC.W / 2, mid + 24, '#ffffff', { align: 'center' });
          }
          break;
        case 'over':
          this.dim(ctx, 0.55);
          Hud.banner(ctx, [{ t: 'GAME OVER', c: '#ff4a4a', scale: 3 }], mid - 10);
          break;
        case 'continue':
          this.dim(ctx, 0.6);
          var n = Math.max(0, Math.ceil(this.continueT / 60));
          Hud.banner(ctx, [{ t: 'CONTINUE?', c: '#ffffff', scale: 3 }], mid - 26);
          Art.text(ctx, String(n), PC.W / 2, mid + 10, n <= 3 ? '#ff4a4a' : '#ffe070', { align: 'center', scale: 4 });
          if ((t >> 4) % 2) {
            Art.text(ctx, 'PRESS 1 TO CONTINUE', PC.W / 2, mid + 54, '#4aa8ff', { align: 'center' });
          }
          break;
        case 'ending':
          this.renderEnding(ctx);
          break;
      }
      if (this.paused) {
        this.dim(ctx, 0.6);
        Hud.banner(ctx, [{ t: 'PAUSED', c: '#ffffff', scale: 3 }], mid - 10);
      }
    },

    dim: function (ctx, a) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#000010';
      ctx.fillRect(0, PC.FIELD_Y, PC.W, PC.FIELD_BOT - PC.FIELD_Y);
      ctx.restore();
    },

    renderEnding: function (ctx) {
      this.dim(ctx, 0.7);
      var lines = [
        'THE TOWER GOES QUIET.',
        '',
        'THE GANG IS FINISHED. THE BLOCK IS',
        'YOURS AGAIN - FOR TONIGHT, ANYWAY.',
        '',
        'SOMEWHERE DOWNTOWN A NEON SIGN',
        'FLICKERS BACK ON.',
        '',
        'THANK YOU FOR PLAYING'
      ];
      var y = PC.FIELD_Y + 26;
      for (var i = 0; i < lines.length; i++) {
        if (this.stateT < 30 + i * 26) break;
        Art.text(ctx, lines[i], PC.W / 2, y + i * 12, i === lines.length - 1 ? '#ffe070' : '#ffffff', { align: 'center' });
      }
      if (this.stateT > 300) {
        Art.text(ctx, 'FINAL SCORE  ' + PC.pad(Math.max(this.scores[0], this.scores[1]), 6),
          PC.W / 2, PC.FIELD_BOT - 22, '#4ae06a', { align: 'center' });
      }
    },

    // ----------------------------------------------------------------- title
    renderTitle: function (ctx) {
      var t = this.stateT;
      // the city rolls past behind the logo
      W.camX = this.attractX % Math.max(1, (PC.stage.def.length - PC.W));
      PC.stage.draw(ctx);
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#04040e';
      ctx.fillRect(0, PC.FIELD_Y, PC.W, PC.FIELD_BOT - PC.FIELD_Y);
      ctx.restore();
      Art.rect(ctx, 0, 0, PC.W, PC.HUD_TOP, '#000000');
      Art.rect(ctx, 0, PC.FIELD_BOT, PC.W, PC.H - PC.FIELD_BOT, '#000000');

      // a band behind the writing so the brickwork never eats it
      Art.rect(ctx, 0, PC.FIELD_BOT - 48, PC.W, 48, 'rgba(4,4,14,0.84)');
      var mid = PC.W / 2, ly = PC.FIELD_Y + 18;
      // logo: a heavy shadow, a red plate, a white face
      Art.text(ctx, 'POWER', mid + 2, ly + 3, '#3a0a12', { align: 'center', scale: 5, tracking: 2 });
      Art.text(ctx, 'POWER', mid, ly, '#e02030', { align: 'center', scale: 5, tracking: 2 });
      Art.text(ctx, 'POWER', mid, ly - 2, '#ff9a40', { align: 'center', scale: 5, tracking: 2 });
      Art.text(ctx, 'CITY', mid + 2, ly + 42, '#0a1a3a', { align: 'center', scale: 5, tracking: 2 });
      Art.text(ctx, 'CITY', mid, ly + 39, '#2f6ef0', { align: 'center', scale: 5, tracking: 2 });
      Art.text(ctx, 'CITY', mid, ly + 37, '#7fd8f0', { align: 'center', scale: 5, tracking: 2 });
      Art.text(ctx, 'A NIGHT ON THE TOWN', mid, ly + 78, '#ffffff', { align: 'center', tracking: 2, shadow: '#000000' });

      if ((t >> 4) % 2) {
        Art.text(ctx, this.credits > 0 ? 'PRESS 1 PLAYER START' : 'INSERT COIN  (PRESS 5)',
          mid, PC.FIELD_BOT - 40, this.credits > 0 ? '#ffe070' : '#4aa8ff', { align: 'center' });
      }
      Art.text(ctx, '1 OR 2 PLAYERS', mid, PC.FIELD_BOT - 26, '#c8d0e8', { align: 'center' });
      Art.text(ctx, '(C) 1988 POWER CITY WORKS', mid, PC.FIELD_BOT - 12, '#6a7290', { align: 'center' });

      Hud.drawTop(ctx, this);
      Hud.drawBottom(ctx, this);
      // the empty half of the marquee earns its keep by teaching the moves
      var hints = [
        'PUNCH THREE TIMES FOR A KNOCKDOWN',
        'PUNCH AND KICK TOGETHER TO SPIN',
        'GET CLOSE AND PUNCH TO GRAB',
        'KICK OUT OF A GRAB TO THROW THEM',
        'DOUBLE-TAP TO RUN, THEN PUNCH',
        'PICK UP BATS, PIPES AND CRATES',
        'JUMP, THEN KICK, ON THE WAY DOWN'
      ];
      Art.text(ctx, 'HOW TO PLAY', mid, 27, '#ff8a3a', { align: 'center' });
      Art.text(ctx, hints[Math.floor(t / 170) % hints.length], mid, 40, '#ffffff', { align: 'center' });

      W.time++;
      FX.update();
    }
  };

  PC.boot = function () { G.boot(); };

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* POWER CITY - on-screen controls for phones and tablets.
 * The pad only exists on coarse pointers; on a desktop it never renders.
 */
(function (global) {
  'use strict';
  var PC = global.PC || (global.PC = {});

  var state = { held: {} };
  PC.input.touch = state;

  function bind() {
    var root = document.getElementById('touch');
    if (!root) return;
    var btns = root.querySelectorAll('button');
    var active = {};

    function set(act, on) { state.held[act] = on; }

    function pointFrom(e) {
      var el = document.elementFromPoint(e.clientX, e.clientY);
      return el && el.dataset && el.dataset.act ? el.dataset.act : null;
    }

    function refresh() {
      var k;
      for (k in state.held) state.held[k] = false;
      for (k in active) if (active[k]) state.held[active[k]] = true;
    }

    root.addEventListener('pointerdown', function (e) {
      var act = pointFrom(e);
      if (!act) return;
      e.preventDefault();
      active[e.pointerId] = act;
      refresh();
      if (PC.audio) PC.audio.resume();
    });
    root.addEventListener('pointermove', function (e) {
      if (!(e.pointerId in active)) return;
      e.preventDefault();
      active[e.pointerId] = pointFrom(e);
      refresh();
    });
    function up(e) {
      if (!(e.pointerId in active)) return;
      delete active[e.pointerId];
      refresh();
    }
    root.addEventListener('pointerup', up);
    root.addEventListener('pointercancel', up);
    root.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // Start / coin live on the pad too, so a phone can put a coin in.
    var start = document.getElementById('touch-start');
    if (start) {
      start.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        PC.input._edge.Enter = true;
        PC.input._down.Enter = true;
        PC.input._latch.Enter = true;
        setTimeout(function () { PC.input._down.Enter = false; }, 60);
      });
    }
    void btns;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
window.addEventListener('load', function () {
      try { PC.boot(); }
      catch (e) {
        var l = document.getElementById('loading');
        if (l) { l.textContent = 'ERROR: ' + e.message; l.style.display = 'block'; }
        throw e;
      }
    });
</script>
