/* ==== UTIL ==== */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hexRgb(hex) {

}
// k > 0 mixes toward white, k < 0 toward black.
const SHADE_CACHE = new Map();
function shadeHex(hex, k) {
  const key = hex + k;

  if (!s) {
    const c = hexRgb(hex), t = k > 0 ? 255 : 0, a = Math.abs(k);
    s = 'rgb(' + Math.round(c[0] + (t - c[0]) * a) + ',' + Math.round(c[1] + (t - c[1]) * a) + ',' + Math.round(c[2] + (t - c[2]) * a) + ')';

}

function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);

  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);

}

/* ==== ART:BEGIN ==== */

// SHOVE_T

// the crash pile on the rug stays pokeable: a tap flicks the nearest piece with a clack, now and then a whistle

// ---- start (5): a tap on the title -> the striped arm shoves the cube in from the left -> BOOM, the title build

  ST.push = Math.max(0.15, (isFinite(left) ? left : CUBE.x + 1.2) - (CUBE.x + 1));

}

  addShake(CFG.CRASH_SHAKE, CFG.CRASH_SHAKE_T);

// ---- hazards (6, M7): from L5 a green bump car on a fixed beat (honk + edge arrow 1.2 s ahead); from L8 it alternates

// level is being played (a crash included, a SMASH not); a hit that comes while no base is parked passes by.
const HZ = { every: 0, clock: 0, next: 0, n: 0, kind: '', side: 1, warned: false, warnAt: -1, car: null, foot: null };
function hazReset() {

function planHazard() {

  return S.gt + (HZ.next - HZ.clock);
}

function hzBaseOk() { return S.phase === 'play' && S.rollT0 < 0 && !S.baseHidden && !!S.B; }
function stepHazards(dt) {

    HZ.warned = true; HZ.warnAt = S.gt;

    else {

      // the heel 1.05 k L the other way. A narrow phone has 2.75 L of rug beside the base, so there the foot comes
      // down a little further back (k < 1, smaller) instead of past the screen edge or onto the car
      const k = clamp((CAM.W / 2 / CAM.L - half - 0.35) / 3.2, 0.6, 1);

      }

    if (c.stage === 'in' || c.stage === 'through') c.x += c.v * dt;

    } else { c.v += c.side * 26 * dt; c.x += c.v * dt; }

  if (HAND.ready && !locked && !S.big && S.firstInput && S.phase === 'play') {

    if (HAND.fuseMarks < 2 && u >= 0.75) { HAND.fuseMarks = 2; Sfx.fuseTick('threeq'); }
    if (HAND.fuseMarks < 3 && fuse - HAND.fuseT <= 0.3) { HAND.fuseMarks = 3; Sfx.fuseTick('last'); }

    // +3 s and starts the SMASH, so the run goes on

}

        const x = (dir > 0 ? -4 + s * 0.005 : 4 - s * 0.005) + jit * Math.sin(s * 2.3);
        const g = chooseSlot(B.cands, x, R, ghost, acc);
        const key = g ? g.key : null;
        if (key !== ghost || !runs.length) runs.push({ key, x0: x, x1: x });
        else runs[runs.length - 1].x1 = x;
        ghost = key;
      }
      for (let k = 2; k < runs.length; k++) {
        const a = runs[k - 2], b = runs[k - 1], c = runs[k];
        if (a.key && a.key === c.key && Math.abs(c.x0 - b.x0) < 0.1 - 1e-9) { flips++; if (!first) first = a.key + '->' + b.key + '->' + c.key + ' at x=' + b.x0.toFixed(3); }
      }
    }
    ok(flips === 0, '8: ' + flips + ' ghost flips A->B->A within 0.1 L' + (first ? ' (' + first + ')' : ''));
  }
  // 9 (M3). the boot calibration hit its targets on the reference tower
  {
    const p = calibPeaks() || {};
    ok(CAL.calibrated && Math.abs(p.bump - CFG.CAL_BUMP) <= 0.03 && Math.abs(p.clack - CFG.CAL_CLACK) <= 0.03 && Math.abs(p.foot - CFG.CAL_FOOT) <= 0.03 && p.perfect <= CFG.CAL_PERFECT,
      '9: calibration off target: ' + JSON.stringify(p));
  }
  // 10 (M3). rock + flex on scratch states: a centred 2x8 tower rocked by a GREAT comes back to rest without a crash;
  //     the same tower with its CoM pushed past a wheel goes over by itself
  {
    const mk = shift => {
      const tiles = [];
      for (let a = 0; a < 8; a++) for (const x of [-0.5, 0.5]) tiles.push({ flight: false, mass: 1, k: 1 / 6, pose: { cx: x + shift, cy: a + 0.5, maxY: a + 1 } });
      const D = massProps({ cars: 1, half: 1, tiles }, false, Object.assign({}, TW));
      D.theta = D.omega = D.s = D.sv = D.braceT = 0; D.crashing = false; D.wn = CFG.FLEX_WN / (1 + CFG.FLEX_WN_H * D.H); D.zeta = CFG.FLEX_ZETA;
      return D;
    };
    const lost = D => D.theta !== 0 && Math.abs(D.theta) > Math.max(0, D.alphaSide) + CFG.CRASH_MARGIN;
    const A = mk(0);
    A.omega = kickOmega(A, CAL.K, 1, 0.5, 0, CFG.CAL_DX_GREAT, 'great', false);
    let crashed = false, rested = -1;
    for (let i = 0; i < 4 / CFG.STEP && !crashed; i++) { rockStep(A, CFG.STEP); if (lost(A)) crashed = true; if (rested < 0 && i > 10 && A.theta === 0 && A.omega === 0) rested = i * CFG.STEP; }
    ok(!crashed && rested > 0 && rested < 3, '10: a GREAT on the centred reference tower ' + (crashed ? 'crashed it' : 'did not settle (rest at ' + rested + ' s)'));
    const Bt = mk(1.0);                                       // CoM 0.9 L right of centre: outside the 0.8 L wheel
    let goneAt = -1;
    for (let i = 0; i < 6 / CFG.STEP; i++) { rockStep(Bt, CFG.STEP); if (lost(Bt)) { goneAt = i * CFG.STEP; break; } }
    ok(goneAt > 0.3 && Bt.theta > 0, '10: a tower with its CoM outside the wheels ' + (goneAt < 0 ? 'never went over' : 'went over after ' + goneAt.toFixed(2) + ' s (want > 0.3 s, to the right)'));
  }
  return { pass: fails.length === 0, failures: fails, ms: Math.round(performance.now() - t0) };
}
// exact convex intersection area (Sutherland-Hodgman); independent of the SAT used by the generators
function polyClipArea(A, Bp) {
  let pts = [];
  for (let k = 0; k < A.length; k += 2) pts.push([A[k], A[k + 1]]);
  const nb = Bp.length >> 1;
  for (let k = 0; k < nb && pts.length; k++) {
    const k2 = (k + 1) % nb, ax = Bp[2 * k], ay = Bp[2 * k + 1], bx = Bp[2 * k2], by = Bp[2 * k2 + 1];
    const side = p => (bx - ax) * (p[1] - ay) - (by - ay) * (p[0] - ax);
    const out = [];
    for (let j = 0; j < pts.length; j++) {
      const p = pts[j], q = pts[(j + 1) % pts.length], sp = side(p), sq = side(q);
      if (sp >= 0) out.push(p);
      if ((sp >= 0) !== (sq >= 0)) { const u = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]); }
    }
    pts = out;
  }
  let a = 0;
  for (let j = 0; j < pts.length; j++) { const p = pts[j], q = pts[(j + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }
  return Math.abs(a) / 2;
}

/* ==== MAIN LOOP ==== */
function step(dt) {
  stepHand(dt);
  if (FX.hitStop > 0) { FX.hitStop = Math.max(0, FX.hitStop - dt); return; }
  if (S.slowLeft > 0) { S.slowLeft -= dt; dt *= CFG.CRASH_SLOW_K; }      // a crash going over, at 0.4x
  S.gt += dt;
  switch (S.phase) {
    case 'start': stepStart(dt); break;
    case 'play': case 'crash':
      stepCrash();
      stepPlay(dt);
      stepTower(dt);
      updateCamera(dt, false);
      computeGhost();
      break;
    case 'smash':
      stepSmash(dt);
      stepPlay(dt);              // the hand refills; the clock and the hazards wait
      stepTower(dt);             // the new cars roll in (the old tower stands still until the cube hits it)
      updateCamera(dt, false);
      break;
    case 'over':
      stepOver(dt);
      stepTower(dt);
      updateCamera(dt, false);
      break;
  }
  stepArm(dt);
  stepHazardActors(dt);
  stepSky(dt);
  stepDebris(dt);
  stepFx(dt);
}
let lastNow = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  let dt = lastNow ? (now - lastNow) / 1000 : 1 / 60;
  lastNow = now;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  S.rt += dt; S.frameDt = dt;
  if (S.phase !== 'paused') {
    acc += dt * PARAM.ts;
    let n = 0;
    while (acc >= CFG.STEP && n < 120) { step(CFG.STEP); acc -= CFG.STEP; n++; }
    if (n >= 120) acc = 0;
  }
  S.frame++;
  try { render(); } catch (e) { ctx.setTransform(1, 0, 0, 1, 0, 0); throw e; }
  // the creak follows how close the tower is to going over (continuous; Sfx maps 0.4..1 to its volume)
  Sfx.creak(S.phase === 'play' ? Math.min(1, TIP.level) : 0);
  const js = performance.now() - t0;
  PERF.jsMs = PERF.jsMs * 0.95 + js * 0.05;
  if (dt > 0) PERF.fps = PERF.fps * 0.95 + (1 / dt) * 0.05;
}
function init() {
  try {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap';
    document.head.appendChild(l);
  } catch (e) { /* offline is fine */ }
  S.big = PARAM.big || !!PREFS.big;
  S.titleT0 = S.rt;
  try { if (window.matchMedia('(pointer: coarse)').matches) S.inputType = 'touch'; } catch (e) { /* keep mouse */ }
  Sfx.setMuted(PARAM.mute || PREFS.mute);
  layout();
  // after layout(): its big allocations (the room, the rug, the sprite caches) pay off the page's start-up GC debt
  // first, so no collector pause lands inside the timed fit (CS.calib().ms)
  calibrate();
  bindInput();
  if (PARAM.autostart) startGame('auto');
  if (PARAM.selftest) {
    setTimeout(() => {
      const r = runSelftest();
      if (r.pass) console.log('SELFTEST PASS (' + r.ms + ' ms)');
      else console.log('SELFTEST FAIL: ' + r.failures.join(' | '));
      window.__selftest = r;
    }, 30);
  }
  requestAnimationFrame(frame);
}
init();
</script>
