    const tau = (Hu, l) => CFG.WOB_TAU * Math.max(1, Hu / CFG.WOB_TAU_H) * Math.max(1, l / CFG.WOB_TAU_LAM);
    ok([[2, 1], [8, 4], [14, 7]].every(([H, l]) => near(wobTau(H, l), tau(H, l))), '16: τ(Hu, λ): ' + [[2, 1], [8, 4], [14, 7]].map(([H, l]) => wobTau(H, l).toFixed(3)).join(', '));
    // the swaying part's mass sums and hinge (16.2): the tiles whose centre is over the brace line, the ends of its
    // bottom row; and the sway moves the weight: turned by q / Hs about the end it leans to, exactly as the drawing
    r = m(T);
    ok(near(r.Sm, 1) && near(r.Sx, 0) && near(r.Sy, 1.5 + H3) && near(r.x0, -0.5) && near(r.x1, 0.5), '16: the part over the brace line: Σm ' + r.Sm + ', Σmx ' + r.Sx + ', ends ' + r.x0 + '..' + r.x1);
    const Wt = Object.assign({}, r, { q: 0.4 }), o = swayOff(Wt), ph = 0.4 / r.Hs;
    ok(near(o.x, (0 - 0.5) * (Math.cos(ph) - 1) + 0.5 * Math.sin(ph)) && near(swayOff(Object.assign({}, r, { q: 0 })).x, 0), '16: the sway moves the weight: Σm·Δx ' + o.x.toFixed(4));
    const Wd = { W: 0.9, q: 0, qv: 0 };
    ok(near(wobDecay(0.9, 1, 1.5), Math.max(0, (0.9 + CFG.WOB_DRAIN * 1.5) * Math.exp(-1 / 1.5) - CFG.WOB_DRAIN * 1.5)) && Wd.W === 0.9, '16: W settles as e^(−t/τ) less the drain');
  }
  return { pass: fails.length === 0, failures: fails, ms: Math.round(performance.now() - t0) };
}
// exact convex intersection area (Sutherland-Hodgman); independent of the SAT used by the generators
function polyClipArea(A, Bp) {
  let pts = [];
  for (let k = 0; k < A.length; k += 2) pts.push([A[k], A[k + 1]]);
  const nb = Bp.length >> 1;
  for (let k = 0; k < nb && pts.length; k++) {
    const k2 = (k + 1) % nb, ax = Bp[2 * k], ay = Bp[2 * k + 1], bx = Bp[2 * k2], by = Bp[2 * k2 + 1];
    const side = p => (bx - ax) * (p[1] - ay) - (by - ay) * (p[0] - ax);
    const out = [];
    for (let j = 0; j < pts.length; j++) {
      const p = pts[j], q = pts[(j + 1) % pts.length], sp = side(p), sq = side(q);
      if (sp >= 0) out.push(p);
      if ((sp >= 0) !== (sq >= 0)) { const u = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]); }
    }
    pts = out;
  }
  let a = 0;
  for (let j = 0; j < pts.length; j++) { const p = pts[j], q = pts[(j + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }
  return Math.abs(a) / 2;
}

/* ==== MAIN LOOP ==== */
function step(dt) {
  stepHand(dt);
  if (FX.hitStop > 0) { FX.hitStop = Math.max(0, FX.hitStop - dt); return; }
  if (S.slowLeft > 0) { S.slowLeft -= dt; dt *= CFG.CRASH_SLOW_K; }      // a crash going over, at 0.4x
  S.gt += dt;
  ROCKED = false;               // (until stepTower has rocked the tower for this step: predictCrash)
  switch (S.phase) {
    case 'start': stepStart(dt); break;
    case 'play': case 'crash':
      stepCrash();
      stepPlay(dt);
      stepTower(dt);
      updateCamera(dt, false);
      computeGhost();
      break;
    case 'smash':
      stepSmash(dt);
      stepPlay(dt);              // the hand refills; the clock and the hazards wait
      stepTower(dt);             // the new cars roll in (the old tower stands still until the cube hits it)
      updateCamera(dt, false);
      break;
    case 'over':
      stepOver(dt);
      stepTower(dt);
      updateCamera(dt, false);
      break;
  }
  ROCKED = true;
  stepArm(dt);
  stepHazardActors(dt);
  stepSky(dt);
  stepDebris(dt);
  stepFx(dt);
}
let lastNow = 0, acc = 0, HALT = false;
function frame(now) {
  if (HALT) return;
  requestAnimationFrame(frame);
  const t0 = performance.now();
  let dt = lastNow ? (now - lastNow) / 1000 : 1 / 60;
  lastNow = now;
  watchdog(dt);
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  S.rt += dt; S.frameDt = dt;
  if (S.phase !== 'paused') {
    acc += dt * PARAM.ts;
    let n = 0;
    while (acc >= CFG.STEP && n < 120) { step(CFG.STEP); acc -= CFG.STEP; n++; }
    if (n >= 120) acc = 0;
  }
  S.frame++;
  if (S.phase === 'title' || S.phase === 'start') warmFont();
  try { render(); } catch (e) { ctx.setTransform(1, 0, 0, 1, 0, 0); throw e; }
  // the creak follows how close the tower is to going over (continuous; Sfx maps 0.4..1 to its volume)
  // (and through a dead end's tell, rising toward the TOPPLE, under the heartbeat)
  // (and a swaying tower as its swing carries the weight toward a wheel, 16.2)
  Sfx.creak(S.phase === 'play' ? Math.min(1, Math.max(TIP.level, WOB.W > 0.05 && S.B ? Math.abs(comOf(TW, WOB).wx - TW.ox) / TW.w : 0, S.toppleAt >= 0 ? 0.68 + 0.2 * toppleTell() : 0)) : 0);
  const js = performance.now() - t0;
  PERF.jsMs = PERF.jsMs * 0.95 + js * 0.05;
  if (dt > 0) PERF.fps = PERF.fps * 0.95 + (1 / dt) * 0.05;
}
// the web font: asked for only when the browser is online (offline the request could only fail, and log that it did);
// a page opened offline asks for it when the connection comes back. The game reads the same in the fallback face
let FONT_ASKED = false;
function askFont() {
  if (FONT_ASKED) return;
  try {
    if (navigator.onLine === false) return;
    FONT_ASKED = true;
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap';
    document.head.appendChild(l);
  } catch (e) { /* offline is fine */ }
}
function init() {
  askFont();
  try { if (!FONT_ASKED) window.addEventListener('online', askFont); } catch (e) { /* no events: the fallback face */ }
  S.big = PARAM.big || PREFS.big === true;
  S.titleT0 = S.rt;
  try { if (window.matchMedia('(pointer: coarse)').matches) S.inputType = 'touch'; } catch (e) { /* keep mouse */ }
  Sfx.setMuted(PARAM.mute || PREFS.mute === true);
  layout();
  // after layout(): its big allocations (the room, the rug, the sprite caches) pay off the page's start-up GC debt
  // first, so no collector pause lands inside the timed fit (CS.calib().ms)
  calibrate();
  nearOffsets();        // (the landing pop's search table: built now, not at the first PERFECT)
  bindInput();
  if (PARAM.autostart) startGame('auto');
  if (PARAM.selftest) {
    setTimeout(() => {
      const r = runSelftest();
      if (r.pass) console.log('SELFTEST PASS (' + r.ms + ' ms)');
      else console.log('SELFTEST FAIL: ' + r.failures.join(' | '));
      window.__selftest = r;
    }, 30);
  }
  requestAnimationFrame(frame);
}
init();
