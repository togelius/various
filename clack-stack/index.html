<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2EEE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clack Stack</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #F2EEE8; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none; }
  #safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  /* overlay buttons (title toggle, pause menu, results): real buttons placed over the canvas */
  #ui { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  #ui .btn { position: fixed; pointer-events: auto; box-sizing: border-box; margin: 0; padding: 0 12px;
    font: 700 22px Fredoka, ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; letter-spacing: 0.02em;
    color: #1E2541; background: #FFFFFF; border: 3px solid #1E2541; border-radius: 16px; box-shadow: 0 4px 0 #1E2541;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  #ui .btn[hidden] { display: none; }
  #ui .btn.gold { background: #FFC531; }
  #ui .btn.big { font-size: 32px; border-radius: 20px; }
  #ui .btn.tog { font-size: 15px; background: rgba(255,255,255,0.9); padding: 0 8px; gap: 6px; }
  #ui .btn svg { flex: none; }
  #ui .btn.tog::after { content: 'OFF'; font-size: 11px; color: #fff; background: #9AA3B5; border-radius: 8px; padding: 2px 6px; }
  #ui .btn.tog.on { background: #FFC531; }
  #ui .btn.tog.on::after { content: 'ON'; background: #2EBF4F; }
  #ui .btn.tog.sm { font-size: 13px; gap: 4px; padding: 0 6px; border-radius: 12px; }
  #ui .btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 #1E2541; }
  #ui .btn.pulse { animation: csPulse 0.8s ease-in-out infinite; }
  @keyframes csPulse { 50% { transform: scale(1.07); background: #FFE07A; } }
  @media (prefers-reduced-motion: reduce) { #ui .btn.pulse { animation: none; } }
  #ui .btn[disabled] { opacity: 0.55; cursor: default; }
  #ui .btn:focus { outline: none; }
  #ui .btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 2px; box-shadow: 0 4px 0 #1E2541, 0 0 0 7px rgba(47,91,234,0.7); }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Clack Stack: drop magnetic tiles to build a tower"></canvas>
<div id="safe"></div>

<script>
'use strict';

/* ==== CONFIG ==== */
const H3 = Math.sqrt(3) / 2;                // triangle height in L
const CFG = {

  R: 0.6, R_BIG: 1.0, R_CROWN: 1.2, R_CROWN_BIG: 1.6,

  PERFECT: 0.10, GREAT: 0.25, PERFECT_BIG: 0.18, GREAT_BIG: 0.35,

  BOUND_X: 3.5, SHRINK: 0.02, OCC_SHRINK: 0.15,

  FALL_GAP: 0.3,                            // L above the slot where the magnet takes over

  YANK_T: 0.07, LAND_GAP: 0.03, NEXT_T: 0.18, PENDING_T: 0.3, START_READY: 0.2,
  // masses and inertia (3.2, 3.6)
  MASS: { sq: 1, tri: 0.45, cube: 3, marble: 1, crown: 0.45 },
  KROT: { sq: 1 / 6, tri: 0.04, cube: 2.0, marble: 1 / 6, crown: 0.04 },
  CAR_MASS: 1.5, CAR_CY: -0.25, WHEEL_IN: 0.2, GRAV: 24,      // GRAV in L/s² (tower rock); debris uses DEBRIS_G
  // the cube is ballast (3.7, 11): dealt only while the build is low (its top at most CUBE_TOP L when it enters the
  // queue, two pieces before the hand: a fresh base); drawn from the bag later, it waits for the next low build
  CUBE_TOP: 1.5,

  // pulses (the gamble is visible);
  // checked this often (s)
  ALLTIPPY_EVERY: 0.2,

  GOAL_NEAR: 3.2, GOAL_NEAR_ALWAYS: 4, SCROLL_RAMP: 2,
  // groundY / H, the wheel contact line inside the rug band. Portrait shows more rug in front of the base

  GROUND_FRAC: 0.905, GROUND_FRAC_P: 0.78,
  // the hand hovers this far (L) above the build top; once the goal is near it hops over the ribbon and holds the

  // HUD (handTop); it eases there
  HAND_HOVER: 2.3, HAND_HOVER_RIB: 1.4, HAND_Y_EASE: 7, HAND_HOP_EASE: 30,
  // a crash or a TOPPLE: the hand flinches up (to FLINCH_UP L under its highest line), fingers spread, out of the way
  // of the burst, and stays up until the new car has parked
  FLINCH_UP: 0.5, FLINCH_OPEN: 0.5,
  // controls (4)
  HAND_EASE: 0.04, KEY_SPEED: 10, KEY_RAMP: 0.06, DETENT_T: 0.12,
  // scoring (7)
  PTS: { perfect: 25, great: 15, clack: 10 }, COMBO_STEP: 6, MULT_MAX: 5, EDGE_CAP: 3,
  GOAL_PTS: 20, RING_PTS: 50, CROWN_PTS: 100, CROWN_K: 0.5, CROWN_SEC: 1, TALLY_PTS: 5, OVERTIME_X: 2,
  // clock economy (6): runs on game time, capped, paused during a SMASH; BIG MAGNETS drains it at 0.6x
  CLOCK_START: 30, CLOCK_MAX: 60, CLOCK_RUNS: true, CLOCK_BIG: 0.6, TIME_RING: 2, TIME_CROWN: 3,
  // rings (3.7): 1 L1-L3 then 2, 0.35-0.75 G high, 1-2 L outside the base edge; collected with 0.15 L slack
  RING_LO: 0.35, RING_HI: 0.75, RING_OUT0: 1.0, RING_OUT1: 1.9, RING_SLACK: 0.15, RING_STOP: 0.06, CROWN_STOP: 0.08,
  // SMASH (5): 1.4 s from the crown landing to the next tile, the clock paused. Times from the crown landing.
  SMASH_ARM: 0.16, SMASH_V: 30, SHOVE_T: 0.3, SMASH_SHAKE: 18, SMASH_TALLY: 0.45, SMASH_BONUS: 0.28, SMASH_LEVEL: 0.42,
  SMASH_ROLL: 0.92, ARM_BACK: 12,
  // start (5): tap -> the arm shoves the cube -> BOOM -> the cars roll in and couple at 0.9 s -> play
  START_HIT: 0.24, START_PLAY: 0.45,
  // TIME! (5): input locks, flights land, the cube smashes what stands, the card at 1.2 s; taps locked 0.8 s more
  OVER_SMASH: 0.45, OVER_CARD: 1.2, OVER_LOCK: 0.8, COUNT_T: 1.1,
  // hazards (6): announced 1.2 s ahead (honk + edge arrow); the bump car enters the screen 0.5 s before it hits;
  // the foot's shadow grows for 1.0 s
  HONK_LEAD: 1.2, BUMP_ENTER: 0.5, FOOT_LEAD: 1.0, FOOT_STAY: 0.35, FOOT_LIFT: 0.4, BUMP_SHAKE: 8, FOOT_SHAKE: 10,
  // HUD
  HUD_H: 64, GUTTER: 16,
  // juice (8)
  FLASH_T: 0.12, FLASH_A: 0.6, GLOW_T: 0.2, SPARKS: 8, SQUASH: 0.04, SQUASH_T: 0.07,
  SHAKE_CLACK: 1.5, SHAKE_CLACK_T: 0.08, HITSTOP_PERFECT: 0.04, HITSTOP_CUBE: 0.09, SHAKE_CUBE: 6, HITSTOP_STREAK: 0.07,

  WORD_MAX: 0.6, WORDS_MAX: 2, ANNOUNCE_MAX: 1.0,   // word pops: life cap, at most this many alive; announcements' life cap
  // a MISS is a playful BONK!, the two-note "aww" at most every AWW_GAP s (a small kid misses a lot: never a stream

  // tower dynamics (3.6): a rocking block about the active wheel + one flex spring on the top

  GF: { perfect: 0.3, great: 1.0, clack: 1.5 }, KICK_BIG: 0.5, LEVER_DX: 0.6,

  // overhang landing with its kick would otherwise fell it 0.2 s after the CLACK, before the tell is any use; DESIGN
  // 3.6: past α the player has a moment to counterweight). The look-ahead (TIPPY, the tell, SAVE) runs this same
  // physics, so it stays honest; a crash going over is free again
  TIP_W: 0.7,
  // (and a weight past the wheel turns the tower over at TIP_ACC rad/s² at least: past a wheel it goes, unless the
  // weight comes straight back, 16.1. A tall tower's own pull there is slow enough that a swing just past a wheel and
  // back barely lifted it, and the player saw the weight past the wheel and nothing happen)
  TIP_ACC: 10,
  FLEX_WN: 9, FLEX_WN_H: 0.06, FLEX_ZETA: 0.15, FLEX_ZETA_L7: 0.10, FLEX_MAX: 0.35, TOP_VMAX: 2.8, PERFECT_SV: 0.6,
  // a kick works against I_eff = I_ref^(1-e) · I_P^e (I_P the live inertia about the pivot): e = 0 would make the rock
  // grow like H³ (one CLACK fells a 10 L tower), e = 1 (the live I_P) topples 4 L towers; 0.35 keeps the rock growing
  // with height but survivable (a CLACK on the outer column of a centred 2-wide tower peaks ~0.2 α at 3 L, 0.45 α at
  // 8 L, ~0.85 α at 15 L; a GREAT stays under ~0.3 α to 26 L)
  KICK_I_EXP: 0.35,
  // boot calibration on the reference tower: 2 wide, 8 L tall, centred, one car (3.6 table)
  CAL_H: 8, CAL_GREAT: 0.25, CAL_CLACK: 0.45, CAL_FLEX: 0.2, CAL_PERFECT: 0.10, CAL_BUMP: 0.35, CAL_FOOT: 0.5,
  CAL_DX_GREAT: 0.175, CAL_DX_CLACK: 0.5, CAL_T: 3,
  // tip tell, SAVE, BRACE (3.6, 3.7)
  TIPWARN_AT: 0.6, TIPWARN_OFF: 0.4, BLUSH_AT: 0.8, SAVE_AT: 0.6, SAVE_PTS: 75, DOOM_HORIZON: 1.5, DOOM_EVERY: 0.1,
  SAVE_HORIZON: 2.5,                        // a SAVE on the slap: the look-ahead says it stays up this long (or comes to rest)
  SAVE_REST: 0.2,                           // a SAVE is paid once the tower has stood still this long, nothing in the air, look-ahead clean
  SAVE_WIN: 1.5,                            // ... and a counterweight landed within this long of the lean being at >= SAVE_AT
  TIPPY_HORIZON: 4,                         // TIPPY looks this far past the aimed tile's landing (a tower near α topples slowly)
  BRACE_T: 0.3, BRACE_W: 0.3, BRACE_PTS: 20, POKE_T: 0.38, SLAP_THUMP_W: 0.35,
  // TRUSS (15.2): a down-triangle between two up-triangles standing on one base row (Δ∇Δ, built in either order:
  // the ▼ into the notch, or the second Δ beside a ▼ hung off the first, trussNotches) braces the tower up to the

  // TRUSS_RISE s, each flashing for TRUSS_FLASH s), then keep a faint steady glint (alpha TRUSS_GLINT)
  // The bonus pays for what the brace saves: TRUSS_PTS × mult × clamp(λ / TRUSS_LAM, 0, TRUSS_MAX), λ the slenderness of
  // the segment it braced (rounded to 5): a brace on a calm, stocky segment (a four-wide base, λ under 1) pays a
  // third or less; a slender one (λ 3 and up) the full bonus and more
  TRUSS_PTS: 150, TRUSS_LAM: 3, TRUSS_MAX: 1.5, TRUSS_W: 0.3, TRUSS_FLASH: 0.5, TRUSS_RISE: 0.22, TRUSS_GLINT: 0.42,
  // SWAY (16.2): the part over the brace line y_b (the top of the highest TRUSS, or the car top) has height Hu and
  // slenderness λ = Hu / w (w: its narrowest width, sampled every WOB_DY from WOB_DY/2 above y_b, floored at WOB_W_MIN).
  // Every landing on it raises the sway's strength W (0..1) by
  //   ΔW = min(cap(λ)·WOB_CAP_G[grade], WOB_A[grade]·max(0, λ − WOB_LAM0)² (× WOB_CUBE for the cube)) (× WOB_BIG in BIG),
  //   cap(λ) = min(WOB_CAP_TOP, WOB_DW_MAX + WOB_CAP_K·max(0, λ − WOB_CAP_L)): the most one CLACK can add, a PERFECT
  //   adding WOB_CAP_G.perfect of that (aim pays at every height)
  // and W settles as dW/dt = −W/τ − WOB_DRAIN (exponential, and a still tower stops dead), τ = WOB_TAU·max(1, Hu /
  // WOB_TAU_H)·max(1, λ / WOB_TAU_LAM). (A marble square's gear steadies it: W × WOB_GEAR, the swing × WOB_GEAR_Q; a
  // TRUSS cuts it × TRUSS_W.) The part sways: it rocks on the brace line, its top swinging SWAY_ANG·W·Hs L (Hs = max(1,
  // Hu); easing to it over WOB_SWAY_T s) at SWAY_WN / (1 + SWAY_WN_H·Hu) rad/s (tall things sway slowly), and its weight
  // goes with it: the centre of weight includes the sway, so a swing that carries it past a wheel tips the tower (the
  // one way to fall, 16.1). Tuned on tools/strategy.cjs (16.6): on level 8 (one car, two wide) a one-wide spire and
  // fast stacking straight up swing the weight past a wheel before the goal; bracing, or waiting for the sway to settle,
  // gets there (the wait costing clock).
  WOB_A: { perfect: 0.45, great: 0.7, clack: 1.0 }, WOB_CUBE: 1.5, WOB_BIG: 0.4, WOB_DY: 0.5, WOB_W_MIN: 1,
  WOB_LAM0: 2.4, WOB_DW_MAX: 0.27, WOB_CAP_L: 3, WOB_CAP_K: 0.09, WOB_CAP_TOP: 0.45,
  WOB_CAP_G: { perfect: 0.72, great: 0.86, clack: 1 },
  WOB_TAU: 1.5, WOB_TAU_H: 6, WOB_TAU_LAM: 4, WOB_DRAIN: 0.19,
  WOB_GEAR: 0.8, WOB_GEAR_Q: 0.3, WAH_EVERY: 0.05,
  SWAY_ANG: 0.34, SWAY_WN: 11, SWAY_WN_H: 0.1, WOB_SWAY_T: 0.12,
  // the one-time hints (16.4): up at least TIP_MIN s, gone after TIP_T s (or a drop after TIP_MIN); the sway's comes
  // with the first sway of TIP_SWAY L at the top
  TIP_T: 4.5, TIP_MIN: 1.6, TIP_SWAY: 0.3,
  // the crown gamble (15.6): CROWN NOW or GO HIGHER (the chip on the HOLD box); the first-ever crown's hint stays up
  // CROWN_HINT_T s (or until the crown leaves the hand)
  CROWN_HINT_T: 4,
  // the crown arrives with the landing that tears the ribbon, while the next tap may already be on its way: for
  // CROWN_GRACE s nothing lets it go (a press then is dropped, not kept), so the choice is the player's (normal mode)
  CROWN_GRACE: 0.4,
  // crash (3.6, 8): freeze, slow motion while it goes over, burst, new car
  CRASH_FREEZE: 0.12, CRASH_SLOW: 0.35, CRASH_SLOW_K: 0.4, CRASH_SHAKE: 14, CRASH_SHAKE_T: 0.5, CRASH_CAR: 0.7,
  CRASH_MIN_W: 1.3, CRASH_SPIN_MIN: 4, CRASH_SPIN_MAX: 12, CRASH_UNZIP: 0.13, CRASH_VMAX: 5.5,
  // debris (3.5, 3.6)
  DEBRIS_MAX: 60, DEBRIS_FADE: 0.4, DEBRIS_REST: 0.35, DEBRIS_FRIC: 0.6, DEBRIS_G: 28, DEBRIS_VT: 14, DEBRIS_SLEEP: 0.15, DEBRIS_LATE: 1.8, DEBRIS_DEADLINE: 2.3, MISS_VX: 3, RING_ROLL: 1.6, PUSH_VMAX: 4,
  DEBRIS_FLAT: 0.03, DEBRIS_TIP: 8, DEBRIS_TURN: 2.5, CLEAR_V: 2.4, CLEAR_SLACK: 0.12,   // resting = an edge on the rug; the parked base clears its span
  WALL_PULL: 30, WALL_V: 2, WALL_SLACK: 0.05,                         // the pile stays in view

  // has hit the rug (only the live base reads as a car); AGAIN clears the rug over AGAIN_FADE s
  DEB_Z_RATE: 3.5, DEB_Z_SCALE: 0.05, DEB_Z_MAX: 3.2, CLEAR_PAD: 0.7, CLEAR_TOP: 0.04, CAR_FADE: 0.6, AGAIN_FADE: 0.4,
  CUBE_FADE: 3,                             // (and the boy takes his cube back: it never piles up into a wall of cubes)
  // a tile (or ring) that has come to rest falls flat on the rug: drawn squashed to LAY_K of its height about its

  LAY_K: 0.3,

  // (the dead end is told for TOPPLE_DELAY before it goes: the tower shivers harder and harder, a "NO ROOM!" sign pops

  TOPPLE_DELAY: 0.42, TOPPLE_FREEZE: 0.1, TOPPLE_SHAKE: 10, ROLL_WAIT: 0.2, ROLL_T: 0.45,
  // the gauge (9): shown once the zoom bottoms out and the camera scrolls
  GAUGE_W: 26,
  // the FPS watchdog (M8)
  WATCH_MS: 22, WATCH_T: 2,
};
// level-complete time bonus (6): L1-L6 +10 s, L7-L10 +9 s, L11 on +8 s
function levelTime(n) { return n <= 6 ? 10 : n <= 10 ? 9 : 8; }
// the base (15.5): two coupled cars (4 L) on L1-L3, one long car (3 L) on L4-L7, one car (2 L) from L8; BIG MAGNETS
// keeps two cars through L4. len: the length of each car (L)
function carsFor(n, big) { return big && n <= 4 ? 2 : levelInfo(n).cars; }
function carLenFor(n, big) { return carsFor(n, big) === 2 ? 2 : levelInfo(n).len || 2; }
// Level table (6, 15.5). icon keys match Art.drawGoalIcon.
const LEVELS = [null,
  { cars: 2, G: 4, name: 'THE WATERMELON BAG', icon: 'melon', fuse: 2.4, rings: 1 },
  { cars: 2, G: 5, name: 'THE TILE BOX', icon: 'box', fuse: 2.2, rings: 1 },
  { cars: 2, G: 6, name: 'THE ARMCHAIR SEAT', icon: 'armchair', fuse: 2.0, rings: 1 },
  { cars: 1, len: 3, G: 7, name: 'THE EGG CHAIR SEAT', icon: 'eggchair', fuse: 1.8, rings: 2 },
  { cars: 1, len: 3, G: 8, name: 'THE SIDE TABLE', icon: 'table', fuse: 1.7, rings: 2, hazard: 12 },
  { cars: 1, len: 3, G: 9, name: 'THE ARMCHAIR BACK', icon: 'armback', fuse: 1.6, rings: 2, hazard: 11 },
  { cars: 1, len: 3, G: 10, name: 'THE WINDOW SILL', icon: 'window', fuse: 1.5, rings: 2, hazard: 10, zeta: 0.10 },
  { cars: 1, G: 11, name: 'THE TOP OF THE EGG CHAIR', icon: 'eggtop', fuse: 1.4, rings: 2, hazard: 10, foot: true },
  { cars: 1, G: 13, name: 'THE AIR CONDITIONER', icon: 'ac', fuse: 1.3, rings: 2, hazard: 9, foot: true },
  { cars: 1, G: 15, name: 'YOU!', icon: 'you', fuse: 1.2, rings: 2, hazard: 9, foot: true },
  { cars: 1, G: 17, name: 'THE FLOOR LAMP', icon: 'lamp', fuse: 1.1, rings: 2, hazard: 8, foot: true },
  { cars: 1, G: 19, name: 'THE BOOKSHELF', icon: 'shelf', fuse: 1.1, rings: 2, hazard: 8, foot: true },
  { cars: 1, G: 22, name: 'A GROWN-UP!', icon: 'grownup', fuse: 1.1, rings: 2, hazard: 8, foot: true },
  { cars: 1, G: 26, name: 'THE DOOR', icon: 'door', fuse: 1.1, rings: 2, hazard: 8, foot: true },
  { cars: 1, G: 32, name: 'THE CEILING', icon: 'ceiling', fuse: 1.1, rings: 2, hazard: 8, foot: true },
];
const LATE_GOALS = [['THE ROOF', 'roof'], ['THE CLOUDS', 'clouds'], ['THE MOON', 'moon']];
function levelInfo(n) {
  if (n < LEVELS.length) return LEVELS[n];
  const k = n - LEVELS.length;                     // 0 = L16
  const g = LATE_GOALS[Math.min(k, 2)];
  const name = k < 3 ? g[0] : 'THE MOON ×' + (k - 1);
  return { cars: 1, G: 32 + 3 * (n - 15), name, icon: g[1], fuse: 1.1, rings: 2, hazard: 8, foot: true };
}

const QS = new URLSearchParams(location.search);
const PARAM = {
  seed: QS.has('seed') ? (parseInt(QS.get('seed'), 10) >>> 0) : ((Math.random() * 4294967296) >>> 0),

  function bodyGrad(g, base, L, a, lit) {
    const gr = g.createLinearGradient(-L / 2, -L / 2, L / 2, L / 2);
    gr.addColorStop(0, rgba(lighten(base, lit ? 0.08 : 0.12), a));
    gr.addColorStop(1, rgba(lit ? darken(base, 0.01) : darken(base, 0.08), a));
    return gr;
  }

  const NIGHT_PAD = 0.24; // glow halo around night sprites, in L
  // how far a night tile's glass is lifted toward white: at least 0.38 (orange 0.46: its X-diamond inset darkens most
  // of the square), and as far as it takes to reach a luminance of NIGHT_LUM (blue 0.5, red and purple a little over
  // 0.38; the light colours stay at 0.38)
  const NIGHT_LUM = 172;
  function nightLift(h) {
    let t = h === PAL.orange ? 0.46 : 0.38;
    for (; t < 0.7; t += 0.02) { const c = rgbOf(lighten(h, t)); if (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2] >= NIGHT_LUM) break; }
    return t;
  }
  function buildTile(L, kind, shape, color, pat) {
    if (shape === 'cube') return buildCube(L, kind);
    const bb = shapeBounds(shape, L);
    const pad = kind === K_NIGHT ? Math.ceil(NIGHT_PAD * L + 2) : 2;
    const s = makeSprite(L, bb[0], bb[1], bb[2], bb[3], pad);
    if (!s) return null;
    const g = s.g;
    const crown = isCrownS(shape);
    const base = crown ? BODY.crown : BODY[color];
    const r = 0.07 * L;
    const outer = shapePts(shape, L, 0);
    if (kind === K_BODY) {
      g.fillStyle = bodyGrad(g, base, L, crown ? CROWN_A : BODY_A);
      g.beginPath(); polyPath(g, outer, r); g.fill();
      // the rim plastic is thicker: a denser band under the frame
      g.fillStyle = rgba(base, 0.22);
      g.beginPath(); polyPath(g, outer, r); polyPath(g, shapePts(shape, L, 0.1 * L), r * 0.5); g.fill('evenodd');
      if (shape === 'marble') marbleBody(g, L, false);
    } else if (kind === K_NIGHT) {
      // lit glass against a dark sky, drawn source-over: the glow halo is baked in under
      // the body so a night tile is ONE blit (two blits plus 'screen' cost 3x in software)
      const nb = PAL[crown ? 'orange' : color];
      g.save();
      g.shadowColor = rgba(lighten(nb, 0.25), 0.85);
      g.shadowBlur = 0.22 * L * SPR;
      g.fillStyle = rgba(lighten(nb, 0.35), 0.5);
      g.beginPath(); polyPath(g, outer, r); g.fill();
      g.restore();
      // lighter and denser than by day: lit glass must stand out from the dark sky AND from the
      // lamp-lit wall and console behind a tower at night (40+ luminance either way, with room to
      // spare: the dark colours, blue above all, are lifted further, to the same lit brightness, and the
      // light across the glass is flatter than by day)
      g.fillStyle = bodyGrad(g, lighten(nb, nightLift(nb)), L, 0.92, true);
      g.beginPath(); polyPath(g, outer, r); g.fill();
      g.fillStyle = rgba(lighten(nb, 0.1), 0.15);
      g.beginPath(); polyPath(g, outer, r); polyPath(g, shapePts(shape, L, 0.1 * L), r * 0.5); g.fill('evenodd');
      if (shape === 'marble') marbleBody(g, L, true);
    } else if (kind === K_DETAIL) {
      tileDetail(g, shape, color, pat, L);
    } else if (kind === K_WHITE) {
      g.fillStyle = '#ffffff';
      g.beginPath(); polyPath(g, outer, r); g.fill();
      if (shape === 'marble') { g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(0, 0, 0.2 * L, 0, TAU); g.fill(); }
    } else if (kind === K_RIM) {
      g.fillStyle = 'rgba(255,40,48,0.16)';
      g.beginPath(); polyPath(g, outer, r); g.fill();
      g.fillStyle = 'rgba(255,34,44,0.95)';
      g.beginPath(); polyPath(g, outer, r); polyPath(g, shapePts(shape, L, 0.11 * L), r * 0.5); g.fill('evenodd');
    }
    return finish(s);
  }

  function marbleBody(g, L, night) {
    // lavender-frosted, porthole cut clean through
    g.fillStyle = rgba(PAL.marble, night ? 0.25 : 0.28);
    g.beginPath(); polyPath(g, shapePts('sq', L, 0), 0.07 * L); g.fill();
    g.globalCompositeOperation = 'destination-out';
    g.beginPath(); g.arc(0, 0, 0.2 * L, 0, TAU); g.fill();
    g.globalCompositeOperation = 'source-over';
  }

  // embossed line: shadow below-right, highlight above-left
  function embossStroke(g, fc, L, pathFn) {
    const o = Math.max(0.6, 0.012 * L);
    g.lineWidth = Math.max(0.8, 0.022 * L);
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.save(); g.translate(o, o); g.strokeStyle = rgba(darken(fc, 0.25), 0.34); g.beginPath(); pathFn(); g.stroke(); g.restore();
    g.save(); g.translate(-o * 0.7, -o * 0.7); g.strokeStyle = 'rgba(255,255,255,0.3)'; g.beginPath(); pathFn(); g.stroke(); g.restore();
  }

  function rivet(g, x, y, rr, fc) {
    g.fillStyle = rgba(lighten(fc, 0.45), 0.9);
    g.beginPath(); g.arc(x, y, rr, 0, TAU); g.fill();
    g.fillStyle = rgba(darken(fc, 0.3), 0.55);
    g.beginPath(); g.arc(x + rr * 0.3, y + rr * 0.3, rr * 0.55, 0, TAU); g.fill();
  }

  function tileDetail(g, shape, color, pat, L) {
    const isTri = isTriS(shape), down = isDownS(shape), crown = isCrownS(shape);
    const fc = crown ? FRAME.crown : FRAME[color];
    const base = crown ? PAL.orange : PAL[color];
    const fw = 0.09 * L, r = 0.07 * L;
    const outer = shapePts(shape, L, 0), inner = shapePts(shape, L, fw);
    // frame
    g.fillStyle = rgba(fc, 0.9);
    g.beginPath(); polyPath(g, outer, r); polyPath(g, inner, r * 0.4); g.fill('evenodd');
    // bevel: bright inner lip + dark outer edge
    g.lineWidth = Math.max(0.7, 0.016 * L);
    g.strokeStyle = rgba(lighten(base, 0.55), 0.55);
    g.beginPath(); polyPath(g, inner, r * 0.4); g.stroke();
    g.strokeStyle = rgba(darken(fc, 0.35), 0.5);
    g.beginPath(); polyPath(g, shapePts(shape, L, 0.006 * L), r); g.stroke();
    // magnet pockets: two per edge, darker slots inside the frame band
    const n = outer.length >> 1;
    g.fillStyle = rgba(darken(fc, 0.5), 0.5);
    for (let i = 0; i < n; i++) {
      const x0 = outer[2 * i], y0 = outer[2 * i + 1];
      const j = (i + 1) % n, x1 = outer[2 * j], y1 = outer[2 * j + 1];
      const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
      const nx = -uy, ny = ux; // inward for clockwise-on-screen polygons
      const ang = Math.atan2(uy, ux);
      for (let k = 0; k < 2; k++) {
        const t = isTri ? (k ? 0.68 : 0.32) : (k ? 0.72 : 0.28);
        const px = x0 + ux * len * t + nx * fw * 0.5, py = y0 + uy * len * t + ny * fw * 0.5;
        g.save(); g.translate(px, py); g.rotate(ang);
        g.beginPath(); rrect(g, -0.11 * L, -0.019 * L, 0.22 * L, 0.038 * L, 0.012 * L); g.fill();
        g.restore();
      }
    }
    // rivets at the corners and edge middles
    const rr = Math.max(0.7, 0.03 * L);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const ix = inner[2 * i], iy = inner[2 * i + 1];
      const ox = outer[2 * i], oy = outer[2 * i + 1];
      rivet(g, lerp(ox, ix, 0.62), lerp(oy, iy, 0.62), rr, fc);
      const mx = (outer[2 * i] + outer[2 * j]) / 2, my = (outer[2 * i + 1] + outer[2 * j + 1]) / 2;
      const mix2 = (inner[2 * i] + inner[2 * j]) / 2, miy = (inner[2 * i + 1] + inner[2 * j + 1]) / 2;
      rivet(g, lerp(mx, mix2, 0.5), lerp(my, miy, 0.5), rr * 0.8, fc);
    }
    // embossed pattern
    if (isTri) {
      const R = L / SQ3, k = 0.42, sg = down ? -1 : 1;
      const tri = [0, -R * k * sg, (L / 2) * k * sg, (R / 2) * k * sg, (-L / 2) * k * sg, (R / 2) * k * sg];
      embossStroke(g, fc, L, () => {
        polyPath(g, tri, 0.02 * L);
        if (pat === 0 || crown) {
          const ii = shapePts(shape, L, fw * 1.1);
          for (let i = 0; i < 3; i++) { g.moveTo(ii[2 * i], ii[2 * i + 1]); g.lineTo(tri[2 * i], tri[2 * i + 1]); }
        }
      });
      g.fillStyle = rgba(lighten(base, 0.4), 0.55);
      g.beginPath(); g.arc(0, 0, 0.05 * L, 0, TAU); g.fill();
      g.strokeStyle = rgba(darken(fc, 0.2), 0.45); g.lineWidth = Math.max(0.6, 0.014 * L);
      g.beginPath(); g.arc(0, 0, 0.05 * L, 0, TAU); g.stroke();
    } else if (shape === 'marble') {
      marbleDetail(g, L, fc, base);
    } else if (pat === 3) {
      const a = L / 2 - fw * 1.05;
      embossStroke(g, fc, L, () => {
        g.moveTo(-a, -a); g.lineTo(a, a); g.moveTo(a, -a); g.lineTo(-a, a);
        g.moveTo(0, -a); g.lineTo(a, 0); g.lineTo(0, a); g.lineTo(-a, 0); g.closePath();
        g.moveTo(0, -a); g.lineTo(0, a); g.moveTo(-a, 0); g.lineTo(a, 0);
      });
      g.fillStyle = rgba(lighten(base, 0.45), 0.5);
      g.beginPath(); g.arc(0, 0, 0.045 * L, 0, TAU); g.fill();
    } else {
      const ins = pat === 1 ? 0.3 * L : 0.24 * L;
      if (pat !== 2) {
        embossStroke(g, fc, L, () => { rrect(g, -L / 2 + ins, -L / 2 + ins, L - 2 * ins, L - 2 * ins, 0.03 * L); });
      }
      // little moulded logo mark in the middle
      g.strokeStyle = rgba(darken(fc, 0.1), 0.3); g.lineWidth = Math.max(0.6, 0.012 * L);
      g.beginPath(); g.arc(0, 0, 0.032 * L, 0, TAU); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.35)';
      g.beginPath(); g.arc(-0.012 * L, -0.012 * L, 0.012 * L, 0, TAU); g.fill();
    }
    // gloss: soft diagonal streak + bright top-left edge, clipped to the tile
    g.save();
    g.beginPath(); polyPath(g, outer, r); g.clip();
    const gl = g.createLinearGradient(-L * 0.55, -L * 0.55, L * 0.2, L * 0.2);
    gl.addColorStop(0, 'rgba(255,255,255,0)');
    gl.addColorStop(0.42, 'rgba(255,255,255,0.0)');
    gl.addColorStop(0.5, 'rgba(255,255,255,0.26)');
    gl.addColorStop(0.62, 'rgba(255,255,255,0.05)');
    gl.addColorStop(0.7, 'rgba(255,255,255,0)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gl;
    g.fillRect(-L, -L, 2 * L, 2 * L);
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,0.42)';
    g.lineWidth = Math.max(0.7, 0.018 * L);
    g.beginPath();
    if (down) { const R = L / SQ3; g.moveTo(-L / 2 + 0.16 * L, -R / 2 + 0.018 * L); g.lineTo(L / 2 - 0.22 * L, -R / 2 + 0.018 * L); }
    else if (isTri) { const R = L / SQ3; g.moveTo(-L / 2 + 0.06 * L, R / 2 - 0.08 * L); g.lineTo(-0.03 * L, -R + 0.1 * L); }
    else { const a = L / 2 - 0.012 * L; g.moveTo(-a, a - 0.12 * L); g.lineTo(-a, -a + r * 0.6); g.arcTo(-a, -a, -a + r, -a, r * 0.7); g.lineTo(a - 0.12 * L, -a); }
    g.stroke();
    if (crown) {
      // the crown always wears a faint gold rim, so it reads as THE piece even at rest
      g.lineJoin = 'round';
      g.strokeStyle = 'rgba(255,197,49,0.75)';
      g.lineWidth = Math.max(1, 0.035 * L);
      g.beginPath(); polyPath(g, shapePts(shape, L, 0.012 * L), r); g.stroke();
      g.strokeStyle = 'rgba(255,240,180,0.6)';
      g.lineWidth = Math.max(0.7, 0.014 * L);
      g.beginPath(); polyPath(g, shapePts(shape, L, fw + 0.01 * L), r * 0.4); g.stroke();
    }
  }

  function marbleDetail(g, L, fc, base) {
    // porthole: raised ring around a clean hole, a ring of screw dots, corner screws
    const hr = 0.2 * L;
    g.lineWidth = 0.06 * L;
    g.strokeStyle = rgba(lighten(base, 0.25), 0.55);
    g.beginPath(); g.arc(0, 0, hr + 0.03 * L, 0, TAU); g.stroke();
    g.lineWidth = Math.max(0.7, 0.016 * L);
    g.strokeStyle = rgba(darken(fc, 0.25), 0.7);
    g.beginPath(); g.arc(0, 0, hr, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.5)';
    g.beginPath(); g.arc(0, 0, hr + 0.065 * L, Math.PI * 1.05, Math.PI * 1.6); g.stroke();
    embossStroke(g, fc, L, () => { g.arc(0, 0, 0.34 * L, 0, TAU); });
    const dr = Math.max(0.7, 0.024 * L);
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * TAU + 0.31;
      rivet(g, Math.cos(a) * 0.29 * L, Math.sin(a) * 0.29 * L, dr, fc);
    }
    const c = 0.3 * L;
    for (let i = 0; i < 4; i++) {
      const x = i & 1 ? c : -c, y = i & 2 ? c : -c;
      g.fillStyle = rgba(darken(fc, 0.45), 0.6);
      g.beginPath(); g.arc(x, y, 0.035 * L, 0, TAU); g.fill();
      g.strokeStyle = rgba(lighten(base, 0.5), 0.6); g.lineWidth = Math.max(0.6, 0.012 * L);
      g.beginPath(); g.arc(x, y, 0.05 * L, 0, TAU); g.stroke();
    }
  }

  /* ---------------------------------------------------------------- cube
   * Photo-3 cube: 2L faces made of 2x2 squares; orange front, red top, yellow left.
   * One renderer serves both the closed cube sprite and the folding net, so fold = 1
   * draws exactly the sprite. Face bodies are composed with 'multiply' inside the body
   * sprite too: multiply is associative, so the folding net can multiply each face straight
   * onto the scene (no offscreen) and still land exactly on the closed cube's colours. 3D: x right, y down, z into the screen (cube = 2 units);
   * oblique projection X = x - z*KX, Y = y - z*KY.
   */
  // A subtle extrusion: in a tower the oblique faces sit behind the tiles stacked on and
  // beside the cube, so a deep one reads as tiles interpenetrating the cube
  const CUBE_KX = 0.08, CUBE_KY = 0.09;   // the oblique faces stay within 0.2 L of the 2L x 2L cell
  const CF_COL = ['orange', 'red', 'orange', 'yellow', 'yellow', 'red']; // front top back left right bottom
  const CF_CI = [0, 1, 0, 2, 2, 1];                                         // orange, red, yellow
  const CQ = new Float64Array(6 * 8); // per face: ox oy ux uy vx vy z vis
  const CA = new Float64Array(6);     // per face: body alpha factor
  const CORD = [0, 1, 2, 3, 4, 5];
  // the oblique top and left faces of the closed cube get a lighter body: tiles stacked on
  // or beside the cube overlap them, and a full-strength red/yellow multiplies into mud
  // (at full strength: the photo's red top and yellow side are what make it THE cube)
  const CUBE_SIDE_A = 1;

  // any fold argument -> 0..1: undefined, NaN, strings that are not numbers and objects are 0
  const fold01 = (f) => (f > 0 ? (f < 1 ? +f : 1) : 0);
  // hinge i's progress: the five hinges close one after the other
  const hinge = (fold, i) => ease(clamp(fold * 5 - i, 0, 1));
  let ckx = CUBE_KX, cky = CUBE_KY;
  function cset(i, Ox, Oy, Oz, Ux, Uy, Uz, Vx, Vy, Vz, vis) {
    const b = i * 8;
    CQ[b] = Ox - Oz * ckx; CQ[b + 1] = Oy - Oz * cky;
    CQ[b + 2] = Ux - Uz * ckx; CQ[b + 3] = Uy - Uz * cky;
    CQ[b + 4] = Vx - Vz * ckx; CQ[b + 5] = Vy - Vz * cky;
    CQ[b + 6] = Oz + (Uz + Vz) / 2; CQ[b + 7] = vis;
  }
  function cubeGeom(fold) {
    fold = fold01(fold);
    const fB = hinge(fold, 0), fR = hinge(fold, 1), fL = hinge(fold, 2), fT = hinge(fold, 3), fK = hinge(fold, 4);
    const H = HALF_PI;
    // depth exaggeration while the net is open (the fold reads as 3D in flight); back to 1
    // by fold 0.8 so the landing is static
    const k = 1 + 3.4 * Math.sin(Math.PI * Math.min(1, fold / 0.8));
    ckx = CUBE_KX * k; cky = CUBE_KY * k;
    cset(0, -1, -1, 0, 2, 0, 0, 0, 2, 0, 1);
    const cT = Math.cos(fT * H), sT = Math.sin(fT * H);
    cset(1, -1, -1, 0, 2, 0, 0, 0, -2 * cT, 2 * sT, 1);
    const cK = Math.cos(fK * H), sK = Math.sin(fK * H);
    // back hangs off the top's far edge: dir = topDir*cos + n*sin, n = (0, sinT, cosT)
    cset(2, -1, -1 - 2 * cT, 2 * sT, 2, 0, 0, 0, 2 * (-cT * cK + sT * sK), 2 * (sT * cK + cT * sK), 1 - 0.55 * Math.min(fT, fK));
    const cL = Math.cos(fL * H), sL = Math.sin(fL * H);
    cset(3, -1, -1, 0, 0, 2, 0, -2 * cL, 0, 2 * sL, 1);
    const cR = Math.cos(fR * H), sR = Math.sin(fR * H);
    cset(4, 1, -1, 0, 0, 2, 0, 2 * cR, 0, 2 * sR, 1 - 0.55 * fR);
    const cB = Math.cos(fB * H), sB = Math.sin(fB * H);
    cset(5, -1, 1, 0, 2, 0, 0, 0, 2 * cB, 2 * sB, 1 - 0.55 * fB);
    CA[0] = CA[2] = CA[4] = CA[5] = 1;
    CA[1] = 1 - (1 - CUBE_SIDE_A) * fT;
    CA[3] = 1 - (1 - CUBE_SIDE_A) * fL;
    // far faces first (insertion sort, no allocation)
    for (let i = 0; i < 6; i++) CORD[i] = i;
    for (let i = 1; i < 6; i++) {
      const v = CORD[i]; let j = i - 1;
      while (j >= 0 && CQ[CORD[j] * 8 + 6] < CQ[v * 8 + 6]) { CORD[j + 1] = CORD[j]; j--; }
      CORD[j + 1] = v;
    }
  }

  function cubeFaceT(g, i, L) {
    const b = i * 8;
    g.transform(CQ[b + 2] * L, CQ[b + 3] * L, CQ[b + 4] * L, CQ[b + 5] * L, CQ[b] * L, CQ[b + 1] * L);
  }
  const faceDet = (i) => { const b = i * 8; return Math.abs(CQ[b + 2] * CQ[b + 5] - CQ[b + 3] * CQ[b + 4]); };

  // face body gradients in unit face space, built once (day and night per face colour);
  // the face transform places them, a face's visibility goes in globalAlpha
  const CUBE_GRAD = [null, null, null, null, null, null];
  function cubeGrad(g, ci, night) {
    const k = ci + (night ? 3 : 0);
    let gr = CUBE_GRAD[k];
    if (!gr) {
      const col = ci === 0 ? 'orange' : ci === 1 ? 'red' : 'yellow';
      const bc = night ? PAL[col] : BODY[col];
      gr = g.createLinearGradient(0, 0, 1, 1);
      gr.addColorStop(0, rgba(night ? lighten(bc, 0.25) : lighten(bc, 0.1), 0.8));
      gr.addColorStop(1, rgba(darken(bc, 0.08), 0.8));
      CUBE_GRAD[k] = gr;
    }
    return gr;
  }

  // mode: 'body' | 'night' | 'detail' | 'white' | 'rim' | 'glow'
  function renderCube(g, L, fold, mode) {
    cubeGeom(fold);
    const ga = g.globalAlpha;
    for (let n = 0; n < 6; n++) {
      const i = CORD[n], vis = CQ[i * 8 + 7];
      const col = CF_COL[i];
      if (faceDet(i) < 1e-4) continue;
      g.save();
      cubeFaceT(g, i, L);
      if (mode === 'body' || mode === 'night') {
        g.globalAlpha = ga * vis * (mode === 'body' ? CA[i] : 1);
        g.fillStyle = cubeGrad(g, CF_CI[i], mode === 'night');
        g.fillRect(0, 0, 1, 1);
      } else if (mode === 'detail') {
        cubeFaceDetail(g, col, vis);
      } else if (mode === 'white') {
        g.fillStyle = '#fff'; g.fillRect(0, 0, 1, 1);
      } else if (mode === 'rim') {
        g.fillStyle = 'rgba(255,40,48,0.14)'; g.fillRect(0, 0, 1, 1);
        g.fillStyle = 'rgba(255,34,44,0.9)';
        g.beginPath(); g.rect(0, 0, 1, 1); g.rect(0.05, 0.05, 0.9, 0.9); g.fill('evenodd');
      } else if (mode === 'glow') {
        g.fillStyle = rgba(lighten(PAL[col], 0.3), 0.3); g.fillRect(0, 0, 1, 1);
      }
      g.restore();
    }
  }

  function cubeFaceDetail(g, col, vis) {
    const fc = FRAME[col], base = PAL[col];
    const fw = 0.045, r = 0.03;
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
      const x = i * 0.5, y = j * 0.5;
      g.fillStyle = rgba(fc, 0.9 * vis);
      g.beginPath(); rrect(g, x, y, 0.5, 0.5, r); rrect(g, x + fw, y + fw, 0.5 - 2 * fw, 0.5 - 2 * fw, r * 0.4); g.fill('evenodd');
      g.lineWidth = 0.008;
      g.strokeStyle = rgba(lighten(base, 0.55), 0.5 * vis);
      g.beginPath(); rrect(g, x + fw, y + fw, 0.5 - 2 * fw, 0.5 - 2 * fw, r * 0.4); g.stroke();
      // pockets
      g.fillStyle = rgba(darken(fc, 0.5), 0.45 * vis);
      for (let k = 0; k < 2; k++) {
        const t = k ? 0.36 : 0.14;
        g.fillRect(x + t - 0.0001, y + fw * 0.5 - 0.01, 0.1, 0.02);
        g.fillRect(x + t - 0.0001, y + 0.5 - fw * 0.5 - 0.01, 0.1, 0.02);
        g.fillRect(x + fw * 0.5 - 0.01, y + t, 0.02, 0.1);
        g.fillRect(x + 0.5 - fw * 0.5 - 0.01, y + t, 0.02, 0.1);
      }
      // inset square emboss
      g.strokeStyle = rgba(darken(fc, 0.2), 0.3 * vis); g.lineWidth = 0.01;
      g.strokeRect(x + 0.13, y + 0.13, 0.24, 0.24);
      g.strokeStyle = 'rgba(255,255,255,' + 0.25 * vis + ')';
      g.strokeRect(x + 0.125, y + 0.125, 0.24, 0.24);
      // corner rivets
      g.fillStyle = rgba(lighten(fc, 0.45), 0.85 * vis);
      for (let k = 0; k < 4; k++) {
        g.beginPath(); g.arc(x + (k & 1 ? 0.5 - 0.028 : 0.028), y + (k & 2 ? 0.5 - 0.028 : 0.028), 0.014, 0, TAU); g.fill();
      }
    }
    // gloss streak across the whole face
    const gl = g.createLinearGradient(0, 0, 0.7, 0.7);
    gl.addColorStop(0, 'rgba(255,255,255,0)');
    gl.addColorStop(0.45, 'rgba(255,255,255,0)');
    gl.addColorStop(0.52, 'rgba(255,255,255,' + 0.22 * vis + ')');
    gl.addColorStop(0.62, 'rgba(255,255,255,0)');
    g.fillStyle = gl; g.fillRect(0, 0, 1, 1);
    g.strokeStyle = 'rgba(255,255,255,' + 0.4 * vis + ')'; g.lineWidth = 0.009;
    g.beginPath(); g.moveTo(0.006, 0.9); g.lineTo(0.006, 0.006); g.lineTo(0.9, 0.006); g.stroke();
  }

  function buildCube(L, kind) {
    const bb = shapeBounds('cube', L);
    const pad = kind === K_NIGHT ? Math.ceil(NIGHT_PAD * L + 2) : 2;
    const s = makeSprite(L, bb[0], bb[1], bb[2], bb[3], pad);
    if (!s) return null;
    const g = s.g;
    if (kind === K_BODY) { g.globalCompositeOperation = 'multiply'; renderCube(g, L, 1, 'body'); }
    else if (kind === K_NIGHT) {
      // glow halo baked under the lit-glass body (one blit at night)
      g.save();
      g.shadowColor = 'rgba(255,170,80,0.9)'; g.shadowBlur = 0.22 * L * SPR;
      renderCube(g, L, 1, 'glow');
      g.restore();
      renderCube(g, L, 1, 'night');
    }
    else if (kind === K_DETAIL) {
      renderCube(g, L, 1, 'detail');
      // the red lid catches the light: a bright lip along the top face's far edge and a softer
      // one where it meets the front (so the red top reads as a lid even as a thin strip)
      const bx = 2 * CUBE_KX * L, by = 2 * CUBE_KY * L;
      g.lineCap = 'round';
      g.strokeStyle = 'rgba(255,128,128,0.9)'; g.lineWidth = Math.max(0.8, 0.035 * L);
      g.beginPath(); g.moveTo(-L - bx + 0.05 * L, -L - by + 0.03 * L); g.lineTo(L - bx - 0.05 * L, -L - by + 0.03 * L); g.stroke();
      g.strokeStyle = 'rgba(255,214,120,0.75)'; g.lineWidth = Math.max(0.7, 0.025 * L);
      g.beginPath(); g.moveTo(-L - bx + 0.01 * L, -L - by + 0.04 * L); g.lineTo(-L - bx + 0.01 * L, L - by - 0.06 * L); g.stroke();
    }
    else if (kind === K_WHITE) renderCube(g, L, 1, 'white');
    else if (kind === K_RIM) renderCube(g, L, 1, 'rim');
    return finish(s);
  }

  // One face's detail (the 2x2 grid, frames, pockets, emboss, rivets, gloss) as a sprite
  // covering the face at size L: the folding net draws it under each face's affine map, one
  // drawImage per face instead of ~100 path operations
  function buildFace(L, col) {
    const s = makeSprite(L, 0, 0, 2 * L, 2 * L, 1);
    if (!s) return null;
    s.g.scale(2 * L, 2 * L);
    cubeFaceDetail(s.g, col, 1);
    return finish(s);
  }
  // The flat net (fold 0) as a body and a detail sprite: it is drawn every frame the cube
  // waits in the hand, so it costs two blits like any tile
  const NET0_BB = [-3, -5, 3, 3];
  function buildNet0(L, kind) {
    const s = makeSprite(L, NET0_BB[0] * L, NET0_BB[1] * L, NET0_BB[2] * L, NET0_BB[3] * L, 2);
    if (!s) return null;
    if (kind === K_BODY) s.g.globalCompositeOperation = 'multiply';
    renderCube(s.g, L, 0, kind === K_BODY ? 'body' : 'detail');
    return finish(s);
  }

  /* ---------------------------------------------------------------- drawTile */
  const NO_OPTS = {};
  const GHOST_COL = table({ white: '#ffffff', gold: '#FFC531', red: '#FF3B3B' });
  const DASH = [6, 4];
  const NO_DASH = [];

  function tileSprite(kind, shape, si, color, ci, pat, q) {
    // flash and tint overlays are colour-independent silhouettes: one sprite per shape
    if (kind === K_WHITE || kind === K_RIM) ci = 0;
    const base = (((si * 8 + ci) * 4 + (kind === K_DETAIL ? pat : 0)) * 8 + kind);
    return getSprite(base, q, buildTile, kind, shape, color, pat);
  }

  function outlinePath(ctx, shape, L) {
    ctx.beginPath();
    if (shape === 'cube') {
      const dx = 2 * CUBE_KX * L, dy = 2 * CUBE_KY * L;
      ctx.moveTo(-L - dx, -L - dy); ctx.lineTo(L - dx, -L - dy); ctx.lineTo(L, -L);
      ctx.lineTo(L, L); ctx.lineTo(-L, L); ctx.lineTo(-L - dx, L - dy); ctx.closePath();
    } else polyPath(ctx, shapePts(shape, L, 0), 0.07 * L);
  }

  /* The aiming ghost, the main aid of a fast game, so it must read at a glance on anything.
   * The outline scales with L (a fixed 2 px line vanishes on a 70 px tile) over a navy
   * underlay; the slot is filled with the held piece's own colour, multiplied in like a faint
   * tile, plus a soft glow inside the rim: "this tile goes here" on the near-white wall, on
   * other tiles and on the armchair. White / gold / red are told apart by the outline.
   * A = effective alpha (option alpha x caller's globalAlpha). At night (caller passes night,
   * or the room is dimmed) multiply only darkens the navy room, so the fill is light instead:
   * an additive colour wash and an additive glow band along the inside of the outline.
   */
  function drawGhost(ctx, shape, color, L, kind, A, night) {
    const gc = GHOST_COL[kind] || GHOST_COL.white;
    const tc = PAL[color] || PAL.orange;
    const lw = Math.max(2, 0.045 * L), uw = Math.max(3.5, 0.075 * L);
    outlinePath(ctx, shape, L);
    ctx.lineJoin = 'round';
    if (night) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.14 * A;
      ctx.fillStyle = tc;
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = gc;
      ctx.lineWidth = 0.34 * L;
      ctx.globalAlpha = 0.28 * A;
      ctx.stroke();
      ctx.lineWidth = 0.14 * L;
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.26 * A;
      ctx.fillStyle = tc;
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = kind === 'gold' ? '#FFF1BF' : kind === 'red' ? '#FFD9D9' : '#FFFFFF';
      ctx.globalAlpha = 0.3 * A;
      ctx.lineWidth = 0.16 * L;
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = (night ? 0.3 : 0.55) * A;
    ctx.strokeStyle = '#1E2541';
    ctx.lineWidth = uw;
    ctx.stroke();
    ctx.globalAlpha = A;
    ctx.strokeStyle = gc;
    ctx.lineWidth = lw;
    DASH[0] = 3 * lw; DASH[1] = 2 * lw;
    ctx.setLineDash(DASH);
    ctx.lineDashOffset = -((performance.now() * 0.02) % (5 * lw));
    ctx.stroke();
    if (kind === 'gold') {
      // twinkling sparkles at the corners
      ctx.setLineDash(NO_DASH);
      const now = performance.now() * 0.006;
      const pts = shape === 'tri' || shape === 'crown' ? 3 : 4;
      const R = shape === 'cube' ? L * 1.1 : shape === 'tri' || shape === 'crown' ? L / SQ3 : L * 0.62;
      ctx.fillStyle = '#FFF6C8';
      for (let i = 0; i < pts; i++) {
        const a = (shape === 'tri' || shape === 'crown' ? -Math.PI / 2 : -Math.PI * 0.75) + (i * TAU) / pts;
        const sz = (0.09 + 0.06 * Math.sin(now + i * 2.1)) * L;
        sparkle(ctx, Math.cos(a) * R, Math.sin(a) * R, sz);
      }
    }
  }

  function sparkle(ctx, x, y, s) {
    if (s <= 0) return;
    ctx.beginPath();
    ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s);
    ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s);
    ctx.fill();
  }

  // the crown's gold sweep: one cached gradient in unit space, placed by the transform
  let glintGrad = null;
  function glintSweep(ctx, shape, L, glint, A) {
    ctx.save();
    outlinePath(ctx, shape, L);
    ctx.clip();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = A * 0.3 * Math.sin(Math.PI * glint);
    ctx.fillStyle = '#FFC531';
    ctx.fillRect(-1.5 * L, -1.5 * L, 3 * L, 3 * L);
    if (!glintGrad) {
      glintGrad = ctx.createLinearGradient(-0.35, -0.35, 0.35, 0.35);
      glintGrad.addColorStop(0, 'rgba(255,214,90,0)');
      glintGrad.addColorStop(0.5, 'rgba(255,246,190,0.95)');
      glintGrad.addColorStop(1, 'rgba(255,214,90,0)');
    }
    const p = lerp(-1.1, 1.1, glint) * L;
    ctx.translate(p, p);
    ctx.scale(L, L);
    ctx.globalAlpha = A;
    ctx.fillStyle = glintGrad;
    ctx.fillRect(-3, -3, 6, 6);
    ctx.restore();
  }

  function drawTile(ctx, shape, color, cx, cy, rot, L, o) {
    if (!okL(L) || !fin(cx) || !fin(cy)) return;
    let si = SHAPE_IDX[shape];
    if (si === undefined) { shape = 'sq'; si = 0; }
    if (shape === 'crown') color = 'orange';
    let ci = COLOR_IDX[color];
    if (ci === undefined) { color = 'red'; ci = 0; }
    if (shape === 'cube') { color = 'orange'; ci = 1; }
    o = o || NO_OPTS;
    const alpha = o.alpha == null ? 1 : clamp(+o.alpha, 0, 1);
    const A = alpha * ctx.globalAlpha; // compose with the caller's alpha (fades)
    if (!(A > 0.003)) return;
    const q = qOf(L);
    curQ = q;
    ctx.save();
    try {
      ctx.translate(cx, cy);
      let r0 = rot && fin(rot) ? rot : 0;
      // a triangle turned by about pi (a down triangle in a band) uses the down sprite turned by
      // the small rest, so its light comes from the top-left like everything else
      if ((si === 1 || si === 4) && !o.ghost) {
        let d = r0 - Math.PI;
        d -= Math.round(d / TAU) * TAU;
        if (d > -0.6 && d < 0.6) { si += si === 1 ? 4 : 2; shape = si === 5 ? 'triD' : 'crownD'; r0 = d; }
      }
      // quarter turns become exact axis-aligned matrices; any other angle is kept in rr
      let rr = r0 && !quarter(ctx, r0) ? r0 : 0;
      if (o.ghost) {
        if (rr) ctx.rotate(rr);
        drawGhost(ctx, shape, color, L, o.ghost, A, !!o.night || curDim >= 0.5);
      } else {
        const pat = patternOf(shape, color, o.variant || 0);
        const layer = o.layer || 'both';
        if (layer !== 'detail') {
          ctx.globalAlpha = A;
          if (o.night) {
            ctx.globalCompositeOperation = 'source-over';
            blitR(ctx, tileSprite(K_NIGHT, shape, si, color, ci, 0, q), L, rr);
          } else {
            ctx.globalCompositeOperation = 'multiply';
            blitR(ctx, tileSprite(K_BODY, shape, si, color, ci, 0, q), L, rr);
          }
        }
        if (layer !== 'body') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = A;
          blitR(ctx, tileSprite(K_DETAIL, shape, si, color, ci, pat, q), L, rr);
          const fl = o.flash || 0, ti = o.tint || 0, gl = o.glint || 0;
          if (fl > 0 || ti > 0 || (gl > 0 && gl < 1)) {
            if (rr) ctx.rotate(rr);
            if (fl > 0) { ctx.globalAlpha = A * Math.min(1, fl); blit(ctx, tileSprite(K_WHITE, shape, si, color, ci, 0, q), L); }
            if (ti > 0) { ctx.globalAlpha = A * Math.min(1, ti); blit(ctx, tileSprite(K_RIM, shape, si, color, ci, 0, q), L); }
            if (gl > 0 && gl < 1) glintSweep(ctx, shape, L, gl, A);
          }
        }
      }
    } finally {
      ctx.restore();
    }
  }

  /* ---------------------------------------------------------------- cube net
   * The open net's faces are painted source-over into one reusable offscreen and that is
   * multiplied onto the scene ONCE: the same pipeline as the closed cube sprite, so the
   * colours do not jump when the fold completes and drawTile('cube') takes over.
   */
  const FACE_BASE = 9500, NET_BASE = 9510;
  function drawCubeNet(ctx, cx, cy, L, fold, rot) {
    if (!okL(L) || !fin(cx) || !fin(cy)) return;
    fold = fold01(fold);
    if (fold >= 1) { drawTile(ctx, 'cube', 'orange', cx, cy, rot, L); return; }
    const A = ctx.globalAlpha;
    if (!(A > 0.003)) return;
    const q = qOf(L);
    curQ = q;
    if (fold <= 0) {
      // the flat net waiting in the hand: two cached sprites
      ctx.save();
      try {
        ctx.translate(cx, cy);
        const rr = rot && fin(rot) && !quarter(ctx, rot) ? rot : 0;
        ctx.globalCompositeOperation = 'multiply';
        blitR(ctx, getSprite(NET_BASE, q, buildNet0, K_BODY), L, rr);
        ctx.globalCompositeOperation = 'source-over';
        blitR(ctx, getSprite(NET_BASE + 1, q, buildNet0, K_DETAIL), L, rr);
      } finally {
        ctx.restore();
      }
      return;
    }
    ctx.save();
    try {
      ctx.translate(cx, cy);
      if (rot && fin(rot)) rotQ(ctx, rot);
      // bodies: each face multiplied straight onto the scene (cached unit-space gradients)
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = A;
      renderCube(ctx, L, fold, 'body');
      // details: each face's cached sprite under the face's affine map, far faces first
      ctx.globalCompositeOperation = 'source-over';
      for (let n = 0; n < 6; n++) {
        const i = CORD[n];
        if (faceDet(i) < 1e-4) continue;
        const s = getSprite(FACE_BASE + CF_CI[i], q, buildFace, CF_COL[i]);
        if (!s) continue;
        ctx.save();
        cubeFaceT(ctx, i, L);
        ctx.globalAlpha = A * CQ[i * 8 + 7];
        const k = 1 / (2 * s.L);
        ctx.drawImage(s.c, -s.ox * k, -s.oy * k, s.w * k, s.h * k);
        ctx.restore();
      }
    } finally {
      ctx.restore();
    }
  }

  /* ---------------------------------------------------------------- car base */
  function carWheel(g, x, y, r, far) {
    g.fillStyle = far ? '#0c0c0e' : '#151517';
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.strokeStyle = far ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.18)';
    g.lineWidth = r * 0.12;
    g.beginPath(); g.arc(x, y, r * 0.86, Math.PI * 1.05, Math.PI * 1.65); g.stroke();
    g.fillStyle = far ? '#4a4a4e' : '#9C9CA2';
    g.beginPath(); g.arc(x, y, r * 0.4, 0, TAU); g.fill();
    g.fillStyle = far ? '#333' : '#6E6E74';
    g.beginPath(); g.arc(x + r * 0.05, y + r * 0.05, r * 0.2, 0, TAU); g.fill();
    if (!far) {
      g.fillStyle = 'rgba(255,255,255,0.55)';
      g.beginPath(); g.arc(x - r * 0.14, y - r * 0.14, r * 0.1, 0, TAU); g.fill();
    }
  }

  // hl: half the car's length in L (1 for a 2 L car, 1.5 for the long 3 L car); wheels 0.2 L in from each end
  function buildCar(L, part, colorName, hl) {
    hl = hl || 1;
    const X = hl * L, n = Math.round(4 * hl);                  // the plate's half-length (px) and its grid cells
    const s = makeSprite(L, -X - 0.32 * L, -0.4 * L, X + 0.32 * L, 0.56 * L, 2);
    if (!s) return null;
    const g = s.g;
    const base = PAL[colorName], fc = FRAME[colorName];
    const yb = -0.21 * L, yf = 0.05 * L, sk = 0.08 * L, y2 = 0.23 * L, wx = X - 0.2 * L;
    const top = [-X, yf, X, yf, X + sk, yb, -X + sk, yb];
    if (part === 0) {
      carWheel(g, -wx + sk, 0.26 * L, 0.19 * L, true);
      carWheel(g, wx + sk, 0.26 * L, 0.19 * L, true);
    } else if (part === 1) {
      const gr = g.createLinearGradient(-X, yb, X, y2);
      gr.addColorStop(0, rgba(lighten(base, 0.15), 0.6));
      gr.addColorStop(1, rgba(darken(base, 0.05), 0.6));
      g.fillStyle = gr;
      g.beginPath(); polyPath(g, top, 0.05 * L); g.fill();
      g.fillStyle = rgba(darken(base, 0.08), 0.8);
      g.beginPath(); rrect(g, -X, yf - 0.01 * L, 2 * X, y2 - yf + 0.01 * L, 0.04 * L); g.fill();
      // tow hooks: loop on the right, peg on the left
      g.strokeStyle = rgba(base, 0.8); g.lineWidth = 0.05 * L;
      g.beginPath(); g.arc(X + 0.13 * L, 0.03 * L, 0.07 * L, 0, TAU); g.stroke();
      g.fillStyle = rgba(base, 0.8);
      g.fillRect(X - 0.02 * L, 0.0, 0.1 * L, 0.08 * L);
      g.fillRect(-X - 0.12 * L, 0.02 * L, 0.14 * L, 0.08 * L);
      g.beginPath(); rrect(g, -X - 0.1 * L, -0.16 * L, 0.07 * L, 0.2 * L, 0.03 * L); g.fill();
    } else {
      // frame of the top plate and the 2 x n inner grid (half-L cells: 2x4 on a 2 L car, 2x6 on the long one)
      g.lineJoin = 'round';
      g.strokeStyle = rgba(fc, 0.9); g.lineWidth = 0.05 * L;
      g.beginPath(); polyPath(g, top, 0.05 * L); g.stroke();
      g.lineWidth = 0.032 * L; g.strokeStyle = rgba(fc, 0.75);
      g.beginPath();
      for (let i = 1; i < n; i++) {
        const f = i / n;
        g.moveTo(-X + 2 * X * f, yf); g.lineTo(-X + sk + 2 * X * f, yb);
      }
      g.moveTo(-X + sk / 2, (yf + yb) / 2); g.lineTo(X + sk / 2, (yf + yb) / 2);
      g.stroke();
      g.strokeStyle = rgba(lighten(base, 0.6), 0.55); g.lineWidth = Math.max(0.6, 0.012 * L);
      g.beginPath();
      for (let i = 0; i <= n; i++) {
        const f = i / n;
        g.moveTo(-X + 2 * X * f + 0.02 * L, yf - 0.02 * L); g.lineTo(-X + sk + 2 * X * f + 0.02 * L, yb + 0.02 * L);
      }
      g.stroke();
      // front face: lip highlight, pockets, dark bottom edge
      g.fillStyle = 'rgba(255,255,255,0.45)';
      g.fillRect(-X + 0.03 * L, yf, 2 * X - 0.06 * L, Math.max(0.8, 0.02 * L));
      g.fillStyle = rgba(darken(fc, 0.5), 0.45);
      const pstep = (2 * hl - 0.59) / (n - 1);
      for (let i = 0; i < n; i++) g.fillRect(-X + (0.3 + i * pstep) * L, yf + 0.07 * L, 0.2 * L, 0.04 * L);
      g.fillStyle = rgba(darken(fc, 0.4), 0.7);
      g.fillRect(-X + 0.02 * L, y2 - 0.025 * L, 2 * X - 0.04 * L, 0.025 * L);
      g.strokeStyle = rgba(fc, 0.95); g.lineWidth = Math.max(0.8, 0.02 * L);
      g.beginPath(); rrect(g, -X, yf - 0.01 * L, 2 * X, y2 - yf + 0.01 * L, 0.04 * L); g.stroke();
      // hooks outline + highlight
      g.strokeStyle = rgba(fc, 0.95); g.lineWidth = Math.max(0.7, 0.016 * L);
      g.beginPath(); g.arc(X + 0.13 * L, 0.03 * L, 0.095 * L, 0, TAU); g.stroke();
      g.beginPath(); g.arc(X + 0.13 * L, 0.03 * L, 0.045 * L, 0, TAU); g.stroke();
      g.beginPath(); rrect(g, -X - 0.1 * L, -0.16 * L, 0.07 * L, 0.2 * L, 0.03 * L); g.stroke();
      g.fillStyle = rgba(lighten(base, 0.5), 0.8);
      g.beginPath(); g.ellipse(-X - 0.065 * L, -0.155 * L, 0.035 * L, 0.015 * L, 0, 0, TAU); g.fill();
      // near wheels: radius 0.2L, 0.2L in from each end, contact 0.5L below the plate top
      carWheel(g, -wx, 0.3 * L, 0.2 * L, false);
      carWheel(g, wx, 0.3 * L, 0.2 * L, false);
    }
    return finish(s);
  }

  // three spokes on each near hub and a fleck on the tyre, turned by ang (radians, clockwise)
  function hubMarks(ctx, L, ang, hl) {
    const r = 0.074 * L, ca = Math.cos(ang), sa = Math.sin(ang), wx = (hl - 0.2) * L;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(44,44,50,0.8)';
    ctx.lineWidth = Math.max(0.8, 0.024 * L);
    ctx.beginPath();
    for (let w = -1; w <= 1; w += 2) {
      const cx = w * wx, cy = 0.3 * L;
      // spokes at ang, ang + 120 and ang + 240 degrees (each turned 120 degrees from the last)
      let c = ca, s = sa;
      for (let k = 0; k < 3; k++) {
        ctx.moveTo(cx + c * r * 0.3, cy + s * r * 0.3); ctx.lineTo(cx + c * r, cy + s * r);
        const c2 = c * -0.5 - s * 0.8660254, s2 = c * 0.8660254 + s * -0.5;
        c = c2; s = s2;
      }
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    for (let w = -1; w <= 1; w += 2) {
      const fx = w * wx + ca * 0.155 * L, fy = 0.3 * L + sa * 0.155 * L;
      ctx.moveTo(fx + 0.022 * L, fy); ctx.arc(fx, fy, 0.022 * L, 0, TAU);
    }
    ctx.fill();
  }
  // o.len: the car's length in L, 2 (default) or 3 (the long car of levels 4-7; any length from 2.5 up draws it)
  function drawCar(ctx, x, y, rot, L, color, o) {
    if (!okL(L) || !fin(x) || !fin(y)) return;
    const cn = color === 'green' ? 'green' : 'red';
    const ci = COLOR_IDX[cn];
    const q = qOf(L), hl = o && fin(o.len) && o.len >= 2.5 ? 1.5 : 1;
    const sq = o && o.squash > 0 ? Math.min(1, o.squash) : 0;
    ctx.save();
    try {
      ctx.translate(x, y);
      if (rot && fin(rot)) rotQ(ctx, rot);
      if (sq) { ctx.translate(0, 0.5 * L); ctx.scale(1 + 0.08 * sq, 1 - 0.22 * sq); ctx.translate(0, -0.5 * L); }
      const b0 = (hl > 1 ? 9040 : 9000) + ci * 4;
      blit(ctx, getSprite(b0, q, buildCar, 0, cn, hl), L);
      ctx.globalCompositeOperation = 'multiply';
      blit(ctx, getSprite(b0 + 1, q, buildCar, 1, cn, hl), L);
      ctx.globalCompositeOperation = 'source-over';
      blit(ctx, getSprite(b0 + 2, q, buildCar, 2, cn, hl), L);
      // the near wheels turn as the car rolls: o.roll = distance rolled in L (angle = roll / r)
      const roll = o && fin(o.roll) ? o.roll : 0;
      hubMarks(ctx, L, roll / 0.2, hl);
    } finally {
      ctx.restore();
    }
  }

  /* ---------------------------------------------------------------- sleeve, hand, arm */
  // one period of the striped sleeve, cached per size: navy, yellow, navy, pale blue
  const SLEEVE_P = 0.4; // period in L
  function buildSleeve(L) {
    const w = 0.62 * L, P = SLEEVE_P * L, n = 4;
    const s = makeSprite(L, -w / 2, 0, w / 2, P * n, 0);
    if (!s) return null;
    const g = s.g;
    for (let k = 0; k < n; k++) {
      const y0 = k * P;
      g.fillStyle = PAL.sleeve; g.fillRect(-w / 2, y0, w, P);
      g.fillStyle = PAL.stripeYellow; g.fillRect(-w / 2, y0 + 0.17 * L, w, 0.06 * L);
      g.fillStyle = PAL.stripeBlue; g.fillRect(-w / 2, y0 + 0.27 * L, w, 0.045 * L);
    }
    // volume: dark sides, soft highlight left of centre
    const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0);
    gr.addColorStop(0, 'rgba(8,10,25,0.55)');
    gr.addColorStop(0.18, 'rgba(8,10,25,0.12)');
    gr.addColorStop(0.38, 'rgba(255,255,255,0.10)');
    gr.addColorStop(0.62, 'rgba(8,10,25,0.05)');
    gr.addColorStop(1, 'rgba(8,10,25,0.6)');
    g.fillStyle = gr; g.fillRect(-w / 2, 0, w, P * n);
    // soft fabric folds
    for (let k = 0; k < n; k++) {
      const y0 = k * P + (k % 2 ? 0.05 : 0.22) * L;
      const fg = g.createLinearGradient(0, y0 - 0.08 * L, 0, y0 + 0.08 * L);
      fg.addColorStop(0, 'rgba(255,255,255,0)'); fg.addColorStop(0.45, 'rgba(255,255,255,0.08)');
      fg.addColorStop(0.55, 'rgba(0,0,0,0.16)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = fg;
      g.beginPath();
      g.moveTo(-w / 2, y0 - 0.08 * L + (k % 2 ? 0.05 : -0.04) * L); g.lineTo(w / 2, y0 - 0.08 * L + (k % 2 ? -0.04 : 0.05) * L);
      g.lineTo(w / 2, y0 + 0.08 * L + (k % 2 ? -0.04 : 0.05) * L); g.lineTo(-w / 2, y0 + 0.08 * L + (k % 2 ? 0.05 : -0.04) * L);
      g.closePath(); g.fill();
    }
    // knit texture
    g.fillStyle = 'rgba(0,0,0,0.08)';
    for (let y = 0; y < P * n; y += Math.max(1, 0.03 * L)) g.fillRect(-w / 2, y, w, Math.max(0.5, 0.008 * L));
    return finish(s);
  }

  // draws the sleeve along local -y from y0 (cuff end) to yTop (negative, far end); phase: how far along the
  // sleeve (px) local y = 0 is, so the stripes run on unbroken from one piece of a bent sleeve to the next
  function sleeveRun(ctx, L, y0, yTop, phase) {
    const s = getSprite(9100, qOf(L), buildSleeve);
    if (!s) return;
    const f = L / s.L, segH = s.h * f;
    let y = y0 - segH;
    if (phase) y += (((phase - y0) % segH) + segH) % segH;
    let guard = 0;
    while (y + segH > yTop && guard++ < 64) {
      ctx.drawImage(s.c, -s.ox * f, y, s.w * f, segH);
      y -= segH;
    }
  }

  // Parts of a hand are drawn twice: first every part stroked wide in the outline colour,
  // then every part filled with skin, so the outline hugs the union of the parts.
  const SKIN_LINE = 'rgba(150,84,58,0.62)';
  function capsule(ctx, x, y, ang, len, w) {
    // from (x,y) along direction ang (0 = pointing down), rounded both ends
    const s = Math.sin(ang), c = Math.cos(ang);
    const ex = x - s * len, ey = y + c * len, r = w / 2;
    const nx = c * r, ny = s * r;
    ctx.moveTo(x + nx, y + ny);
    ctx.lineTo(ex + nx, ey + ny);
    ctx.arc(ex, ey, r, ang, ang + Math.PI);
    ctx.lineTo(x - nx, y - ny);
    ctx.arc(x, y, r, ang + Math.PI, ang + TAU);
    ctx.closePath();
  }
  const HF = new Float64Array(4 * 4); // per finger: kx, ky, ang, len
  function handParts(ctx, L, open, pass) {
    const ow = Math.max(1.2, 0.03 * L);
    // thumb (behind the tile's top edge, pinching from the left)
    const ta = lerp(-0.62, -1.25, open);
    ctx.beginPath(); capsule(ctx, -0.27 * L, -0.4 * L, ta, 0.3 * L, 0.15 * L);
    pass ? ctx.fill() : ctx.stroke();
    // back of the hand
    ctx.beginPath();
    ctx.moveTo(-0.24 * L, -0.7 * L);
    ctx.bezierCurveTo(-0.25 * L, -0.48 * L, -0.33 * L, -0.34 * L, -0.31 * L, -0.16 * L);
    ctx.quadraticCurveTo(-0.3 * L, -0.08 * L, -0.2 * L, -0.08 * L);
    ctx.lineTo(0.2 * L, -0.08 * L);
    ctx.quadraticCurveTo(0.31 * L, -0.08 * L, 0.32 * L, -0.18 * L);
    ctx.bezierCurveTo(0.33 * L, -0.34 * L, 0.26 * L, -0.48 * L, 0.24 * L, -0.7 * L);
    ctx.closePath();
    pass ? ctx.fill() : ctx.stroke();
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      capsule(ctx, HF[i * 4], HF[i * 4 + 1], HF[i * 4 + 2], HF[i * 4 + 3], i === 3 ? 0.13 * L : 0.155 * L);
      pass ? ctx.fill() : ctx.stroke();
    }
    return ow;
  }

  function scribbles(ctx, L) {
    ctx.strokeStyle = 'rgba(217,51,59,0.62)';
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1, 0.032 * L);
    ctx.beginPath();
    ctx.moveTo(-0.15 * L, -0.46 * L);
    ctx.quadraticCurveTo(-0.04 * L, -0.38 * L, 0.03 * L, -0.47 * L);
    ctx.quadraticCurveTo(0.1 * L, -0.55 * L, 0.15 * L, -0.4 * L);
    ctx.stroke();
    ctx.lineWidth = Math.max(1, 0.024 * L);
    ctx.beginPath(); ctx.moveTo(-0.08 * L, -0.27 * L); ctx.lineTo(0.06 * L, -0.23 * L); ctx.stroke();
    ctx.fillStyle = 'rgba(217,51,59,0.5)';
    ctx.beginPath(); ctx.arc(0.19 * L, -0.24 * L, 0.028 * L, 0, TAU); ctx.fill();
  }

  function cuff(ctx, L, y) {
    ctx.fillStyle = '#161B33';
    ctx.beginPath(); rrect(ctx, -0.335 * L, y - 0.13 * L, 0.67 * L, 0.15 * L, 0.05 * L); ctx.fill();
    ctx.strokeStyle = 'rgba(143,166,201,0.35)'; ctx.lineWidth = Math.max(0.6, 0.012 * L);
    ctx.beginPath();
    for (let i = -6; i <= 6; i++) { ctx.moveTo(i * 0.05 * L, y - 0.11 * L); ctx.lineTo(i * 0.05 * L, y); }
    ctx.stroke();
  }

  const FINGER_LEN = [0.33, 0.36, 0.34, 0.28];
  // (returns where the arm went, for the caller to keep things it must not hide clear of it: the wrist, the elbow and
  // the shoulder in screen px and the arm's half-widths there; one reused object, valid until the next call)
  const ARMJ = { ok: false, wx: 0, wy: 0, ex: 0, ey: 0, sx: 0, sy: 0, rf: 0, ru: 0, bow: 0 };
  function drawHand(ctx, x, y, L, open, t) {
    ARMJ.ok = false;
    if (!okL(L) || !fin(x) || !fin(y)) return ARMJ;
    open = open > 0 ? Math.min(1, open) : 0;
    t = fin(t) ? t : 0;
    ctx.save();
    try { handBody(ctx, x, y, L, open, t); } finally { ctx.restore(); }
    return ARMJ;
  }
  // the elbow: a navy ball with a soft light (one unit-space gradient, placed by the transform)
  let elbowGrad = null;
  function elbowBall(ctx, x, y, r) {
    ctx.fillStyle = PAL.sleeve;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    if (!elbowGrad) {
      elbowGrad = ctx.createRadialGradient(-0.26, -0.32, 0.06, 0, 0, 1);
      elbowGrad.addColorStop(0, 'rgba(143,166,201,0.28)'); elbowGrad.addColorStop(1, 'rgba(5,7,20,0.35)');
    }
    ctx.save();
    ctx.translate(x, y); ctx.scale(r, r);
    ctx.fillStyle = elbowGrad;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
    ctx.restore();
  }
  /* The holding arm. It comes from a shoulder above the top edge toward the right (the boy kneels
   * at the right of the build, photo 1), so it slants and its angle follows the hand. The forearm is
   * a child's (2.6 L) and the elbow always shows: within reach the arm bends by plain two-segment IK;
   * beyond it (a low hand) the child stretches: the forearm grows with the reach (up to ARM_FORE_MAX
   * times), the upper arm takes the rest up to the shoulder (mostly off the top) and the elbow keeps a
   * 35 degree bend, pointing out to the lower right. The upper arm is drawn coming toward the viewer:
   * it widens on its way off the screen and bows out a little (upperArm), so a long reach reads as a
   * child's arm reaching in from above the camera, never as a straight pole. In landscape the
   * shoulder sits left of the corner HUD column, so the arm comes down beside it. The hand turns part
   * of the way toward the shoulder, about its grip on the tile. */
  const ARM_FORE = 2.6, ARM_UPPER = 2.8, ARM_GAMMA = Math.PI - 0.61;   // elbow angle when stretched (145 deg)
  const ARM_REACH = Math.sqrt(ARM_FORE * ARM_FORE + ARM_UPPER * ARM_UPPER - 2 * ARM_FORE * ARM_UPPER * Math.cos(ARM_GAMMA));
  const ARM_FORE_MAX = 1.75, ARM_FORE_K = 0.55, ARM_TAPER = 0.09, ARM_TAPER_MAX = 1.55, ARM_BOW = 0.08, ARM_N = 10;
  // the upper arm from the elbow E toward the shoulder S (and 1.5 L on past it): a gentle bow away from the wrist side
  // (side: +1 / -1), widening along its length. Straight pieces of sleeve (the stripes running on across them), each a
  // little wider than the arm there, clipped to the arm's one smooth outline (no steps at the joins)
  const UA = new Float64Array((ARM_N + 2) * 2), UW = new Float64Array(ARM_N + 2), UC = new Float64Array(ARM_N + 2);
  const UN = new Float64Array((ARM_N + 2) * 2), ARM_SEGS = [0, 3, 6, 9, ARM_N + 1];
  const armW = (L, s) => Math.min(ARM_TAPER_MAX, 1 + ARM_TAPER * Math.max(0, s - 1.2 * L) / L);
  function upperArm(ctx, L, ex, ey, sx, sy, side) {
    const dx = sx - ex, dy = sy - ey, len = Math.max(1e-3, Math.hypot(dx, dy));
    const nx = -dy / len * side, ny = dx / len * side, bow = ARM_BOW * len;
    const cx = (ex + sx) / 2 + nx * bow, cy = (ey + sy) / 2 + ny * bow;
    for (let i = 0; i <= ARM_N; i++) {
      const t = i / ARM_N, u = 1 - t;
      UA[2 * i] = u * u * ex + 2 * u * t * cx + t * t * sx; UA[2 * i + 1] = u * u * ey + 2 * u * t * cy + t * t * sy;
    }
    // (on past the shoulder along the curve's end tangent, off the screen)
    let tx = sx - cx, ty = sy - cy; const tl = Math.max(1e-3, Math.hypot(tx, ty)); tx /= tl; ty /= tl;
    UA[2 * ARM_N + 2] = sx + tx * 1.5 * L; UA[2 * ARM_N + 3] = sy + ty * 1.5 * L;
    let c = 0;
    for (let i = 0; i <= ARM_N + 1; i++) {
      UC[i] = c; UW[i] = 0.31 * L * armW(L, c);
      if (i <= ARM_N) c += Math.hypot(UA[2 * i + 2] - UA[2 * i], UA[2 * i + 3] - UA[2 * i + 1]);
      // (the offset to the outline there: the normal of the path, as long as the half-width)
      const a = i > 0 ? i - 1 : 0, b = i <= ARM_N ? i + 1 : ARM_N + 1, qx = UA[2 * b] - UA[2 * a], qy = UA[2 * b + 1] - UA[2 * a + 1];
      const k = UW[i] / Math.max(1e-3, Math.hypot(qx, qy));
      UN[2 * i] = -qy * k; UN[2 * i + 1] = qx * k;
    }
    // the outline: each point pushed out both ways along the normal of the path there
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(UA[0] + UN[0], UA[1] + UN[1]);
    for (let i = 1; i <= ARM_N + 1; i++) ctx.lineTo(UA[2 * i] + UN[2 * i], UA[2 * i + 1] + UN[2 * i + 1]);
    for (let i = ARM_N + 1; i >= 0; i--) ctx.lineTo(UA[2 * i] - UN[2 * i], UA[2 * i + 1] - UN[2 * i + 1]);
    ctx.closePath();
    ctx.clip();
    // (the sleeve in ARM_SEGS straight runs along the chords, each as wide as the widest of the arm it covers: the
    // outline is the smooth one, and few runs keep the canvas calls, and their boxed numbers, down)
    for (let k = 0; k + 1 < ARM_SEGS.length; k++) {
      const i = ARM_SEGS[k], j = ARM_SEGS[k + 1];
      const x0 = UA[2 * i], y0 = UA[2 * i + 1], px = UA[2 * j] - x0, py = UA[2 * j + 1] - y0, l = Math.max(1e-3, Math.hypot(px, py));
      let wmax = 0;
      for (let q = i; q <= j; q++) if (UW[q] > wmax) wmax = UW[q];
      sleeveSeg(ctx, L, x0, y0, px / l, py / l, l + 0.06 * L, k ? 0.08 * L : 0, 1.1 * wmax / (0.31 * L), UC[i]);
    }
    ctx.restore();
  }
  function handBody(ctx, x, y, L, open, t) {
    const LEN = FINGER_LEN;
    const hy = y - open * 0.12 * L;
    const W = LAY.W > 0 ? LAY.W : x + 6 * L, H = LAY.H > 0 ? LAY.H : 2 * W;
    // (landscape: the shoulder also follows the hand a little way, so a hand far to the left is reached for at a
    // slant from up and right of it, not from across the whole screen)
    const sx = W > 1.1 * H ? Math.min(W - Math.max(130, 0.16 * W), x + 6.5 * L) : W + 0.5 * L, sy = -2.4 * L - 20;
    const lean = Math.atan2(sx - x, (hy - 0.62 * L) - sy);
    const tilt = clamp(0.55 * lean, -0.5, 0.5) + Math.sin(t * 1.9) * 0.02;
    const wx = x + 0.62 * L * Math.sin(tilt), wy = hy - 0.62 * L * Math.cos(tilt);
    // u: wrist -> shoulder; the elbow sits b along the forearm, turned beta off u toward the lower right
    let ux0 = sx - wx, uy0 = sy - wy;
    const d = Math.max(1e-3, Math.hypot(ux0, uy0));
    ux0 /= d; uy0 /= d;
    const b = ARM_FORE * L * clamp(1 + ARM_FORE_K * (d / (ARM_REACH * L) - 1), 1, ARM_FORE_MAX), cg = Math.cos(ARM_GAMMA);
    let a = b * ARM_UPPER / ARM_FORE, beta;
    if (d * d >= a * a + b * b - 2 * a * b * cg) {
      // out of reach: the upper arm takes the length, the elbow keeps its bend (law of cosines, then sines)
      a = 0.5 * (2 * b * cg + Math.sqrt(4 * b * b * cg * cg - 4 * (b * b - d * d)));
      beta = Math.asin(clamp(a * Math.sin(ARM_GAMMA) / d, 0, 1));
    } else beta = Math.acos(clamp((b * b + d * d - a * a) / (2 * b * d), -1, 1));
    // turn u by beta to the side that puts the elbow to the lower right of the wrist-shoulder line
    const cb = Math.cos(beta), sb = Math.sin(beta);
    let fx0 = ux0 * cb - uy0 * sb, fy0 = ux0 * sb + uy0 * cb;
    if (fx0 * -uy0 + fy0 * ux0 < 0) { fx0 = ux0 * cb + uy0 * sb; fy0 = -ux0 * sb + uy0 * cb; }
    const ex = wx + fx0 * b, ey = wy + fy0 * b;
    // upper arm (from the elbow up past the shoulder), the elbow, then the forearm over them
    // (the bow away from the wrist's side of the elbow-shoulder line)
    const wside = (sx - ex) * (wy - ey) - (sy - ey) * (wx - ex);
    upperArm(ctx, L, ex, ey, sx, sy, wside > 0 ? 1 : -1);
    ARMJ.ok = true; ARMJ.wx = wx; ARMJ.wy = wy; ARMJ.ex = ex; ARMJ.ey = ey; ARMJ.sx = sx; ARMJ.sy = sy;
    ARMJ.rf = 0.31 * L + 2; ARMJ.ru = 0.31 * L * ARM_TAPER_MAX + 2; ARMJ.bow = ARM_BOW * Math.hypot(sx - ex, sy - ey);
    elbowBall(ctx, ex, ey, 0.31 * L);
    let fx = ex - wx, fy = ey - wy;
    const lf = Math.max(1e-3, Math.hypot(fx, fy));
    fx /= lf; fy /= lf;
    sleeveSeg(ctx, L, wx, wy, fx, fy, lf, 0.06 * L);
    ctx.save();
    ctx.translate(x, hy);
    ctx.rotate(tilt);
    // finger poses: curled over the tile's top edge when gripping, fanned out when open
    for (let i = 0; i < 4; i++) {
      HF[i * 4] = (-0.215 + 0.145 * i) * L;
      HF[i * 4 + 1] = -0.14 * L;
      HF[i * 4 + 2] = lerp((1.5 - i) * -0.03, (1.5 - i) * 0.34, open);
      HF[i * 4 + 3] = lerp(LEN[i], LEN[i] + 0.05, open) * L;
    }
    ctx.lineJoin = 'round';
    ctx.strokeStyle = SKIN_LINE;
    ctx.lineWidth = 2 * Math.max(1.2, 0.03 * L);
    handParts(ctx, L, open, 0);
    ctx.fillStyle = PAL.skin;
    handParts(ctx, L, open, 1);
    // shading: shadow on the far side, soft light on the near side
    ctx.fillStyle = 'rgba(200,120,90,0.22)';
    ctx.beginPath(); ctx.ellipse(0.2 * L, -0.36 * L, 0.11 * L, 0.3 * L, -0.1, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,238,225,0.4)';
    ctx.beginPath(); ctx.ellipse(-0.1 * L, -0.42 * L, 0.1 * L, 0.2 * L, 0.25, 0, TAU); ctx.fill();
    // creases between fingers, knuckle dimples, nails
    ctx.strokeStyle = 'rgba(165,92,66,0.45)';
    ctx.lineWidth = Math.max(0.8, 0.016 * L);
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const kx = HF[i * 4], ky = HF[i * 4 + 1], a = HF[i * 4 + 2], len = HF[i * 4 + 3];
      const sa = Math.sin(a), ca = Math.cos(a);
      const w = i === 3 ? 0.13 * L : 0.155 * L;
      if (i > 0 && open < 0.5) {
        const bx = kx - w / 2;
        ctx.beginPath(); ctx.moveTo(bx - sa * 0.05 * L, ky + ca * 0.05 * L); ctx.lineTo(bx - sa * len * 0.9, ky + ca * len * 0.9); ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(kx - sa * len * 0.45, ky + ca * len * 0.45, w * 0.28, a + 0.4, a + Math.PI - 0.4);
      ctx.stroke();
      const nx = kx - sa * (len - w * 0.05), ny = ky + ca * (len - w * 0.05);
      ctx.fillStyle = 'rgba(255,226,214,0.9)';
      ctx.beginPath(); ctx.ellipse(nx, ny, w * 0.27, w * 0.3, a, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(185,110,85,0.3)';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(HF[i * 4], -0.13 * L, 0.02 * L, 0, TAU); ctx.fill(); }
    scribbles(ctx, L);
    ctx.fillStyle = 'rgba(217,51,59,0.5)';
    ctx.beginPath(); ctx.ellipse(HF[4] - Math.sin(HF[6]) * 0.2 * L, HF[5] + Math.cos(HF[6]) * 0.2 * L, 0.035 * L, 0.02 * L, 0.4, 0, TAU); ctx.fill();
    ctx.restore();
    // the cuff across the end of the forearm, over the wrist
    ctx.translate(wx, wy);
    ctx.rotate(Math.atan2(fx, -fy));
    cuff(ctx, L, 0.04 * L);
  }

  /* The SMASH / title-shove arm: a child's arm reaching in from the left screen edge. The
   * hand is side-on and flat against the push face at local x = 0: a tall palm slab whose
   * right edge is pressed straight against the face, four fingers pointing up and fanning
   * back a little (seen from the back-left, as the cube's left face is), the thumb tucked
   * low against the heel of the palm, a knuckle crease, nails, and the red marker scribbles
   * on the back of the hand. The sleeve bends at the elbow: the forearm droops from the
   * wrist down to the elbow, the upper arm rises off-screen toward the shoulder. A shove
   * pulse driven by t squashes the hand against the face and sinks the elbow.
   */
  const AF = [ // fingers, index (against the face) to pinky: base x, base y, angle (PI = up), length, width (in L)
    -0.074, -0.44, Math.PI + 0.02, 0.6, 0.148,
    -0.19, -0.455, Math.PI - 0.09, 0.68, 0.15,
    -0.3, -0.44, Math.PI - 0.2, 0.62, 0.142,
    -0.39, -0.4, Math.PI - 0.34, 0.5, 0.126,
  ];
  function armParts(ctx, L, pass) {
    const done = () => { if (pass) ctx.fill(); else ctx.stroke(); };
    // fingers, pinky (furthest back) first
    for (let i = 3; i >= 0; i--) {
      const b = i * 5;
      ctx.beginPath(); capsule(ctx, AF[b] * L, AF[b + 1] * L, AF[b + 2], AF[b + 3] * L, AF[b + 4] * L); done();
    }
    // palm slab: right edge flat on the face, heel rounded, back of the hand to the wrist
    ctx.beginPath();
    ctx.moveTo(0, -0.46 * L);
    ctx.lineTo(0, 0.2 * L);
    ctx.quadraticCurveTo(0.005 * L, 0.38 * L, -0.15 * L, 0.4 * L);
    ctx.lineTo(-0.48 * L, 0.44 * L);
    ctx.lineTo(-0.54 * L, 0.02 * L);
    ctx.quadraticCurveTo(-0.46 * L, -0.14 * L, -0.45 * L, -0.34 * L);
    ctx.quadraticCurveTo(-0.44 * L, -0.47 * L, -0.28 * L, -0.5 * L);
    ctx.quadraticCurveTo(-0.08 * L, -0.52 * L, 0, -0.46 * L);
    ctx.closePath();
    done();
  }
  function thumbPart(ctx, L) {
    // tucked low along the heel of the palm, tip pointing up and back
    ctx.beginPath(); capsule(ctx, -0.08 * L, 0.27 * L, Math.PI - 0.92, 0.36 * L, 0.165 * L);
  }

  function drawArm(ctx, x, y, L, t) {
    if (!okL(L) || !fin(x) || !fin(y)) return;
    t = fin(t) ? t : 0;
    ctx.save();
    try { armBody(ctx, x, y, L, t); } finally { ctx.restore(); }
  }

  // one straight run of sleeve from P along (dx, dy), cut square at both ends: from `over`
  // behind P to `len` ahead of it; kw widens it (1: a child's sleeve), phase: see sleeveRun
  function sleeveSeg(ctx, L, px, py, dx, dy, len, over, kw, phase) {
    const w = 0.62 * L;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(Math.atan2(dx, -dy));
    if (kw && kw !== 1) ctx.scale(kw, 1);
    ctx.beginPath(); ctx.rect(-w / 2 - 2, -len, w + 4, len + over); ctx.clip();
    sleeveRun(ctx, L, over, -len, phase || 0);
    ctx.restore();
  }

  function armBody(ctx, x, y, L, t) {
    // the shove: a quick pulse (about twice a second) squashes the hand flat on the face and
    // sinks the elbow
    const sp = Math.sin(t * 13);
    const p = sp > 0 ? sp * sp : 0;
    ctx.translate(x + Math.sin(t * 31) * 0.008 * L, y);
    // wrist W -> elbow E (the forearm droops), then up toward the shoulder, off-screen left
    const wx = -0.5 * L, wy = 0.22 * L;
    const ex = (-2.45 + 0.16 * p) * L, ey = (0.62 + 0.08 * p) * L;
    let fx = ex - wx, fy = ey - wy;
    const lf = Math.hypot(fx, fy); fx /= lf; fy /= lf;
    const ux = -0.9, uy = -0.436;                                 // elbow -> shoulder, ~26 deg up
    // reach past the left screen edge (local x = -x), with room for the screen shake
    const lu = Math.max(1.5 * L, (x + ex + 80) / -ux);
    const r = 0.31 * L;
    // upper arm, the rounded elbow, then the forearm over them
    sleeveSeg(ctx, L, ex, ey, ux, uy, lu, 0);
    elbowBall(ctx, ex, ey, r);
    sleeveSeg(ctx, L, wx, wy, fx, fy, lf, 0.06 * L);
    // fabric bunching at the inside of the bend
    ctx.strokeStyle = 'rgba(5,7,20,0.5)';
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1, 0.035 * L);
    ctx.beginPath();
    ctx.moveTo(ex + 0.05 * L, ey - 0.27 * L); ctx.quadraticCurveTo(ex + 0.12 * L, ey - 0.12 * L, ex + 0.05 * L, ey);
    ctx.stroke();

    // the hand, squashed against the face by the shove (about the push face, x = 0)
    ctx.save();
    ctx.translate(0, -0.1 * L);
    ctx.scale(1 - 0.08 * p, 1 + 0.035 * p);
    ctx.translate(0, 0.1 * L);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = SKIN_LINE;
    ctx.lineWidth = 2 * Math.max(1.2, 0.03 * L);
    armParts(ctx, L, 0);
    ctx.fillStyle = PAL.skin;
    armParts(ctx, L, 1);
    // light on the back of the hand; the side pressed on the face in shadow
    ctx.fillStyle = 'rgba(255,238,225,0.4)';
    ctx.beginPath(); ctx.ellipse(-0.33 * L, -0.12 * L, 0.08 * L, 0.26 * L, 0.06, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(196,112,84,0.26)';
    ctx.beginPath(); ctx.rect(-0.055 * L, -0.46 * L, 0.055 * L, 0.7 * L); ctx.fill();
    // fingers: the line where each overlaps the next one back, joint creases, nails
    for (let i = 0; i < 4; i++) {
      const b = i * 5;
      const bx = AF[b] * L, by = AF[b + 1] * L, a = AF[b + 2], len = AF[b + 3] * L, w = AF[b + 4] * L;
      const dx = -Math.sin(a), dy = Math.cos(a);   // along the finger, base -> tip
      const nx = Math.cos(a), ny = Math.sin(a);    // across it, toward the back of the hand
      ctx.strokeStyle = 'rgba(160,86,60,0.55)';
      ctx.lineWidth = Math.max(0.8, 0.02 * L);
      if (i < 3) {
        ctx.beginPath();
        ctx.moveTo(bx + nx * w * 0.5 + dx * 0.04 * L, by + ny * w * 0.5 + dy * 0.04 * L);
        ctx.lineTo(bx + nx * w * 0.5 + dx * len * 0.92, by + ny * w * 0.5 + dy * len * 0.92);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(165,92,66,0.4)';
      ctx.lineWidth = Math.max(0.7, 0.014 * L);
      for (let k = 0; k < 2; k++) {
        const f = k ? 0.68 : 0.38, jx = bx + dx * len * f, jy = by + dy * len * f;
        ctx.beginPath(); ctx.moveTo(jx + nx * w * 0.38, jy + ny * w * 0.38); ctx.lineTo(jx + nx * w * 0.02, jy + ny * w * 0.02); ctx.stroke();
      }
      const tx = bx + dx * (len - w * 0.5) + nx * w * 0.16, ty = by + dy * (len - w * 0.5) + ny * w * 0.16;
      ctx.fillStyle = 'rgba(255,230,218,0.95)';
      ctx.beginPath(); ctx.ellipse(tx, ty, w * 0.2, w * 0.3, a, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(190,120,95,0.5)';
      ctx.lineWidth = Math.max(0.6, 0.01 * L);
      ctx.stroke();
    }
    // knuckle crease across the top of the palm, knuckle dimples
    ctx.strokeStyle = 'rgba(160,86,60,0.5)';
    ctx.lineWidth = Math.max(0.8, 0.018 * L);
    ctx.beginPath(); ctx.moveTo(-0.42 * L, -0.38 * L); ctx.quadraticCurveTo(-0.22 * L, -0.36 * L, -0.03 * L, -0.4 * L); ctx.stroke();
    ctx.fillStyle = 'rgba(185,110,85,0.3)';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(AF[i * 5] * L, AF[i * 5 + 1] * L + 0.035 * L, 0.024 * L, 0, TAU); ctx.fill(); }
    // red marker scribbles on the back of the hand
    ctx.save();
    ctx.translate(-0.2 * L, 0.12 * L);
    ctx.rotate(-0.3);
    scribbles(ctx, 0.64 * L);
    ctx.restore();
    // the thumb, tucked over the heel of the palm
    ctx.lineWidth = Math.max(1, 0.026 * L);
    ctx.strokeStyle = 'rgba(160,86,60,0.6)';
    thumbPart(ctx, L); ctx.stroke();
    ctx.fillStyle = PAL.skin;
    thumbPart(ctx, L); ctx.fill();
    ctx.fillStyle = 'rgba(200,120,90,0.18)';
    ctx.beginPath(); ctx.ellipse(-0.14 * L, 0.27 * L, 0.06 * L, 0.11 * L, -0.92, 0, TAU); ctx.fill();
    const ta = Math.PI - 0.92, tdx = -Math.sin(ta), tdy = Math.cos(ta);
    ctx.fillStyle = 'rgba(255,230,218,0.95)';
    ctx.beginPath(); ctx.ellipse(-0.08 * L + tdx * 0.29 * L, 0.27 * L + tdy * 0.29 * L, 0.045 * L, 0.06 * L, ta, 0, TAU); ctx.fill();
    ctx.restore();
    // the cuff over the wrist, across the forearm
    ctx.save();
    ctx.translate(wx, wy);
