<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STÅLHAGEN II</title>
<meta name="description" content="STÅLHAGEN II · Isvägen — the ice road. A 3D action-horror walk across a frozen bay, after the paintings of Simon Stålenhag.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%239ea9b3'/><rect y='10' width='16' height='6' fill='%23dfe6ea'/><rect x='6' y='6' width='2' height='5' fill='%23c9542a'/><circle cx='12' cy='4' r='1' fill='%23ff5a3c'/></svg>">
</head>
<body>
  <div id="frame">
    <canvas id="gl" tabindex="0" aria-label="STÅLHAGEN II game. Enter to begin; WASD to move."></canvas>
    <canvas id="ui" aria-hidden="true"></canvas>
  </div>
  <div id="loading">painting&hellip;</div>
  <div id="touch">
    <div id="stick" class="pad"><div class="knob"></div></div>
    <div class="pad right">
      <button data-act="camera" class="small" aria-label="Camera">&#9673;</button>
      <button data-act="torch" class="small" aria-label="Torch">&#9788;</button>
      <button data-act="use" aria-label="Reach out / use">&#10022;</button>
      <button data-act="cut" class="small" aria-label="Cutter">&#9889;</button>
    </div>
    <div id="look"></div>
    <button id="runbtn" data-act="hurry" class="small" aria-label="Run">⇧</button>
    <button id="albumbtn" data-act="album" class="small" aria-label="Photo album">▦</button>
    <button id="pausebtn" data-act="pause" class="small" aria-label="Pause">&#10074;&#10074;</button>
  </div>
  <script src="js/util.js"></script>
  <script src="js/math.js"></script>
  <script src="js/store.js"></script>
  <script src="js/brushes.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/foliage-data.js"></script>
  <script src="js/material-data.js"></script>
  <script src="js/sky-data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/world.js"></script>
  <script src="js/interior.js"></script>
  <script src="js/creatures.js"></script>
  <script src="js/character-data.js"></script>
<script src="js/character.js"></script>
<script src="js/player.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/text.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
