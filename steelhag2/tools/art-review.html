<!doctype html><meta charset="utf-8"><title>Isvägen · playtest</title>
<style>body{height:100vh;display:flex;flex-direction:column;margin:0;background:#171c22;color:#d6dbdf;font:13px system-ui}nav{flex-shrink:0;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}button{background:#343e48;color:inherit;border:1px solid #56616a;padding:6px 10px;border-radius:4px;cursor:pointer}iframe{width:100%;flex:1;min-height:0;border:0}output{margin-left:auto;font-size:12px}</style>
<nav><strong>ISVÄGEN</strong><button data-view="opening">Opening</button><button data-view="checkpoint">Checkpoint</button><button data-view="recovery">Recovery sled</button><button data-view="recoveryPhoto">Recovery photo</button><button data-view="idle">Idle framing</button><button data-view="crossing">Crossing</button><button data-view="farm">Farm</button><button data-view="yard">Garden gate</button><button data-view="woodstore">Wood shelter</button><button data-view="yardWalk">Yard approach</button><button data-view="porch">Porch</button><button data-view="room">House interior</button><button data-view="notebook">Notebook</button><button data-view="darkroom">Darkroom</button><button data-view="bedroom">Bedroom</button><button data-view="hulls">Hulls</button><button data-view="reveal">Reveal sequence</button><button data-view="iceRise">Ice rising</button><button data-view="iceAfter">Ice aftermath</button><button data-view="hullRear">Hull rear</button><button data-view="photospot">Photo spot</button><button data-view="photoFeedback">Photo feedback</button><button data-view="reach">Reach out</button><button data-view="lockedDoor">Door prompt</button><button data-view="relay">Field relay</button><button data-view="relayOn">Relay activation</button><button data-view="bearer">Bearer</button><button data-view="character">Character</button><button data-view="encounter">Encounter</button><button data-view="hit">Hit reaction</button><button data-view="shot">Shot feedback</button><button data-view="critical">Critical condition</button><button data-view="fallen">Death</button><button data-view="charge">Charge cue</button><button data-view="behind">Threat behind</button><button data-view="cameraThreat">Camera threat</button><button id="strafe">Strafe / stop</button><button id="walk">Walk / stop</button><button id="run">Run / stop</button><button id="aim">Aim / lower</button><button id="fire">Use / fire</button><button id="checks">Run checks</button><button id="farmcheck">Farm checks</button><button id="album">Album</button><button id="build">Standalone</button><button id="phone">Phone layout</button><button id="landscape">Landscape layout</button><button id="desktop">Desktop layout</button><span id="stats"></span><output id="status">Loading…</output></nav><iframe id="game" src="../index.html?review=1"></iframe>
<script>
const f=document.querySelector('iframe'),status=document.querySelector('output');let walking=false,running=false,aiming=false,strafing=false,release=false,device='desktop';
function scene(name){const g=f.contentWindow.__game;if(!g)return;g.reviewFrozen=false;g.newJourney();Object.keys(g.keys).forEach(k=>g.keys[k]=false);walking=running=aiming=strafing=false;
const views={checkpoint:[1,-4,-17,0],recovery:[1,-3,51,-.5],recoveryPhoto:[1,-3.7,54,-.85],opening:[1,.5,-22,0],idle:[1,.5,-22,0],crossing:[1,0,56,0],farm:[2,-12,142,.4],yard:[2,0,145,0],woodstore:[2,-5.5,160,0],yardWalk:[2,0,146,0],porch:[2,0,156.8,Math.PI],room:[2,0,156.8,0],notebook:[2,805.4,806.6,Math.PI],darkroom:[1,8,14,0],bedroom:[2,809.0,806.7,0],relay:[2,13.6,173.5,0],relayOn:[2,13.6,173.5,0],bearer:[2,24,186,0],character:[1,4,40,Math.PI],encounter:[1,4,25,0],hit:[1,4,31,0],shot:[1,4,26,0],critical:[1,4,31,0],fallen:[1,4,31,0],charge:[1,4,29.3,0],behind:[1,4,27,Math.PI],cameraThreat:[1,4,27,Math.PI],hulls:[1,0,8,0],reveal:[1,0,2,0],iceRise:[1,0,2,0],iceAfter:[1,0,2,0],hullRear:[1,2,69,Math.PI],photoFeedback:[1,2,-8,0],reach:[2,24,190,0],lockedDoor:[2,0,157.1,0],photospot:[1,2,-8,0]};const [ch,x,z,yaw]=views[name];g.jump(ch,x,z);g.place(x,z,yaw);g.step(1);g.awake=false;
if(['room','notebook','bedroom'].includes(name)){g.enterHouse();if(name!=='room')g.place(x,z,yaw);g.step(90);}
if(name==='darkroom'){g.P.viewfinder=true;g.step(2);g.pressed.use=true;g.step(1);g.P.viewfinder=false;g.jump(2);g.openDarkroom();}
if(name==='behind'||name==='cameraThreat'){if(name==='cameraThreat')g.P.viewfinder=true;g.step(90);g.reviewFrozen=true;}
if(name==='idle'){g.step(960);g.setState('free');}
if(name==='charge'){g.keys.cut=true;g.step(30);g.keys.cut=false;g.setState('free');}
if(name==='relay'||name==='relayOn'){g.place(14,174.4,0);g.step(1);if(name==='relayOn'){g.pressed.use=true;g.step(100);}if(name==='relayOn')g.set(10,7.5,171,25,3.6,182);else g.set(12.4,5.2,174.1,14,4.35,176);}
if(name==='bearer'){const m=g.bearer;g.set(m.x+2.4,m.y+1.5,m.z+3,m.x,m.y+.7,m.z);}
if(name==='recoveryPhoto'){g.sentry.off=true;g.step(30);}
if(name==='yard'){g.place(0,138,0);g.step(1);g.set(-7,5.0,143,0,4.2,159);}
if(name==='woodstore'){g.place(0,138,0);g.step(1);g.set(-5.8,4.9,157.5,-8,4,163.3);}
if(name==='checkpoint'){g.set(-2.3,4.0,-20,-7.6,2.6,-10);}
if(name==='recovery'){g.flags.hulls=true;for(const h of g.world.hulls){h.rise=1;h.rising=true;h.model[13]=0;h.y=0;}g.sentry.off=true;g.set(-2,3.8,49,-8,1.4,58);}
if(['hit','critical','fallen'].includes(name)){const target=name==='hit'?2:name==='critical'?1:0;for(let i=0;i<1500&&g.health>target;i++)g.step(1);g.step(name==='fallen'?16:6);g.reviewFrozen=true;}
if(name==='shot'){g.keys.cut=true;g.step(20);g.pressed.use=true;g.step(2);g.reviewFrozen=true;}
if(name==='photoFeedback'){g.sentry.off=true;g.P.viewfinder=true;g.step(30);g.pressed.use=true;g.step(50);g.reviewFrozen=true;}
if(name==='reach'){g.place(14,174.4,0);g.pressed.use=true;g.step(1);for(let i=0;i<1250&&g.bearer.state!=='standoff';i++)g.step(1);g.keys.use=true;g.step(60);g.reviewFrozen=true;}
if(name==='character')g.set(6,1.8,43,4,1,40);
if(['reveal','iceRise','iceAfter'].includes(name)){g.sentry.off=true;if(name!=='reveal'){g.step(name==='iceRise'?180:470);g.set(4,3.4,30,19,3,53);}}
if(name==='hullRear'){g.flags.hulls=true;for(const h of g.world.hulls){h.rise=1;h.rising=true;h.model[13]=0;h.y=0;}g.sentry.off=true;g.set(28,8,76,19,19,53);}
if(name==='hulls'){g.flags.hulls=true;for(const h of g.world.hulls){h.rise=1;h.rising=true;h.model[13]=0;h.y=0;}g.sentry.off=true;g.set(-3,2,1,8,10,61);}
if(name==='crossing'){g.flags.hulls=true;for(const h of g.world.hulls){h.rise=1;h.rising=true;h.model[13]=0;h.y=0;}g.sentry.off=true;g.set(1,2.0,50,0,2,78);}
status.textContent=name;}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>scene(b.dataset.view));document.querySelector('#walk').onclick=()=>{const g=f.contentWindow.__game;g.reviewFrozen=false;g.setState('play');walking=!walking;g.keys.forward=walking;g.keys.hurry=false;};
document.querySelector('#run').onclick=()=>{const g=f.contentWindow.__game;g.reviewFrozen=false;g.setState('play');running=!running;g.keys.forward=running;g.keys.hurry=running;};
document.querySelector('#aim').onclick=()=>{const g=f.contentWindow.__game;g.reviewFrozen=false;g.setState('play');aiming=!aiming;g.keys.cut=aiming;};document.querySelector('#fire').onclick=()=>{f.contentWindow.__game.pressed.use=true;};
document.querySelector('#strafe').onclick=()=>{const g=f.contentWindow.__game;g.reviewFrozen=false;g.setState('play');strafing=!strafing;g.keys.right=strafing;};
function load(){f.src=(release?'../dist/stalhagen2.html':'../index.html')+'?review=1'+(device!=='desktop'?'&touch=1':'');}
function layout(mode){device=mode;f.style.width=mode==='phone'?'390px':mode==='landscape'?'844px':'100%';f.style.maxWidth='100%';f.style.alignSelf='center';f.style.flex=mode==='landscape'?'0 0 390px':'1';load();}
document.querySelector('#build').onclick=()=>{release=true;load();};document.querySelector('#phone').onclick=()=>layout('phone');document.querySelector('#landscape').onclick=()=>layout('landscape');document.querySelector('#desktop').onclick=()=>layout('desktop');
document.querySelector('#checks').onclick=async()=>{
  const assert=(v,msg)=>{if(!v)throw Error(msg);};
  try{const g=f.contentWindow.__game;g.reviewFrozen=false;g.newJourney();Object.keys(g.keys).forEach(k=>g.keys[k]=false);g.jump(1,0,-22);g.awake=false;const z=g.P.z;g.keys.forward=true;g.step(120);g.keys.forward=false;g.step(20);const moved=g.P.z-z;assert(moved>5.8&&moved<7.2,'walking distance '+moved);
    assert(g.machines.every(m=>Array.from(m.bones).every(Number.isFinite)),'invalid rig');
    g.keys.cut=true;g.pressed.use=true;g.step(1);assert(g.cutterFeedback.flash>0&&g.cutterFeedback.miss>0,'missed cutter press gave no feedback');g.keys.cut=false;g.step(45);
    g.jump(1,2,-8);const before=g.photos.length;g.pressed.use=true;g.step(1);assert(g.photos.length===before+1,'E at photo prompt made no photo');assert(g.P.viewfinder,'camera did not raise');g.pressed.album=true;g.step(1);assert(g.state==='album','Tab did not open album');g.step(20);g.pressed.album=true;g.step(1);assert(g.state==='play','Tab did not return to play');g.pressed.camera=true;g.step(1);
    assert(g.photos.every(p=>p.src&&p.neg),'incomplete photographic negative');
    status.textContent='Photo + movement passed; testing encounter…';await new Promise(requestAnimationFrame);
    g.newJourney();g.jump(1,4,26);g.keys.cut=true;g.step(1);for(let i=0;i<4;i++){g.pressed.use=true;g.step(1);g.step(45);}g.keys.cut=false;assert(g.sentry.cut.size>=3||g.sentry.dark,'cutter did not disable three joints');assert(g.flags.roadkeeper,'roadkeeper unresolved '+JSON.stringify({cut:[...g.sentry.cut],legs:g.sentry.legsLeft(),state:g.sentry.state}));
    g.newJourney();g.jump(1,4,31);g.step(360);assert(g.health<3||g.deaths>0,'hostile never caused damage');assert(g.character.condition<3,'field-pack condition did not respond to damage');
    g.newJourney();g.jump(1,4,31);for(let i=0;i<1800&&!g.deaths;i++)g.step(1);assert(g.deaths>0,'hostile defeat did not begin');g.step(20);assert(g.character.clip==='Death','defeat does not animate');g.step(180);assert(g.health===3&&g.deaths<=0&&g.character.condition===3,'checkpoint did not restore player condition');
    status.textContent='Encounter passed; testing route…';await new Promise(requestAnimationFrame);
    g.newJourney();g.jump(1,0,-22);g.sentry.off=true;g.keys.forward=true;
    for(let i=0;i<48&&g.chapter===1;i++){g.step(60);if(i%6===0)await new Promise(requestAnimationFrame);}g.keys.forward=false;assert(g.chapter===2,'island not reached in 48 seconds');assert(g.world.hulls.every(h=>h.rise===1),'hull reveal did not finish');g.iceBreak.sync(false);assert(g.iceBreak.particles.n===0,'ice dust persists after reveal');
    g.jump(2,24,190);const m=g.bearer;m.state='standoff';m.calm=1;g.place(m.x,m.z-.9,0);g.P.viewfinder=true;const closePhoto=g.photos.length;g.pressed.use=true;g.step(1);assert(g.photos.length===closePhoto+1,'camera E blocked by close machine');g.P.viewfinder=false;g.keys.use=true;g.step(145);g.keys.use=false;assert(m.off,'peaceful standoff failed');assert(!g.renderError,'render failure');assert(g.performance.foliage,'environment assets did not load');
    status.textContent='PASS · E photo / album / movement / cutting / damage / 48s crossing / standoff';g.setState('free');
  }catch(e){status.textContent='FAIL · '+e.message;}
};
document.querySelector('#album').onclick=()=>{f.contentWindow.__game.pressed.album=true;};
document.querySelector('#farmcheck').onclick=async()=>{
  const g=f.contentWindow.__game,assert=(v,msg)=>{if(!v)throw Error(msg);};
  try{g.reviewFrozen=false;g.newJourney();g.jump(2);g.awake=false;g.place(0,146,0);g.keys.forward=true;g.step(185);g.keys.forward=false;assert(g.P.z>155,'garden gate blocks the front door route');const r=g.world.relay;g.place(r.x,r.z-1.5,0);g.pressed.use=true;g.step(1);assert(g.flags.relay&&g.awake,'relay did not wake bearer');
    g.step(60);await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);assert(g.world.fieldRelay.progress===1&&!g.world.fieldRelay.pulse.hidden,'relay breaker/surge did not respond');assert(g.bearer.state==='approach'||g.bearer.state==='wait','bearer did not respond');
    let arrival=0;while(arrival<1200&&g.bearer.state!=='standoff'){g.step(1);arrival++;}assert(g.bearer.state==='standoff','bearer could not reach the relay within 20 seconds: '+g.bearer.state);status.textContent='Bearer arrival '+(arrival/60).toFixed(1)+'s; checking saves…';g.keys.use=true;g.step(145);g.keys.use=false;assert(g.sleepReady,'bearer resolution did not unlock ending');const contactYaw=Math.atan2(g.bearer.x-g.P.x,g.bearer.z-g.P.z);assert(Math.cos(g.P.yaw-contactYaw)>.97,'reaching character did not face the bearer');
    assert(g.world.fieldRelay.green.emis>g.world.fieldRelay.amber.emis,'relay status lamps did not change');const saved=JSON.parse(JSON.stringify(g.saved));g.newJourney();g.resume(saved);assert(g.chapter===2&&g.bearer.off&&g.sleepReady&&g.flags.relay,'checkpoint did not restore resolved encounter');
    await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);assert(g.world.fieldRelay.progress===1&&g.world.fieldRelay.pulse.hidden,'relay checkpoint state not restored');const before=g.photos.length;g.P.viewfinder=true;g.pressed.use=true;g.step(1);assert(g.photos.length>=before,'photo failure');g.P.viewfinder=false;
    g.place(g.world.cellar.x,g.world.cellar.z,0);g.pressed.use=true;g.step(1);assert(g.state==='darkroom','cellar not usable');g.step(160);assert(g.darkroom.ready&&g.photos.every(p=>p.developed),'batch development did not finish');g.pressed.camera=true;g.step(1);assert(g.darkroom.compare,'darkroom comparison did not work');g.pressed.album=true;g.step(1);assert(g.state==='album','darkroom album did not open');g.step(20);g.pressed.album=true;g.step(1);assert(g.state==='darkroom','album did not return to workbench');g.nav.back=true;g.step(1);assert(g.state==='play','darkroom did not return');
    g.place(g.world.door.x,g.world.door.z-1,0);g.pressed.use=true;g.step(1);assert(g.interior,'front door did not enter house');
    const roomSave=JSON.parse(JSON.stringify(g.saved));g.newJourney();g.resume(roomSave);assert(g.interior,'interior checkpoint not restored');
    g.place(...g.room.spots.radio,0);g.pressed.use=true;g.step(1);assert(g.flags.radio,'radio did not respond');
    g.place(805.4,806.6,Math.PI);g.pressed.use=true;g.step(1);assert(g.state==='note'&&g.flags.notebook,'notebook did not open');g.step(30);g.pressed.use=true;g.step(1);assert(g.state==='play','notebook did not close');const learned=JSON.parse(JSON.stringify(g.saved));g.resume(learned);assert(g.interior&&g.flags.radio&&g.flags.notebook,'house discoveries lost on resume');
    const inPhoto=g.photos.length;g.pressed.camera=true;g.step(1);g.pressed.use=true;g.step(1);assert(g.photos.length===inPhoto+1,'interior photography failed');g.pressed.camera=true;g.step(1);
    g.place(...g.room.spots.exit,Math.PI);g.pressed.use=true;g.step(1);assert(!g.interior,'could not leave house');g.place(g.world.door.x,g.world.door.z-1,0);g.pressed.use=true;g.step(1);assert(g.interior,'could not reenter house');
    g.place(...g.room.spots.bed,0);g.pressed.use=true;g.step(180);assert(g.state==='end','bedroom did not finish game');g.step(250);g.pressed.any=true;g.step(1);assert(g.state==='album','ending did not open album');assert(!g.renderError,'render error');status.textContent='PASS · relay / bearer / saves / darkroom / house / radio / notebook / indoor photo / exit / ending';
  }catch(e){status.textContent='FAIL · '+e.message;}
};
f.onload=()=>scene('opening');setInterval(()=>{const g=f.contentWindow.__game;if(g)document.querySelector('#stats').textContent=g.performance.fps+' fps · '+g.performance.draws+' draws · '+g.performance.triangles.toLocaleString()+' tris';},1000);
</script>
