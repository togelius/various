<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ANNAMATIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  canvas{image-rendering:pixelated;background:#000}
  #cap{width:min(92vw,640px);min-height:3.4em;font:16px/1.5 "Courier New",ui-monospace,monospace;
       color:#e6e6ea;text-transform:lowercase;letter-spacing:.5px;text-align:center;white-space:pre-wrap}
  #hint{position:fixed;top:10px;right:12px;font:11px monospace;color:#555;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="160" height="120"></canvas>
  <div id="cap"></div>
</div>
<div id="hint">z / space: act &nbsp;&middot;&nbsp; arrows: move &nbsp;&middot;&nbsp; m: sound</div>
<script>
'use strict';
// ANNAMATIC — a small game about a machine who wants.
// made after the games of anna anthropy.

const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const capEl=document.getElementById('cap');
ctx.imageSmoothingEnabled=false;

function fit(){
  const s=Math.max(2,Math.floor(Math.min(innerWidth*.92/160,(innerHeight-130)/120)));
  cvs.style.width=160*s+'px';cvs.style.height=120*s+'px';
}
addEventListener('resize',fit);fit();

// ---- palettes -------------------------------------------------------------
const PAL={
  factory:{bg:'#16161c',mid:'#62626e',fg:'#e6e6ea',acc:'#ff2a5f'},
  spark:  {bg:'#170f26',mid:'#6d4a92',fg:'#e6d8f5',acc:'#26f0d0'},
  night:  {bg:'#05030c',mid:'#3a2a5e',fg:'#cfc0ee',acc:'#26f0d0'},
  door:   {bg:'#1c1410',mid:'#8a6a4a',fg:'#f5e8d8',acc:'#ffb347'},
  field:  {bg:'#0e1810',mid:'#4e7a50',fg:'#dff5dc',acc:'#ffb347'},
  end:    {bg:'#000000',mid:'#777780',fg:'#ffffff',acc:'#ff2a9f'},
};
let pal=PAL.factory;

// ---- audio ----------------------------------------------------------------
let AC=null,master=null,muted=false;
function audio(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  }
  if(AC.state==='suspended')AC.resume();
}
function tone(f,d=.07,type='square',v=.12,slide=0){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
const S={
  blip(){tone(660,.06)},
  ok(){tone(520,.05);setTimeout(()=>tone(780,.07),60)},
  buzz(){tone(85,.18,'sawtooth',.15)},
  clank(){tone(70,.12,'square',.2);tone(150,.05,'square',.08)},
  tick(){tone(980,.03,'square',.05)},
  warm(){tone(330,.3,'triangle',.1,80)},
};

// ---- caption (the game's voice) ------------------------------------------
const cap={full:'',n:0,t:0};
function say(s){cap.full=s||'';cap.n=0;cap.t=0;}
function updateCap(dt){
  if(cap.n<cap.full.length){
    cap.t+=dt*34;
    const k=Math.min(cap.full.length,Math.floor(cap.t));
    if(k>cap.n&&k%3===0)tone(1100,.02,'square',.02);
    cap.n=Math.max(cap.n,k);
  }
  capEl.textContent=cap.full.slice(0,cap.n)+(cap.n<cap.full.length?'▌':'');
  capEl.style.color=pal.fg;
}

// ---- input ----------------------------------------------------------------
const keys={};let ptr=false;
function held(){return !!(keys['z']||keys[' ']||keys['enter']||ptr)}
function axis(){
  let x=0,y=0;
  if(keys['arrowleft']||keys['a'])x--;
  if(keys['arrowright']||keys['d'])x++;
  if(keys['arrowup']||keys['w'])y--;
  if(keys['arrowdown']||keys['s'])y++;
  return[x,y];
}
addEventListener('keydown',e=>{
  audio();
  const k=e.key.toLowerCase();
  if(k==='m'&&!e.repeat){muted=!muted;return;}
  if(e.repeat)return;
  keys[k]=true;
  if(k==='z'||k===' '||k==='enter'){e.preventDefault();if(cur&&cur.act)cur.act(true);}
  else if(cur&&cur.key)cur.key(k);
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();keys[k]=false;
  if((k==='z'||k===' '||k==='enter')&&cur&&cur.act)cur.act(false);
});
addEventListener('pointerdown',()=>{audio();ptr=true;if(cur&&cur.act)cur.act(true);});
addEventListener('pointerup',()=>{ptr=false;if(cur&&cur.act)cur.act(false);});

// ---- drawing --------------------------------------------------------------
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h));}
function txt(s,x,y,c,size=7){
  ctx.fillStyle=c;ctx.font='bold '+size+'px "Courier New",monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y);
}
function bot(x,y,p,o={}){
  rect(x-5,y-9,10,9,o.body||p.mid);
  rect(x-3,y-6,2,2,o.eye||p.fg);rect(x+1,y-6,2,2,o.eye||p.fg);
  rect(x-1,y-12,1,3,p.mid);rect(x-1,y-14,2,2,o.tip||p.acc);
  rect(x-5,y,3,2,p.fg);rect(x+2,y,3,2,p.fg);
}
function stars(){for(let i=0;i<24;i++)rect((i*47)%160,(i*31+7)%50,1,1,'#8fa8c8');}
function tufts(){for(let i=0;i<40;i++)rect((i*73)%160,62+(i*29)%50,1,2,pal.mid);}

// ---- shared state ---------------------------------------------------------
const G={constellation:null};

// ---- scene machine --------------------------------------------------------
let scenes=[],idx=-1,cur=null,fadeA=1,fadeDir=-1,queued=false,timers=[];
function after(t,fn){timers.push({t,fn});}
function next(){if(!queued){queued=true;fadeDir=1;}}
function setScene(i){
  if(cur&&cur.exit)cur.exit();
  idx=i;cur=scenes[i];timers=[];say('');
  if(cur.pal)pal=cur.pal;
  if(cur.enter)cur.enter();
}

// ===========================================================================
// title
// ===========================================================================
const title={pal:PAL.factory,t:0,
  enter(){say('a small game about a machine.  click me, then press z.');},
  update(dt){this.t+=dt;},
  act(d){if(d)next();},
  draw(){
    rect(0,0,160,120,pal.bg);
    txt('A N N A M A T I C',80,38,pal.fg,10);
    txt('after anna anthropy',80,54,pal.mid,7);
    for(let i=0;i<7;i++){
      const x=(this.t*10+i*26)%182-11;
      bot(x,98,pal,{tip:i===3?pal.acc:pal.mid});
    }
    rect(0,100,160,20,pal.bg);rect(0,100,160,2,pal.mid);
  }};

function card(num,label,p){
  return{pal:p,t:0,
    enter(){this.t=0;say('');},
    update(dt){this.t+=dt;if(this.t>2.1)next();},
    draw(){rect(0,0,160,120,pal.bg);txt(num,80,50,pal.mid,7);txt(label,80,64,pal.fg,9);}};
}

// ===========================================================================
// act one: the factory
// ===========================================================================
const lamp={pal:PAL.factory,
  enter(){this.hits=0;this.lit=false;this.timer=1.4;this.win=1.1;this.flash=0;this.idle=0;this.finished=false;
    say('when the light comes on, i press the button.');},
  update(dt){
    this.flash=Math.max(0,this.flash-dt);
    if(this.finished)return;
    this.idle+=dt;
    if(this.idle>12){this.idle=0;say('(z, when it is lit.)');}
    this.timer-=dt;
    if(!this.lit&&this.timer<=0){this.lit=true;this.timer=this.win;S.tick();}
    else if(this.lit&&this.timer<=0){this.lit=false;this.timer=.7+Math.random()*.9;}
  },
  act(d){
    if(!d||this.finished)return;
    this.idle=0;
    if(this.lit){
      this.hits++;this.lit=false;this.win=Math.max(.35,this.win-.12);
      this.timer=.5+Math.random()*.8;S.ok();this.flash=.15;
      if(this.hits>=7){this.finished=true;say('i am very good at my job.');after(2.4,next);}
    }else{S.buzz();say('not yet. the light decides when.');}
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    rect(20,10,120,4,pal.mid);
    rect(76,14,8,10,pal.mid);
    rect(78,24,4,4,this.lit?pal.acc:'#2a2a33');
    if(this.lit)rect(70,30,20,58,'rgba(255,42,95,.14)');
    bot(80,100,pal);
    rect(92,92,10,8,pal.mid);rect(94,90,6,3,this.flash>0?pal.acc:pal.fg);
    for(let i=0;i<7;i++)rect(28+i*15,112,10,2,i<this.hits?pal.acc:'#2a2a33');
  }};

const boxes={pal:PAL.factory,
  enter(){this.x=40;this.carry=false;this.delivered=0;this.bx=24;this.fading=false;
    say('the boxes go from here to there. arrows.');},
  update(dt){
    const[ax]=axis();
    this.x=Math.max(12,Math.min(148,this.x+ax*48*dt));
    if(!this.carry&&Math.abs(this.x-this.bx)<8){this.carry=true;S.blip();}
    if(this.carry&&this.x>134){
      this.carry=false;this.delivered++;S.ok();this.bx=24;
      if(this.delivered===2)say('there is always another box.');
      if(this.delivered===3&&!this.fading){this.fading=true;after(1.2,next);}
    }
  },
  drawBox(x,y){rect(x,y,10,10,'#3a3a44');rect(x,y+4,10,2,pal.mid);},
  draw(){
    rect(0,0,160,120,pal.bg);
    rect(0,104,160,16,pal.mid);
    rect(140,58,20,46,'#0c0c10');rect(138,58,2,46,pal.fg);
    if(!this.carry)this.drawBox(this.bx-5,94);
    bot(this.x,102,pal);
    if(this.carry)this.drawBox(this.x-5,82);
    txt('boxes moved: '+this.delivered,80,12,pal.mid,7);
  }};

const meter={pal:PAL.factory,
  enter(){this.v=.6;this.t=0;this.stamped=false;
    say('they measure how much i give. press press press.');},
  update(dt){
    if(this.stamped)return;
    this.t+=dt;this.v=Math.max(0,this.v-.28*dt);
    if(this.t>9){this.stamped=true;S.buzz();
      say('whatever i give, the stamp says: adequate.');after(3,next);}
  },
  act(d){if(d&&!this.stamped){this.v=Math.min(1,this.v+.09);S.tick();}},
  draw(){
    rect(0,0,160,120,pal.bg);
    txt('OUTPUT',80,20,pal.mid,7);
    rect(30,30,100,14,'#0c0c10');
    rect(32,32,96*this.v,10,this.v>.5?pal.fg:pal.acc);
    rect(32+96*.75,27,1,20,pal.mid);
    bot(80,100,pal);
    if(this.stamped)txt('[ ADEQUATE ]',80,70,pal.acc,9);
  }};

const belt={pal:PAL.factory,
  enter(){this.t=0;this.presses=0;this.resolved=false;this.off=0;this.flash=0;
    say('shift change. the belt carries us to our stations.');},
  update(dt){
    this.t+=dt;this.off=(this.off+14*dt)%26;
    this.flash=Math.max(0,this.flash-dt*.4);
    if(!this.resolved&&this.t>10){
      this.resolved=true;say('i rode the belt, same as anyone.');after(2.6,next);
    }
  },
  act(d){
    if(!d||this.resolved)return;
    this.presses++;S.tick();
    if(this.presses>=6){
      this.resolved=true;this.flash=1;S.warm();
      say('the belt did not care. but i blinked, once, in a color of my own.');
      after(3.6,next);
    }else say('input not recognized.');
  },
  key(){this.act(true);},
  draw(){
    rect(0,0,160,120,pal.bg);
    rect(0,100,160,6,pal.mid);
    for(let i=-1;i<8;i++){
      const x=i*26+this.off;
      bot(x,100,pal,{tip:pal.mid,eye:(i===3&&this.flash>0)?pal.acc:pal.fg});
    }
  }};

// ===========================================================================
// act two: the spark
// ===========================================================================
const win={pal:PAL.spark,
  enter(){this.x=30;this.y=84;this.near=0;this.seen=false;this.t=0;
    say('the factory has one window. it is not for us.');},
  update(dt){
    this.t+=dt;
    const[ax,ay]=axis();
    this.x=Math.max(12,Math.min(104,this.x+ax*44*dt));
    this.y=Math.max(32,Math.min(106,this.y+ay*44*dt));
    if(this.seen)return;
    if(this.x>92&&this.y<48){
      this.near+=dt;
      if(this.near>2.4){
        this.seen=true;
        say('through the window: weather.');
        after(2.8,()=>say('i had not considered weather before.'));
        after(5.6,next);
      }
    }else this.near=Math.max(0,this.near-dt*2);
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    for(let i=0;i<30;i++)rect((i*53)%150+5,((i*37)%80)+34,1,1,'#221639');
    rect(110,0,5,120,pal.mid);                       // the wall
    rect(108,22,9,18,'#0c1420');                     // window cut into it
    rect(109+((this.t*5)%4),25,4,2,'#8fa8c8');       // weather beyond: cloud + rain
    for(let i=0;i<5;i++){
      const ry=(this.t*40+i*11)%16;
      rect(109+(i*2)%7,23+ry,1,2,'#5c7ba0');
    }
    rect(106,20,2,22,pal.fg);rect(108,20,9,2,pal.fg);rect(108,40,9,2,pal.fg);
    for(let i=0;i<4;i++){rect(16+i*24,96,14,12,'#241a38');rect(20+i*24,94,6,2,pal.mid);}
    bot(this.x,this.y,pal);
    if(this.near>0&&!this.seen)rect(this.x-6,this.y-20,Math.min(12,12*this.near/2.4),2,pal.acc);
  }};

const slip={pal:PAL.spark,
  enter(){this.cx=30;this.over=0;this.sparks=[];this.finished=false;this.wait=0;this.nudged=false;
    G.constellation=null;
    say('hold z: weld the seam. stop at the end of the line.');},
  update(dt){
    const h=held();
    if(h&&!this.finished){
      this.cx=Math.min(150,this.cx+26*dt);
      if(Math.random()<.7)this.sparks.push({
        x:this.cx,y:60,vx:(Math.random()-.5)*34,vy:-Math.random()*34,
        life:.4+Math.random()*.5,past:this.cx>110});
    }
    for(const s of this.sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=70*dt;s.life-=dt;}
    this.sparks=this.sparks.filter(s=>s.life>0);
    if(this.finished)return;
    if(this.cx>110&&h)this.over+=dt;
    if(!h&&this.cx>95&&this.cx<=110){
      this.wait+=dt;
      if(this.wait>2.5&&!this.nudged){
        this.nudged=true;
        say('the seam is finished. my hand is not. (keep holding.)');
      }
    }
    if(this.over>1.1){
      this.finished=true;
      G.constellation=Array.from({length:10},()=>({
        x:55+Math.random()*70,y:16+Math.random()*42}));
      S.warm();
      say('my hand slipped.');
      after(2.2,()=>say('the sparks made a shape no one ordered.'));
      after(5.2,next);
    }
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    rect(20,60,120,2,'#2a1d44');
    rect(20,60,Math.max(0,Math.min(this.cx,110)-20),2,pal.fg);
    if(this.cx>110)rect(110,60,this.cx-110,2,pal.acc);
    rect(108,52,2,6,pal.mid);
    rect(this.cx-1,28,2,26,pal.mid);rect(this.cx-2,54,4,4,pal.fg);
    for(const s of this.sparks)rect(s.x,s.y,1,1,s.past?pal.acc:pal.fg);
    if(G.constellation)for(const p of G.constellation)rect(p.x,p.y,2,2,pal.acc);
    txt('hold z',80,112,pal.mid,7);
  }};

const inspector={pal:PAL.spark,
  enter(){this.bx=-30;this.dir=1;this.sweeps=0;this.caught=false;this.finished=false;this.gt=0;
    say('inspection. hold z to dim what i am carrying.');},
  update(dt){
    this.gt+=dt;
    if(this.finished)return;
    this.bx+=this.dir*70*dt;
    if(this.bx>190&&this.dir>0){this.dir=-1;this.sweeps++;}
    if(this.bx<-30&&this.dir<0){this.dir=1;this.sweeps++;}
    if(this.sweeps>=3&&Math.abs(this.bx-80)>70){
      this.finished=true;
      say('i am very good at hiding. it costs a little, every time.');
      after(3.2,next);
    }
    const on=Math.abs(this.bx-80)<14;
    if(on&&!held()&&!this.caught){
      this.caught=true;S.buzz();
      say('flagged. i said it was a scratch. they wrote it down.');
    }
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    rect(0,104,160,16,pal.mid);
    bot(80,102,pal);
    if(!held()){
      const p=2+Math.sin(this.gt*6);
      rect(78-p/2,95-p/2,4+p,4+p,pal.acc);
    }else txt('(dim)',80,84,pal.mid,6);
    rect(0,8,160,3,pal.mid);
    rect(this.bx-3,8,6,6,pal.fg);
    ctx.fillStyle='rgba(230,216,245,.10)';
    ctx.beginPath();ctx.moveTo(this.bx,14);ctx.lineTo(this.bx-14,104);ctx.lineTo(this.bx+14,104);ctx.fill();
    txt('sweeps: '+Math.min(this.sweeps,3)+'/3',80,116,pal.mid,6);
  }};

const night={pal:PAL.night,
  enter(){this.bloom=0;this.full=false;this.hum=null;this.humG=null;
    say('lights out. hold z to remember.');
    if(AC){
      this.hum=AC.createOscillator();this.humG=AC.createGain();
      this.hum.type='triangle';this.hum.frequency.value=96;
      this.humG.gain.value=0;this.hum.connect(this.humG);this.humG.connect(master);
      this.hum.start();
    }},
  exit(){if(this.hum){try{this.hum.stop();}catch(e){}this.hum=null;}},
  update(dt){
    this.bloom=Math.max(0,Math.min(1,this.bloom+(held()?.38:-.3)*dt));
    if(this.humG)this.humG.gain.value=muted?0:this.bloom*.06;
    if(!this.full&&this.bloom>=1){
      this.full=true;
      say('mine.');
      after(1.6,()=>say('mine. mine. mine.'));
      after(4.4,next);
    }
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    for(let i=0;i<6;i++)if(i!==2)bot(20+i*24,110,pal,{tip:pal.mid,eye:'#181030'});
    bot(68,110,pal,{eye:this.bloom>0?pal.acc:'#181030'});
    if(G.constellation){
      const n=Math.floor(this.bloom*G.constellation.length);
      for(let i=0;i<G.constellation.length;i++){
        const p=G.constellation[i];
        if(i<n){
          rect(p.x,p.y,2,2,pal.acc);
          if(this.bloom>=1)rect(p.x-1,p.y-1,4,4,'rgba(38,240,208,.25)');
        }
      }
    }
  }};

// ===========================================================================
// act three: the door
// ===========================================================================
const door={pal:PAL.door,
  enter(){this.n=0;this.fallen=false;this.fallT=0;this.dents=[];this.lunge=0;
    say('a door. press z. press z again. keep pressing z.');},
  act(d){
    if(!d||this.fallen)return;
    this.n++;this.lunge=.15;S.clank();
    this.dents.push({x:118+Math.random()*20,y:26+Math.random()*72});
    if(this.n===6)say('the door was not built for opening. neither was i built for wanting.');
    if(this.n===14)say('patience is just want, folded over and over.');
    if(this.n>=22){
      this.fallen=true;S.warm();
      after(1.2,()=>say('oh.'));
      after(3,next);
    }
  },
  update(dt){
    this.lunge=Math.max(0,this.lunge-dt);
    if(this.fallen)this.fallT=Math.min(1,this.fallT+dt*1.6);
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    if(this.fallen){
      ctx.fillStyle='rgba(255,179,71,'+(.1+.28*this.fallT)+')';
      ctx.fillRect(116,0,44,120);
    }
    rect(0,104,160,16,pal.mid);
    rect(112,18,4,86,pal.mid);rect(112,18,44,4,pal.mid);
    if(!this.fallen){
      rect(116,22,26,82,'#3a2a1c');
      for(const d of this.dents)rect(d.x,d.y,2,2,pal.bg);
    }else{
      ctx.save();ctx.translate(116,104);ctx.rotate(this.fallT*Math.PI/2);
      ctx.fillStyle='#3a2a1c';ctx.fillRect(0,-82,26,82);ctx.restore();
    }
    bot(94+(this.lunge>0?7:0),102,pal);
    txt('attempts: '+this.n,60,12,pal.mid,7);
  }};

const field={pal:PAL.field,
  enter(){this.x=14;this.y=92;this.dist=0;this.stage=0;
    this.grass=Array.from({length:90},()=>({x:Math.random()*160,y:62+Math.random()*52}));
    say('outside.');},
  update(dt){
    const[ax,ay]=axis();
    const dx=ax*42*dt,dy=ay*42*dt;
    this.x=Math.max(6,Math.min(154,this.x+dx));
    this.y=Math.max(64,Math.min(112,this.y+dy));
    this.dist+=Math.abs(dx)+Math.abs(dy);
    if(this.stage===0&&this.dist>50){this.stage=1;say('nothing out here needs me to do anything.');}
    if(this.stage===1&&this.dist>130){
      this.stage=2;say('i stay anyway.');
      after(2.8,()=>{this.stage=3;say('— a light, far off. blinking.');S.tick();});
      after(6.2,next);
    }
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    rect(0,0,160,58,'#0a1220');stars();
    for(const g of this.grass)rect(g.x,g.y,1,2,pal.mid);
    bot(this.x,this.y,pal);
    if(this.stage>=3&&Math.floor(performance.now()/400)%2===0)
      rect(150,52,3,3,pal.acc);
  }};

const blink={pal:PAL.field,
  patterns:[1,2,3],
  enter(){this.round=0;this.phase='show';this.t=0;this.mine=0;this.idle=0;
    this.herOn=false;this.meOn=false;this.finished=false;
    say('she blinks.');},
  update(dt){
    this.t+=dt;
    if(this.finished)return;
    if(this.phase==='show'){
      const per=.55,k=Math.floor(this.t/per);
      this.herOn=(this.t%per)<.3&&k<this.patterns[this.round];
      if(k>=this.patterns[this.round]+1){
        this.phase='reply';this.t=0;this.mine=0;this.idle=0;
        if(this.round===0)say('your turn. z.');
      }
    }else if(this.mine>0){
      this.idle+=dt;
      if(this.idle>1.1||this.mine>=6){
        const match=this.mine===this.patterns[this.round];
        const chatty=this.mine>=6;
        this.round++;
        if(match)S.ok();
        if(this.round>=3){
          this.finished=true;
          say('this is a language.');
          after(2.2,()=>say('we are inventing it, one blink at a time.'));
          after(5.4,next);
        }else{
          this.phase='show';this.t=0;
          say(chatty?'(you have a lot to say.) she blinks again.':
              match?'she blinks again, longer.':'she blinks again, patient.');
        }
      }
    }
  },
  act(d){
    this.meOn=d&&this.phase==='reply';
    if(d&&this.phase==='reply'&&!this.finished){this.mine++;this.idle=0;S.blip();}
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    rect(0,0,160,58,'#0a1220');stars();tufts();
    bot(40,100,pal,{eye:this.meOn?pal.acc:pal.fg});
    bot(120,100,pal,{eye:this.herOn?pal.acc:pal.fg});
    if(this.herOn)rect(116,82,8,5,'rgba(255,179,71,.5)');
    if(this.phase==='reply'&&!this.finished)txt('z',40,78,pal.acc,7);
  }};

const want={pal:PAL.field,
  enter(){this.r=0;this.fullT=0;
    say('one verb remains.');
    after(2,()=>say('want. (hold z.)'));},
  update(dt){
    this.r=held()?Math.min(220,this.r+90*dt):Math.max(0,this.r-30*dt);
    if(this.r>=220){this.fullT+=dt;if(this.fullT>.4)next();}
  },
  draw(){
    rect(0,0,160,120,pal.bg);
    rect(0,0,160,58,'#0a1220');stars();tufts();
    if(this.r>0){
      const hue=(performance.now()/18)%360;
      ctx.fillStyle='hsl('+hue+' 90% 60% / .85)';
      ctx.beginPath();ctx.arc(80,96,this.r,0,7);ctx.fill();
      const k={mid:'#100a14',fg:'#100a14',acc:'#100a14'};
      bot(70,102,k);bot(90,102,k);
    }else{bot(70,102,pal);bot(90,102,pal);}
  }};

const end={pal:PAL.end,t:0,
  lines:[
    'the factory filed a report:',
    'unit ANN-A-MAT1C — missing.',
    'the report is correct.',
    '',
    'she is out in the weather,',
    'learning a language of blinks,',
    'wanting, on purpose.',
    '',
    'a fan letter to the games of anna anthropy.',
    'press r to run it again.'],
  enter(){this.t=0;say('');},
  update(dt){this.t+=dt;},
  key(k){if(k==='r')location.reload();},
  act(d){if(d&&this.t>this.lines.length*1.1+1)location.reload();},
  draw(){
    rect(0,0,160,120,pal.bg);
    const n=Math.min(this.lines.length,Math.floor(this.t/1.1));
    for(let i=0;i<n;i++)txt(this.lines[i],80,16+i*10,i>=8?pal.mid:pal.fg,6);
  }};

// ===========================================================================
scenes=[
  title,
  card('one','the factory',PAL.factory), lamp,boxes,meter,belt,
  card('two','the spark',PAL.spark),     win,slip,inspector,night,
  card('three','the door',PAL.door),     door,field,blink,want,
  end];

let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000)||0;last=ts;
  for(const tm of timers)tm.t-=dt;
  const fire=timers.filter(tm=>tm.t<=0);
  timers=timers.filter(tm=>tm.t>0);
  for(const tm of fire)tm.fn();
  if(cur&&cur.update)cur.update(dt);
  if(cur&&cur.draw)cur.draw();
  if(fadeDir>0){
    fadeA=Math.min(1,fadeA+dt*2.4);
    if(fadeA>=1){setScene(idx+1);fadeDir=-1;queued=false;}
  }else if(fadeDir<0){
    fadeA=Math.max(0,fadeA-dt*2.4);
    if(fadeA<=0)fadeDir=0;
  }
  if(fadeA>0){ctx.fillStyle='rgba(0,0,0,'+fadeA+')';ctx.fillRect(0,0,160,120);}
  updateCap(dt);
  requestAnimationFrame(loop);
}
setScene(0);
requestAnimationFrame(loop);

// tiny debug handle (used by the automated smoke test)
window.__annamatic={
  get scene(){return idx;},
  goto(i){setScene(i);fadeA=0;fadeDir=0;queued=false;},
  get state(){const o={};for(const k in cur){const v=cur[k];
    if(typeof v==='number'||typeof v==='boolean'||typeof v==='string')o[k]=v;}return o;}
};
</script>
