<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Square Off — Hang Out view bench</title>
<!-- Dev bench for js/render/hangout-view.js: the real park + a "Hang Out" match, no HUD.
     Click/tap your group (or press 1 2 3), then click a spot or the ground. Drag = pan, wheel = zoom, Q/E = rotate,
     Space = pause, F = 4x speed. URL: ?crew=hustle&rival=pack&seed=1&diff=normal&auto=hard&ff=60&pause=1
     &cam=overview|fountain|holley|garibaldi|sandbox|dogrun|north|south|x,z,h,heading &sel=0 &hl=fountain
     &scenario=firstSpot|spread|argue|walkAway|firstMatch &len=300 &clean &q=low|med|high &script=coffee -->
<style>
  html, body { margin: 0; height: 100%; background: #1d2a24; overflow: hidden; font: 13px/1.35 system-ui, -apple-system, sans-serif; color: #eee; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #dbg { position: fixed; left: 8px; top: 8px; background: rgba(15,18,22,0.78); padding: 6px 9px; border-radius: 8px; white-space: pre; font: 12px ui-monospace, monospace; pointer-events: none; }
  body.clean #dbg { display: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<script defer src="../js/vendor/three.min.js"></script>
<script defer src="../js/geo.js"></script>
<script defer src="../js/core/ns.js"></script>
<script defer src="../js/core/contracts.js"></script>
<script defer src="../js/data/units.js"></script>
<script defer src="../js/data/factions.js"></script>
<script defer src="../js/data/landmarks.js"></script>
<script defer src="../js/data/maps.js"></script>
<script defer src="../js/data/events.js"></script>
<script defer src="../js/data/text.js"></script>
<script defer src="../js/data/navOverrides.js"></script>
<script defer src="../js/data/hangout.js"></script>
<script defer src="../js/sim/nav.js"></script>
<script defer src="../js/sim/hangout.js"></script>
<script defer src="../js/sim/hangout-ai.js"></script>
<script defer src="../js/render/textures.js"></script>
<script defer src="../js/render/ground.js"></script>
<script defer src="../js/render/buildings.js"></script>
<script defer src="../js/render/landmarks.js"></script>
<script defer src="../js/render/props.js"></script>
<script defer src="../js/render/sky.js"></script>
<script defer src="../js/render/scene.js"></script>
<script defer src="../js/render/units.js"></script>
<script defer src="../js/render/fx.js"></script>
<script defer src="../js/render/hangout-view.js"></script>
<script defer src="../js/ui/camera.js"></script>
</head>
<body>
<div id="view"></div>
<div id="dbg"></div>
<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var P = new URLSearchParams(location.search);
  if (P.has('clean')) document.body.classList.add('clean');
  var view = document.getElementById('view');
  SQ.render.init(view, {});
  SQ.camera.init(view);
  var HV = SQ.hangoutView;

  // ---- match
  var crew = P.get('crew') || 'hustle', rival = P.get('rival') || (crew === 'pack' ? 'violets' : 'pack');
  var cfg = { seed: parseInt(P.get('seed') || '1', 10), quiet: true };
  var auto = P.get('auto');
  if (P.get('scenario')) { cfg.scenario = P.get('scenario'); cfg.crew = crew; cfg.rival = rival; }
  else cfg.players = [{ crew: crew, ai: auto ? { difficulty: auto } : false }, { crew: rival, ai: { difficulty: P.get('diff') || 'normal' } }];
  if (P.get('len')) cfg.length = parseFloat(P.get('len'));
  var m = SQ.Hangout.create(cfg);
  var me = m.state.player >= 0 ? m.state.player : 0;
  if (auto) m.state.player = 0; // presentation only: side 0 is "you" even when an AI plays it (the AI reads cfg.players)
  // the classic camera wants a classic state for its framing; give it a stub (the UI owns the real one)
  SQ.camera.setMatch({ state: { factions: [{ home: '-' }], player: 0, lmById: {} }, rules: {} });
  SQ.camera.skipIntro();
  SQ.render.setMatch(m);   // scene.js hands Hang Out matches to SQ.hangoutView

  var CAMS = {
    overview: [-2, 4, 165, 0], fountain: [0, 6, 62, 0], holley: [-62, 4, 52, 0], garibaldi: [60, -2, 52, 0],
    sandbox: [-45, -48, 46, 0], dogrun: [31, 64, 52, 0], north: [-8, -30, 110, 0], south: [6, 30, 110, 0],
    play: [0, -14, 125, 0]
  };
  function cam(spec, instant) {
    var c = CAMS[spec] || (spec ? spec.split(',').map(Number) : CAMS.play);
    SQ.camera.focus(c[0], c[1], { height: c[2], heading: (c[3] || 0) * Math.PI / 180, instant: instant !== false });
  }
  cam(P.get('cam') || 'play');

  // ---- scripted beats for screenshots
  var script = P.get('script');
  var ff = parseFloat(P.get('ff') || '0');
  function tickN(n) { for (var i = 0; i < n && !m.state.over; i++) { m.tick(); if (script) runScript(); } }
  var beats = { coffee: false };
  function runScript() {
    var st = m.state;
    if (script === 'coffee' && !beats.coffee && st.t >= 20) { beats.coffee = true; m.forceCoffee(st.sides[me].groups[1]); }
  }
  // warm the view through the fast-forward so world beats are not all fired at once
  var warm = Math.round(ff * 20);
  var chunk = 40;
  while (warm > 0) { var k = Math.min(chunk, warm); tickN(k); warm -= k; SQ.camera.update(0.05); SQ.render.frame(m.state, 1, 0.05 * k / 4); }
  if (P.get('sel') !== null && P.get('sel') !== '') HV.select(m.state.sides[me].groups[parseInt(P.get('sel'), 10)]);
  if (P.get('hl')) HV.highlight(P.get('hl'));

  // ---- loop
  var paused = P.has('pause'), speed = parseFloat(P.get('speed') || '1'), acc = 0, last = 0, frames = 0;
  window.dev = {
    m: m, HV: HV, me: me, cam: cam,
    step: function (n) { tickN(n || 1); },
    pause: function (on) { paused = on === undefined ? !paused : !!on; return paused; },
    speed: function (s) { speed = s; },
    order: function (slot, target) { return m.order(me, m.state.sides[me].groups[slot], target); },
    orderSide: function (side, slot, target) { return m.order(side, m.state.sides[side].groups[slot], target); },
    frames: function () { return frames; },
  };
  function frame(now) {
    requestAnimationFrame(frame);
    var real = Math.min(0.25, Math.max(0, (now - (last || now)) / 1000)); last = now;
    if (!paused && !m.state.over) {
      acc += real * speed; var n = 0;
      while (acc >= 0.05 && n < 12) { tickN(1); acc -= 0.05; n++; }
      if (n === 12) acc = 0;
    }
    var alpha = paused ? 1 : Math.min(1, acc / 0.05);
    SQ.camera.update(real);
    SQ.render.frame(m.state, alpha, real);
    frames++;
    if (frames % 10 === 0) {
      var st = m.state, s = HV.stats();
      document.getElementById('dbg').textContent =
        st.sides.map(function (x) { return x.name + ' ' + x.points; }).join('  vs  ') + '   ' + SQ.util.fmtClock(st.timeLeft) + (paused ? '  PAUSED' : '') + '\n' +
        st.groups.map(function (g) { return (g.side === me ? '* ' : '  ') + g.short + ': ' + HV.statusText(g, st) + ' ' + Math.round(g.patience); }).join('\n') +
        '\n' + JSON.stringify(SQ.render.stats()) + '\n' + JSON.stringify(s);
    }
  }
  requestAnimationFrame(frame);
  window.dev.ready = true;

  // ---- input: tap your group, then a spot / the ground; drag pans; wheel zooms
  var el = SQ.render.renderer.domElement, down = null;
  el.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', function (e) {
    if (!down) {
      var h = HV.pick(e.clientX, e.clientY);
      HV.hover(h && h.type === 'group' ? { group: h.id } : h && h.type === 'spot' ? { spot: h.idx } : null);
      return;
    }
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.moved = true;
    if (down.moved) { SQ.camera.panScreen(down.lx, down.ly, e.clientX, e.clientY); down.lx = e.clientX; down.ly = e.clientY; }
  });
  el.addEventListener('pointerup', function (e) {
    if (!down) return;
    var d = down; down = null;
    if (d.moved) return;
    var hit = HV.pick(e.clientX, e.clientY, { touch: e.pointerType === 'touch' });
    if (hit && hit.type === 'group' && hit.side === me) { HV.select(hit.id); return; }
    if (HV.selected < 0 || !hit) return;
    var target = hit.type === 'spot' ? hit.idx : hit.type === 'group' ? (m.state.groups[hit.id].at >= 0 ? m.state.groups[hit.id].at : { x: m.state.groups[hit.id].x, z: m.state.groups[hit.id].z }) : { x: hit.x, z: hit.z };
    m.order(me, HV.selected, target);
  });
  el.addEventListener('wheel', function (e) { e.preventDefault(); SQ.camera.zoomBy(e.deltaY > 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
  window.addEventListener('keydown', function (e) {
    var ids = m.state.sides[me].groups;
    if (e.key === '1' || e.key === '2' || e.key === '3') HV.select(ids[+e.key - 1]);
    else if (e.key === 'Escape') HV.select(-1);
    else if (e.key === 'q' || e.key === 'Q') SQ.camera.rotateBy(-Math.PI / 8);
    else if (e.key === 'e' || e.key === 'E') SQ.camera.rotateBy(Math.PI / 8);
    else if (e.key === ' ') paused = !paused;
    else if (e.key === 'f' || e.key === 'F') speed = speed === 1 ? 4 : 1;
  });
});
</script>
</body>
</html>
