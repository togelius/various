<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Square Off — World Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 13px/1.35 system-ui, -apple-system, sans-serif; color: #eee; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; left: 8px; top: 8px; background: rgba(15,18,22,0.78); padding: 8px 10px; border-radius: 8px; max-width: calc(100vw - 32px); }
  #ui label { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; }
  #ui button { background: #2b3440; color: #eee; border: 1px solid #44505e; border-radius: 5px; padding: 3px 7px; margin: 2px 1px; cursor: pointer; }
  #ui button:hover { background: #3a4656; }
  #stats { position: fixed; right: 8px; bottom: 8px; background: rgba(15,18,22,0.7); padding: 6px 8px; border-radius: 6px; font: 12px ui-monospace, monospace; white-space: pre; }
  #hide { position: fixed; right: 8px; top: 8px; }
  body.clean #ui, body.clean #stats { display: none; }
</style>
<script defer src="../js/vendor/three.min.js"></script>
<script defer src="../js/geo.js"></script>
<script defer src="../js/render/textures.js"></script>
<script defer src="../js/render/ground.js"></script>
<script defer src="../js/render/buildings.js"></script>
<script defer src="../js/render/landmarks.js"></script>
<script defer src="../js/render/props.js"></script>
<script defer src="../js/render/sky.js"></script>
</head>
<body>
<div id="ui">
  <div>
    <label>Quality <select id="q"><option>low</option><option selected>med</option><option>high</option></select></label>
    <label>Time <input id="t" type="range" min="0" max="1" step="0.001" value="0.1" style="width:140px"></label>
    <span id="tl">4:54 PM</span>
    <label><input id="play" type="checkbox"> run clock</label>
  </div>
  <div>
    Views:
    <button data-v="overview">Overview</button><button data-v="arch">Arch</button><button data-v="archNorth">Arch (north)</button><button data-v="rts">RTS</button><button data-v="esb">Fifth Ave / ESB</button>
    <button data-v="fountain">Fountain</button><button data-v="row">The Row</button><button data-v="judson">Judson</button>
    <button data-v="chess">Chess</button><button data-v="grove">Grove</button><button data-v="playground">Playground</button><button data-v="dogrun">Dog run</button>
  </div>
  <div>
    Phase: <button data-p="afternoon">Afternoon</button><button data-p="golden">Golden</button><button data-p="night">Night</button>
    <label><input id="fade" type="checkbox" checked> canopy fade</label>
    <span style="opacity:.7">drag: orbit · right/shift-drag: pan · wheel: zoom · H: hide UI</span>
  </div>
</div>
<div id="stats"></div>
<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var q = params.get('q') || 'med';
  document.getElementById('q').value = q;
  if (params.get('clean')) document.body.classList.add('clean');
  var renderer = new THREE.WebGLRenderer({ antialias: q !== 'low', powerPreference: 'high-performance', preserveDrawingBuffer: !!params.get('shot') });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q === 'high' ? 2 : q === 'med' ? 1.25 : 1));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 2600);
  var world = SQ.env.build({ scene: scene, renderer: renderer, quality: q });
  console.log('world built', JSON.stringify(world.timings));

  // simple orbit camera
  var cam = { target: new THREE.Vector3(0, 0, -10), dist: 260, yaw: 0, pitch: 0.95 };
  function applyCam() {
    var cp = Math.cos(cam.pitch);
    camera.position.set(cam.target.x + Math.sin(cam.yaw) * cp * cam.dist, cam.target.y + Math.sin(cam.pitch) * cam.dist, cam.target.z + Math.cos(cam.yaw) * cp * cam.dist);
    camera.lookAt(cam.target);
  }
  var VIEWS = {
    overview: { t: [0, 0, -5], d: 290, yaw: 0, p: 1.0 },
    arch: { t: [0.75, 9, -54], d: 52, yaw: 0.35, p: 0.22 },
    esb: { t: [0.75, 14, -60], d: 70, yaw: 0.0, p: 0.06 },
    archNorth: { t: [0.75, 6, -58], d: 34, yaw: Math.PI - 0.35, p: 0.2 },
    rts: { t: [-20, 0, 10], d: 150, yaw: 0.3, p: 0.75 },
    fountain: { t: [0.5, 1, 0.2], d: 48, yaw: 0.8, p: 0.55 },
    row: { t: [-60, 6, -85], d: 70, yaw: 0.25, p: 0.3 },
    judson: { t: [-28, 14, 95], d: 80, yaw: 2.6, p: 0.3 },
    chess: { t: [-134, 0, 49], d: 55, yaw: 0.6, p: 0.95 },
    grove: { t: [-140, 4, -48], d: 85, yaw: 0.9, p: 0.62 },
    playground: { t: [55, 0, -32], d: 50, yaw: 0.5, p: 0.75 },
    dogrun: { t: [-60, 0, 58], d: 60, yaw: 0.3, p: 0.8 }
  };
  function setView(n) { var v = VIEWS[n]; if (!v) return; cam.target.set(v.t[0], v.t[1], v.t[2]); cam.dist = v.d; cam.yaw = v.yaw; cam.pitch = v.p; applyCam(); }
  setView(params.get('view') || 'overview');

  var el = renderer.domElement, drag = null;
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  el.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {
      var s = cam.dist * 0.0016, c = Math.cos(cam.yaw), sn = Math.sin(cam.yaw);
      cam.target.x -= (dx * c - dy * sn) * s; cam.target.z -= (-dx * sn - dy * c) * s;
    } else { cam.yaw -= dx * 0.005; cam.pitch = Math.max(0.02, Math.min(1.5, cam.pitch + dy * 0.004)); }
    applyCam();
  });
  el.addEventListener('pointerup', function () { drag = null; });
  el.addEventListener('wheel', function (e) { e.preventDefault(); cam.dist = Math.max(8, Math.min(900, cam.dist * Math.exp(e.deltaY * 0.001))); applyCam(); }, { passive: false });
  window.addEventListener('keydown', function (e) { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean'); });
  window.addEventListener('resize', function () { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); });

  var tInput = document.getElementById('t'), tl = document.getElementById('tl'), play = document.getElementById('play'), fade = document.getElementById('fade');
  var tod = parseFloat(params.get('t') || '0.1'); tInput.value = tod;
  var phase = null;
  function phaseOf(t) { return t < 0.333 ? 'afternoon' : t < 0.667 ? 'golden' : 'night'; }
  tInput.addEventListener('input', function () { tod = parseFloat(tInput.value); phase = null; });
  document.querySelectorAll('[data-v]').forEach(function (b) { b.onclick = function () { setView(b.dataset.v); }; });
  document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { phase = b.dataset.p; tod = { afternoon: 0.12, golden: 0.45, night: 0.82 }[phase]; tInput.value = tod; }; });
  document.getElementById('q').onchange = function (e) { params.set('q', e.target.value); location.search = params.toString(); };

  var last = performance.now(), statsEl = document.getElementById('stats'), frames = 0, acc = 0, fps = 0;
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (play.checked) { tod = (tod + dt / 600) % 1; tInput.value = tod; }
    var mins = Math.round(tod * 540), hh = 16 + Math.floor(mins / 60), mm = mins % 60;
    tl.textContent = ((hh - 1) % 12 + 1) + ':' + (mm < 10 ? '0' : '') + mm + (hh >= 12 && hh < 24 ? ' PM' : ' AM');
    world.canopyFade(camera.position, fade.checked ? [{ x: cam.target.x, z: cam.target.z }] : []);
    world.update(dt, tod, phase || phaseOf(tod), camera);
    renderer.render(scene, camera);
    frames++; acc += dt; if (acc > 0.5) { fps = frames / acc; frames = 0; acc = 0; }
    var inf = renderer.info.render;
    statsEl.textContent = 'fps ' + fps.toFixed(0) + '  calls ' + inf.calls + '  tris ' + (inf.triangles / 1000).toFixed(0) + 'k\nbuild ' + world.timings.total + ' ms  tex ' + renderer.info.memory.textures + '  geo ' + renderer.info.memory.geometries;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.dev = {
    world: world, camera: camera, renderer: renderer, scene: scene, cam: cam, setView: setView,
    setTime: function (t, p) { tod = t; phase = p || null; tInput.value = t; },
    look: function (pos, target) { camera.position.set(pos[0], pos[1], pos[2]); cam.target.set(target[0], target[1], target[2]); var d = new THREE.Vector3().subVectors(camera.position, cam.target); cam.dist = d.length(); cam.pitch = Math.asin(d.y / cam.dist); cam.yaw = Math.atan2(d.x, d.z); applyCam(); },
    settle: function (n) { for (var i = 0; i < (n || 60); i++) { world.canopyFade(camera.position, fade.checked ? [{ x: cam.target.x, z: cam.target.z }] : []); world.update(0.1, tod, phase || phaseOf(tod), camera); } renderer.render(scene, camera); }
  };
});
</script>
</body>
</html>
